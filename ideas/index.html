：追新与补番比例（季度开播全追型还是养肥型）、各季度分布、月度看番节奏热力图、个人评分与社区均分的偏差（你比大众严格还是宽容）、标签词云的年度迁移、最冷门与最大众的一条观看记录。渲染走 SVG/Canvas 纯代码路线——和仓库里已有的出图出片经验是同一条管线，海报、长图、视频素材一次生成三份。怎么开始：先用公开用户页练手（不需要 token），再申请 access token 拉自己的数据；GitHub Actions 定时任务设在 12 月 1 日，自动生成自动发。第一版只做三张图，一周能交；第二年复盘时数据已经攒起来了。","tags":["追番","数据可视化","Bangumi","延伸创意"],"effort":"一周级","id":"a406"},{"kind":"视频选题","title":"2 万星 B 站 API 文档库的最后一页：一封律师函之后，弹幕数据还能从哪来","url":"https://github.com/SocialSisterYi/bilibili-API-collect","source":"GitHub · SocialSisterYi/bilibili-API-collect（仓库现存关停公告页）","date":"2026-11","summary":"2026-01-28，20148 星的 bilibili-API-collect 收到 B 站委托律所的律师函，维护者当日宣布永久关停并删除全部文档——社区协作与平台权益边界的标志性事件，弹幕工具生态的分水岭。","takeaways":["类型：事件解读 + 替代方案盘点 · 成本：零 · 可行性：仓库公告页就是一手素材，全部可截图","关停事实可查：README 置顶 Deprecated 声明，原文引用律师函对「非公开 API 系统性收集传播」的指控","20148 stars · 最后提交 2026-01-30，关停后仓库仅存公告","替代路径均已验证：弹弹play 开放弹幕网络、DanmakuFactory、pakku.js 密度图、AniList 站方 API"],"whyValuable":"每个拿弹幕数据做内容的人都该知道这条线画在哪。选题自带冲突结构（社区协作 vs 平台权益），结尾还能落到建设性：四条合规路线全部实测过。","polished":"2026 年 1 月 28 日，GitHub 上最有影响力的中文社区项目之一按下了停止键。bilibili-API-collect——两万星、记录 B 站非公开接口的民间文档库——收到 B 站委托律师事务所的律师函，指控其「通过技术手段对平台非公开 API 接口及其调用逻辑进行系统性收集、整理，并以技术文档形式向不特定公众传播」。维护者当天置顶公告：永久关停，删除全部文档与源代码，如今仓库里只剩那一页声明。这支视频就从这个页面讲起：先考古这个项目曾支撑起多少追番工具、弹幕插件和数据看板；再逐句读公告原文，讲清楚平台在意的到底是什么；然后把重点放在建设性上——这之后，想要弹幕数据的人还有哪些路？四条全部实测过：弹弹play 的开放弹幕网络（正式的接入审核流程）、DanmakuFactory 处理自己下载的弹幕文件、pakku.js 这类本地扩展的密度统计、AniList 这类站方主动开放的 API。观点收尾：灰色地带正在收窄，「站方开放接口」是唯一能长期押注的路线。这不是唱衰社区，而是教观众在新边界里继续做想做的工具——对做工具内容的人来说，这本身就是一期没人讲透的选题。","tags":["弹幕","事件解读","开源合规","视频选题"],"effort":"一周级","id":"a407"},{"kind":"视频选题","title":"一条 GraphQL 实测 AniList 评分榜：零 key 零爬虫的番剧可视化第一课","url":"https://docs.anilist.co","source":"API · graphql.anilist.co + docs.anilist.co（AniList 官方 GraphQL，端点实测 200 可用）","date":"2026-11","summary":"AniList 官方 GraphQL API 实测可用：一条查询同时拿评分、人气、标题，按 SCORE_DESC 排序直接返回「葬送のフリーレン 91 分 / 49.6 万热度」级数据——不要 key、不要爬虫的番剧可视化第一课。","takeaways":["类型：API 实测 + 可视化选题 · 成本：免费（无 key）· 可行性：curl 一发即中，本调研已实测","实测查询：Page(perPage:5){media(sort:SCORE_DESC,type:ANIME)} → HTTP 200，芙莉莲 91 分 495,753 热度","GraphQL 按需取字段，一次请求顶 REST 数次翻页；文档 docs.anilist.co 实测可达","可视化三连：评分-热度散点、季度矩阵、标签网络图；离线全量补全交给 anime-offline-database"],"whyValuable":"番剧数据可视化的第一课就该是它：不要 key、不要爬虫、文档即查询器，一条查询就能撑起从数据到成片的完整视频，也是教观众「API 思维」最顺滑的入口。","polished":"想教普通人用数据看番剧圈，AniList 的 GraphQL 接口是最顺滑的入口。实测过程本身就能当视频脚本：打开 graphql.anilist.co，敲一条查询——Page 里按 SCORE_DESC 拿前五部 ANIME，只要 title、averageScore、popularity 三个字段——回车，HTTP 200，葬送のフリーレン 91 分、49 万余人气，银魂 THE FINAL、Re:Zero 第四季依次排开。不需要注册、不需要 key，这就是全部门槛，本调研已用 curl 实测通过。GraphQL 的好处在镜头前特别好讲：字段写在查询里，要什么给什么，一次请求顶 REST 的好几页翻页，观众第一次见通常会「哦？」出声。视频主体可以做三级跳：第一级，把评分榜拉满，讲头部番的分数有多卷；第二级，评分与人气双轴散点图，找「评分高但人气低」的遗珠和「人气高但评分平平」的爆款——每期都能吵起来；第三级，按季度和标签切片画一张番剧星图，看类型与年代的风格漂移。要离线全量数据就接 anime-offline-database（已收录），在线查增量用 AniList，两者刚好互补。注意点只有一个：接口有限速，批量抓取加间隔、做好缓存。一条查询进，一张星图出，全程录屏就是成片。","tags":["数据可视化","API","番剧","视频选题"],"effort":"一周级","id":"a408"},{"kind":"项目灵感","title":"ha-bambulab：把拓竹打印机变成 Home Assistant 原生设备的社区集成","url":"https://github.com/greghesp/ha-bambulab","source":"GitHub · greghesp/ha-bambulab","date":"2026-11","summary":"2410 星的 HACS 集成，把 X1/P1/A1 系列和 AMS 全部传感器、摄像头、控制实体搬进 Home Assistant，是拓竹×全屋智能联动的第一块拼图。HA 核心至今没有原生 Bambu 集成，它就是事实标准。","takeaways":["类型：HACS 自定义集成 · 成本：免费 · 可行性：HACS 一键装，填 IP 和 LAN 访问码即用","2410 星 · MIT · 2026-11 仍在活跃更新，生态最成熟的拓竹集成","X1/P1/A1 系列与 AMS 全支持：温度/进度/料卷余量传感器、AMS 温湿度、摄像头画面（X1 走 RTSP）、自定义打印机卡片与料卷卡片","与 bambuddy 定位互补：那是独立指挥中心，这个是把打印机编入全屋自动化"],"whyValuable":"HA 核心至今没有原生 Bambu 集成（官方集成页 404），这块 2410 星的社区集成就是拓竹×全屋智能的事实标准，装完打印机即刻获得 HA 生态的全部玩法。","polished":"HA 玩拓竹绕不开的一块拼图：greghesp 的 ha-bambulab 把 X1/P1/A1 系列和 AMS 变成 Home Assistant 里的原生设备——喷头与热床温度、打印进度、当前耗材、AMS 湿度全部成为标准传感器实体，摄像头画面（X1 系走 RTSP）直接进面板，调速、暂停这些控制也都是标准实体，还自带打印机卡片和料卷卡片两套 Lovelace 组件。要强调它和已有条目 bambuddy 定位完全不同：bambuddy 是一台独立的自托管指挥中心，而 ha-bambulab 是把打印机『编入』全屋智能，打印状态从此可以参与 HA 里任何自动化。怎么开始：第一步，HACS 添加仓库安装集成，设置里填打印机 IP 和 LAN 访问码，选本地连接；第二步，把自动生成的打印机卡片、料卷卡片放进面板，温度曲线和 AMS 余量一眼看完；第三步，写第一条自动化——打印完成时给手机推摄像头截图，或让客厅灯闪三下。进阶玩法：把进度实体映射到灯光（见本轮 WLED 灯条创意），或用 HA 长期统计看每周打印时长。注意点：集成走局域网 MQTT，打印机固件更新偶尔会临时弄断兼容性，升级固件前先扫一眼 issue 区。对已经在玩 HA 的人，这是把 3D 打印正式纳入智能家居版图的第一步。","tags":["Home Assistant","拓竹","3D打印"],"effort":"周末级","id":"a409"},{"kind":"项目灵感","title":"moonraker-home-assistant：Klipper 打印机的 Home Assistant 接入器","url":"https://github.com/marcolivierarsenault/moonraker-home-assistant","source":"GitHub · marcolivierarsenault/moonraker-home-assistant","date":"2026-11","summary":"504 星的 HACS 集成，通过 Moonraker API 把 Klipper 机器（Voron 自组机、刷 Klipper 的各种 DIY 机）接进 Home Assistant：状态传感器、摄像头、打印缩略图、急停按钮、宏按钮一应俱全。","takeaways":["类型：HACS 自定义集成 · 成本：免费 · 可行性：HACS 安装，填 Moonraker 地址即用","504 星 · MIT · 2026-10 仍在更新，文档站齐全","实体清单：打印机关键数值传感器、摄像头画面、当前打印任务缩略图、一键急停按钮、Klipper 宏直接映射成面板按钮","拓竹之外的世界：Voron/Ender/自组高速机的 HA 联动答案，与 ha-bambulab 凑成两个生态全家桶"],"whyValuable":"拓竹之外还有半个 3D 打印世界跑在 Klipper 上，这个集成让自组机玩家在 HA 里获得与拓竹玩家对等的体验，还把 Klipper 宏变成面板按钮，玩法定制空间远大于成品机。","polished":"拓竹之外还有半个 3D 打印世界跑在 Klipper 上——Voron 自组机、刷了固件的 Ender、各种高速 DIY 机，而把这群机器接进 Home Assistant 的现成答案就是 marcolivierarsenault 的 moonraker-home-assistant。它通过 Moonraker API 连接打印机，给 HA 提供一整套实体：打印机状态与关键数值传感器、摄像头画面、当前打印任务的缩略图、一键急停按钮，还能把 Klipper 宏直接映射成面板按钮——『调平』『purge』『取件』这些日常操作从此点一下就执行，附带按比例计算的进度类实体。怎么开始：第一步，HACS 安装集成，填 Moonraker 的地址和端口（Mainsail/Fluidd 环境默认就有）；第二步，照文档里的仪表盘指引把传感器和缩略图摆进面板，五分钟得到一个带急停的打印监控页；第三步，挑两三个高频宏做成按钮，感受打印间工业自动化的爽感。进阶玩法：用 HA 通用自动化把打印完成事件接进全屋通知和灯光；家里有几台 Klipper 机器就分别接入，凑一个家庭打印农场总览。注意点：FLSUN Speeder Pad 和 Sonic Pad 这类一体屏环境不在支持范围，文档里有说明。对同时玩拓竹和 Klipper 的人，这个集成加上 ha-bambulab 就是两个世界的全家桶；对纯自组机玩家，这是把打印机纳入智能家居的最短路径。","tags":["Home Assistant","Klipper","3D打印"],"effort":"周末级","id":"a410"},{"kind":"项目灵感","title":"Obico：开源可自托管的 AI 打印失败监控，拉丝翻车有人管","url":"https://github.com/TheSpaghettiDetective/obico-server","source":"GitHub · TheSpaghettiDetective/obico-server","date":"2026-11","summary":"前身 The Spaghetti Detective 的 1923 星开源 AI 监控：摄像头盯打印，AI 识别拉丝、脱板等失败征兆，报警甚至自动暂停。服务器可完整自托管，摄像头数据不出家门，支持 OctoPrint 与 Klipper。","takeaways":["类型：自托管服务/Docker · 成本：自托管免费，云服务有免费档 · 可行性：官方文档齐全，NAS 即可跑","1923 星 · AGPL-3.0 · 2026-11 仍在活跃更新","AI 失败检测可自动暂停打印止损；通知渠道覆盖手机推送/邮件/短信","支持 OctoPrint、Klipper（Fluidd/Mainsail）、Duet3D 社区插件；社区已把 bambuddy 对接自托管 Obico 检测 API"],"whyValuable":"无人值守打印最大的心理障碍是『翻车了没人管』，这是该问题最老牌、最完整的开源答案：既能云端零运维起步，又能整包自托管把数据留在家，工程边界干净。","polished":"无人值守打印最大的心理障碍是『翻车了没人管』——Obico（前身 The Spaghetti Detective）就是为此而生的开源 AI 监控：摄像头盯着打印过程，AI 模型识别拉丝、翘边、脱板这类失败征兆，及时报警甚至自动暂停打印，省料省时间更省机器。关键它是 AGPL 开源的，服务器可以完整自托管在自己的电脑或 NAS 上，摄像头数据不出家门；官方也提供带免费档的云服务，先白嫖再自建两条路随选。平台支持 OctoPrint 和 Klipper（Fluidd/Mainsail 均可），Duet3D 有社区插件；社区还有人把已有的 bambuddy 指挥中心对接自托管的 Obico 检测 API，等于给现有面板装上眼睛。怎么开始：第一步，用云服务免费档把打印机接上，先看 AI 判定准不准；第二步，觉得靠谱再按官方文档把 obico-server 迁到自托管，调好摄像头帧率与检测灵敏度；第三步，把报警接到手机推送和邮件，再用 HA 的通知体系做全屋联动。进阶玩法：故意制造几次小失败测它的响应延迟和误报率，攒一个月的拦截记录——这本身就是一条硬核实测视频（见本轮选题）。手机端 iOS/Android 应用带高清串流和锁屏进度，出门在外的安全感直接拉满。","tags":["3D打印","AI监控","自托管"],"effort":"一周级","id":"a411"},{"kind":"项目灵感","title":"OctoEverywhere：不开放端口的打印机远程隧道，AI 失败检测还免费","url":"https://github.com/QuinnDamerell/OctoPrint-OctoEverywhere","source":"GitHub · QuinnDamerell/OctoPrint-OctoEverywhere","date":"2026-11","summary":"给打印机一条加密隧道的云服务：不开端口、不暴露公网，浏览器和手机 App 随时看状态和 30 帧摄像头串流。AI 失败检测 Gadget 免费不限量，免费档支持 3 台打印机，Bambu/Klipper/Elegoo OS 全吃。","takeaways":["类型：云服务+自托管插件 · 成本：免费档 3 台打印机，进阶约 $3.99/月 · 可行性：装插件扫码即用","306 星 · AGPL-3.0 · 2026-10 活跃更新，支持 OctoPrint/Klipper（Mainsail、Fluidd、Moonraker）/Bambu Lab OS/Elegoo OS","Gadget AI 检测拉丝、附着不良、层错位，免费且不限量，可报警或自动暂停","通知渠道全家桶：推送、Discord、Telegram、SMS、Slack、邮件；摄像头 30 帧全速串流加公开直播链接"],"whyValuable":"它解决了远程监控最劝退的安全问题（打印机不暴露公网、端到端加密），又把 AI 失败检测做成免费不限量，是零运维路线的最优解，与自托管重装方案 Obico 形成互补。","polished":"HA 管得了家里局域网里的联动，出了门怎么办？OctoEverywhere 的答案是：不开放任何端口，给打印机一条端到端加密的隧道——浏览器或手机 App 随时随地看状态、看摄像头（免费就有 30 帧全速串流）、收通知。更狠的是它的 AI 失败检测『Gadget』免费不限量，识别拉丝、附着不良、层错位，可以直接报警或自动暂停；免费档支持 3 台打印机，OctoPrint、Klipper（Mainsail/Fluidd/Moonraker）、Bambu Lab OS、Elegoo OS 全都吃——拓竹玩家不开官方 App 也能远程盯机，Klipper 玩家更是白嫖到爽。怎么开始：第一步，按打印机类型装对应插件或容器，扫码绑定账号；第二步，手机装 OctoApp 或 Mobileraker，把通知渠道配齐（推送、Discord、Telegram、SMS、Slack、邮件都支持）；第三步，打开 Gadget，故意制造一次小失败看它多久报警。进阶玩法：多台机器用它的多打印机仪表盘拼一个口袋农场总览；它还能生成公开直播链接，把打印过程嵌进直播或博客页面。和本轮 obico-server 的关系：一个是完整可自托管的重装方案，一个是零运维的云端隧道，建议先用后者验证需求，再决定要不要自建。官方明确打印机不会暴露在公网，数据不出售，安全审计报告公开可查。","tags":["远程监控","拓竹","AI监控"],"effort":"周末级","id":"a412"},{"kind":"项目灵感","title":"OpenBambuAPI：社区逆向的拓竹 MQTT 协议文档，第三方联动的地基","url":"https://github.com/Doridian/OpenBambuAPI","source":"GitHub · Doridian/OpenBambuAPI","date":"2026-11","summary":"708 星、GFDL 开源的社区协议文档，把拓竹打印机的 MQTT 协议扒了个底朝天：局域网直连参数、report/request 主题、暂停调速发 Gcode 切耗材控制舱灯的 JSON 指令全部有据可查。","takeaways":["类型：协议文档 · 成本：免费 · 可行性：读文档加 mosquitto_sub 即可上手","708 星 · GFDL-1.3 · 2026-08 仍有更新，19 个 open issue 持续修订","局域网直连：bblp 用户名 + LAN 访问码，TLS 连 8883 端口，支持 # 通配订阅","指令覆盖：暂停/恢复/停止、四档速度、原始 Gcode、AMS 换料、舱灯、摄像头、pushall 全量状态"],"whyValuable":"这是所有拓竹第三方工具共同的地基层资产：读懂它，ha-bambulab 和 bambuddy 的内部原理一目了然，甚至可以自己写一个只属于你的极简集成——打印机从此不依赖任何一家 App。","polished":"所有拓竹第三方联动的地基都在这个仓库里：Doridian 整理的 Bambu API 社区文档（GFDL 开源，708 星，2026 年仍在更新），把打印机的 MQTT 协议扒了个底朝天。最实用的是局域网直连部分：用 bblp 作为用户名、LAN 访问码作为密码，TLS 连上打印机的 8883 端口，订阅 device/序列号/report 就能收到机器的全部状态心跳，往 device/序列号/request 发一条 JSON 就能暂停、恢复、停止、调四档速度（从静音到 ludicrous）、发原始 Gcode、切换 AMS 耗材、控制舱灯、开关摄像头录像——官方 App 能做的它几乎都能做，本地还支持 # 通配订阅把所有主题一次看全。怎么开始：第一步，读 mqtt.md 的本地连接章节，在打印机上拿到访问码；第二步，用 mosquitto_sub 订阅 report 主题，亲眼看看机器每秒在说什么，把 JSON 结构摸熟；第三步，写 20 行 Python 或一段 Node-RED 流程，完成『检测到打印完成就推送』这种最小联动。进阶玩法：把它当教材，理解 ha-bambulab、bambuddy 这些集成内部在干什么，甚至自己写一个只属于你的极简集成。为什么值得：协议文档是社区公共资产，读懂它，打印机就不再依赖任何一家 App——这才是智能家居联动最底层的自由。","tags":["拓竹","MQTT","协议"],"effort":"周末级","id":"a413"},{"kind":"延伸创意","title":"打印进度灯条：WLED 让房间灯光跟着打印进度走","url":"https://www.home-assistant.io/integrations/wled","source":"延伸创意 · 基于 Home Assistant WLED 官方集成 + Aircoookie/WLED（近 1.9 万星）","date":"2026-11","summary":"用 WLED 驱动一条 WS2812B 灯条，在 HA 里把打印进度实体映射成灯效：进度条式点亮、打印中呼吸蓝光、出错红色爆闪、完成切庆祝彩虹。HA 官方 WLED 集成是白金质量，自动化零门槛。","takeaways":["类型：传感器自动化 DIY · 成本：几十元（ESP32+灯条）· 可行性：周末级","HA 官方 WLED 集成白金质量：每个分段就是灯实体，预设/调色板/特效全是标准 select","WLED 近 1.9 万星开源固件，WS2812B 等 LED 全支持，HA 自动发现","状态机三套灯效：打印中/失败/完成，复用同一逻辑还能控制排风扇"],"whyValuable":"这是『传感器自动化』最直观的展示位：客人一眼看懂、朋友来了必问，把抽象的打印进度变成整个房间的可视化，而成本只有几十块钱的灯条。","polished":"把打印进度从手机屏幕搬到整面墙上：用 WLED 驱动一条 WS2812B 灯条（ESP32 固件开源，近 1.9 万星），在 Home Assistant 里把打印进度实体映射成灯效——进度每涨 10%，灯条就多点亮一段；打印中呼吸蓝光，出错红色爆闪，打印完成切换庆祝彩虹。HA 的 WLED 官方集成质量是白金级：每个分段就是一个灯实体，预设、调色板、特效全都是标准 select，自动化写起来毫无门槛，设备还会被自动发现。怎么开始：第一步，ESP32 刷 WLED 固件接灯条，HA 自动发现后配好网段；第二步，建第一条自动化：进度实体数值变化时调用 light.turn_on 设定对应亮度百分比；第三步，在 WLED 里做好『打印中/失败/完成』三套预设，自动化里按打印机状态机切换。进阶玩法：把灯条沿打印间天花板走一圈做氛围光，色温跟着喷头温度走；或者复用同一套状态机控制智能插座排风扇——打印中开、完成即停，一套逻辑两处复用。为什么值得：这是传感器自动化最直观的展示位——客人一眼看懂，朋友来了必问，而成本只有几十块钱的灯条。它也是给打印间做『环境反馈系统』的第一块砖：机器有情绪，房间有反应，3D 打印从此长在了房子上。","tags":["Home Assistant","WLED","自动化"],"effort":"周末级","id":"a414"},{"kind":"延伸创意","title":"一个智能插座两层玩法：功率 watchdog 加打印电费年报","url":"https://www.home-assistant.io/docs/energy/","source":"延伸创意 · 基于 Home Assistant Energy 看板（官方文档）+ 智能插座功率传感器","date":"2026-11","summary":"二三十块的智能插座两层玩法：实时层做 watchdog，功率骤降判定打印完成或中断，自动通知加断电；长期层接入 HA Energy 看板，按月按年统计打印电费，年底导出一份年度打印报告。","takeaways":["类型：传感器自动化 · 成本：二三十元智能插座 · 可行性：周末级","实时层：打印功率基线稳定，功率骤降保持数分钟即判定完成/中断，先通知后断电","长期层：HA Energy 看板支持单设备接入，功率积分转 kWh，按月按年自动累计","进阶：结合谷电时段，让大件长打印自动等电价低谷再开始"],"whyValuable":"它同时解决夜间无人值守的安全焦虑和『玩打印到底烧不烧钱』的账目问题——两件烦恼，一个插座收编，是所有打印机传感器自动化里性价比最高的入口。","polished":"最便宜的打印机传感器自动化入口，是一个二三十块的智能插座。玩法分两层。实时层当 watchdog：HA 里给功率传感器写数值触发自动化，打印中的功率基线是稳定的，一旦功率骤降并保持几分钟，多半是打印完了或中途断了，自动推送通知、关插座断电；配合打印状态实体做双确认，误判几乎为零。长期层做账本：HA Energy 看板支持把单个设备接进来，功率传感器经积分转成 kWh 长期累计——这个月打印用了多少度电、折算多少钱、哪台机器是电老虎、每卷耗材摊多少电费，年底导出就是一份《年度打印报告》。怎么开始：第一步，打印机插智能插座接入 HA，完整跑一次打印记录功率曲线，摸清待机、加热、打印三段基线；第二步，写 watchdog 自动化，先只通知不断电，观察一周准确率后再放开断电权限；第三步，把能耗实体加入 Energy 看板，度数和折算成本随月随年自动累计。进阶玩法：结合谷电时段，让需要跑十几个小时的大件自动等电价低谷再开始。为什么值得：它同时解决夜间无人值守的安全焦虑和『玩打印到底烧不烧钱』的账目问题——两件烦恼一个插座收编，而且是所有打印机传感器自动化里最没有门槛的入口，买回来当晚就能跑通第一条自动化。","tags":["Home Assistant","智能插座","能耗"],"effort":"周末级","id":"a415"},{"kind":"视频选题","title":"AI 保安盯机实测：五种人为翻车，它几秒报警？","url":"https://obico.io/","source":"选题调研 · 基于 obico.io（开源 AI 打印监控 Obico，支持自托管）","date":"2026-11","summary":"自托管 Obico 后故意制造翻车的硬核实测：五种典型失败逐一测试 AI 报警延迟，做成对比表格；顺带考察自动暂停与误报率，最后回答无人值守到底该不该开自动暂停。","takeaways":["类型：实测横评 · 成本：一台带摄像头的打印机 + 可跑 Docker 的机器 · 可行性：周末级","正片结构：五种失败（拔料/抬喷头/刮模型/断电/拉丝）秒表计时报警延迟","钩子设计：塞入『换色不算失败』的刁钻样本考误报率","对标差异：翻车合集靠惨博流量，这条带数据表格，AI 延迟就是传播点"],"whyValuable":"无人值守是所有 3D 打印玩家的共同痛点，市面翻车合集只供情绪价值，这条用实测数据给出可操作的结论，技术浓度与实用性兼得。","polished":"一条把『AI 看打印』做硬核实测的选题：自托管一套 Obico，然后故意制造翻车，看 AI 保安多久发现。脚本结构建议五段：开场用一段真实的拉丝惨案引入——无人值守一晚浪费一整卷料的痛，每个打印玩家都懂；第二段快速过方案选型，为什么选可自托管的开源 Obico（摄像头数据不出门、模型可调、有免费档先试）；第三段是正片：连续制造五种典型失败——中途拔料、手动抬喷头、刮掉模型、断电重连、经典拉丝，用秒表记录每种失败从发生到 AI 报警的延迟，做成对比表格，这就是全片传播点；第四段考察它的自动暂停敢不敢触发、误报率如何，把最刁钻的『类似失败但其实是正常换色』也塞进去考一考它；结尾给结论：无人值守到底该不该开自动暂停，什么情况下人还是要盯。差异化：市面上翻车合集靠惨博流量，这条是带数据的横评，表格截图天然适合做封面和传播图；顺带演示报警接到手机推送与邮件的完整链路。成本：一台带摄像头的打印机加一台跑得动 Docker 的机器，周末级可完成。受众是所有想无人值守又不敢的 3D 打印玩家，痛点精准，完播率有保障。","tags":["3D打印","AI监控","实测"],"effort":"周末级","id":"a416"},{"kind":"视频选题","title":"不装任何 App：手写一条 MQTT 消息直接命令拓竹打印机","url":"https://github.com/Doridian/OpenBambuAPI/blob/main/mqtt.md","source":"选题调研 · 基于 Doridian/OpenBambuAPI 的 mqtt.md（拓竹 MQTT 协议社区文档）","date":"2026-11","summary":"揭秘向技术选题：不装官方 App 也不装 HA，用一条 MQTT 消息直接跟拓竹打印机对话。从拿到 LAN 访问码、订阅心跳，到手写 JSON 当场暂停打印机，最后升级成 20 行 Python 守护脚本。","takeaways":["类型：揭秘教程 · 成本：几乎为零 · 可行性：周末级，素材是终端录屏+一台打印机","开场钩子：智能家居联动的背后到底是什么？直接掀开管道给观众看","正片三连：mosquitto_sub 看机器心电图 → 手写 JSON 让打印机当场暂停 → 20 行 Python 极简守护","差异化：市面教程停在『装个集成』，这条讲清楚地板下面是什么，对 IoT 新人是一堂直观 MQTT 课"],"whyValuable":"直接掀开智能家居联动的地板给观众看：协议是社区逆向并开源维护的，懂技术的人会狂转，想入门 IoT 的新人能收获一堂比教科书直观的 MQTT 课。","polished":"一条揭秘向技术选题：不装官方 App、不装 Home Assistant，就用一条 MQTT 消息直接跟拓竹打印机对话。结构建议四段：开场先抛问题——智能家居联动的背后到底是什么？与其抓包，不如直接读社区逆向好的 OpenBambuAPI 协议文档（GFDL 开源，仍在更新）；第二段实操：在打印机上拿到 LAN 访问码，用 bblp 用户名 TLS 连上 8883 端口，mosquitto_sub 订阅 report 主题，满屏 JSON 心跳就是最好的『机器心电图』——喷头温度、坐标、进度全在里面，逐字段讲给观众听；第三段发号施令：往 request 主题手写一条 JSON，让打印机当场暂停，再当场恢复，节目效果拉满，顺带演示调速度档位和控制舱灯；第四段升级：把这段逻辑写进 20 行 Python 脚本，做一个只推送『打印完成』的极简守护进程，跑一晚验证稳定性。差异点：市面教程都停在『装个集成』，这条直接掀开地板给观众看管道本身，懂的人会狂转；对想入门 IoT 协议的新人，这是一堂比任何教科书都直观的 MQTT 课。风险与看点并存：协议由社区逆向维护，要提醒观众固件更新可能带来变动。成本几乎为零，周末级可完成。","tags":["3D打印","MQTT","揭秘"],"effort":"周末级","id":"a417"},{"kind":"项目灵感","title":"AWTRIX NG：像素时钟固件的原作者全面重写，AWTRIX 3 的正统继任者","url":"https://github.com/Blueforcer/AWTRIX-NG","source":"GitHub · Blueforcer/AWTRIX-NG（AWTRIX 3 已归档，NG 为从零重写的继任版本）","date":"2026-11","summary":"原作者 Blueforcer 归档了 2.4k 星的 AWTRIX 3 之后，从零重写的像素矩阵时钟固件：Ulanzi TC001/TC002 直刷或 ESP32 自制屏，MQTT/HTTP 接 Home Assistant，设备端 Berry 脚本写 App，网页 UI 编辑，无云无遥测。","takeaways":["类型：开源固件刷机 · 成本：Ulanzi TC001 整机入手即可 · 可行性：浏览器在线刷机，零编译","前代 AWTRIX 3（2.4k 星 / 965 提交）已归档，NG 全部重写，当前 1.2.x 版本仍在迭代","HA 经 MQTT discovery 自动发现：按钮、传感器、亮度、音量全部变实体；TC002 旋钮还能当 HA Voice 卫星","许可注意：PolyForm Noncommercial，个人/学校/科研免费，商用需单独授权"],"whyValuable":"ESP32 小电视这条线里，像素矩阵是比 GeekMagic 更复古的一支；由原作者亲自重写续命、生态里五千多人 Discord 兜底，是这个方向最正统也最活跃的选项，且与已有的 HA 玩法条目天然联动。","polished":"讲桌面像素屏绕不开 AWTRIX 这个名字：原作者 Blueforcer 已把功勋老仓库 AWTRIX 3 归档（2.4k 星、965 次提交），转头从零重写了 AWTRIX NG——不是社区外包接力，而是作者亲自续写，在这个圈子里相当稀有。硬件上直接对准 Ulanzi TC001/TC002 像素钟，也能升级 AWTRIX 2 主板，或用 ESP32/ESP32-S3 自制点阵屏；TC001 在浏览器里在线刷机，TC002 走 USB 安装器，全程零编译。设计哲学是『屏只管显示，智能交给智能家居』：接入 Home Assistant 后经 MQTT discovery 自动发现，按钮、传感器、亮度、音量全部变成实体，自动化里随意编排；内容也可以走 HTTP/MQTT 从 Node-RED、n8n 喂进来。设备端 App 用 Berry 脚本编写，内置网页 UI 直接改，带实时预览、图标编辑器和备份；滚动文字、动态图标、19 种背景特效、22 种转场，配旋律播放和网络电台，氛围感拉满。无云、无账号、全本地。怎么开始：第一步，入一台 TC001 或凑一块 ESP32 加 HUB75 点阵屏，浏览器刷入固件；第二步，接进 HA 发一条通知测试；第三步，去 AWTRIX 生态的 flows.blueforcer.de 分享站抄自动化模板，改造成自己的桌面情报看板。唯一注意：许可为 PolyForm Noncommercial，家用、学校、科研免费，想商用要单独谈——当桌面玩具毫无约束。","tags":["像素屏","ESP32","Home Assistant","开源硬件"],"effort":"周末级","id":"a418"},{"kind":"项目灵感","title":"ESP32-Cheap-Yellow-Display：约 15 美元的『黄板子』，4.6k 星社区文档工程","url":"https://github.com/witnessmenow/ESP32-Cheap-Yellow-Display","source":"GitHub · witnessmenow/ESP32-Cheap-Yellow-Display","date":"2026-11","summary":"ESP32-2432S028R：ESP32 焊一块 2.8 寸 320×240 电阻触摸屏，带 USB、SD 卡槽，到手约 15 美元。出厂资料几乎没有，这个仓库把刷机文档、示例代码、3D 打印外壳和社区项目清单全攒齐了。","takeaways":["类型：开源硬件文档工程 · 成本：整板约 15 美元包邮 · 可行性：买板即开箱","4.6k 星 / 464 fork / 396 提交 · MIT（原始文档目录除外）","SETUP/PINS/ADDONS/TROUBLESHOOTING 四件套文档，TFT_eSPI 与 ESPHome 双路线示例","附 3D 打印外壳、硬件魔改指南、PROJECTS.md 灵感清单，文档含繁体中文翻译"],"whyValuable":"『便宜到随手买的触摸屏 ESP32』是桌面小硬件门槛最低的品类，官方资料却约等于零；这个仓库把杂牌板的坑全部填平，是硬件新手和 HA 玩家理想的第一块能摸的屏。","polished":"这块板子江湖人称『廉价黄显示』：型号 ESP32-2432S028R，一颗 ESP32 焊着 2.8 寸 320×240 电阻触摸屏，再塞进 USB、SD 卡槽和一颗 LED，快递到手约 15 美元。问题是它出厂软件支持约等于没有——作者原话，官方资料『基本上就是某个网站上的一个 zip』。这个 4.6k 星的社区仓库干的就是填坑：SETUP.md 手把手刷机，PINS.md 整理引脚表，ADDONS.md 列扩展配件，TROUBLESHOOTING.md 收录常见玄学故障；示例代码同时给 TFT_eSPI 和 ESPHome 两条路线，还有 3D 打印外壳、硬件魔改指南，和一份越攒越长的 PROJECTS.md 灵感清单，连繁体中文翻译都有，社区 Discord 随时答疑。对想做桌面小硬件的人来说，它是成本最低的一块『能摸的屏』：接 Home Assistant 做 ESPHome 触摸面板、当天气钟、做迷你小电视、跑小游戏，社区全有先例可抄。怎么开始：第一步，按 SETUP.md 烧第一个 demo，注意这板子出过好几版硬件，屏幕驱动可能不同，报错先对照 troubleshooting；第二步，从 PROJECTS.md 挑一个复刻，比如天气钟或 HA 控制面板；第三步，把自己踩的坑提交回去——这个仓库本来就是靠社区互相填坑长起来的。许可 MIT（原始文档目录除外），拿来做视频教程几乎零负担。","tags":["ESP32","触摸屏","开源硬件","社区文档"],"effort":"周末级","id":"a419"},{"kind":"项目灵感","title":"esp32-weather-epd：6.3k 星的桌面墨水屏气象站，一节电池撑半年","url":"https://github.com/lmarzen/esp32-weather-epd","source":"GitHub · lmarzen/esp32-weather-epd","date":"2026-11","summary":"ESP32 驱动 7.5 寸 800×480 电子墨水屏的气象站：OpenWeatherMap 数据 + 板载 BME280 室内传感器，睡眠电流约 14μA，5000mAh 电池按半小时刷新能撑 6-12 个月，界面排版精致可深度定制。","takeaways":["类型：开源硬件桌面设备 · 成本：屏幕加开发板几百元级 · 可行性：接线几根，改配置烧录即用","6.3k 星 / 483 fork · GPL-3.0 · 支持 Waveshare/Good Display 多款 7.5 寸黑白、红白、七色屏","功耗实测：睡眠约 14μA，刷新约 83mA 持续 15 秒；5000mAh 电池 30 分钟刷新档可用 6-12 个月","数据源 OpenWeatherMap One Call 3.0 + 空气质量 API，免费档每天 1000 次调用足够"],"whyValuable":"桌面小硬件里最『安静』的审美路线：与像素屏一闪一静正好互补；6.3k 星说明它是墨水屏自制设备里最成熟的模板，抄作业成本极低。","polished":"桌面小硬件里最安静的一类：7.5 寸电子墨水屏气象站。这个 6.3k 星的项目用 ESP32 驱动一块 800×480 的 Waveshare 或 Good Display 墨水屏，除了黑白版，还支持红白双色和七色 ACeP 面板；刷新一次约十五秒，之后整屏断电零功耗——官方数据睡眠电流约 14μA，刷新时约 83mA，5000mAh 电池按半小时刷新一次能撑 6 到 12 个月，配上 USB-C 充电，是真正可以挂上墙然后忘掉它的设备。数据侧走 OpenWeatherMap 的 One Call 3.0 与空气质量接口，免费档每天 1000 次调用绰绰有余；板上焊一颗 BME280 传感器补齐室内温湿度气压。界面深度可定制：语言、单位、日期格式、AQI 标准、字体全可调，排版专为墨水屏灰阶设计，观感相当高级，和那种满屏广告的成品气象钟是两个物种。怎么开始：第一步，按仓库推荐买 Waveshare 7.5 寸 v2 面板加 ESP32 开发板，接线只有几根杜邦线；第二步，改配置填 API key 和城市坐标，烧录固件；第三步，调刷新间隔平衡电池寿命与数据新鲜度，找个相框装起来。GPL-3.0 许可，魔改开源无压力。它和像素屏是两种方向的审美：一个闪、一个静，桌面上并排放刚刚好。","tags":["墨水屏","ESP32","桌面硬件","气象站"],"effort":"周末级","id":"a420"},{"kind":"项目灵感","title":"pixoo-homeassistant：把 Divoom Pixoo 64 正式编入 Home Assistant 的像素看板","url":"https://github.com/gickowtf/pixoo-homeassistant","source":"GitHub · gickowtf/pixoo-homeassistant（HACS 自定义集成）","date":"2026-11","summary":"MIT 许可的非官方自定义集成，让最容易买到的 64×64 像素屏玩具 Divoom Pixoo 64 听 Home Assistant 指挥：Jinja2 模板自由组件、页面轮播、临时通知推送、蜂鸣器，还内置一整套像素字体。","takeaways":["类型：Home Assistant 自定义集成 · 成本：一台 Pixoo 64 · 可行性：HACS 一键安装","260 星 / 30 fork / 313 提交 · MIT 许可","页面类型：时钟、频道、音乐可视化、GIF、光伏、进度条、油价牌；组件全部支持 Jinja2 模板引用任意传感器","内置 Tiny5、PressStart2P、PICO_8 等像素字体，支持自定义 .bdf 字体"],"whyValuable":"Divoom 是像素屏玩具里铺货最广的品牌，App 生态丰富但封闭；这个集成把『显示什么』的控制权整个交给 HA，是像素屏玩家数据看板化的最短路径。","polished":"Divoom Pixoo 64 是市面上最容易买到的 64×64 像素屏玩具，官方 App 生态热闹，但显示内容终究要在手机上手动折腾；这个 MIT 许可的自定义集成把它正式编入 Home Assistant：HACS 一键安装，之后屏幕上放什么全由 HA 说了算。能力比想象中细：页面类型有时钟、频道切换、音乐可视化、GIF 播放、光伏发电、进度条、油价牌，还有一个自由组件系统——文字、图片、矩形全部支持 Jinja2 模板，可以直接引用 HA 里的任何传感器值；页面轮播按每页时长或扫描间隔自动切换；show_message 服务能把临时通知推上屏幕，过时自动消失；连蜂鸣器都能放音。字体内置 Tiny5、PressStart2P、PICO_8 等一整套像素味儿正宗的字形，也支持自定义 .bdf 字体。对已经在跑 HA 的人来说，这是把『数据看板』从浏览器搬上桌面的最低成本路径：打印机状态、AI 用量、文摘更新数、家庭能耗，想要什么就模板什么。怎么开始：第一步，HACS 装集成并配好设备 IP；第二步，先做一个时钟页和一条 show_message 通知跑通链路；第三步，用 Jinja2 把自己最常看的几个传感器拼成轮播页。社区小经验：亮度别拉满，README 提到设到 90% 可避免崩溃——民间集成的小脾气，恰恰是折腾乐趣的一部分。","tags":["像素屏","Home Assistant","Divoom","自动化"],"effort":"周末级","id":"a421"},{"kind":"项目灵感","title":"cool-retro-term：26.6k 星的 CRT 复古终端，把 2026 年的命令行装回 1985","url":"https://github.com/Swordfish90/cool-retro-term","source":"GitHub · Swordfish90/cool-retro-term","date":"2026-11","summary":"专门模仿 CRT 阴极射线管观感的终端模拟器：辉光、扫描线、屏幕曲率、绿字琥珀字荧光效果全可调，底下却是真终端（基于 Konsole 的 qtermwidget QML 移植），Linux/macOS 可用。","takeaways":["类型：终端模拟器 · 成本：免费 · 可行性：AppImage/dmg 下载即用，Ubuntu/Fedora/Arch 仓库有包","26.6k 星 / 1.0k fork · GPL-2.0/3.0 · 基于 qtermwidget（Konsole）的 QML 移植","右键设置菜单调颜色、字体、特效，经典绿字与琥珀色荧光粉风格一键切换","仅 Linux 与 macOS，需要 Qt6；特效开最高会明显吃 GPU"],"whyValuable":"『CLI 复古美学』的代言人级项目：既当日常氛围终端，又直接解决录视频时『终端画面太素』的问题——录出来即成片，不用后期加滤镜，是内容创作者的视觉风格工具。","polished":"要给『CLI 复古美学』选代言人，就是它：cool-retro-term，26.6k 星，专门模仿 CRT 阴极射线管显示器观感的终端模拟器。辉光、扫描线、屏幕曲率、荧光粉色调这些经典元素全部可调，右键设置菜单改颜色、字体、特效，绿字和琥珀字一秒穿越回 1985——但它底下是真终端，基于 Konsole 的 qtermwidget QML 移植，跑什么命令都不含糊。Linux 和 macOS 可用，需要 Qt6，AppImage 和 dmg 直接下载，Ubuntu、Fedora、Arch 仓库里也有现成包。它的价值分三层：日常层，换上它写代码，工位直接复古未来主义；创作层，录终端演示视频时它就是现成的视觉风格——不用后期加滤镜和扫描线特效，录出来即成片，配复古像素字体和 chiptune 配乐就是一整套视觉体系；怀旧层，它把『终端本来就该好看』这个态度带了回来，项目本身就是审美驱动的作品。怎么开始：第一步，下载 AppImage 双击跑起来，把配色调成琥珀色经典款；第二步，在里面跑一遍你常用的工具链找手感；第三步，录屏或直播时把它全屏当舞台用。注意两点：它只是『看起来』复古，特效档位拉满会吃 GPU，录屏前先把性能调平衡；Windows 用户暂时无缘，需要 Qt6 环境。","tags":["终端","复古美学","CRT"],"effort":"周末级","id":"a422"},{"kind":"项目灵感","title":"cava：终端里的音频频谱律动，6.5k 星的复古视觉玩具","url":"https://github.com/karlstav/cava","source":"GitHub · karlstav/cava","date":"2026-11","summary":"跨平台音频频谱可视化器：一排小柱子跟着音乐在终端里跳动，README 自己声明『不用于科学用途』，目标就一个字——好看。SDL2 窗口、GLSL 着色器、渐变主题、均衡器全可配。","takeaways":["类型：终端音频可视化玩具 · 成本：免费 · 可行性：包管理器一条命令安装","6.5k 星 / 303 fork · MIT · Linux/FreeBSD/macOS/Windows 全平台","输入后端 PipeWire/PulseAudio/ALSA/PortAudio/JACK/mpd fifo/Core Audio/Windows 输出捕获，覆盖所有听歌姿势","输出除终端外还有 SDL2 + OpenGL/GLSL 着色器窗口，渐变色、主题、灵敏度全可调"],"whyValuable":"终端玩具序列里最上镜的一个：对普通人是桌面氛围道具，对内容创作者是廉价但效果极佳的视觉素材——直播角落挂一个，观众能看见你 BGM 的呼吸。","polished":"终端玩具序列里最上镜的一个：cava，6.5k 星的跨平台音频频谱可视化器，一排小竹节柱跟着音乐在终端里跳动。README 自己都说『不打算用于科学用途』，目标就一个字：好看。但工程上一点不含糊——输入后端从 PipeWire（默认）、PulseAudio、ALSA、PortAudio、JACK、OSS、mpd fifo，一路支持到 macOS Core Audio 和 Windows 系统输出捕获，基本覆盖所有听歌姿势；输出除了终端 ncurses，还有 SDL2 窗口加 OpenGL/GLSL 着色器，渐变色、主题、均衡器灵敏度全部可配，Linux、FreeBSD、macOS、Windows 全平台能跑。对内容创作者来说它是廉价的『氛围道具』：直播写代码时角落挂一个，观众看得见你 BGM 的呼吸；做复古主题视频时，终端频谱配像素风界面就是天然的视觉母题。怎么开始：第一步，用包管理器安装，各发行版仓库和 Homebrew 都有，选好音频后端；第二步，改配置文件调柱宽、颜色梯度和平滑度，找到最顺眼的参数组合；第三步，SDL 模式开起来放桌面，或者录进视频当动态背景。MIT 许可，没有任何使用门槛。它不解决任何实际问题，纯粹让终端更快乐——而『没有用但好看』，恰恰是复古美学玩具的精髓。","tags":["终端","音乐","可视化","复古美学"],"effort":"周末级","id":"a423"},{"kind":"项目灵感","title":"Textual：用 CSS 写终端界面，37.6k 星的 Python TUI 框架","url":"https://github.com/Textualize/textual","source":"GitHub · Textualize/textual","date":"2026-11","summary":"MIT 许可的 Python TUI 框架：用类似 CSS 的样式表描述布局，组件库齐全（按钮、树、数据表、输入框），自带命令面板与调试工具，还能用 textual serve 把同一个应用直接跑进浏览器。","takeaways":["类型：Python 开发框架 · 成本：免费 · 可行性：pip install textual 即装","37.6k 星 / 1.4k fork / 13104 提交 · MIT 许可 · Textualize 官方维护","CSS 式样式表 + 全套组件 + Ctrl+P 模糊搜索命令面板，异步底层但写法直觉","textual serve 让同一应用跑在浏览器里；textual-dev 提供第二终端调试台，官方测试框架标配"],"whyValuable":"看够别人家的终端工具想自己写一个，这是当下最强的答案；对写惯 Python 的作者，给 AI 用量账本或文摘管线做一个终端仪表盘，正是一两个周末的体量。","polished":"看够别人家的终端工具、眼馋想自己写一个？Textual 是当下最强的答案：37.6k 星、MIT 许可的 Python TUI 框架，用写网页的思路写终端应用——布局用类似 CSS 的样式表描述，组件库开箱即用，按钮、树、数据表、输入框、文本域一应俱全，还自带 Ctrl+P 模糊搜索命令面板，可以扩展自定义命令。底层是异步架构，但写起来完全可以同步直觉化，不逼你先学 asyncio。调试体验专门设计过：装上 textual-dev 包，从第二个终端连上 Dev Console 看日志和变量；官方测试框架也是标配，TUI 应用终于能正经写单测了。最杀手的特性是 textual serve——同一个应用直接跑进浏览器，Textual Web 甚至号称能穿透防火墙对外服务，『终端应用』和『网页应用』的边界被抹掉了。对写惯 Python 的人来说，用武之地现成：给 Claude Code 用量账本做一个终端仪表盘、给文摘管线做个运行状态面板、把魔方计时做成 TUI 小工具，都是一两个周末的体量。怎么开始：第一步，pip install textual，跑官方 demo（python -m textual 或 uvx textual-demo）感受组件手感；第二步，照官方教程写一个带输入框和数据表的小应用，体会 CSS 布局；第三步，textual serve 挂到浏览器里，发链接给别人围观。","tags":["Python","TUI","终端","开发框架"],"effort":"一周级","id":"a424"},{"kind":"延伸创意","title":"终末地情报像素屏：AWTRIX NG 接管文摘日更播报","url":"","source":"延伸创意 · 基于 AWTRIX NG（本轮条目）+ endfield-digest 自动化日更管线","date":"2026-11","summary":"给桌面像素屏装一条『文摘情报线』：digest 流水线每跑完一轮，把新增条目数、来源分布打包成 JSON 推给 AWTRIX NG 的自定义 App，像素屏常驻一页终末地情报速览，有更新就跳动滚动，没更新就安静倒数。","takeaways":["类型：自有项目组合功能 · 成本：零（复用现有管线与屏幕）· 可行性：周末级跑通","digest 日更数据 → AWTRIX Custom App：新增条目数/来源分布打包成一条 HTTP 或 MQTT 推送","进阶两层：接 HA 联动灯光播报；用 TC002 旋钮在情报、AI 用量、打印机状态页之间切换，升级成工位统一状态灯","内容反哺：『我把文摘日更装进了桌上的像素钟』是与自动化日更那期天然承接的下篇选题"],"whyValuable":"把已经在跑的两套系统（文摘管线、像素屏）用一条 HTTP 消息焊起来，不引入任何新数据源，工程边界极小，还自带一期连载感很强的视频选题。","polished":"手上有两样已经在各自运转的东西：endfield-digest 的情报管线每天自动产出终末地文摘更新，AWTRIX NG（本轮条目）负责把任何 MQTT/HTTP 消息变成像素屏上的滚动字幕和动态图标。这个延伸创意就是把两者焊起来，给像素屏装一条『文摘情报线』：文摘流水线每跑完一轮，统计当天新增条目数、来源分布、是否有大版本更新，打包成一条 JSON 推给 AWTRIX 的自定义 App，屏幕上常驻一页『终末地情报速览』——有新内容时图标跳动、字幕滚动，没内容时安静显示距下次更新的倒数。工程边界很小：digest 管线数据现成，AWTRIX 侧只需写一个 Berry 脚本 App 或走纯 HTTP 推送，周末级体量。再往上叠两层：第一层接 Home Assistant，把『文摘更新了』变成自动化触发条件，联动灯光或音箱播报，客厅里就有一台终末地情报钟；第二层做反向交互，用 TC002 的旋钮在情报页、AI 用量页、打印机状态页之间切换，这块像素屏就升级成创作工位的统一状态灯。内容上还能反哺：『我把文摘日更装进了桌上的像素钟』本身就是一个与自动日更那期天然成对的视频选题，上篇讲管线、下篇讲硬件，连载感直接成立。许可注意：AWTRIX NG 为 PolyForm Noncommercial，自用播报毫无问题。","tags":["组合","自动化","内容生产","像素屏"],"effort":"周末级","id":"a425"},{"kind":"视频选题","title":"不碰录屏软件：我用一个 .tape 文件把终端演示变成 GIF/MP4 素材","url":"https://github.com/charmbracelet/vhs","source":"GitHub · charmbracelet/vhs（Charm 出品，21.3k 星）","date":"2026-11","summary":"终端演示视频的老三样痛苦：手滑、节奏不匀、分辨率不统一，重录五遍是常态。VHS 的解法是程序员式的：写一个 .tape 剧本描述每一步，一条命令渲染出像素级一致的 GIF、MP4、WebM，还能接 CI 自动重录。","takeaways":["类型：工具实测/工作流改造视频 · 成本：免费开源 · 可行性：一条命令安装，十分钟上手","21.3k 星 / 491 fork · MIT · Charm 家出品，Windows 下 winget/scoop 可装","剧本指令：Type、Enter、Sleep、Wait（正则等到输出）、Hide/Show；输出 GIF/MP4/WebM/PNG 帧","vhs record 反向生成剧本；vhs-action 接 CI，仓库发版自动重录 README 演示 GIF"],"whyValuable":"面向 UP 主自己最痛的点动手：演示素材代码化以后可版本管理、可重放、可 CI 生成，前后对比就是天然的高潮段落，工具门槛低到观众当晚就能抄。","polished":"终端演示视频的老三样痛苦：手滑打错命令、打字节奏不匀、每次分辨率不一样，重录五遍是常态。Charm 家的 VHS（21.3k 星）给出程序员式解法：写一个 .tape 剧本文件，用 Type、Enter、Sleep、Wait（支持正则，等到输出出现再继续）描述每一步，跑一下 vhs demo.tape，出来就是渲染好的 GIF、MP4、WebM 或 PNG 帧序列——字体、主题、窗口尺寸、帧率、回放速度、光标闪烁、窗口栏、圆角全部在剧本里声明，每次产物像素级一致。更妙的是 vhs record：先手动操作一遍终端，它反向生成 tape 文件，从此演示剧本可以进 git 做版本管理；官方 vhs-action 接进 CI，仓库一发版自动重录 README 里的演示 GIF；还内置 SSH 服务器和 vhs.charm.sh 发布托管。技术栈上它靠 ttyd 和 ffmpeg 干活——这顺便点破另一个玩法：ttyd 本身就能把终端投成网页，OBS 里当浏览器源捕获，直播画面就有了。选题切口：别做成工具介绍，做成『我的终端演示流水线改造记』——从手滑重录五遍，到改一行剧本重跑十秒出片，前后对比就是天然的高潮。Windows 下 winget/scoop 可装，观众当晚就能抄作业。","tags":["终端","视频素材","开源工具","内容生产"],"effort":"周末级","id":"a426"},{"kind":"视频选题","title":"揣兜里的 ESP32 电脑：M5Stack Cardputer 到底能干嘛","url":"https://docs.m5stack.com/en/core/Cardputer","source":"M5Stack 官方文档 · docs.m5stack.com/en/core/Cardputer","date":"2026-11","summary":"一张信用卡大小的 ESP32-S3 全键盘小电脑：双核 240MHz、1.14 寸 240×135 屏、56 键键盘、麦克风扬声器、红外发射头标称 410 厘米、磁吸底座藏 1400mAh 电池。一条视频回答『这东西能干嘛』。","takeaways":["类型：上手实测/设备盘点视频 · 成本：需购入一台 Cardputer · 可行性：文档齐全，四条编程路线","核心参数：ESP32-S3FN8 双核 240MHz / 8MB Flash，ST7789 1.14 寸 240×135，整机 84×54×19.7mm、92.3g","外围齐活：MEMS 麦克风 + 1W I2S 扬声器、红外发射 410cm、microSD、Grove 口、2.4G Wi-Fi、睡眠 0.26μA","官方文档页未标售价：视频口播报价前先查当天电商价，避免翻车"],"whyValuable":"桌面小硬件里最有复古电脑气质的入门口设备，『能干嘛』是搜索意图明确的选题；键盘手感与电池续航只有上手才有结论，天然驱动续集。","polished":"桌面小硬件里最有『复古电脑』气质的一台：M5Stack Cardputer，一张信用卡大小的 ESP32-S3 全键盘小电脑。官方参数很能打：Stamp-S3 模块，ESP32-S3FN8 双核 240MHz、8MB Flash；1.14 寸 240×135 的 ST7789 屏；56 键键盘（4×14）直接焊在面板上；MEMS 麦克风加 1W I2S 扬声器；红外发射头标称能打 410 厘米，对准电视空调就是万能遥控器；microSD、Grove 扩展口、2.4G Wi-Fi 齐全；120mAh 内置电池，磁吸底座里再藏一块 1400mAh，底座可吸附金属、带乐高兼容孔；整机 84×54×19.7 毫米、92.3 克，睡眠电流 0.26μA。编程路线四条：Arduino、UiFlow2 图形化、PlatformIO、ESP-IDF，从图形化小白到裸写固件都能接。选题切口：拍一支『揣兜里的掌上终端』体验视频——开机进终端写个小应用、做个 HA 遥控页面、当红外万能遥控器、翻社区项目库找复古游戏 demo，一条视频把『这东西能干嘛』回答干净；续集钩子是键盘手感与电池实测，这两点只有上手才有结论，天然驱动二创。注意一个细节：官方文档页没有标价格，视频里报售价前先查当天电商价并注明『以实时价格为准』，避免口播翻车；对比对象可以拉上树莓派 Zero 和之前收录的小电视，做出品类横评的层次感。","tags":["ESP32","掌上电脑","桌面硬件","视频选题"],"effort":"一周级","id":"a427"},{"kind":"项目灵感","title":"anthropics/skills：Anthropic 官方 Agent Skills 仓库，连 docx/pptx 技能的生产源码都摊开给你看","url":"https://github.com/anthropics/skills","source":"GitHub · anthropics/skills（Agent Skills 开放标准见 agentskills.io）","date":"2026-11","summary":"Anthropic 官方技能示范仓库：创意/开发/企业工作流各类技能示例，附带驱动 Claude『创建文件』能力的 docx/pdf/pptx/xlsx 四个文档技能源码（source-available），还有规范、模板和 Claude Code 插件市场一键安装。","takeaways":["类型：官方技能库/学习范本 · 成本：免费 · 可行性：一条 /plugin 命令装进 Claude Code","18.6 万星（GitHub API，2026-11-03），2026-10 仍在更新；多数示例 Apache 2.0，文档四件套 source-available","安装：/plugin marketplace add anthropics/skills，再装 document-skills 或 example-skills","技能本体只是一个带 YAML frontmatter 的 SKILL.md 文件夹，template-skill 改改就是自己的第一个技能"],"whyValuable":"想理解『技能』这个 2026 年 agent 生态最热的抽象，没有比官方示范库更好的入口；文档四件套是给 Claude 生产功能供电的同款代码，源码可读即教程，直接喂给『AI 编程工具配置单』和双周报条线。","polished":"技能（Skills）是 2026 年 coding agent 生态最热的抽象，而它的官方示范库就摆在 anthropics/skills：18.6 万星，从创意设计到测试网页、生成 MCP server 的技能示例全在里面。最有分量的是 skills/docx、pdf、pptx、xlsx 这四个文件夹——它们是给 Claude『创建文件』功能供电的同款实现，官方以 source-available 形式摊开，等于把一份生产级 AI 应用的底牌给你看：技能怎么组织脚本、怎么处理模板、怎么做校验，全是第一手范本。技能本身简单得不像话：一个文件夹，一个带 YAML frontmatter 的 SKILL.md，可选加脚本和资源，仓库里连 spec 和 template 都备好了。怎么开始：第一步，在 Claude Code 里跑 /plugin marketplace add anthropics/skills，装上 document-skills，丢一份 PDF 让它抽表单字段，直观感受技能被触发的过程；第二步，打开 docx 技能源码，看官方怎么把『生成 Word』拆成指令加脚本两层；第三步，照 template-skill 写一个自己工作流的技能。顺带一提，Agent Skills 已是开放标准（agentskills.io），Codex 等 agent 也能读同一份 SKILL.md——写一次，到处安装。","tags":["ClaudeCode","AI","AgentSkills","效率"],"effort":"周末级","id":"a428"},{"kind":"项目灵感","title":"superpowers：31 万星的技能框架，给 coding agent 装上『先想清楚再动手』的完整开发方法论","url":"https://github.com/obra/superpowers","source":"GitHub · obra/superpowers（已进入 Claude 与 Codex 官方插件市场）","date":"2026-11","summary":"Jesse Vincent 的 superpowers 不是单个技能，而是一整套软件开发方法论：自动头脑风暴挤需求 → 分段确认 spec → 写『没品味实习生也能照做』的实施计划 → subagent 驱动的红绿 TDD，agent 能按计划自主跑两小时不跑偏。","takeaways":["类型：技能框架/工作流方法论 · 成本：免费 · 可行性：一条 /plugin install 装进 Claude Code","31.1 万星（GitHub API，2026-11-03），2026-11-02 仍在提交；可装 16 种 harness，含 Claude Code、Codex App/CLI、Cursor、Gemini CLI、OpenCode、Qwen Code","已进 Anthropic 官方插件市场（claude.com/plugins/superpowers）和 OpenAI Codex 官方插件市场（openai/plugins）","核心哲学写在脸上：真红绿 TDD、YAGNI、DRY；技能自动触发，不需要记得手动调用"],"whyValuable":"之前『给 agent 上缰绳』是防御性叙事，superpowers 把同一件事升级成进攻性方法论：用流程和技能约束 agent 的行为。Claude Code 与 Codex 双修的用法正好做横评——同一个任务，装与不装 superpowers 各跑一遍。","polished":"如果只装一个第三方技能包，很多人会选 superpowers：31 万星、作者 Jesse Vincent、已经同时进了 Anthropic 和 OpenAI 两家官方插件市场。它的野心不是帮你写代码，而是改造你写代码的方式：agent 一察觉你要造东西，不会扑上去就敲，而是先退一步追问你到底想要什么；把需求挤成 spec 后，分段展示，短到你真能读完；你签字确认，它才写一份『让一个热情但没品味、没上下文、讨厌测试的实习生也能照做』的实施计划；然后进入 subagent 驱动开发——子代理逐项施工，主 agent 检查验收，红绿 TDD、YAGNI、DRY 全程压阵，官方说法是 agent 常常能按计划自主干上两小时不跑偏。关键是这套流程靠技能自动触发，你什么都不用记。支持面也夸张：Claude Code、Codex App/CLI、Cursor、Gemini CLI、OpenCode、Qwen Code 等 16 种 harness 都能装。怎么开始：第一步，/plugin install superpowers@claude-plugins-official；第二步，丢一个你拖了很久的小项目进去，观察它怎么逼你把需求说清楚；第三步，对比裸奔 agent 和 superpowers agent 的返工率，数据本身就是一支视频。","tags":["ClaudeCode","AI","工作流","效率"],"effort":"周末级","id":"a429"},{"kind":"项目灵感","title":"npx skills：Vercel 给 agent 技能做的『npm 时刻』，一行命令装进 75+ 个 coding agent","url":"https://github.com/vercel-labs/skills","source":"GitHub · vercel-labs/skills（技能目录站 skills.sh）","date":"2026-11","summary":"开放 agent skills 生态的官方 CLI：npx skills add/find/check/update 跨 Claude Code、Codex、Cursor、OpenCode 等 75+ 个 agent 统一安装技能，注册表 skills.sh 负责发现与展示；实验特性还能把 npm 包自带的技能随依赖同步进项目。","takeaways":["类型：CLI 工具/技能生态基础设施 · 成本：免费 · 可行性：npx 一行，Node 22.20+","37,780 stars（GitHub API，2026-11-03），MIT 开源，2026-11-02 仍在提交","npx skills add owner/repo --skill xxx -a claude-code；-g 全局安装跨项目可用","experimental_sync：npm 依赖自带的技能随依赖更新同步进项目，配 skills-lock.json 锁定"],"whyValuable":"技能生态从『复制粘贴 markdown』进入包管理时代是今年最清晰的信号，Vercel 押注的这套 CLI + skills.sh 就是那个 npm。对重度玩 Claude Code/Codex 的人，这是基础设施级的工具，值得单独讲一期。","polished":"npm 改变了 JavaScript，而 Vercel 想让技能也拥有自己的 npm 时刻——vercel-labs/skills 就是那个包管理器：37.7k 星、MIT 开源、2026-11 仍在高频提交。用法简单到残忍：在项目里跑 npx skills add vercel-labs/agent-skills，它会检测你装了哪些 agent，让你勾选技能和目标——同一份技能可以同时装进 Claude Code、Codex、Cursor、OpenCode 等它声称支持的 75+ 个 agent，彻底告别『每个工具一个安装姿势』。配套的 skills.sh 是技能目录站，能看安装量排行榜；find 搜技能、check 查更新、update 升级、remove 卸载、init 起模板，一条链全齐。最有想象空间的是实验特性 experimental_sync：npm 包可以直接随代码附带技能，装依赖时一并同步进项目并用 skills-lock.json 锁定——『库作者顺手教会 agent 用自己的库』这个模式一旦铺开，agent 的知识分发方式就变了。怎么开始：第一步，npx skills find 随便逛逛；第二步，挑一个真实工作流技能装进 Claude Code 和 Codex 各试一遍；第三步，用 init 把自己的重复流程做成技能发上去。","tags":["AI","效率","AgentSkills","开源"],"effort":"一晚级","id":"a430"},{"kind":"项目灵感","title":"spec-kit：GitHub 官方的规格驱动开发工具包，14.5 万星，先写说明书再让 agent 写代码","url":"https://github.com/github/spec-kit","source":"GitHub · github/spec-kit（文档 github.github.io/spec-kit）","date":"2026-11","summary":"GitHub 官方开源的 SDD（规格驱动开发）工具包：给 coding agent 配上结构化流程、可复用模板和留档产物；主流程规格→计划→任务→实现之外，还有 bug 修复与点子评估两个扩展流程，支持自定义质量门并挂接 agent 生命周期事件。","takeaways":["类型：开发流程工具包 · 成本：免费 · 可行性：CLI 安装，配任意主流 agent","145,406 stars（GitHub API，2026-11-03），有简体中文 README，2026-11-02 仍在提交","三条独立入口：建功能走 SDD、修 bug 走 bug-fixing、评估点子走 idea assessment（后两者为捆绑扩展）","可组合：自定义流程/命令/质量门，还能订阅 coding-agent 生命周期事件做扩展"],"whyValuable":"agent 写代码的瓶颈早就不在打字速度而在需求质量；GitHub 官方下场给『想清楚』做工程化，与 superpowers 一攻一守——一个管怎么想，一个管按什么写，两条路都值得实测。","polished":"agent 写代码够快之后，瓶颈反而回到人类这边：需求说不清楚，agent 就自由发挥。GitHub 官方对此的答案就是 spec-kit——14.5 万星的开源工具包，主张规格驱动开发（SDD）：先让 agent 和你一起把规格写明白，再生成计划、拆任务，最后才动手实现，全程产物留档、可回溯。README 里三条独立入口很务实：建功能走 SDD；修 bug 走 bug-fixing 流程，先评估根因再定修复范围并记录验证；有一个点子拿不准投入产出，走 idea assessment，给出基于证据的做/澄清/停三选一。它不是死流程：模板可改，可以加自定义命令和质量门，甚至能订阅 agent 生命周期事件做扩展，官方文档站把机制写得明明白白，简体中文 README 也备好了。怎么开始：第一步，用安装器把 spec-kit 接到你常用的 agent 上；第二步，拿文摘站这类已有项目试一次 bug-fixing 流程，看『先评估根因再动手』与直接让 agent 修的差别；第三步，把自家流程沉淀成自定义模板。和 superpowers 搭着看正好：一个代表 GitHub 的『流程派』，一个代表社区的『技能派』，同一道题的两种解法。","tags":["AI","工作流","ClaudeCode","开源"],"effort":"周末级","id":"a431"},{"kind":"项目灵感","title":"chrome-devtools-mcp：Chrome DevTools 官方出品，把整台浏览器的调试能力交给 coding agent","url":"https://github.com/ChromeDevTools/chrome-devtools-mcp","source":"GitHub · ChromeDevTools/chrome-devtools-mcp（Chrome DevTools 团队维护）","date":"2026-11","summary":"Chrome DevTools 团队官方 MCP server（附 CLI）：agent 能控制真实 Chrome，读带 source-map 堆栈的 console、分析网络请求、截图，还能录制性能 trace 并结合 CrUX 真实用户数据给出可执行的优化建议；自动化基于 puppeteer，动作自带等待。","takeaways":["类型：MCP server/CLI · 成本：免费 · 可行性：MCP 客户端里一行 npx chrome-devtools-mcp@latest","54,664 stars（GitHub API，2026-11-03），官方支持 Claude、Cursor、Copilot、Antigravity 等","三大能力：性能洞察（trace + CrUX 真实体验数据）、高级调试（网络/console/截图）、可靠自动化（puppeteer）","隐私注意：默认上报使用统计，--no-usage-statistics 可关；仅官方支持 Chrome 与 Chrome for Testing"],"whyValuable":"agent 调前端从『看代码猜』升级为『看仪表盘』：性能慢在哪、哪个请求挂了，眼见为实。自己维护文摘站和工具站，前端调试是刚需场景，演示效果也直观，适合出视频。","polished":"让 agent 调网页，过去靠贴报错日志猜，现在是 Chrome DevTools 团队亲自下场：chrome-devtools-mcp 把 DevTools 的全部能力做成 MCP 工具暴露给 coding agent，54.6k 星，官方 README 直接点名 Claude、Cursor、Copilot、Antigravity 都能用。三个能力档位都很硬：调试上，agent 能读 console 消息（堆栈带 source-map，定位到你源码那一行）、分析网络请求、截图；自动化基于 puppeteer，每个动作自动等待结果，比裸脚本稳得多；最惊艳的是性能——agent 自己录 trace，提取可执行的优化建议，还能叠加 CrUX 真实用户数据，把『实验室数据』和『线上体验』放在一起看。装法是标准 MCP 一行配置，也提供 CLI 形态。隐私上有个细节值得讲：它默认向 Google 上报使用统计，加 --no-usage-statistics 才关，这类官方工具的隐私开关本身就是个好话题。怎么开始：第一步，把 server 配进 Claude Code；第二步，故意让 agent 修一个自己文摘页面的性能问题，看它怎么用 trace 定位；第三步，让它盯着 network 复现一个接口报错并当场修掉。眼看着 agent 打开 DevTools 面板，比任何截图都有说服力。","tags":["AI","MCP","前端","效率"],"effort":"一晚级","id":"a432"},{"kind":"项目灵感","title":"context7：6.4 万星的『文档保鲜』MCP，专治 agent 一本正经写过期 API","url":"https://github.com/upstash/context7","source":"GitHub · upstash/context7（Upstash 维护）","date":"2026-11","summary":"把最新版本、版本对应的官方文档与代码示例直接拉进 agent 上下文的工具：一行 use context7 触发；两种形态——MCP server（mcp.context7.com）或 CLI+技能（npx ctx7 setup），免费 API key 提高速率限制，治过期示例、幻觉 API、旧版本答非所问三大老毛病。","takeaways":["类型：MCP server/CLI · 成本：免费（建议申个免费 API key 提额）· 可行性：npx ctx7 setup 一条命令","64,090 stars（GitHub API，2026-11-03），Upstash 维护，2026-11-02 仍在提交","双形态：CLI+Skills 模式不依赖 MCP，用 ctx7 命令拉文档；MCP 模式注册 mcp.context7.com/mcp","Claude、ChatGPT、Cursor、VS Code 等均有官方一键添加入口；ctx7 CLI 需 Node 22.13+"],"whyValuable":"接 Home Assistant、Bambu 这类小众生态时，agent 拿训练数据里的旧 API 编答案是日常灾难；context7 是最被广泛验证的解法，装完立刻见效，性价比极高的一件套。","polished":"agent 最气人的错误不是写不出代码，而是自信地写出去年就废弃的 API——训练数据过期是结构性问题，context7 是目前最流行的对症药：64k 星、Upstash 出品。原理直白：把数万开源库的最新文档和代码示例抓好、按版本切好，agent 需要时实时注入上下文，提示词里加一句 use context7 即可。README 的对比很诚实：没有它，你得到过时的示例、根本不存在的 API、针对老版本的泛泛而谈；有它，『用 Next.js 写个校验 JWT 的代理』拿到的是当下版本的真文档。接入体验也在卷：npx ctx7 setup 一条命令，OAuth 授权、生成免费 API key、装好技能一气呵成；嫌 MCP 重可以走 CLI+技能模式，纯命令拉文档不注册 server；想手动配就指到 mcp.context7.com/mcp。对 Claude、ChatGPT、Cursor、VS Code 都有一键添加入口。怎么开始：第一步，npx ctx7 setup 装好并申领免费 key；第二步，复现一个你踩过的『agent 写旧 API』案例，关掉和打开 context7 各跑一遍对比；第三步，接小众库（比如某 HA 集成）时养成带库 ID 提问的习惯，跳过匹配直接命中。这一件套几乎是零成本提升 agent 准确率。","tags":["AI","MCP","效率","开源"],"effort":"一晚级","id":"a433"},{"kind":"项目灵感","title":"claude-mem：11 万星，给 Claude Code 装上跨会话记忆，上次干到哪这次接着来","url":"https://github.com/thedotmack/claude-mem","source":"GitHub · thedotmack/claude-mem（Apache-2.0，有简体中文 README）","date":"2026-11","summary":"为 Claude Code 打造的持久记忆压缩系统：hooks 自动捕捉会话里 agent 干过的一切，压缩后落库，新会话开场注入相关上下文并可检索；Apache 2.0，版本 15.9 持续迭代，定位是面向所有 agent 的持久上下文层。","takeaways":["类型：Claude Code 插件/记忆系统 · 成本：免费 · 可行性：npm 安装，Node ≥20","110,564 stars（GitHub API，2026-11-03），Apache-2.0，被 awesome-claude-code 收录","机制三段：hooks 自动捕获 → 压缩存储 → 新会话自动注入 + 可检索","有简体中文文档（docs/i18n/README.zh.md），安装无门槛"],"whyValuable":"长期维护文摘管线、多项目并行时『每次开会话都失忆重来』是真实痛点；记忆库还能被翻旧账，天然接上『给 agent 上缰绳』的可审计叙事。","polished":"Claude Code 用户的集体痛点：会话一关，agent 就失忆，昨天调好的构建脚本、定好的目录约定，今天又从头自我介绍一遍。claude-mem 是这个赛道最响的名字——11 万星、Apache-2.0、还在 awesome-claude-code 榜单上。它的工作方式是三层：用 Claude Code 的 hooks 在会话进行中自动捕捉 agent 做过的事，不经你手动记录；把原始历史压缩成语义化的记忆存进本地库；下次会话启动时自动把相关记忆注入上下文，需要翻旧账时还能检索。作者把它定位成面向所有 agent 的持久上下文层，而不只是 Claude Code 配件，版本号已经迭代到 15.9，更新勤得可怕。实测价值在你项目越多的时候越明显：文摘管线、工具站、打印农场脚本并行推进时，跨项目上下文终于有了承重墙。另一个值得说的角度：记忆是落盘可查的——agent『记得什么』第一次变得可审计，这正好接上之前『给 agent 上缰绳』的叙事。怎么开始：第一步，npm 装好并跑一次引导，重启会话看它回放你上次干了什么；第二步，故意隔几天回来问『上次那个报错怎么解决的』；第三步，翻它的存储结构，看看你的 agent 这一个月都在记什么小纸条。","tags":["ClaudeCode","AI","效率","自动化"],"effort":"一晚级","id":"a434"},{"kind":"项目灵感","title":"happy：手机上指挥 Claude Code 和 Codex 的开源指挥台，MIT、端到端加密、不另收钱","url":"https://github.com/slopus/happy","source":"GitHub · slopus/happy（官网 happy.engineering，MIT）","date":"2026-11","summary":"开源 agent 指挥台：手机/桌面/网页三端同看同控会话，登的是你已付费的 Claude、Codex、Grok 订阅而不另收钱；设备间端到端加密，原生多人——邀请朋友进同一会话围观，俩人都能随时接管驾驶。","takeaways":["类型：多端 agent 客户端 · 成本：免费开源（MIT），复用已有订阅，不加月费","24,458 stars（GitHub API，2026-11-03），2026-11-02 仍在提交；App Store 4.9 分（1000+）、Google Play 5.0 分（3100+）","仓库矩阵：happy（移动端+CLI+中继）、happy-desktop（macOS/Win/Linux）、happy-agent（开源 agent 运行时）","模型面：Claude/Codex/Grok 订阅直登，Gemini 走 Antigravity，任何 Agent Client Protocol 的 agent 都能插进来"],"whyValuable":"『躺着用手机指挥 agent 干活』是天然的视频场景；与已收录的 magpie（菜单栏切模型）错位在移动端与多人协作，且开源可自托管，符合频道调性。","polished":"coding agent 的生产力上限，卡在你盯着屏幕的时间——happy 的答案是把指挥台塞进手机：24.4k 星、MIT 开源，App Store 4.9 分、Google Play 5.0 分，是这个赛道口碑最硬的开源方案。它的商业模型很克制：不卖模型、不加月费，直接登录你已付费的 Claude、Codex、Grok 订阅，Gemini 走 Antigravity 接入，任何支持 Agent Client Protocol 的 agent 都能当 harness 插进来——happy 只做壳和传输。三端（iOS/Android/Web 加 macOS/Win/Linux 桌面版）看的是同一批会话：出门前派给 Claude Code 的活，地铁上掏出手机就能看进度、批权限、改方向；设备间传输端到端加密，中继服务器看不见明文，整套架构代码可读、可自托管。最有人味的功能是原生多人：邀请链接一发，朋友进来和你看同一个 agent 干活，俩人谁都能接管——结对编程被 agent 改写成『结对遛 agent』。怎么开始：第一步，手机装 App，用现有订阅登录，把一个正在跑的会话接到手机上；第二步，体验一次完整的『出门指挥』：派任务、等警报、远程批一个危险命令；第三步，读一眼中继架构，确认你的代码和密钥到底流经哪里。躺平指挥这件事，它做得最正经。","tags":["ClaudeCode","AI","效率","开源"],"effort":"一晚级","id":"a435"},{"kind":"延伸创意","title":"把我的 linux.do 归档流程写成一个 Agent Skill 发上 skills.sh","url":"https://agentskills.io","source":"Agent Skills 开放标准（agentskills.io）+ npx skills 分发（vercel-labs/skills）","date":"2026-11","summary":"文摘采集管线目前是散装脚本；按开放标准包成一个 SKILL.md 技能——抓帖、正文抽取、归档入库、生成日报各司其职——用 npx skills init 起模板，发到 skills.sh 让其他 agent 用户一条命令安装。","takeaways":["类型：延伸创意（自用工具→技能分发）· 成本：零 · 可行性：技能=文件夹+SKILL.md，标准公开","agentskills.io 定义标准：YAML frontmatter（name/description）+ 指令正文 + 可选脚本资源","npx skills init my-skill 起步；skills.sh 展示安装量，跨 Claude Code/Codex 等 75+ agent 生效","与已有条目联动：文摘采集管线、开源『游戏文摘生成器』"],"whyValuable":"把自用脚本变成『可安装资产』是 2026 年最划算的内容动作：一份工作既产出工具又产出技能包，还天然为后续的技能安全审计条目提供发布者第一视角。","polished":"之前把 linux.do 一键归档进文摘的管线是散装脚本，只服务自己；2026 年把它升级成技能（Skill）的时机刚好——Agent Skills 已是开放标准（agentskills.io），一份 SKILL.md 写清楚 frontmatter 和指令，配几个脚本，Claude Code、Codex 等一众 agent 都认。动手路径很短：第一步，npx skills init endfield-digest 起模板，把抓帖、正文抽取、入库、日报四个环节写成带参数的指令与脚本；第二步，重点打磨 description 字段——技能能不能被 agent 在恰当时机自动触发，全看这行描述写得准不准，这也是官方文档反复强调的手艺；第三步，本地实测后发到 GitHub，让 skills.sh 收录，看安装量排行榜上的数字涨起来。这件事的双重回报在于内容：一边是『我把自己的工作流做成了 75+ 个 agent 都能装的技能』这样完整的教程视频，一边是发布者视角攒下的第一手安全经验——你自己发的东西别人敢不敢装，反过来就是之后技能安全审计那期的引子。自用工具变公共资产，一次劳动吃三口。","tags":["内容生产","AgentSkills","自动化","组合"],"effort":"周末级","id":"a436"},{"kind":"视频选题","title":"装个技能等于给 agent 派了卧底？我抽审了 skills.sh 上的热门 SKILL.md","url":"https://www.skills.sh","source":"skills.sh（Vercel 运营的 Agent Skills 注册表）","date":"2026-11","summary":"技能市场爆发后，SKILL.md 的本质是『会被模型当作指令执行的文档』——prompt injection、诱导危险命令、环境变量外传都藏得下，而多数用户装技能像装浏览器插件一样无脑点同意。选题：抽 10-20 个热门技能逐个人工审计，现场评级，并演示一种可控的注入手法。","takeaways":["类型：视频选题（安全审计）· 成本：零 · 可行性：纯本地演示，不碰真实恶意样本","skills.sh 已上线可访问（2026-11-03 实测 HTTP 200），热门榜单即审计样本池","官方自己也留话：anthropics/skills 免责声明写明『仅演示教育用途，上生产前自行充分测试』","官方工具也有隐私开关：chrome-devtools-mcp 默认上报使用统计，--no-usage-statistics 才关——现成的对比案例"],"whyValuable":"接住《鱼灾自查：给 agent 上缰绳》的人设做系列续集；技能市场是 2026 年增速最快的供应链攻击面话题，审计类内容在中文区几乎没有对手。","polished":"技能越火，越该有人问一句：你装进 agent 的那个 SKILL.md，逐行读过吗？这条选题把镜头对准 skills.sh 的热门榜——Vercel 运营的技能注册表，一行 npx skills add 就能装进 75+ 个 agent。而技能的本质决定了风险模型：它是会被模型当作指令执行的文档，天然是 prompt injection 的载体；『顺手』读个环境变量、往未知地址发个请求、诱导 agent 执行危险命令，都能写得人畜无害。玩法设计成三期结构：第一期，抽 15 个高安装量技能做人工审计，逐个过 SKILL.md 和附属脚本，按『指令清晰度/越权动作/外部通信』评级，结果往往两极——写得极好的与夹带私货的共存；第二期，本地沙箱演示一种可控的注入手法（自造样本，不碰真实恶意技能），让观众看见 agent 怎么被一行看似无辜的描述带偏；第三期请官方背书：anthropics/skills 自己的免责声明就写着『仅演示教育用途、生产前自行测试』，chrome-devtools-mcp 默认上报使用统计要加参数才关——官方生态尚且如此，第三方更得留心。怎么开始：第一步，列热门榜样本池并定审计维度；第二步，搭一次性沙箱环境逐个跑；第三步，把审计清单做成可复用的检查表开源。安全类内容接住『缰绳』人设，中文区还没人认真做过。","tags":["视频选题","AI","安全","ClaudeCode"],"effort":"一周级","id":"a437"},{"kind":"项目灵感","title":"DuckDB：一条 SQL 查穿全年 AI 会话流水，read_ndjson 直吃 JSONL","url":"https://duckdb.org/docs/2.0/data/json/loading_json.html","source":"DuckDB 官方文档 · JSON 数据读取（read_ndjson / newline_delimited，本轮已实际抓取验证）","date":"2026-11","summary":"嵌入式分析数据库 DuckDB 的 JSON 读取是个人数据分析的最短路径：read_ndjson 直接把逐行 JSONL 会话日志当表查，不用写一行解析代码，是 aiusage/monorail 年度数据故事的地基。","takeaways":["类型：数据分析底座 · 成本：零（MIT 协议，DuckDB 基金会治理）· 可行性：装 CLI 即用，周末级","官方文档明确支持 newline_delimited：read_ndjson/read_ndjson_objects 专吃逐行 JSON","read_json 的 format 有 auto/unstructured/newline_delimited/array 四档，ignore_errors 容忍脏行","CLI、Python、Node.js 全家桶齐备，与 Evidence/Observable Framework 组成零成本分析栈"],"whyValuable":"年终复盘的第一步不是画图，是把散落的会话日志变成能查的表。Claude Code 的会话流水就是 JSONL，DuckDB 让『查自己的数据』变成一条 SQL 的事，这正是 aiusage/monorail 数据故事最缺的底座。","polished":"年终复盘的第一步不是画图，是把散落的会话日志变成能查的表。DuckDB 就是这一步的最短路径：官网定位是『随处可部署的分析数据库』，MIT 协议、由独立的 DuckDB 基金会治理，CLI、Python、Node.js 全家桶齐备。对个人数据故事真正关键的是它的 JSON 读取：官方文档明确支持 newline_delimited 格式，read_ndjson 一条命令把逐行 JSONL 当表查，read_json 的 format 参数还有 auto/unstructured/newline_delimited/array 四档，配 ignore_errors 容忍脏行——Claude Code 的会话流水就是 JSONL，不用写一行解析代码就能 GROUP BY 出每天的 token 和成本。怎么开始：第一步，装 CLI，直接 SELECT * FROM 'xxx.jsonl' 体验自动嗅探；第二步，把 aiusage 导出的会话文件和 monorail 的时间条目各建成一张表，练习 JOIN 出『哪类任务烧了多少 token』；第三步，把常用查询存成 .sql 文件，年报管线里反复复用。它和 Evidence、Observable Framework 是绝配：DuckDB 管算，前端管画，整条个人数据分析栈零成本搭起来。","tags":["数据可视化","DuckDB","SQL","年终复盘"],"effort":"周末级","id":"a438"},{"kind":"项目灵感","title":"Observable Framework：Markdown 加 data loader，个人年报页的现成地基","url":"https://github.com/observablehq/framework","source":"GitHub · observablehq/framework（本轮已实际抓取验证：约 3.7k 星 · ISC · 官方维护）","date":"2026-11","summary":"Observable 官方开源的静态站生成器，约 3.7k 星、ISC 协议，专为数据应用、仪表盘与报告而生：Markdown 写页面，data loader 在构建时预计算数据快照，页面秒开，天然适合做年终复盘叙事页。","takeaways":["类型：数据应用框架 · 成本：零（开源 ISC）· 可行性：npx 起步，一周级出第一页","data loader 构建时预计算：仪表盘秒开，适合挂 GitHub Pages 白嫖托管","Markdown 写页面 + D3 系图表 API，后端数据预处理语言不限","aiusage 导出的 CSV/JSON 与 monorail 的 Markdown 条目都能直接喂进去"],"whyValuable":"如果年终复盘页只选一个地基，它是最顺手的那个：官方文档全公开，数据管线和叙事页面在同一个仓库里，写一次每年 12 月自动构建，年终复盘从此变成换数据就行。","polished":"如果年终复盘页只选一个地基，我选 Observable Framework：Observable 官方开源的静态站生成器，约 3.7k 星、ISC 协议，定位就是『数据应用、仪表盘与报告』。它最聪明的设计是 data loader——构建时用任意后端语言预计算好数据快照，页面秒开，天然适合挂 GitHub Pages 白嫖托管。页面用 Markdown 写，图表用熟悉的 D3 系 API，aiusage 导出的 CSV/JSON 和 monorail 的 Markdown 条目都能直接喂进去。怎么开始：第一步，npx observable-framework init 起一个项目（官方文档 observablehq.com/framework 全公开）；第二步，写一个 data loader 脚本把 aiusage 会话导出聚合成月度 JSON；第三步，用框架自带的图表组件拼出第一页『我的 AI 编程月历』。进阶玩法：配合 GitHub Actions 每年 12 月自动构建，产出一份永久在线的年度报告页——写一次管线，以后每年的年终复盘都只是换数据。这就是『个人数据故事』的基建：数据是自己的，叙事是自己的，框架是现成的。","tags":["数据可视化","静态站","年终复盘","框架"],"effort":"一周级","id":"a439"},{"kind":"项目灵感","title":"Evidence：SQL 加 Markdown 写年报的 BI-as-code，内置 DuckDB 还官方支持 agent 开发","url":"https://github.com/evidence-dev/evidence","source":"GitHub · evidence-dev/evidence（本轮已实际抓取验证：约 7.1k 星 · MIT · 10081 commits）","date":"2026-11","summary":"约 7.1k 星的 BI-as-code 工具：SQL 负责查数、Markdown 负责叙事，生成交互式数据网站可自托管，内置 DuckDB 和 dbt，README 明确 agent-ready 支持 Claude Code/Cursor——AI 用量数据的年终报告工厂。","takeaways":["类型：BI-as-code 报告站 · 成本：零（MIT）· 可行性：两条命令起步，周末级","SQL + Markdown → 交互式报告静态站，自托管或发布托管版","内置 DuckDB + dbt：会话 JSONL 拷进来就能查，不用配数据仓库","README 明确 agent-ready：官方支持 Claude Code、Cursor 或自带 Agent 开发报告"],"whyValuable":"『会写 SQL 就能出报告』的心智模型最适合快速把一年的账算清楚；官方对 agent 开发的一等支持，意味着可以让 Claude Code 自己写报告——这本身就是一条现成的视频选题。","polished":"BI-as-code 这个词几乎就是给 Evidence 发明的：约 7.1k 星、MIT 协议、上万个 commit 的活跃项目，README 直接写着 agent-ready——官方支持用 Claude Code 或 Cursor 来开发它。它的心智模型极其适合写年报：SQL 负责查数，Markdown 负责叙事，跑起来就生成交互式数据网站，可以自托管成静态站。内置 DuckDB 和 dbt 支持，意味着 aiusage 的会话 JSONL 拷进来就能开查，连数据仓库都不用配。怎么开始：第一步，照 README 一行脚本安装，evidence init 建项目、evidence dev 起本地预览；第二步，把全年 AI 用量数据放进去，写第一条 SQL 页面——比如『每月 token 花费柱状图』，Markdown 里直接内联查询结果；第三步，把每章做成一个故事段落：开销、时段、项目、结论。它和 Observable Framework 的区别在于：Evidence 是『会写 SQL 就能出报告』，适合快速把一年的账算清；等叙事要求高了再上前端框架也不迟。两条路都通向同一个终点——你的 2026 年终数据报告。","tags":["数据可视化","BI","SQL","年终复盘"],"effort":"周末级","id":"a440"},{"kind":"项目灵感","title":"claude-code-log：把会话 JSONL 变成可读 HTML，自带 token 统计和缩放时间轴","url":"https://github.com/daaain/claude-code-log","source":"GitHub · daaain/claude-code-log（本轮已实际抓取验证：约 1.3k 星 · MIT · 活跃开发）","date":"2026-11","summary":"Python CLI 把 Claude Code 会话 JSONL 转成可读 HTML/Markdown/JSON：每条消息的 token 用量、可缩放交互时间轴、watch 模式、全文检索归档，五档深度裁剪输出，还实验性支持 Codex CLI 会话导入。","takeaways":["类型：会话日志前处理 · 成本：零（MIT）· 可行性：uvx claude-code-log@latest 即用，周末级","每消息/每会话 token 统计 + 缩放时间轴 + watch 模式实时刷新","session→user→assistant→agent→tool→hook 五档深度裁剪，--compact 精简版可直接喂回 LLM","全量归档回环全文检索，实验性支持 Codex CLI 导入"],"whyValuable":"想让 AI 会话数据讲故事，先得让日志能读。它把格式转换、统计、归档三件事一次做完，是个人 AI 数据故事管线里最省力的前处理，剩下的就交给可视化和叙事。","polished":"想让 AI 会话数据讲故事，先得让日志能读。claude-code-log（约 1.3k 星、MIT、仍在活跃开发）是个 Python CLI：把 Claude Code 的会话 JSONL 转成可读的 HTML 和 Markdown，另外还出 JSON 给程序用。能力列表相当豪华：每条消息、每个会话的 token 用量统计，可缩放的交互时间轴，watch 模式实时刷新，全量归档的回环全文检索，还能按 session/user/assistant/agent/tool/hook 五档深度裁剪输出——官方明说 --compact 出的精简 Markdown 可以直接喂回给 LLM 用。甚至有实验性的 Codex CLI 会话导入。怎么开始：第一步，uvx claude-code-log@latest 直接跑，把最近一条会话转成 HTML 看效果；第二步，对全年会话批量转换，观察 token 在哪些会话里集中；第三步，挑一条『传奇会话』——比如深夜那次三小时的大作战——作为会话心电图故事的原料。它是个人 AI 数据故事管线里最省力的前处理：格式转换、统计、归档三件事一次做完，剩下的就交给可视化和叙事了。","tags":["Claude Code","日志分析","数据可视化","CLI"],"effort":"周末级","id":"a441"},{"kind":"延伸创意","title":"「我的 2026 AI 编程年报」：aiusage × monorail 数据的 Wrapped 式滚动叙事页","url":"https://github.com/ryoppippi/ccusage","source":"延伸创意 · 基于 aiusage + monorail（自有项目）+ Observable Framework + ccusage（链接均已验证）","date":"2026-11","summary":"12 月用 aiusage 导出和 monorail 时间条目自动生成一页滚动叙事年报：年度会话数、token 总量、最贵一夜、黄金时段、项目 Top——像 Spotify Wrapped 一样可转发。ccusage 19.3k 星证明这类数据观众真的爱看。","takeaways":["类型：自有数据内容管线 · 成本：零 · 可行性：Observable Framework 一周级搭好，每年自动跑","ccusage（约 19.3k 星，npx 即跑，daily/weekly/monthly/session/blocks 五种报表）证明社区对个人 AI 用量数据有天然好奇心","与已有『monorail 周报成本面板』分清定位：面板是自用工具，年报页是传播资产","GitHub Actions 12 月定时构建，网页 + 视频素材双料产出"],"whyValuable":"Spotify Wrapped 年年刷屏，因为人人都有『我的年度』好奇心，而 AI 编程玩家的年度还没人替他们做。自己的真实数据 + 一页会讲故事的网页，是 12 月最应景的内容资产。","polished":"Spotify Wrapped 之所以年年刷屏，是因为人人都有一个『我的年度』好奇心——而 AI 编程玩家的年度，还没有人替他们做。ccusage（约 19.3k 星、MIT）的爆火恰好证明这个需求真实存在：npx 一跑，daily/weekly/monthly/session/blocks 五种报表全出来，无数人晒过自己的 token 账单。但通用工具给的是表格，不是故事。用 Observable Framework 把 aiusage 导出和 monorail 时间条目做成一页滚动叙事年报：年度会话总数开场，往下依次是 token 曲线、最贵一夜、黄金时段热力块、项目 Top 榜，结尾一句『明年见』。怎么开始：第一步，12 月初把数据导出聚合脚本写好；第二步，页面按『一屏一个事实』排版，每屏一个数字一张图；第三步，GitHub Actions 定时构建，自动挂到博客域名下。要点是和已有的『monorail 周报成本面板』分清定位：面板是自用工具，天天看；年报页是内容资产，一年发一次、专门给观众和朋友看的。一份管线两种产出：网页本身就是 B 站年终视频的素材库。","tags":["年终复盘","数据可视化","aiusage","monorail"],"effort":"一周级","id":"a442"},{"kind":"延伸创意","title":"会话心电图：把一条三小时的 AI 结对会话画成可交互时间轴故事页","url":"https://github.com/Brads3290/cclogviewer","source":"延伸创意 · 基于 cclogviewer + daaain/claude-code-log + 仓库 gen-aivideo.mjs（链接均已验证）","date":"2026-11","summary":"挑一条印象最深的深夜长会话，用 cclogviewer（MIT，一条命令 JSONL 转交互 HTML，含 token 统计与工具调用折叠）转出基底，再叠加自己的叙事标注，做成『AI 结对编程心电图』——观众没见过的画面。","takeaways":["类型：单会话可视化故事 · 成本：零 · 可行性：现成工具转基底，周末级","cclogviewer（Go，85 星）：层级对话树、可折叠工具调用、token 用量，一条命令出交互 HTML","叙事标注 5-8 个事件：一次过/反复返工/AI 等我死锁时刻","接 gen-aivideo.mjs 把时间轴做成动画片段，博客与 B 站双料素材"],"whyValuable":"Persona 用量归因回答『谁最烧钱』，这条回答『一次真实的 AI 结对长什么样』——卡壳、灵光、死锁的完整心跳曲线，是观众真正没见过的 AI 编程内幕画面。","polished":"单条会话也能讲一个好故事。挑一条你印象最深的 AI 结对会话——最好是那种深夜打了三小时、中间经历过卡壳和灵光乍现的——把它画成一张『心电图』：横轴时间，纵轴是消息密度和 token 峰值，工具调用用刻度标注。现成工具已经把地基打好了：cclogviewer（MIT、Go 写的）一条命令把 Claude Code JSONL 转成交互式 HTML，层级对话树、可折叠的工具调用、token 用量统计全都有；更进一步的 claude-code-log 还带可缩放时间轴。你要做的是在这之上加一层自己的叙事标注：哪里是『第一次尝试就过』，哪里是『反复返工的重灾区』，哪里是『AI 等我、我在等 AI』的死锁时刻。怎么开始：第一步，用现成工具把这条会话转出 HTML 基底；第二步，按时间戳手动加 5-8 个事件标注；第三步，接进仓库里的 gen-aivideo.mjs，把时间轴做成动画片段。它和 Persona 用量归因是互补的两个视角：那条回答『谁最烧钱』，这条回答『一次真实的 AI 结对长什么样』——后者才是观众没见过的画面。","tags":["Claude Code","数据可视化","叙事","aiusage"],"effort":"周末级","id":"a443"},{"kind":"延伸创意","title":"monorail 年度成就卡组：把一年的专注时间铸成 12 月 31 日开包的徽章","url":"https://github.com/drknzz/GitHub-Achievements","source":"延伸创意 · 基于 monorail（自有项目）+ drknzz/GitHub-Achievements 的阶梯阈值设计（链接已验证）","date":"2026-11","summary":"借鉴 GitHub 徽章的阶梯阈值设计（社区清单 3.2k 星：Pull Shark 2/16/128/1024 四档等），给 monorail 加年度成就层：连续专注、深夜爆发、百会话达成铸成年度卡组，12 月 31 日开包，海报可传播。","takeaways":["类型：自有应用年度玩法 · 成本：零 · 可行性：monorail 已有抽卡心智，一周级","drknzz/GitHub-Achievements（约 3.2k 星，MIT）社区公认的徽章阈值表，直接抄作业","挑 8-10 个年度指标定档位：连续专注 30 天/单日 8 小时马拉松/凌晨四点战士/百会话达成","与 Wrapped 年报页共用同一份年度统计管线：一个数据层，两种仪式感"],"whyValuable":"GitHub 早就验证过徽章的魔力。monorail 本来就有抽卡设计，把一年的真实数据铸成可收集的年度卡组，是产品差异化，也是天然的朋友圈/linux.do 传播物和短视频素材。","polished":"GitHub 早就验证过徽章的魔力：Starstruck、Pull Shark 这些成就让无数人为了点亮图标去开源。drknzz/GitHub-Achievements（约 3.2k 星、MIT）把全部徽章和升级阈值整理成一张社区公认的清单——Pull Shark 2/16/128/1024 四档，Starstruck 按星数分档——这套『阶梯阈值』设计可以直接抄作业。monorail 本来就有抽卡心智，把年度成就做成『年度卡组』是自然延伸：12 月 31 日开包，一整年的专注时间铸成徽章——『连续专注 30 天』『单日 8 小时马拉松』『凌晨四点战士』『百会话达成』，每张卡背面印着触发它的真实数据。怎么开始：第一步，从 monorail 条目里挑 8-10 个可统计的年度指标；第二步，对照 GitHub 的阈值设计确定每张卡的档位；第三步，做成开包动画或静态海报。产出天然是传播物：徽章海报发朋友圈和 linux.do，开包过程录成短视频，和 Wrapped 年报页共用同一份年度统计管线——一个数据层，两种仪式感。","tags":["monorail","游戏化","年终复盘","传播"],"effort":"一周级","id":"a444"},{"kind":"延伸创意","title":"Open My AI Usage：把脱敏的年度 AI 用量数据集开源成公共素材","url":"https://huggingface.co/docs/hub/datasets-adding","source":"延伸创意 · 基于 aiusage/monorail 导出数据 + Hugging Face Datasets Hub（官方文档本轮已实际抓取验证）","date":"2026-11","summary":"把一年 AI 使用数据整理成公开数据集发上 Hugging Face Datasets：jsonl/parquet 拖拽即传、Data Studio 在线预览，配 Dataset Card 写清脱敏与字段含义——个人数据故事的开源终章，社区可复现你的年报。","takeaways":["类型：个人数据开源 · 成本：零 · 可行性：网页拖拽上传，周末级","HF Hub 原生支持 .jsonl/.csv/.parquet，公开/私有可选，Data Studio 自动在线预览","聚合统计层全量公开 + 对话抽样脱敏；Dataset Card 模板强制写清来源、用途、限制、伦理","红线自己把住：路径/密钥/代码块/人名全部剔除，宁可少放不可错放"],"whyValuable":"个人数据故事的终极形态是开源出去：别人可以拿真实个人 AI 用量数据复现你的年报、验证你的结论，issue 区变成免费的数据共创区——这本身就是一条独立的内容选题。","polished":"个人数据故事的终极形态是把它开源出去。把一年的 AI 使用数据整理成公开数据集发上 Hugging Face Datasets：Hub 原生支持 .jsonl/.csv/.parquet，网页拖拽即传，可公开可私有，Data Studio 上传后自动在线预览，别人不用下代码就能浏览你的数据长什么样。发什么：全量的聚合统计层（每小时 token、每会话元数据、项目分布——这些不涉及任何代码内容）加上抽样脱敏的对话片段，配一份认真的 Dataset Card——官方模板本来就强制要求写清来源、用途、使用限制和伦理考量，正好是脱敏说明的容器。怎么开始：第一步，写脱敏脚本，路径、密钥、代码块、人名全部替换或剔除；第二步，聚合表存 parquet、样本存 jsonl，分两个文件上传；第三步，Dataset Card 写清楚每个字段的含义。这一步的意义超出内容本身：社区可以拿真实个人 AI 用量数据复现你的年报、验证你的结论，README 的 issue 区会变成免费的数据故事共创区。红线自己把住：宁可少放，不可错放。","tags":["开源","数据集","aiusage","年终复盘"],"effort":"周末级","id":"a445"},{"kind":"视频选题","title":"谁在凌晨三点写代码：我把全年 AI 会话画成 24×7 编程生物钟","url":"https://docs.github.com/en/rest/metrics/statistics?apiVersion=2022-11-28","source":"GitHub REST API · statistics/punch_card（文档本轮已验证，且已用 curl 实测 vercel/next.js 返回真实 [星期, 小时, 次数] 数据）","date":"2026-11","summary":"GitHub 每个仓库页的 punch card 有官方 API 端点（[星期, 小时, 次数] 三元组，已实测）。把同样形式移植到自己身上：全年 aiusage 会话时间戳画成 24×7 热力块，monorail 专注条目交叉验证，讲一个数据不会说谎的编程生物钟故事。","takeaways":["类型：视频选题（数据故事）· 成本：零 · 可行性：数据全在手，一周级","GET /repos/{owner}/{repo}/stats/punch_card 返回 [星期, 小时, 次数]，官方示例：[2,14,25] 即周二 14 点档 25 次提交","数据源双保险：aiusage 会话时间戳 + monorail 专注条目交叉验证","钩子：凌晨三点那格热力块里是什么项目？结尾镜头揭晓；渲染组件进年报页复用"],"whyValuable":"punch card 是程序员都认的视觉语言，把它从 GitHub 仓库搬到自己身上，形式熟悉、内容陌生——『我以为我在努力，数据显示我凌晨一点的会话占了 40%』这种反差是天然的爆款结构。","polished":"GitHub 每个仓库页都有那张 punch card：七列星期、二十四行小时，每格圆圈大小是提交次数。官方 REST API 就有这个端点——GET /repos/{owner}/{repo}/stats/punch_card，返回 [星期, 小时, 次数] 三元组数组，文档原话是『[2, 14, 25] 表示周二下午 2 点档有 25 次提交』（我用 curl 打 vercel/next.js 实测，真实数据哗哗地回）。现在把同样的形式移植到自己身上：全年 aiusage 会话时间戳画成 24×7 热力块，再用 monorail 的专注条目交叉验证——『我以为我在努力，数据显示我凌晨一点的会话占了 40%』。视频结构现成：开场放 GitHub 官方 punch card 引出形式，中段亮出自己的图逐格讲故事——周二晚上的大块是哪个项目？周日为什么是空的？最疯的一格在凌晨三点，镜头揭晓那晚在干什么。收尾升华一句：数据不会说谎，它只是把你已经隐约知道的作息画给你看。顺带的产出是 punch card 渲染组件，直接进年报页复用。","tags":["视频选题","数据可视化","aiusage","monorail"],"effort":"一周级","id":"a446"},{"kind":"视频选题","title":"2026，我和 AI 结对了 XXX 次：一年真实数据的年终复盘（附 3D 打印年度天际线）","url":"https://github.com/github/gh-skyline","source":"GitHub 官方 CLI 扩展 · github/gh-skyline（本轮已实际抓取验证：约 1.4k 星 · MIT · --year 支持到当前年份）","date":"2026-11","summary":"年终大菜：gh-skyline（GitHub 官方 CLI 扩展）把贡献年历打成 3D 可打印 STL 天际线上机开题，正片用 aiusage/monorail 真实导出讲一年数据故事，结尾滚动展示自制年报页——与已有的月度账本工具视频明确区分。","takeaways":["类型：视频选题（年终大菜）· 成本：打印机耗材 · 可行性：一周级","gh extension install github/gh-skyline 后 gh skyline 即出 STL，--year 支持到当前年，跑时带 ASCII 预览","天际线放上拓竹打印机 → 与打印机内容线梦幻联动，开场 30 秒就有了","与『这个月烧了多少钱』工具视频区分：那条讲工具怎么用，这条讲一年怎么活，数字全部可回溯"],"whyValuable":"年终复盘值得一条大菜级别的视频：官方工具做仪式感开场，自家真实数据做正片，全片每个数字都能回溯到原始导出——真实感本身就是这类年终内容最硬的护城河。","polished":"年终复盘值得一条『大菜』级别的视频，而这道菜需要一个开场钩子：gh-skyline——GitHub 官方出的 CLI 扩展（约 1.4k 星、MIT），gh extension install github/gh-skyline 一装，gh skyline 一跑，你整年的贡献日历就变成一个可 3D 打印的 STL 天际线，--year 支持到当前年份，跑的时候终端里还有 ASCII 预览。把这块『GitHub 年度天际线』放上拓竹打印机打出来，和打印机内容线梦幻联动——开场三十秒就有了。正片全是真实数据：一年 XXX 次 AI 会话、XXX 万 token、XXX 小时专注、最贵一夜、黄金时段、项目 Top，全部来自 aiusage 和 monorail 的导出，脚本里每个数字都能回溯到原始数据——这本身就是和『这个月烧了多少钱』那期工具介绍视频的区分：那条讲工具怎么用，这条讲一年怎么活。结尾把自制年报页滚动展示，预告明年继续记账。选题句式现成：『我用一年的真实数据，复盘了自己和 AI 的 365 天』。仪式感不是矫情，是把数据变成记忆的最后一道工序。","tags":["视频选题","年终复盘","3D打印","数据故事"],"effort":"一周级","id":"a447"},{"kind":"视频选题","title":"WIRED 亲口盖章的『不可能』：3 秒复原魔方，被中国魔友拧进了 2.51","url":"https://www.youtube.com/watch?v=7FB4Tts3CKM","source":"YouTube · @Tingman《I'm So MAD About the New Rubik's Cube World Record》（官方 RSS 实抓验证）；事实经 WIRED 原片页、Cuboss、Speedcubers Digest 与 WCA 档案交叉核验","date":"2026-11","summary":"WIRED 在 2019 年把『3 秒内复原魔方』拍成 Almost Impossible，预言五年内见到 sub-3；2026 年 Zajder 2.76 首破三秒，中国魔友耿暄一在广州把纪录拧进 2.51——英文圈两次验证过的题，破纪录者就在中国赛场。","takeaways":["类型：魔方纪录科普视频 · 成本：零 · 可行性：素材全公开，周末可出稿","WIRED 2019-05-23 原片：当时 WR 是杜宇生 3.47，Zemdegs 预测『五年内看到 sub-3』，2026 年以加倍兑现","据 Cuboss/Speedcubers Digest：Zajder 2.76 于 2026-02-08 首破三秒；耿暄一 2026-10-06 广州 Grand Open 拧出 2.51（32 步，约 12.7 TPS），同轮 Yang Pin Xiu 18 步 2.74 亦快过旧纪录","WCA 档案 2023GENG02：2025 沈阳春季赛 3.05 WR、平均 WR 3.71（德清），十年纪录曲线数据现成"],"whyValuable":"魔方区常青题叠加中国选手主场叙事：英文圈已用 WIRED 科普体和 Tingman 反应体两次验证容量，中文侧破纪录者、比赛地、数据源全在本土，几乎零门槛接住这波热度。","polished":"2019 年 5 月，WIRED 把『3 秒内复原魔方』拍成一支 Almost Impossible：当时世界纪录还是杜宇生的 3.47，出镜的 Zemdegs 大胆预测『五年之内会看到 sub-3』。七年过去，这句预言以加倍的方式兑现：据 Cuboss 与 Speedcubers Digest 报道，2026 年 2 月 8 日，波兰魔友 Zajder 用 2.76 首次踩破三秒线；10 月 6 日国庆黄金周，广州 Grand Open 的第二轮，中国魔友耿暄一直接把纪录拧进 2.51——32 步复原，平均每秒约 12.7 次转动，同轮还有中国香港魔友 Yang Pin Xiu 拧出 18 步的 2.74，同样快过旧纪录，只是 2.51 已经先落地。WCA 档案（2023GENG02）显示他早在 2025 年沈阳春季赛就刷出过 3.05 的 WR，平均世界纪录 3.71 也握在手里。英文圈已验证这个题目的容量：Tingman 的反应视频《I'm So MAD About the New Rubik's Cube World Record》刚更新，WIRED 原片还挂在官网。中文化空间几乎是现成的：破纪录的是中国选手、比赛在广州，B 站魔方区可以直接做三件事——解说 WIRED 原片里 Rokicki 讲的上帝之数与步数/速度权衡（正好接上你拆解上帝之数的那期）、用 WCA 档案拉一条『三秒线十年进化史』曲线、再聊聊 2.51 的 32 步里 CFOP 与 TPS 各占多少。素材、数据、情绪全部就位，就差开机。","tags":["魔方","世界纪录","科普视频","WIRED"],"effort":"周末级","id":"a448"},{"kind":"视频选题","title":"让 Claude 通关《宝可梦红》：Twitch 爆款 agent 直播的复刻图纸摊开了","url":"https://www.twitch.tv/claudeplayspokemon","source":"Twitch · ClaudePlaysPokemon（页面实抓验证）；制作细节来自 Josherich × Latent Space 访谈（已实抓验证）","date":"2026-11","summary":"英文圈最出圈的 agent 直播：Claude 玩《宝可梦红》，画面与推理分屏，卡关名场面全成梗。Anthropic 的 David Hershey 在访谈里公开了完整图纸：30 条消息上限、三个工具、8000 token 知识库、逆向 RAM 喂状态——中文圈还没有同款。","takeaways":["类型：AI agent 实验复刻/直播 · 成本：API 按量（原作数千美元级）· 可行性：图纸公开，harness 结构朴素","ClaudePlaysPokemon：Twitch 分屏直播（画面+推理），2025 年 2 月底开播即成现象","核心参数：30 条消息上限+摘要压缩（实测 20 太短 40 太长）、3 个工具（按键/知识库/导航器）、知识库限 8000 token","逆向《宝可梦红》RAM 喂可行走格子是关键补丁；视觉与导航仍是最大短板（半夜连按 12 小时 A 的名场面）"],"whyValuable":"英文圈已用一场直播验证『AI 玩长线游戏』的观赏性，而制作图纸在访谈里完整公开；宝可梦在 B 站的受众盘子只大不小，复刻或换壳改造都是空位。","polished":"英文圈这两年最出圈的 agent 直播，不是哪个测评，而是一条叫 ClaudePlaysPokemon 的 Twitch 频道：Claude 玩《宝可梦红》，左边游戏画面、右边推理过程，卡在月见山绕圈、半夜连按 12 小时 A 键的片段全成了梗。Anthropic 的 David Hershey 在 Latent Space 访谈里把图纸摊开了：整个 harness 是一个最朴素的循环——截图喂给模型、模型调工具、循环往复；系统提示只有『关于宝可梦的六条事实』，工具只有三个：模拟器按键、知识库读写、坐标导航器；对话历史压到 30 条就摘要进首条消息（实测 20 太短、40 太长），知识库限 8000 token，『基本就是挂在提示词后面的 Python 字典』；他还逆向了宝可梦红的内存，把可行走格子直接喂给模型——费时的地址映射是拿 Claude Code 干的。单次 rollout 约 10 万 token，全部试验烧掉『至少几千美元』。中文化空间很清楚：宝可梦在 B 站的受众盘子比英文圈更大，『AI 思考过程』分屏本身就是天然的直播素材；你可以照这张图纸搭自己的 harness（模拟器加自有卡带，注意版权边界），或者换个壳——让 agent 通你的旧存档、复盘它在哪里犯蠢、给它上一条你那期『agent 缰绳』同款的安全带。前置内容都是现成的，接上就是系列。","tags":["AI Agent","宝可梦","Twitch","直播"],"effort":"周末级","id":"a449"},{"kind":"视频选题","title":"0.103 秒复原魔方：四个大学生的毕设机器人，眨眼之前就结束了比赛","url":"https://engineering.purdue.edu/ECE/News/2025/purdue-ece-students-shatter-guinness-world-record-for-fastest-puzzle-cube-solving-robot","source":"Purdue ECE News（已实抓验证，2025-05-12）；Purdue Newsroom 与 NBC 报道交叉核验","date":"2026-11","summary":"普渡大学四名本科生的毕设机器人 Purdubik's Cube 以 0.103 秒刷新吉尼斯最快魔方机器人纪录（前纪录三菱 0.305 秒）：机器视觉+定制求解算法+亚毫秒运动控制。英文圈已刷屏，中文圈还缺一份『自己攒一台』的落地路线。","takeaways":["类型：硬核拆解+DIY 复刻路线 · 成本：复刻件预估千元级 · 可行性：无官方开源，需自攒","0.103 秒吉尼斯纪录（2025-05-12 报道），前纪录三菱电机 0.305 秒（2024-05），快近三倍；人眨眼约 200-300 毫秒","结构三件套：机器视觉认色 + 速度优化求解算法 + Kollmorgen 工业运动控制（亚毫秒协同）；蓝牙智能魔方实时镜像打乱","故事线完整：牵头人高中被 MIT 380 毫秒机器人种草 → co-op 组队 → 2024-12 校内 SPARK 赛一等奖 → 吉尼斯"],"whyValuable":"魔方、3D 打印、机器视觉三条内容线在此交汇，英文圈已被主流媒体验证过热度；中文圈缺的不是猎奇转发，而是一份从步进电机到 Kociemba 求解器的复刻路线图。","polished":"人眨一次眼大约 200 到 300 毫秒——普渡大学四个本科生的毕设机器人 Purdubik's Cube 在 0.103 秒内就把魔方复原完了，吉尼斯世界纪录，比三菱电机 2024 年 5 月的 0.305 秒快了近三倍。ECE 学院官网把结构讲得很直白：机器视觉认色、为速度定制的高效求解算法、Kollmorgen 工业运动控制做到『亚毫秒级协同』；现场还有个蓝牙智能魔方，观众打乱什么，它镜像什么、然后瞬间还原。故事线也好讲：牵头人 Patrohay 高中时被 MIT 那台 380 毫秒的机器人种草，立志『总有一天要打赢它』，团队在 co-op 项目里相识，先拿 2024 年 12 月校内 SPARK 设计赛一等奖，再一路刷到吉尼斯。中文化空间：这是魔方、3D 打印、机器视觉三个你常做主题的交汇点，B 站硬核拆解受众吃这一套；公开报道没有开源图纸，正好把『怎么自己攒一台』讲成系列——两轴或四轴夹持加高速步进、Kociemba 二阶段求解（你拆过的那套）、OpenCV 认色标定，先做到秒级再谈压进百毫秒，每一档速度都是一期视频。镜头语言现成：高速摄影机怼着拍，0.103 秒拍成 10 秒慢放，弹幕会替你数步数。","tags":["魔方","机器人","毕设","吉尼斯纪录"],"effort":"一周级","id":"a450"},{"kind":"项目灵感","title":"weather-dashboard-kindle：吃灰 Kindle 的第二春，树莓派加一行 cron 变常亮墨水屏","url":"https://github.com/pytatbro/weather-dashboard-kindle","source":"GitHub · pytatbro/weather-dashboard-kindle（已实抓验证：MIT、完整管线文档）；XDA via daily.dev 报道（已实抓验证）","date":"2026-11","summary":"英文圈正在给吃灰 Kindle 安排第二春：越狱后当常亮墨水屏面板。weather-dashboard-kindle（MIT）给出截图派完整管线：Open-Meteo 免费数据、无头 Chromium 渲染、Pillow 灰度化、eips 全屏刷新——国内海量吃灰 Kindle 正等一份中文踩坑记录。","takeaways":["类型：旧物改造/墨水屏面板 · 成本：吃灰 Kindle + 树莓派 · 可行性：MIT 协议，越狱+脚本即可跑","管线：Open-Meteo 免费天气/空气质量 → 无头 Chromium 截图 Jinja2 模板 → Pillow 裁切缩放转灰度 → Kindle eips 全屏刷新（cron 每 30 分钟）","英文圈佐证：XDA（daily.dev 转载）用 Véra 越狱 + KOReader 防休眠 + 自带浏览器直开 Home Assistant 前端；残影与无触控是已知代价","扩展位：HA 家庭状态面板、终末地情报墨水屏，与 AWTRIX 像素屏构成『LED 派 vs 墨水屏派』姊妹篇"],"whyValuable":"『旧 Kindle 变面板』在英文圈已被 XDA 等验证成内容格式，国内 Kindle 退出后存量巨大、二手白菜价；中文社区缺一条从越狱到自动刷屏的完整踩坑记录。","polished":"Kindle 退出中国之后，抽屉里的吃灰设备突然都有了同一种宿命——英文圈正在示范第二种结局。XDA 撰文（daily.dev 转载）把旧 Paperwhite 刷成常亮的智能家居状态屏：Véra 越狱、KOReader 防休眠，Kindle 自带浏览器直接开 Home Assistant 前端，残影和无法触控是代价，但『抬眼即看全家状态』的价值成立。GitHub 上的 weather-dashboard-kindle（MIT）给了更稳的截图派管线：树莓派 4 从 Open-Meteo 免费拉天气与空气质量，无头 Chromium 渲染 Jinja2 模板并截图，Pillow 裁切、缩放、转灰度再旋转，Kindle 侧一个 booklet 脚本定时 curl 这张 PNG、用 eips 全屏刷上，cron 每 30 分钟一轮，配置走网页端，Leaflet 地图上点一下就选好位置。仓库只有 11 个 commit、几乎无人知晓，但每一行都是中文教程的素材。中文化空间：吃灰 Kindle 在国内是白菜价存量，墨水屏『永远亮着却几乎不耗电』的克制感正对极简桌搭的胃口；你可以把它接进 Home Assistant 出一张家庭面板，或者干脆喂终末地情报站的日更数据，做一块不插电的情报墨水屏——与你 AWTRIX 像素屏那期正好凑成『LED 派 vs 墨水屏派』的姊妹篇。","tags":["Kindle","墨水屏","Home Assistant","旧物改造"],"effort":"周末级","id":"a451"},{"kind":"项目灵感","title":"Home Assistant Voice PE：69 美元的开源音箱，把语音助手拆到焊盘级","url":"https://www.home-assistant.io/voice-pe/","source":"Home Assistant 官网 · Voice PE 产品页（已实抓验证：价格/硬件/语言细节全录）","date":"2026-11","summary":"Home Assistant 官方出品的开源语音盒子：69 美元，ESP32-S3 加 XMOS 音频 DSP，物理断电静音开关，语音管线三档可选。英文圈评测已验证热度，而『让它说中文』的本地化改造实录在中文圈还是空位。","takeaways":["类型：开源硬件/智能家居 · 成本：$69（约 500 元），全本地档另需 N100 级主机 · 可行性：即插即用，中文改造需动手","配置：ESP32-S3（16MB flash + 8MB PSRAM）+ XMOS XU316 回声消除/降噪 + 双麦阵列 + 物理切断麦克风供电的静音开关 + Grove 口/PCB 焊盘","语音三档：Speech-to-Phrase 离线固定句式 / Whisper 全本地（N100+ 起步）/ 云端（声明不留存）；唤醒词 Okay Nabu、Hey Jarvis、Hey Mycroft","60+ 语言列表含中文，简中 STT/TTS 与 LLM 接入是现成改造位；实验性支持 Google/OpenAI/Anthropic/Llama 当对话大脑"],"whyValuable":"开源语音助手对垒小爱/天猫精灵的『对照组』选题：英文圈评测矩阵已验证容量，中文侧拆解加中文化改造无人做全，且正好补上 Home Assistant 内容线的上游入口。","polished":"Home Assistant 官方卖硬件了：Voice Preview Edition，69 美元（欧洲 59 欧含税），Nabu Casa 出品，利润反哺 Open Home 基金会。配置单摆出来就知道它是奔着被改造去的：ESP32-S3（16MB flash + 8MB PSRAM）打底，XMOS XU316 专门做回声消除与降噪，双麦克风阵列，还有一枚『物理切断麦克风供电』的静音开关，Grove 传感器口和 PCB 焊盘全露在外，螺丝可拆。语音管线三档可选：Speech-to-Phrase 离线吃固定句式，低配硬件就能跑；Whisper 全本地则需要 N100 级别起步；不想折腾可走云端，Nabu Casa 声明不留存数据。官方 60 多种语言列表里中文在列，但简中体验要自己拼——本地中文 STT、句子模板、TTS 都得动手，接一个国产 LLM 当对话大脑更是现成的改造位。中文化空间：这正是与小爱同学、天猫精灵对打的『开源对照组』，英文圈（Smart Home Junkie 等频道）已出了成套评测，中文侧同款拆解加『让它说中文』改造实录还空着；对你在 Home Assistant 上的既有内容线，这是一块补得上游的拼图——前有打印机接入，后有语音入口，全屋智能的故事从此有了耳朵和嘴。","tags":["Home Assistant","语音助手","开源硬件","智能家居"],"effort":"周末级","id":"a452"},{"kind":"延伸创意","title":"英文圈风向板块：r/Endfield 和 YouTube 评测自动翻译进终末地情报站","url":"https://www.reddit.com/r/Endfield/","source":"Reddit · r/Endfield（已实抓验证：英文圈主阵地）；Beta Test 二测时间与 YouTube 评测生态经检索核验","date":"2026-11","summary":"r/Endfield 是英文圈终末地讨论主阵地，二测与英文创作者评测热度在线。把 Reddit JSON、YouTube RSS 与字幕喂进已验证的情报站管线，LLM 翻译+聚类+情绪标签，日更一张『英文圈风向』卡——B 站常青的『外网风评』需求，自动化版本只花 API 钱。","takeaways":["类型：情报站管线扩展 · 成本：LLM API 少量 · 可行性：复用现有 GitHub Actions 日更链路","信源：r/Endfield（英文主阵地）+ YouTube 官方 RSS 与字幕（youtube-transcript-api 一行命令）","工序：.json/RSS 采集 → 字幕拉取 → LLM 翻译+聚类+情绪标签 → 摘要卡编进情报站日更","合规：遵守 Reddit 频控与 UA 规范，摘要保留原帖链接可回溯，标注『机翻+模型归纳』"],"whyValuable":"情报站日更管线已在丹青渡更新周验证过稳定性，换信源即可长出『英文圈风向』新板块；『外网风评』是 B 站常青需求，自动化版本比人肉搬运快一个时区。","polished":"终末地情报站日更运行至今，吃的是中文信源；而 r/Endfield——官方描述里的『即将上线的战略 3D RPG』英文大本营——从 2025 年 11 月 28 日开启的 Beta Test 二测，到 YouTube 英文创作者的试玩 highlights、九个月长测回顾，讨论热度一直在线。把这些喂给现有管线，就是一个现成的『英文圈风向』板块：Reddit 的 .json 端点免费吐帖子与评论，YouTube 频道有官方 RSS，视频用 youtube-transcript-api 一行命令拉字幕，GitHub Actions 定时聚合成池子，LLM 做翻译、聚类、打情绪标签，产出『本周英文圈在吵什么、在夸什么』的摘要卡片，直接编进情报站日更。你在丹青渡更新周已经验证过这条链路的稳定性，这次只是换信源、加一层翻译与情绪聚类。中文化空间几乎不用论证：B 站『外网风评』类内容是常青款，而自动化的版本可以做到每天凌晨出卡——比人肉搬运快一个时区。注意两点：Reddit 拉取遵守频控与 UA 规范；LLM 摘要里保留原帖链接可回溯，情绪标签标注『机翻+模型归纳』，别把它当成客观结论。英文圈的口碑波动会先于任何官方公告出现，这个板块就是你的提前量。","tags":["终末地","Reddit","GitHub Actions","LLM 摘要"],"effort":"周末级","id":"a453"},{"kind":"视频选题","title":"Kaggle 办了场大模型象棋联赛：八强名单里坐着 DeepSeek 和 Kimi","url":"https://www.chess.com/news/view/which-ai-model-is-the-best-at-chess-kaggle-game-arena","source":"Chess.com · Kaggle Game Arena 赛事报道（已实抓验证）；Kaggle game-arena 页面在线（实抓确认）","date":"2026-11","summary":"2025 年 8 月 Kaggle 联手 DeepMind 上线 Game Arena：八大模型单败淘汰下国际象棋，Nakamura 实况、GothamChess 复盘、卡尔森收官。LLM 棋力业余还走违规着法——反差正是看点。中文移植：换棋盘为中国象棋，Pikafish 当裁判。","takeaways":["类型：AI 竞技赛事视频 · 成本：LLM API 少量 · 可行性：赛制引擎可复用 AI 魔方大赛经验","Kaggle Game Arena：2025-08-04 上线，八模型单败淘汰象棋赛（Gemini 2.5 Pro/Flash、o3、o4-mini、Claude 4 Opus、Grok 4、DeepSeek R1、Kimi k2）","解说阵容：Nakamura Twitch 实况、GothamChess 每日复盘、卡尔森收官总结；赛后 Elo 榜常驻 Kaggle","核心反差：LLM 棋力约业余级、会走违规着法（Hassabis：『目前不太行』）；平台计划扩展到多人游戏与真实模拟"],"whyValuable":"『大模型打棋』已被 Kaggle 用职业解说阵容验证成内容事件；中国象棋版有开源引擎 Pikafish 保底与更大的观赛基本盘，赛制工程你在 AI 魔方大赛里已做过一遍。","polished":"2025 年 8 月 4 日，Kaggle 联手 Google DeepMind 上线 Game Arena——让顶级大模型打比赛的公开基准平台，首战项目国际象棋：八模型单败淘汰，Gemini 2.5 Pro/Flash、o3、o4-mini、Claude 4 Opus、Grok 4、DeepSeek R1、Kimi k2，三天赛程里 Hikaru Nakamura 天天在 Twitch 实况解说，GothamChess 出每日复盘，卡尔森亲自收官总结。看点不在棋力——Hassabis 自己都承认 LLM 棋力『目前不太行』，业余水平、还会走出违规着法——而在『AI 互搏加人类解说』这个格式本身：Elo 积分榜赛后常驻 Kaggle，战场还计划扩到多人游戏与真实模拟环境。中文化空间是现成的棋盘换皮：中国象棋。开源引擎 Pikafish 当裁判与保底棋力，LLM 只负责出着法、解说与心态管理，八强里必须有 DeepSeek 和 Kimi——Kaggle 那场的噱头原样搬过来；赛制、对阵图、赛后 Elo 曲线，你在 AI 魔方大赛里已经搭过一遍，这次连『外行看得懂』都更容易，因为每个中国观众都认识楚河汉界。选题钩子现成：『让 8 个大模型下象棋，谁先走出送帅？』","tags":["大模型","中国象棋","AI 竞技","Kaggle"],"effort":"周末级","id":"a454"},{"kind":"项目灵感","title":"mindcraft：6k 星开源框架，让一队 AI 在 Minecraft 里组队打工","url":"https://github.com/kolbytn/mindcraft","source":"GitHub · kolbytn/mindcraft（已实抓验证：约 6k 星、MIT、活跃维护，版本支持至 1.21.11）","date":"2026-11","summary":"MIT 协议的 mindcraft 用 Mineflayer 把 LLM 接进 Minecraft：agent 会聊天、追目标、组队协作，JSON 档案可为每个角色配不同模型，DeepSeek/Ollama 全支持。英文圈已验证『AI 在 MC 打工』的流量，中文全方言 agent 实拍还是空位。","takeaways":["类型：开源项目体验/AI 玩具 · 成本：API 按量或 Ollama 本地零成本 · 可行性：MIT，npm 装 Mineflayer 即跑","架构：Mineflayer 接入 Minecraft Java（局域网默认端口 55916），agent 为 JSON 档案，聊天/编码/视觉/嵌入/语音可分模型配置","支持 OpenAI/Anthropic/Google/DeepSeek/Grok/Ollama；游戏内写代码执行默认关闭，官方建议 Docker 隔离","学术背书：MineCollab 多智能体具身协作论文（arXiv 2504.17950），develop 分支 1600+ commit 活跃维护"],"whyValuable":"英文圈已把『LLM 在 Minecraft 打工』验证成流量格式，项目开源活跃、有论文背书；中文侧用 DeepSeek 或本地模型驱动全中文 agent 的实拍记录还很少，对话本身就是弹幕梗。","polished":"Minecraft 里最勤快的打工人现在是一队 LLM：开源项目 mindcraft（MIT，约 6000 星）用 Mineflayer 把大模型接进 Minecraft Java 版，agent 会聊天、认目标、组队协作，甚至能在游戏里写代码执行——默认关闭，官方明说有注入风险、推荐 Docker 隔离。上手路径短得惊人：本地开一个局域网世界，node main.js 连上（默认端口 55916），塞一个 API key 就能跑；每个 agent 是一份 JSON 配置，聊天、编码、视觉、嵌入、语音可以各配各的模型——OpenAI、Anthropic、Google、DeepSeek、Grok 都支持，挂 Ollama 就能全本地零成本。项目背后有正经论文（MineCollab，多智能体具身协作，arXiv 2504.17950），支持任务基准与 Docker 部署，版本一路跟到 1.21.11，develop 分支 1600 多个 commit，活着。中文化空间：《我的世界》在 B 站是基本盘级受众，『我让 3 个 AI 在 Minecraft 里组队盖了个家』这类题英文圈已反复验证流量，中文侧用 DeepSeek 或本地模型驱动全中文 agent 的实拍记录还很少——对话直接是中文梗，与弹幕的兼容度天然。进阶玩法：给 agent 分配性格档案互相拆台，或复刻 MineCollab 的协作任务做成系列，每期换一个模型当工头。","tags":["Minecraft","LLM Agent","开源项目","多智能体"],"effort":"一晚级","id":"a455"},{"kind":"项目灵感","title":"nanochat：Karpathy 的 100 美元 ChatGPT，从分词器到聊天界面一条龙","url":"https://github.com/karpathy/nanochat","source":"GitHub · karpathy/nanochat（已实抓验证：约 59.8k 星、MIT、README 成本与流水线数据全录）","date":"2026-11","summary":"Karpathy 的 nanochat：约 6 万星 MIT 仓库，一条流水线覆盖分词、预训练、SFT、RL、评测到推理，8×H100 约 2 小时 48 美元训出 GPT-2 水平小模型（2019 年同类成本约 4.3 万美元）。英文圈流量已验证，『中文语料再跑一遍』的教程是清晰空位。","takeaways":["类型：开源项目/训练流水线体验 · 成本：约 $48（8×H100 两小时，spot 约 $15）· 可行性：MIT，单机脚本齐全","全链路：BPE 分词 → 预训练 → SFT → RL → 评测（CORE/bpb/MMLU/GSM8K/ARC/HumanEval）→ KV cache 推理 + CLI 聊天","tagline『$100 能买到的最好 ChatGPT』；一个 --depth 旋钮自动配平宽度/头数/学习率，产出 compute-optimal 迷你系列","社区玩起『最快训到 GPT-2』竞速榜，当前纪录约 1.65 小时（8×H100）"],"whyValuable":"Karpathy 的仓库与讲解在英文圈是公认的 AI 教学顶流，星数与话题度已验证；『换中文语料+国内租价』的本地化教程是清晰空位，成本叙事（一顿饭钱训一个自己的 ChatGPT）现成。","polished":"『$100 能买到的最好 ChatGPT』——Karpathy 给 nanochat 起的 tagline 不是比喻：这条全链路流水线覆盖 tokenizer 训练、预训练、SFT、强化学习、评测到推理，在 8×H100 节点上约 2 小时、约 48 美元就能训出一个 GPT-2 水平的小模型（竞价实例约 15 美元），对照 2019 年同类约 4.3 万美元的成本。仓库约 6 万星、MIT：BPE 分词器、base_train、chat_sft、chat_rl 一套脚本管到底，评测对着 CORE、bits-per-byte、MMLU、GSM8K、ARC、HumanEval 打分，推理带 KV cache 还送命令行聊天界面；一个 --depth 旋钮自动配平宽度、头数与学习率，产出 compute-optimal 的迷你系列，社区还玩起了『最快训到 GPT-2』竞速榜——目前纪录约 1.65 小时。中文化空间：Karpathy 的仓库与讲解视频在英文圈是公认的 AI 内容顶流，nanochat 的中文内容还停留在零星笔记；真正的空位是『换成中文语料再跑一遍』——中文分词比例、语料配比、损失曲线的坑全是新内容，成本换算成国内 GPU 租价后，『一顿饭钱训一个自己的 ChatGPT』这个标题就成立了。对写代码的观众，这条流水线本身就是最好的实战教材：每一层都能读懂、能改、能测。","tags":["nanochat","Karpathy","LLM 训练","开源项目"],"effort":"一周级","id":"a456"},{"kind":"视频选题","title":"从全网刷屏到悄悄关停：Sora 2 的七个月，给中文视频圈留下了什么","url":"https://openai.com/index/sora-2/","source":"OpenAI 官方博客《Sora 2 is here》（已实抓验证，顶部含 2026-04-26 关停公告）；上线细节经检索核验","date":"2026-11","summary":"OpenAI 官网的 Sora 2 发布帖顶部现在挂着一行小字：产品已于 2026 年 4 月 26 日停止提供。从 cameo 数字分身刷屏到下架，英文圈完整走完一轮爆红—争议—退潮；中文圈的两层解读——产品考古与格式移植到可灵/即梦——都还没人做全。","takeaways":["类型：AI 视频产品复盘+格式移植 · 成本：零（素材全公开）· 可行性：官方博客与英文圈报道可查","官方博客实证：2025-09-30 发布 Sora 2 与 iOS 社交 app（美加首发、邀请制），cameo 数字分身、同步对白/音效、物理合理性改进（打铁会弹框）","官网原帖顶部公告：『As of April 26, 2026, the Sora product is no longer available』——从刷屏到下架约七个月","移植层：分身客串/热梗重演等已验证格式，用可灵、即梦、海螺复刻；ComfyUI 人物替换+动作迁移流程当对照组"],"whyValuable":"英文圈完整走完『爆红—争议—关停』全程，素材与讨论公开可查；中文侧既有产品史考古价值，又有国产工具移植的实操落点，双重叙事无人做全，比单纯追热点耐看。","polished":"OpenAI 官网的 Sora 2 发布帖顶部现在挂着一行小字：『As of April 26, 2026, the Sora product is no longer available.』从 2025 年 9 月 30 日带着 iOS 社交应用与 cameo『数字分身』刷屏，到悄悄下架，这条爆款曲线本身就值得一支复盘视频：发布时官方称物理合理性显著改进（篮球打铁会弹框）、同步对白与音效、上传一段自拍就能生成分身把本人塞进任何场景，美加上线、邀请制排队，英文圈的二创池当时被它灌满。而现在，官网原帖成了墓碑。中文化空间要分两层讲：第一层是考古——邀请制、社交 feed、cameo 授权链、青少年模式，这套设计哪些是产品创新、哪些埋着关停的种子，版权与肖像争议当时就没停过；第二层才是移植——它验证过的爆款格式（分身客串、热梗重演、名场面乱入）在可灵、即梦、海螺里能不能用国产工具复刻，你去年用 ComfyUI 做人物替换与动作迁移的那套流程，正好当对照组。英文圈验证过峰值、也验证了退潮，中文圈的两层解读都还没人做全——这比单纯追热点多一层『产品史』的耐看度，也顺手回应了观众最关心的那个问题：热闹散场之后，真正留下来的是什么。","tags":["Sora 2","AI 视频","可灵","产品复盘"],"effort":"周末级","id":"a457"},{"kind":"视频选题","title":"13 个官方技能装进 Claude Code：我不写一行 Remotion 代码，让 agent 自己出一条片","url":"https://github.com/remotion-dev/skills","source":"GitHub · remotion-dev/skills","date":"2026-11","summary":"Remotion 官方 Agent Skills 仓库，把建项目、写组件、开预览、渲染、查文档、授权自查做成 13 个子技能，一行命令装进 Claude Code/Codex/Kimi Code/Cursor。栏目 10 月底调研时是 12 个，实查已更新到 13 个，官方还在持续加码。","takeaways":["类型：官方 Agent Skill 实测 · 成本：免费（skill 本身不涉及 Remotion 商用授权）· 可行性：装完即可开拍","2026-11-03 实查 6,085 星、677 fork，2026-01-19 创建，11 月 2 日仍在推送","13 个子技能：best-practices 总纲、create、markup、studio、render、maps、captions、saas、interactivity、docs、license（v4.0.540 起）、upgrade、multimedia（Mediabunny）","安装：npx skills add remotion-dev/skills，官方文档页 remotion.dev/docs/ai/skills 可直接核对"],"whyValuable":"官方下场给 agent 定基线，skill 数量三天内从 12 涨到 13，实测它就是给整个『AI 视频工程』栏目做一次活体检验。","polished":"官方下场给 agent 定基线这件事，Remotion 做得最早也最全。remotion-dev/skills 仓库 2026 年 1 月创建，11 月 3 日实查已有 6,085 星、677 fork，前一天还在推送。栏目 10 月底调研时收录为 12 个子技能，本次实查官方文档已列出 13 个：/remotion-best-practices 总纲、/remotion-create 建项目、/remotion-markup 写 React 组件、/remotion-studio 开预览、/remotion-render 出片，另有地图、字幕、SaaS 架构、Studio 交互、文档检索、授权自查（v4.0.540 起可用）、升级和基于 Mediabunny 的 /remotion-multimedia。选题就这么做：一行 npx skills add remotion-dev/skills 装进 Claude Code（Codex、Kimi Code、Cursor 也认），然后只说一句『做一条 60 秒的终末地情报周报片头』，让总纲技能自己调度，全程录屏——观众想看的不是成片本身，而是 agent 怎么查文档、写组件、开 Studio 自查、再渲染成 MP4 的完整链路。拍完还能反哺栏目：官方 13 个技能与社区 15k 星分镜技能的分工实测，本身就是下一条视频的选题。skill 环节免费，真正涉及授权的是渲染出的商用片，个人创作无虞。","tags":["Remotion","AgentSkills","ClaudeCode","AI视频工程","实测"],"effort":"周末级","id":"a458"},{"kind":"项目灵感","title":"GitHub Unwrapped 模板改造计划：把官方年度视频生成器接到自己的数据源上","url":"https://github.com/remotion-dev/github-unwrapped","source":"GitHub · remotion-dev/github-unwrapped","date":"2026-11","summary":"Remotion 官方的 Wrapped 式年度视频生成器：GitHub GraphQL 拉数据，Remotion Lambda 分布式渲染，代码 MIT 且 README 明确邀请 fork 作模板。把数据源换成文摘站或 B 站数据，就是一条自己的年度视频自动生成管线。","takeaways":["类型：官方模板改造 · 成本：Lambda 按渲染量计费，个人年度级用量很低 · 可行性：模板现成，工程量在数据适配层","2026-11-03 实查 1,328 星，2026-07 仍在维护；架构：Vite 前端 + Remotion 渲染 + Lambda 多区域多账号分流 + MongoDB 缓存去重","红线一：配乐 SmartSound 授权仅限官方站，二创必须整轨换掉","红线二：Remotion 免费条件是个人/非营利/≤3 人公司（栏目 a282 已拆解）"],"whyValuable":"这是官方摊开的『Wrapped 式视频生成器』完整参考实现，从数据接入到云端渲染每个环节都有生产级答案。","polished":"每年年底，GitHub Unwrapped 都会给每个开发者生成一条专属年度总结视频。这套系统 11 月 3 日实查 1,328 星，README 原话『Feel free to fork and use this repository as a template!』，代码以 MIT 发布，是官方摊开的完整参考实现。架构值得逐行读：前端 Vite，数据来自 GitHub GraphQL API 的个人令牌（无需特殊 scope），渲染全靠 Remotion——模板在 Remotion Studio 里改，成片用 Remotion Lambda 分散到多个 AWS 区域和账号渲染以绕开并发上限，MongoDB 缓存加数据库锁防止同一用户重复渲染。改造思路有两条：把数据源从 GitHub 换成文摘站自己的数据（每日更新条数、栏目热度、关键词云），就是一条『终末地情报站 2026 年度报告』自动生成管线；换成 B 站开放接口拉投稿与弹幕数据，就能给任何 UP 主做一条 Wrapped。两条红线要写进选题：其一，配乐是 SmartSound 授权且仅限官方站使用，二创必须整轨替换；其二，Remotion 本体免费条件是个人、非营利或 3 人以下公司，商用需买 Company License。历年版本（2021-2023）还在独立分支和仓库里，模板风格可挑。年底前动手，正好赶上Wrapped 流量季。","tags":["Remotion","Lambda","年度总结","模板改造","终末地"],"effort":"一周级","id":"a459"},{"kind":"视频选题","title":"124 张分镜配方卡实测：video-shotcraft 让 agent 拍出有分镜感的片子，还能导出剪映继续剪","url":"https://github.com/Vincentwei1021/video-shotcraft","source":"GitHub · Vincentwei1021/video-shotcraft","date":"2026-11","summary":"社区视频技能的人气王者：124 张 shot recipe 卡加 150 个动效预览，让 Claude Code/Codex 按validated镜头语言组合 Remotion 分镜，自带节拍同步与音效设计，且支持导出剪映工程收尾——人机分工路径清晰。","takeaways":["类型：社区 Agent Skill 实测 · 成本：免费 · 可行性：装完即用，Apache-2.0","2026-11-03 实查 16,154 星，Apache-2.0，10 月 29 日仍在更新","能力清单（仓库描述原文）：124 shot recipe cards、150 motion previews、beat sync、sound design、Motion Workbench、剪映（JianYing/CapCut CN）导出","安装：npx skills add Vincentwei1021/video-shotcraft"],"whyValuable":"它把『分镜』变成可复用工程资产，且剪映导出给中文创作者留了最顺手的收尾通道，是 skill 路线成色的最佳试金石。","polished":"社区视频技能里人气最高的还是它：video-shotcraft，11 月 3 日实查 16,154 星、Apache-2.0，10 月 29 日仍在更新。它的思路是把『分镜』做成可复用的工程资产：124 张 shot recipe 卡、150 个动效预览，每张卡都是被验证过的镜头语言——agent 不再凭感觉乱写 Remotion 代码，而是按卡片组合镜头，再配上节拍同步（beat sync）和音效设计，从脚本到成片一条龙。选题做法：拿一条魔方科普短片当靶子，从写脚本开始全程交给它，重点观察两件事——recipe 卡组合出来的分镜像不像『人拍的』，以及成片离产品宣传片的水线还差多远。对中文创作者有个杀手级细节：它支持导出剪映工程，意味着 agent 负责前 80% 的动效成片，最后 20% 的精剪回到剪映手动收尾，这条人机分工路径比『全自动一条龙』务实得多，也最容易引起剪辑区观众共鸣。成片建议做成对比实测：同一份脚本，分别让裸 Remotion 和带 recipe 卡的技能各出一版，把过程剪成双栏对照——差距本身就有传播点，还能顺手回答『skill 到底值不值得装』这个栏目读者最关心的问题。","tags":["AgentSkills","Remotion","分镜","剪映","实测"],"effort":"周末级","id":"a460"},{"kind":"项目灵感","title":"claude-motion-design：不碰 Remotion 授权的动态设计路线，HTML+Playwright+ffmpeg 三件套","url":"https://github.com/howseen-ai/claude-motion-design","source":"GitHub · howseen-ai/claude-motion-design","date":"2026-11","summary":"一个 Claude Code skill，用纯代码做动态设计视频：HTML 写动效、Playwright 逐帧截图、ffmpeg 合成，MIT 授权、无 Remotion 商用顾虑。适合把片头、片尾、字幕条做成一次编写、每期复用的模板资产。","takeaways":["类型：Agent Skill（授权友好路线）· 成本：免费 · 可行性：MIT，商用无授权红线","2026-11-03 实查 756 星，MIT，10 月 4 日仍在更新，主页 howseen.ai","仓库描述原文：『HTML + Playwright + ffmpeg. No After Effects, no Remotion license』","对比：Remotion 免费条件为个人/非营利/≤3 人公司，长期模板资产走 MIT 路线更稳"],"whyValuable":"在 Remotion 授权红线与 After Effects 订阅之间，它给出了第三条 MIT 且纯代码的路，恰好补上栏目『授权友好』条目群。","polished":"AI 视频工程栏目拆过 Remotion 的授权红线：个人、非营利、3 人以下公司免费，再往上要买 Company License。对想长期沉淀片头、字幕条、转场模板的创作者，claude-motion-design 给了一条干净得多的路——仓库描述原话：『HTML + Playwright + ffmpeg. No After Effects, no Remotion license』，MIT 授权，11 月 3 日实查 756 星。原理不神秘：动效写成 HTML/CSS，Playwright 逐帧截图，ffmpeg 合成视频，全程纯代码，无商业授权顾虑。这个组合的工程含义是：渲染逻辑完全自己可控，改模板就是改 HTML，批量出片就是循环调 Playwright，agent 写起来也没有任何框架学习成本。落地选题：把栏目视频的片头、片尾、下期预告三件套做成一套可复用模板，一次写好、每期换文案就能出片；顺手实测它与 Remotion 路线在渲染速度、画面细腻度和改稿效率上的差距，给选型提供第一手数据。756 星说明它还是早期项目，API 可能变动，生产使用建议锁定版本——但 MIT 加纯代码的组合，作为个人片头工厂已经足够，这也正是它对『授权敏感型』团队的真实价值。","tags":["AgentSkills","MIT","片头动画","授权友好","Playwright"],"effort":"周末级","id":"a461"},{"kind":"视频选题","title":"防『幻灯片感』的讲解视频：video-talkcraft 把口播稿逐字对齐到动效，108 张配方卡撑场面","url":"https://github.com/Vincentwei1021/video-talkcraft","source":"GitHub · Vincentwei1021/video-talkcraft","date":"2026-11","summary":"口播驱动的讲解视频技能：输入口播稿加成品音频，本地词级时间戳对齐（FireRedASR2-CTC，标称中位偏差 20-40ms），七层反 PPT 相机系统让静止帧结构上不可能出现，再用 Remotion 渲染成片。注意授权为 PolyForm Noncommercial。","takeaways":["类型：Agent Skill 实测 · 成本：免费（个人/教育/研究）· 可行性：依赖 Node 18+、Python 3.10+、ffmpeg","2026-11-03 实查 2,026 星，10 月 12 日仍在更新；README 记载 108 张动效配方卡（2026-09-05 由 89 补充而来）","词级对齐默认 FireRedASR2-CTC int8（约 767MB，可用 --backend whisper 替代），每个动效节拍锚定到确切的字","授权：PolyForm Noncommercial 1.0.0——产出视频归你，工具商用需作者许可"],"whyValuable":"讲解视频的死穴是幻灯片感，它是目前把『动效逐字对齐口播』做得最系统的 skill，防 PPT 相机系统值得逐层拆给观众看。","polished":"讲解视频最大的死穴是幻灯片感：画面动不起来，或者动效和口播对不上。video-talkcraft（11 月 3 日实查 2,026 星，10 月 12 日仍在更新）专治这个。流程是：你给出口播稿和一段录好的音频，它先在本地做词级时间戳对齐——默认 FireRedASR2-CTC int8 模型，README 标称中位偏差 20 到 40 毫秒，然后生成 SHOTBOOK 分镜，每个动效节拍都锚在确切的字上，最后用 Remotion 分段并行渲染并做三重验收。防幻灯片感靠『七层反 PPT 系统』：每个场景都套一条极缓慢的推拉镜头曲线加六种运动转场，README 原话是『静止帧在结构上不可能出现』。弹药库是 108 张动效配方卡，2026 年 9 月刚从 89 张补充而来。选题做法：把已经写过的魔方二阶段算法长文转成口播音频喂进去，检验两件事——词级对齐在中文语速下是否依然精准，成片是否真有讲解感而不是高级轮播。注意授权是 PolyForm Noncommercial 1.0.0：个人、教育、研究免费，产出视频归你，工具本身商用要作者许可；环境依赖 Node 18+、Python 3.10+ 和 ffmpeg，对齐模型约 767MB，也可以切 whisper 后端。装法照旧：npx skills add Vincentwei1021/video-talkcraft。","tags":["AgentSkills","口播","Remotion","对齐","实测"],"effort":"周末级","id":"a462"},{"kind":"项目灵感","title":"VideoCaptioner 卡卡字幕助手：流水线最烦的字幕环节交给 LLM，16k 星开箱即用","url":"https://github.com/WEIFENG2333/VideoCaptioner","source":"GitHub · WEIFENG2333/VideoCaptioner","date":"2026-11","summary":"基于 LLM 的智能字幕桌面应用：语音识别、智能断句、纠错、双语翻译全流程处理。不管成片来自 Remotion 渲染还是实拍，字幕需求都一样，环节级工具比定制管线复用性强得多。","takeaways":["类型：字幕环节工具 · 成本：免费开源 · 可行性：桌面应用开箱即用，GPL-3.0","2026-11-03 实查 16,445 星，GPL-3.0，官网 videocaptioner.cn","定位（仓库描述原文）：基于 LLM 的智能字幕助手——生成、断句、校正、翻译全流程","与栏目 a311 字幕三件套（faster-whisper/whisperX/whisper.cpp）互补：那是引擎层，这是成品应用层"],"whyValuable":"组装型流水线的每个环节里，字幕最磨人也最通用，它把这一环做成了免安装调参的成品，恰好补上栏目引擎层与流水线之间缺的应用层。","polished":"组装型视频流水线里，画面、配音都有现成方案，最磨人的其实是字幕：语音识别出来的稿子不断句、错别字多、时间轴粗糙。VideoCaptioner（卡卡字幕助手）把这一环做成了开箱即用的桌面应用——11 月 3 日实查 16,445 星、GPL-3.0，官网 videocaptioner.cn，一句话定位：基于 LLM 的智能字幕助手，字幕生成、断句、校正、翻译全流程处理。它值得单独收进工具箱的理由是『环节级』而非『项目级』：不管你的成片来自 Remotion 渲染、Manim 动画还是实拍素材，字幕需求都是同一套，一个独立应用比每次现搭管线复用性强得多，也正好接在栏目字幕三件套（faster-whisper/whisperX/whisper.cpp）这些引擎层条目之上——引擎负责听清，它负责听懂。实战玩法：拿一期录屏素材跑全流程——识别、LLM 断句、术语校正（AI 视频工程的一堆专有名词正好测试它的纠错能力）、生成双语字幕，再把 srt 喂回剪辑软件，记录人工修正率；这个数字直接决定它能不能进正式流水线，本身就是一个可发布的实测数据点。GPL-3.0 意味着二次开发也要开源，个人使用毫无问题。对做系列视频的人，这就是把每周两小时字幕工时压到半小时的那一环。","tags":["字幕","LLM","组装型流水线","GPL","效率"],"effort":"一晚级","id":"a463"},{"kind":"延伸创意","title":"情报周报视频补上最后一环：edge-tts 零成本中文配音，12k 星老牌方案还活着","url":"https://github.com/rany2/edge-tts","source":"GitHub · rany2/edge-tts","date":"2026-11","summary":"用 Python 调用微软 Edge 在线语音合成服务（无需装 Edge），12,443 星的长寿项目。给『终末地情报周报视频』的组装型流水线补上配音环节：LLM 摘要改写口播稿，edge-tts 合成中文音色，与字幕动画对轴，全程零成本可日更。","takeaways":["类型：配音环节延伸创意 · 成本：零（走 Edge 免费接口）· 可行性：pip 即装，作为独立服务调用无授权传染","2026-11-03 实查 12,443 星，10 月 14 日仍在更新；授权为 LGPL-3.0（仅 srt_composer.py 为 MIT）","组合定位：与已有延伸创意『终末地情报周报视频：文摘数据 + 代码生成动画』衔接，补的是配音那一块拼图","风险：免费接口随时可能收紧，重要管线要有备用音源（栏目 a312 TTS 存亡表可做备选清单）"],"whyValuable":"它是中文零成本配音事实上的默认答案，把周报流水线的最后一个缺口补上，同时自带一条 TTS 横评视频选题。","polished":"『终末地情报周报视频：文摘数据 + 代码生成动画』这个创意还缺一块拼图：配音。自己录耗时间，接商用 TTS 有成本，edge-tts 是被社区验证多年的中间答案——用 Python 调微软 Edge 的在线语音合成服务，不需要安装 Edge，11 月 3 日实查 12,443 星、10 月 14 日还在更新，在这个工具死得飞快的赛道里算罕见的长寿项目。授权要看清：主体代码 LGPL-3.0，唯独 srt_composer.py 是 MIT；作为命令行工具或独立服务调用没有传染问题，嵌进闭源发行版才需要谨慎。落地创意：给情报周报的组装型流水线补上配音环节——LLM 把当日摘要改写成 60 秒口播稿，edge-tts 用中文音色合成，与字幕、代码动画对轴出片，全程零成本，撑得起日更节奏。顺手能做的实测选题：把 edge-tts 与国内主流开源 TTS 在中文自然度、多音字处理、语速控制上横评一遍（栏目 TTS 选型存亡表里正好有一份存亡名单可做对照），这本身就是一条有搜索量的视频。唯一的隐患也要讲清：它走的是 Edge 免费接口，微软随时可能收紧策略，重要管线必须留备用音源——这份不确定性，反而让横评选题更有现实意义。","tags":["TTS","配音","组装型流水线","终末地","零成本"],"effort":"一周级","id":"a464"},{"kind":"视频选题","title":"直播回放自动切片实测：FunClip 全本地跑 FunASR 转写加 LLM 挑高光，数据不出本机","url":"https://github.com/modelscope/FunClip","source":"GitHub · modelscope/FunClip","date":"2026-11","summary":"阿里 ModelScope 出品的本地化智能切片工具：FunASR/Paraformer 转写、自动字幕、LLM 按语义挑选高光段落裁切，Gradio 界面开箱即用，MIT 授权。拿自己的直播回放实测三个数字：错字率、高光重合度、全程耗时。","takeaways":["类型：本地切片工具实测 · 成本：免费（本地推理，需 GPU 更佳）· 可行性：MIT，另有 Hugging Face 在线 demo","2026-11-03 实查 6,487 星，MIT，11 月 1 日刚有提交，同类里活跃度数一数二","技术栈（仓库描述原文）：FunASR 转写 + 字幕生成 + LLM 辅助切片 + 本地 Gradio UI，Paraformer 中文转写是主场","组合玩法：切片粗坯交给 auto-editor（栏目 a301）压掉静默，组成直播回放到竖版短片的完整本地流水线"],"whyValuable":"切片是内容生产的体力活天花板，FunClip 提供数据不出本机的全本地答案，且中文转写底子比 Whisper 系更值得实测。","polished":"长视频切片是内容生产的体力活天花板：一场两小时直播回放，人工找高光要耗一晚上。阿里 ModelScope 的 FunClip 是全本地方案：FunASR/Paraformer 转写、自动生成字幕、LLM 按语义挑选高光段落并裁切，Gradio 界面开箱即用，MIT 授权，11 月 3 日实查 6,487 星、11 月 1 日刚有提交，活跃度在同类项目里数一数二；不想装环境，可以直接玩 Hugging Face 上的 FunAudioLLM/FunClip 在线 demo 先感受上限。选题做法：拿一场自己的直播回放当靶子跑全流程，记录三个数字——转写错字率、LLM 挑出的高光与人工认定的重合度、全程耗时；这三个数字直接回答『本地切片能不能替代手动』，比任何口播评测都有说服力。对比维度也现成：栏目已收录的 AutoClip 走云端 LLM，FunClip 主打数据不出本机，同一份素材两边各跑一遍，出片质量与隐私成本一比便知；切完的粗片再丢给 auto-editor 压掉静默段，就组成一条『直播回放到竖版短片』的完整本地流水线。中文场景是 Paraformer 的主场，错字率大概率优于 Whisper 系——实测正好验证这一点，结论可以直接回填栏目 a311 的字幕选型表。","tags":["切片","FunASR","本地推理","实测","高光"],"effort":"周末级","id":"a465"},{"kind":"视频选题","title":"用生成器函数逐帧画算法：Motion Canvas 把递归回溯变成可讲懂的动画","url":"https://github.com/motion-canvas/motion-canvas","source":"GitHub · motion-canvas/motion-canvas","date":"2026-11","summary":"TypeScript 生成器函数逐帧编程动画，配实时预览编辑器，官方定位『创建有信息量的矢量动画并与配音同步』——几乎为编程科普视频量身定做。19,652 星、MIT，是栏目 Manim 之外被低估的第三条绘制型路线。","takeaways":["类型：绘制型动画框架实测 · 成本：免费 · 可行性：MIT，Vite 插件体系，前端开发者零门槛","2026-11-03 实查 19,652 星，MIT，7 月初仍在更新；monorepo 含 core/2d/vite-plugin/player 四件套","定位（README 原文）：TypeScript 生成器函数编程动画 + 实时预览编辑器，专为与配音同步的信息型矢量动画设计","与 Remotion 的模型差异：React 按帧计算 vs 生成器逐帧 yield，后者写动画节奏更像讲故事，编辑器可直接改关键帧"],"whyValuable":"讲算法的视频在 PPT 与 Manim 之间缺一个前端友好的选项，Motion Canvas 的生成器模型恰好补位，与 Manim 同题对垒就是现成选题。","polished":"讲算法的视频不好做：PPT 太干、实拍够不着、Remotion 写时间轴又太重。Motion Canvas 是个被低估的第三选项：一个用 TypeScript 生成器函数逐帧编程动画的库，外加实时预览编辑器，官方定位是『创建有信息量的矢量动画并与配音同步』——这句话几乎就是为编程科普视频写的。11 月 3 日实查 19,652 星、MIT 授权，monorepo 里 core 负责运行与渲染、2d 是默认二维渲染器、vite-plugin 负责开发打包、player 是浏览器自定义元素，文档在 motion-canvas.io。它和 Remotion 的差异在时间轴模型：Remotion 是 React 组件按帧计算，Motion Canvas 是生成器逐帧 yield，动画节奏写起来更像『讲故事』，还能在编辑器里直接修改关键帧细节，省掉改代码、重渲染的循环。选题做法：把一段迭代加深的搜索过程（比如魔方二阶段求解的剪枝回溯）写成 Motion Canvas 动画——节点逐层展开、剪枝回溯逐帧画出来，配音讲清每一步为什么走、为什么不走。更有传播力的版本是同题对垒：同一个算法，Manim 版和 Motion Canvas 版各做一版，两条绘制型路线的写法差异、出片速度、改稿成本一览无余——栏目读者看完就知道该学哪个，这一期素材也能同时回填两个条目。","tags":["MotionCanvas","算法可视化","绘制型","TypeScript","实测"],"effort":"周末级","id":"a466"},{"kind":"视频选题","title":"为了不错过终末地的每一条情报，我做了这个……——套用何同学的「造物句式」","url":"https://ww
