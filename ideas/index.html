w.bilibili.com/video/BV1vGub6FEcu","source":"B站 · 老师好我叫何同学","date":"2026-11","summary":"何同学「为了睡个好觉，我们做了这个...」实查 1092.8 万播放（2026-11-03，view API），是他近月最高的一条。同句式「为了上班吃零食」「做个不一样的拐杖」分别 473.9 万、280.5 万，近月三连全部 280 万以上——这是当下科技区最稳的爆款模板。","takeaways":["类型：选题模式复刻 · 成本：零（素材已有）· 可行性：情报站项目现成可拍","对标实测：何同学「为了睡个好觉，我们做了这个...」2026-08-07 发布，2026-11-03 实查 1092.8 万播、32.0 万赞，web_reader 页面显示曾登每周必看第 386 期","同句式矩阵（均实查）：「为了上班吃零食，我们做了这个...」473.9 万（2026-06-19）、「我们做了个不一样的拐杖...」280.5 万（2026-06-12）","模式拆解：痛点前置 →「我们做了这个」留悬念 → 正片是立项/踩坑/迭代/给真人试用的工程叙事；睡眠片由全新理想 L8 植入托底（视频标签实查）","复用切口：爬虫、GitHub Actions 日报、AWTRIX 像素屏播报都是「为了不错过情报而造的物」，闭环落在订阅者真收到一次推送"],"whyValuable":"何同学用近五个月的三连爆把这个句式跑成了稳定公式，而本频道手里正好有一个做了几个月、随时能开拍的造物项目，句式和素材是天生一对。","polished":"「为了X，我们做了这个」在近五个月里被何同学跑成了科技区最稳的爆款公式：为了睡个好觉（实查 1092.8 万）、为了上班吃零食（473.9 万）、做个不一样的拐杖（280.5 万），三条全部 280 万以上，均经 view API 实查。拆开看只有三步：第一步，标题第一个短语必须是全民痛点——失眠、嘴馋、腿脚不便，观众扫一眼就知道「这说的就是我」；第二步，「我们做了这个」只给悬念不给答案，把点击动机从好奇心升级成「我想看他能做到什么程度」；第三步，正片是一场正经的工程叙事——立项、踩坑、迭代、给真实用户试用，造物过程本身就是正片，不靠额外玩梗撑场面。对本频道来说素材是现成的：终末地情报站做了几个月，爬虫、GitHub Actions 日报、AWTRIX 像素屏播报，全是「为了不错过情报而造的物」。选题直接套句式：「为了不错过终末地的每一条情报，我做了这个……」，开拍前把每次踩坑的录屏留好，痛点前置、过程扎实，结尾让一位订阅者真的用它收到一次情报推送——闭环落在产品上，这也是何同学每条片子的收尾方式。","tags":["选题模式","何同学","造物叙事","终末地"],"effort":"周末级","id":"a467"},{"kind":"视频选题","title":"我给 AI 当手：让 Claude 只看摄像头复原魔方——复刻林亦的「AI 极限实验」生产线","url":"https://www.bilibili.com/video/BV1bmKp6cERp","source":"B站 · 林亦LYi","date":"2026-11","summary":"林亦「我用AI杀死了史上最难的跑步游戏」实查 392.2 万播放（2026-11-03），近月他的「AI+极限场景」四连全部 88.6 万以上：攻略我的猫 149.5 万、让AI同时打1000人 104.6 万、AI 三省六部 88.6 万。这条公式可以原样搬到魔方上。","takeaways":["类型：选题模式复刻 · 成本：现有工具链即可开拍 · 可行性：Kociemba/cubing.js 都是现成裁判","对标实测：林亦LYi 2026-07-20「我用AI杀死了史上最难的跑步游戏」，实查 392.2 万播、13.5 万赞；QWOP 通关记录已推进到 37 秒并开源在 run.lyihub.com（简介实查）","近月系列（均实查）：「我用AI攻略了我的猫！」149.5 万（2026-09-28）、「我让AI同时打1000人，两天后它杀死了所有角色！」104.6 万（2026-10-10）、「打造AI三省六部」88.6 万（2026-07-09）","模式拆解：实验对象具体到荒诞 + 极限目标可验证 + 人只是实验员，观众全程等的是 AI 怎么翻车、翻车后怎么自救","复用切口：不给公式、只给摄像头，让 agent 看着复原过程自己总结步法，人当它的「手」——视觉识别 → 状态解析 → 求解的每一环都可能翻车，全是钩子"],"whyValuable":"林亦证明了「AI 极限实验」不需要大制作也能稳定百万播放，而魔方这个既硬核又视觉化的题材在本频道是独家资产，两者组合没有竞品。","polished":"林亦LYi 近半年把「AI 极限实验」做成了稳定生产线：让 AI 攻略史上最难的 QWOP（实查 392.2 万）、攻略我的猫（149.5 万）、让 AI 同时打 1000 人看两天后谁能活下来（104.6 万），加上 AI 三省六部（88.6 万），四支同类视频全部 88.6 万以上，均经 view API 实查。这条公式有三块骨头：其一，实验对象要具体到荒诞——不是「AI 玩游戏」，而是「AI 杀死史上最难的跑步游戏」，标题里永远有一个可验证的极限目标；其二，人是实验员不是主角，观众全程等的是 AI 什么时候翻车、翻车后怎么自救，QWOP 那条甚至把通关记录开源到 run.lyihub.com 让观众继续挑战，视频之外还有第二层沉淀；其三，每期结尾给可复用的工件——脚本、榜单、数据。套到本频道：魔方是天然试验台——不给公式、只给摄像头，让 Claude 盯着复原过程自己总结步法，人只当它的「手」。视觉识别魔方状态、转成求解输入、逐条口播步骤，每一环都可能翻车，而翻车正是这条公式里最值钱的段落；熟悉的 Kociemba、cubing.js 顺手就成了解说和验证工具。","tags":["AI Agent","林亦","魔方","选题模式"],"effort":"一周级","id":"a468"},{"kind":"项目灵感","title":"把终末地情报站打磨成第二届 B 站 AI 创造公开赛的参赛作品","url":"https://www.bilibili.com/video/BV1BBME6BEkQ","source":"B站 · 林亦LYi","date":"2026-11","summary":"B 站首届 AI 创造公开赛落幕：3 万+投稿、1.34 万名创作者、累计播放时长 583 万小时（搜狐 2026-10-16 报道，web_reader 实查）；粉丝 1 万以下创作者占 88%。官方宣布第二届即将启动、流量扶持升至十亿级——情报站是现成的参赛底子。","takeaways":["类型：平台活动红利 · 成本：免费 · 可行性：项目已存在，按 BIP 叙事重新连载即可","对标实测：林亦「打造AI三省六部！批电子奏折，当赛博皇帝！【B站AI创造公开赛】」实查 88.6 万播、10.5 万赞；web_reader 确认赛后标题已改为「干掉推荐算法！我给手机装了个三省六部」——参赛作赛后转日常选题是标准打法","同系列实查：「用AI预测世界杯把房子赔掉了！【B站AI创造公开赛】」72.2 万（2026-06-11）","赛事数据（搜狐报道，web_reader 实查）：3 万+投稿、1.34 万创作者、100 万+用户互动、583 万小时播放时长；粉丝 1 万以下占 88%，非专业开发者超七成","第二届官宣将启动、流量扶持升级至十亿级（搜狐 2026-09-08 报道，web_reader 实查）"],"whyValuable":"这是平台级、给个人创作者留了 88% 名额的流量窗口，而本频道唯一缺的「参赛作品」其实已经做了一半——只差按公开构建的叙事重新连载一遍。","polished":"B 站首届「buildinbilibili·AI 创造公开赛」把答案写在了明面上：3 万+投稿、1.34 万名创作者、累计播放时长 583 万小时（搜狐 2026-10-16 报道，web_reader 实查）；参赛门槛对个人极其友好——粉丝 1 万以下的创作者占 88%，非专业开发者超七成。林亦两支参赛作实测 88.6 万与 72.2 万播放，赛后他把标题从「打造AI三省六部」改成「干掉推荐算法」，参赛作无缝转成日常选题，一套素材吃两轮流量。官方已宣布第二届即将启动，流量扶持升级到十亿级。对本频道这不是「要不要参加」而是「用哪个项目参赛」的问题：终末地情报站就是标准的 BIP（公开构建）样本——全程公开、可连载、有真实用户。做法分三步：把情报站的采集管线、LLM 日报、像素屏播报拆成 4-6 集连载，每集结尾放当期进度和下一个坑；仓库链接直接挂在投稿页，把老观众转化成早期用户；投稿动作本身再出一条片——「我拿做了半年的情报站，报名了第二届AI创造公开赛」。就算不获奖，连载过程的每一集也都是选题。","tags":["AI创造公开赛","平台活动","终末地情报站","AI Agent"],"effort":"一周级","id":"a469"},{"kind":"视频选题","title":"一镜到底。修一个真 Bug——把「形式标签前置」搬进 AI 编程实况","url":"https://www.bilibili.com/video/BV12peP6kEnK","source":"B站 · 老师好我叫何同学","date":"2026-11","summary":"iPhone 18 Pro 首发混战里，何同学把形式创新写在标题第一个词：「一镜到底。」实查 541.7 万播放（2026-11-03）；影视飓风同场把「折1万次」写进标题，1203.4 万。事件日流量只奖励有记忆点的形式。","takeaways":["类型：形式创新实验 · 成本：零（一条录屏）· 可行性：选一个真实 issue 即可开拍","对标实测：何同学「【何同学】一镜到底。iPhone 18 Pro首发体验」2026-09-16，实查 541.7 万播、16.0 万赞","同场参照（均实查）：「能折！但代价呢？iPhone Duo首发体验」255.0 万（2026-10-21）；影视飓风「折1万次，会坏吗？iPhone Duo深度评测」1203.4 万、51.3 万赞（2026-10-21）","模式拆解：大事件当天人人有素材，差异点从「讲什么」变成「怎么拍」；形式词放标题最前面充当签名，把「真实」变成可感知的卖点","复用切口：「一镜到底。修一个真 Bug」——60 分钟不剪辑的 agent 结对实录，主屏终端 + 画中画口播，翻车不补录；系列化后「第 N 期通过率」本身是新看点"],"whyValuable":"AI 编程实录的公信力全靠「没剪过」，一镜到底恰好把这件事做成标题——形式与内容互为证明，是同类内容里最省成本的一次升级。","polished":"大事件当天，所有科技 UP 都有素材，胜负手从「讲什么」变成「怎么拍」。何同学把形式创新直接写在标题最前面：「一镜到底。iPhone 18 Pro首发体验」，实查 541.7 万；同场把「折1万次」写进标题的影视飓风拿了 1203.4 万，Duo 首发「能折！但代价呢？」255.0 万。三个数字说明同一件事：事件日流量池极大，但只奖励有记忆点的形式。一镜到底是最容易被复用的那种——它把「真实」变成了可感知的东西：没有剪辑点，观众会下意识找破绽，找到「居然没剪」的那一刻，信任就建立了。复用到 AI 编程线就是「一镜到底。修一个真 Bug」：60 分钟不剪辑的 agent 结对实录，主屏是终端，画中画是出镜口播；让 Claude Code 现场查文档、写补丁、跑测试，翻车了就当着镜头翻车。选一个真实 issue 而不是演示项目，宣传只说一句「全程不剪辑，翻车不补录」。做顺了可以系列化：每期片头放历史通过率，第 N 期能不能一次过，本身就是新钩子。","tags":["一镜到底","形式创新","AI编程","选题模式"],"effort":"周末级","id":"a470"},{"kind":"视频选题","title":"从明日方舟到终末地：六年，一张图——借「库克时代」的谢幕叙事方法","url":"https://www.bilibili.com/video/BV1G7tG6tEwL","source":"B站 · 老师好我叫何同学","date":"2026-11","summary":"何同学「库克时代」实查 549.0 万播放、25.4 万赞、14.5 万硬币（2026-11-03），是近月互动率最高的一条之一：用一个时代的谢幕当叙事锚点，把行业史揉进个人记忆。终末地上线就是二次元圈的同类情绪节点。","takeaways":["类型：情绪叙事 · 成本：低（档案素材为主）· 可行性：情报站数据库即素材库","对标实测：何同学「【何同学】库克时代」2026-09-01，实查 549.0 万播、25.4 万赞、14.5 万投硬币——硬币比 1:0.57，远高于其首发类视频","背景确认：web_reader 相关视频区出现「苹果发布会开场 库克交接」，2026-09 秋季发布会完成 CEO 交接；「苹果新CEO凭啥是他？」116.9 万——谢幕与继任是成对选题","模式拆解：谢幕叙事自带情绪分层——老用户来告别、新用户来补课；骨架是公开档案（发布会片段、老产品、旧报道），穿插一两件私人物品建立个人视角","复用切口：明日方舟六年 → 终末地上线，把六年版本数据做成一张会动的图或 5 分钟动画，开服曲线、活动节点、玩家梗逐层叠加，停在「开门」那一刻"],"whyValuable":"情绪型选题是频道从工具实测转向大众传播的最短路径，而终末地上线这个节点一过就不再有——谢幕叙事有时效性，素材库却已经备好。","polished":"「库克时代」实查 549.0 万、25.4 万赞、14.5 万硬币，是何同学近月互动率最高的一条：它不是评测，而是一场用档案素材剪出来的时代叙事——库克执掌苹果的十五年，配 2026-09 发布会上的交接时刻（web_reader 相关视频区确认「苹果发布会开场 库克交接」）。谢幕选题的杠杆在于情绪分层：老用户进来告别，新用户进来补课，两类人都觉得这条片「为我而做」。而且它对制作成本友好——叙事骨架全是公开档案：发布会片段、老产品、旧报道，穿插一两件私人物品就能建立个人视角。同场验证的还有「苹果新CEO凭啥是他？」116.9 万，谢幕与继任是成对的选题矿脉。搬进本频道，情绪节点是现成的：明日方舟走过六年，终末地上线，一个 IP 的两代同框。做法：「从明日方舟到终末地：六年，一张图」——把六年版本更新数据做成一张会动的图或 5 分钟动画，开服数据、活动曲线、玩家梗图逐层叠加，最后停在终末地开门那一刻。情报站数据库就是素材库，这条片还能反哺情报站的品牌。","tags":["情绪叙事","明日方舟","终末地","数据可视化"],"effort":"一周级","id":"a471"},{"kind":"视频选题","title":"自费五张二手卡，横评本地大模型——照着极客湾的「圈层事件」配方做","url":"https://www.bilibili.com/video/BV1kMxM6FECM","source":"B站 · 极客湾Geekerwan","date":"2026-11","summary":"极客湾 10 月底芯片大横评实查 349.3 万播放、33.5 万赞（2026-11-03），web_reader 页面显示全站排行榜最高第 1 名；7 月续航大横评 504.4 万、自购 78 台零售机。自费+统一口径数据表，已是科技区的「圈层事件制造机」。","takeaways":["类型：横评实测 · 成本：数千元（二手卡可再出手）· 可行性：基准脚本开源生态成熟","对标实测：极客湾「旗舰手机芯片大横评：苹果高通发哥玄戒谁最强？」2026-10-27，实查 349.3 万播、33.5 万赞、57 分钟；页面标注全站排行榜最高第 1 名","系列前作实查：「极客湾手机续航大横评：电池锁容？电量缩水？谁在浑水摸鱼？」2026-07-25，504.4 万、54.3 万赞，自购 78 台零售机，用「基于 AI Agent 自主玩手机」的 5.0 续航标准（简介实查）","溢出效应实查：115 秒解读向二创「极客湾芯片横评一出，整个数码圈都安静了」80.6 万（view API 两查一致）——横评数据是全圈的引用素材","决策型佐证（实查）：小白测评「双11手机怎么选？2026全价位购机指南」37.9 万（2026-10-31），买前决策内容节点常青","复用切口：自费收 5 张不同价位二手显卡，统一基准横评本地大模型推理——同时踩中装机、AI、省钱三个流量池"],"whyValuable":"横评是最重的内容形态，但也是唯一能被同行反复引用、长期吃搜索流量的资产；「本地大模型」议题正处在极客湾芯片横评同款的争议红利期。","polished":"极客湾证明了一件事：自费、统一口径、肯下死功夫的横评，是科技区最稳定的「圈层事件制造机」。芯片大横评实查 349.3 万、33.5 万赞，57 分钟长片，web_reader 页面显示全站排行榜最高第 1 名；7 月的续航大横评 504.4 万，自购 78 台零售机，甚至用「基于 AI Agent 自主玩手机」的 5.0 标准来测续航——测评方法论本身都在 AI 化。更值得记一笔的是溢出效应：115 秒的解读向二创「极客湾芯片横评一出，整个数码圈都安静了」实查 80.6 万，横评数据成了全圈的引用素材。复用路线已经清楚：二手显卡本地大模型推理横评——自费收 5 张不同价位的二手卡，统一一套基准（tokens/s、长文本、显存峰值、功耗），一张大表给结论。它同时踩中三个流量池：装机（决策刚需）、AI（议题热度）、省钱（二手）。选题名可以更狠一点：「为了搞清本地跑大模型要花多少钱，我收了 5 张二手卡」。决策型指南的常青性另有佐证：小白测评双 11 购机指南实查 37.9 万。","tags":["横评","极客湾","本地大模型","二手显卡"],"effort":"一周级","id":"a472"},{"kind":"延伸创意","title":"把睡眠数据接进 Home Assistant：一场以「半年」为单位的实验","url":"https://www.bilibili.com/video/BV1gcaK6UEvA","source":"B站 · 电丸科技AK","date":"2026-11","summary":"电丸科技AK「半年改善睡眠实验 hrv提高12% 生理年龄年轻7岁」实查 35.2 万播放（2026-11-03），59 分钟长片全靠数据说话；同题的天花板是何同学「为了睡个好觉」的 1092.8 万。睡眠是 2026 科技区被反复验证的全民痛点。","takeaways":["类型：数据管线 + 长线实验 · 成本：一枚智能戒指/手环 · 可行性：HA 生态有现成集成","对标实测：电丸科技AK「半年改善睡眠实验 hrv提高12% 生理年龄年轻7岁」2026-09-24，实查 35.2 万播、59 分钟长片","天花板参照：何同学「为了睡个好觉，我们做了这个...」同题实查 1092.8 万——睡眠题材上限极高","模式拆解：「半年」这个时间单位自带权威感，HRV/生理年龄等生理数据把「感觉变好」变成可验证结论；中途的反复与失败是最留人的段落","复用切口：戒指/手表数据接 HA——入睡自动关灯、HRV 异常触发空气治理、起床联动窗帘，LLM 每周生成睡眠周报；一个实验养三个选题"],"whyValuable":"这是少数「现在开始攒数据、半年后必然有片」的选题：管线是延伸创意，成片是视频选题，中途每次联动翻车都能单独成条。","polished":"电丸科技AK 的「半年改善睡眠实验」实查 35.2 万，是一条低成本高信服的典型：没有何同学级别的制作，靠的是「半年」这个时间单位——HRV 提高 12%、生理年龄年轻 7 岁，所有结论都钉在数据上（59 分钟长片，观众精准）。同题的天花板是何同学「为了睡个好觉」的 1092.8 万，说明睡眠是 2026 科技区被反复验证的全民痛点。把这条叙事搬进本频道，切口在数据管线：智能戒指/手表的睡眠数据接进 Home Assistant——入睡后灯光自动熄灭、HRV 连续异常触发空气治理、起床时间联动窗帘，再让 LLM 每周生成一页睡眠周报，把原始数据翻译成一句人话。工程量不大，但「半年」这个叙事单位必须现在就开始积累：先跑一个月管线校准数据、排除误报，第 31 天开机拍摄，第 180 天出结论。这条线的价值在于复利：数据管线本身是一条延伸创意，半年后的成片是视频选题，中途任何一次联动翻车都能单独成片——一个实验养三个选题，而且数据越攒越值钱。","tags":["睡眠","智能家居","数据叙事","长线实验"],"effort":"月级","id":"a473"},{"kind":"视频选题","title":"用放大镜逐帧拆 10 条百万播放 AI 视频：生成物的破绽藏在哪","url":"https://www.bilibili.com/video/BV19deM6iEZ5","source":"B站 · 大狸子切切里","date":"2026-11","summary":"大狸子切切里「用放大镜看ColorOS 17，居然这么好玩」实查 67.8 万播放（2026-11-03）——把一个十块钱的道具变成评审方法，玄学评测立刻变成可验证内容。AI 视频刷屏的当下，这套打法可以反过来用。","takeaways":["类型：工具化拆解 · 成本：零 · 可行性：素材全是公开热门视频","对标实测：大狸子切切里「用放大镜看ColorOS 17，居然这么好玩｜OPPO Find X10首发体验」2026-09-17，实查 67.8 万播、1.7 万赞","争议场参照（实查）：「钟文泽，iPhone Duo测评引争议，一张磨砂膜炸穿整个B站数码圈！」41.0 万（2026-10-26）——热点争议 + 专业工具下场是稳定流量组合","模式拆解：「用X看Y」句式把日常工具变成评审道具，观众获得「我也能这么看」的技能感；放大镜/逐帧/波形图都是现成道具","复用切口：逐帧看手指、光影、文字边缘，总结 3 个藏不住的破绽——既是创作者教程也是观众避坑指南"],"whyValuable":"AI 视频内容正在爆发但鉴别内容稀缺，「拆解」同时服务创作者和普通观众两个流量池，还能反哺本频道自己的 AI 视频工程质量。","polished":"大狸子切切里把「放大镜」变成了评审方法：「用放大镜看ColorOS 17，居然这么好玩」实查 67.8 万——一个十块钱的道具，把厂商发布会里的玄学形容词全部变成可验证的像素级事实，观众拿到的是「我也能这么看」的技能感。这套打法在争议场更锋利：iPhone Duo 磨砂膜争议发酵时，解读向视频「一张磨砂膜炸穿整个B站数码圈」实查 41.0 万——热点争议+专业工具下场，是稳定的流量组合。搬到本频道，靶子是现成的：AI 生成视频正在刷屏，但几乎没人系统拆过它的破绽。「用放大镜逐帧拆 10 条百万播放 AI 视频」：逐帧看手指、看光影、看文字边缘，必要时上波形图和放大镜转场，最后总结 3 个藏不住的破绽和 2 个好用到值得抄的处理。它同时是教程（创作者学识别）、避坑指南（观众学防骗）和频道 AI 视频工程线的自我检验——拆完别人的片子，自己 agent 生成的片子该注意什么也就清楚了。素材选片标准也简单：只拆播放过百万、且能确定是 AI 生成的公开视频，逐条给出来源链接。","tags":["AI视频","逐帧拆解","选题模式","避坑指南"],"effort":"周末级","id":"a474"},{"kind":"延伸创意","title":"把 AI 眼镜接进 Home Assistant：它看到什么，就触发什么","url":"https://www.bilibili.com/video/BV14pnh6nEsi","source":"B站 · 大狸子切切里","date":"2026-11","summary":"大狸子切切里「没摄像头，没外放，这叫智能眼镜？｜雷鸟iO智能眼镜上脸体验」实查 62.7 万播放（2026-11-03）；电丸科技AK 的千问AI眼镜 N1 Pro 实查 42.5 万。AI 眼镜是 2026 下半年新品类密度最高的赛道，而「眼镜+全屋智能」的交叉地带还没人认真做。","takeaways":["类型：新品类交叉实验 · 成本：一副带摄像头的 AI 眼镜 · 可行性：HA webhook + 视觉模型即可打通","对标实测：大狸子切切里「没摄像头，没外放，这叫智能眼镜？｜雷鸟iO智能眼镜上脸体验」2026-10-23，实查 62.7 万播、2.5 万赞；web_reader 页面确认宣传语「这应该是我用过最AI的AI眼镜」","品类热度参照（实查）：电丸科技AK「千问AI眼镜 N1 Pro 超级好玩：两个小鼻托，让我重新理解智能眼镜」42.5 万（2026-10-13）——一个细节就能撑起一支片","模式拆解：新品类第一现场 + 反问式标题制造认知差；观众心理是「我该不该上车」，交叉地带内容天然稀缺","复用切口：眼镜摄像头 → 视觉模型 → HA 场景触发（看到快递员、宠物、炉上的锅）；是「把全屋智能交给大模型」的天然下集"],"whyValuable":"新品类 × 既有智能家居积累是本频道独占的交叉点：开箱人人能拍，「把眼镜变成全屋智能的眼睛」目前没有对标竞品。","polished":"AI 眼镜是 2026 下半年新品类密度最高的赛道：大狸子切切里「没摄像头，没外放，这叫智能眼镜？｜雷鸟iO智能眼镜上脸体验」实查 62.7 万，反问式标题直接制造认知差——「这应该是我用过最AI的AI眼镜」（web_reader 页面确认）；电丸科技AK 的千问AI眼镜 N1 Pro 实查 42.5 万，一个「小鼻托」细节就能撑起一支片。新品类期的观众心理是「我该不该上车」，第一现场内容天然吃香。但本频道的差异化入口不在开箱，而在交叉地带：把带摄像头的眼镜接进 Home Assistant，让「看到」成为「触发」——眼镜看见快递员进小区，门口摄像头开始录制；看见猫跳上桌子，喂食器推送一条消息；出门在外说一句话，家里的场景照常执行。这条创意是「把全屋智能交给大模型」的天然下集：上次是灯归大模型管，这次是眼睛。若拍成视频，标题可以就叫「我把 AI 眼镜接进了全屋智能：它看到什么，就触发什么」。","tags":["AI眼镜","智能家居","新品类","延伸创意"],"effort":"周末级","id":"a475"},{"kind":"项目灵感","title":"HowToLiveBetter（高性价比人生指南）：767 条「花最少换最多」的生活决策库，Claude Code 协助编写","url":"https://github.com/eternity4719/HowToLiveBetter","source":"GitHub · eternity4719/HowToLiveBetter","date":"2026-11","summary":"767 条覆盖急救、省钱、法律红线、医保社保、婚育出国的建议，每条写明成本、收益与证据等级，只引期刊论文和官方文件；网页/EPUB/PDF/Anki 全免费，还自带一个会引用到「第几节第几条」的 AI 问答 skill。","takeaways":["类型：知识库/开源项目 · 成本：免费（CC BY 4.0）· 可行性：网页打开即用","72729 stars · 2026-09-07 创建 · 果麦文化 2026-10 出官方电子书，网页版照旧免费最快更新","767 条建议，证据分级 A 495 / B 220 / C 52，全书挂 2531 条原始文献链接","自带 Claude Code/Codex skill：先查书再回答，并注明出自第几节第几条"],"whyValuable":"把「过好一生」做成证据分级的开放数据库，「每条写明花掉什么、换回什么、证据有多硬」的写法可直接复用到任何垂直知识库。","polished":"十月底中文互联网最猛的黑马：一份 767 条的《高性价比人生指南》，9 月初开仓，已冲到 7.2 万星。它讲怎么活得久、怎么少生病、出了意外怎么急救，也讲失业了能领什么、开店开公司要办什么手续、恋爱结婚生孩子的关键决策——所有制度类内容按中国大陆现行规定写。真正让它立住的是方法论：每条建议都写明「花掉什么、换回什么、证据有多硬」，证据分 A/B/C 三级（A 级 495 条、B 级 220 条、C 级 52 条），全书挂 2531 条原始文献链接，只引期刊论文和官方文件，少数官方不公开的案件引署名报道并附网页存档。CC BY 4.0 全免费：网页版可搜索、支持离线，另有 EPUB、PDF 和 Anki 牌组下载；果麦文化 10 月出了官方电子书，仓库网页版照旧最快更新。最妙的是作者把 AI 用法也做进去了：仓库自带一个 Claude Code/Codex skill，装上后问「替朋友担保签不签」，它先查书里的条目再回答，并注明出自第几节第几条。README 里还堂堂正正挂着「Claude Code 协助编写」的徽章——这本书本身就是一个「人定框架和标准、AI 批量成稿、逐条挂证据」的写作案例。想借鉴的不止内容：这套「证据分级 + 全部挂原始出处」的写法，套到任何垂直领域都是一份可直接抄的模板，包括自己的情报类项目。","tags":["知识库","生活指南","Claude Code","证据分级","CC BY 4.0"],"effort":"一晚级","id":"a476"},{"kind":"项目灵感","title":"laya：不生成文字的 AI——33 毫秒给出结构化决定的 System 1 决策引擎","url":"https://github.com/NandhaKishorM/laya","source":"GitHub · NandhaKishorM/laya","date":"2026-11","summary":"非自回归决策小模型：choice/score/yes-no 三种类型化决策一次前向 33ms 出结果，跨 100+ 语言，RLCD 强化学习训练；9-10 月带动 kev、Jev、laya-mlx 一整批「决策模型」生态爆发。","takeaways":["类型：模型/开源项目 · 成本：免费开源（Apache-2.0）· 可行性：pip install laya","34890 stars · 2026-09-18 创建 · choice/score/yes-no 类型化决策，单次前向 33ms","配套齐整：MCP server、LangChain、LlamaIndex、CrewAI、ONNX、浏览器端 laya-ts、HF demo Space","生态爆发：jaredpalmer/kev、M3 Max 上 7–14ms 的 laya-mlx、awesome-jev 清单等接力出现"],"whyValuable":"展示了一条与「大模型生成文本」完全相反的路线：小模型只做决定，快两个数量级——agent 工程里所有路由、分类、打分环节的直接替代品。","polished":"今年九、十月 agent 圈最值得盯的技术分歧：当所有人都在把大模型往更长文本、更多推理卷的时候，一条完全反向的路线悄悄爆发——不生成任何文字，只做决定。laya 是这条路线的旗手：一个非自回归的「System 1 决策引擎」，输入文本加一组类型化问题，一次前向 33 毫秒内给出结构化答案——该路由到哪个部门（choice）、紧急程度打几分（score）、用户有没有威胁退订（yes/no 概率）。单模型跨 100+ 语言，用严格正则评分规则加强化学习（RLCD）训练，置信度低的字段可按 schema 直接返回空。它是独立开发者 NandhaKishorM 的作品，dev.to 上有篇自带戏剧性的自述：一年前做了非自回归决策模型，随后一家 frontier lab 拿出了同路线的产品——而这个 3.5 万星仓库就是先行者的完整开源版：pip install laya 即用，附 MCP server、LangChain、LlamaIndex、CrewAI、ONNX、浏览器端 laya-ts 全家桶，Hugging Face 有 demo Space 可零安装试玩。围绕它和 Jev（TypeSafe AI 的同类决策模型）已经长出一圈生态：jaredpalmer 的 kev、M3 Max 上 7–14 毫秒的 laya-mlx、awesome-jev 清单、jev-chat-jarvis 等一批衍生项目。对 agent 工程师来说，凡是「分类、路由、打分」这类不需要模型开口说话的环节，都值得测一次这条 33 毫秒路线——这也是「agent 成本砍半」最现实的下刀处。","tags":["决策模型","System 1","非自回归","推理加速","agent 路由"],"effort":"周末级","id":"a477"},{"kind":"项目灵感","title":"anatomy：让 Claude 把抽象概念造成一台「真的会转」的等距机械插图","url":"https://github.com/wheresryan22/anatomy","source":"GitHub · wheresryan22/anatomy","date":"2026-11","summary":"一个 Claude skill：让 agent 把要讲的概念变成一台可交互的等距机器——缓存键是弹子锁，Raptor 2 发动机悬停可拆成 11 个组件，SVG+WebGL 零依赖纯代码输出，MIT 协议 24k 星。","takeaways":["类型：Agent Skill · 成本：免费（MIT）· 可行性：npx skills add 即装","24090 stars · 2026-10-08 创建 · Node ≥20.10 · 零依赖，输出全是 SVG + WebGL 纯代码页面","示例是硬货：Raptor 2 试车台、水波干涉教具、千分表、3D 转盘（beta，约 90 部件逐帧重投影）","兼容 Claude Code/Codex/Antigravity/OpenCode/MiniMax Code，走 Agent Skills 标准"],"whyValuable":"把「讲清楚一件事」的工具从剪辑软件换成会写代码的 agent，连插画正确性都有审计——示例页面自证「拆开后任何一帧没有管线穿过别的部件」。","polished":"agent skill 里少见的「作品型选手」：2.4 万星、MIT 协议、零依赖，只干一件事——把要讲的概念造成一台真的会动的等距机械装置。给它一个技术概念，它会发明一件「工作原理即是概念本身」的实物：缓存失效键是一把只有内容没变才转得动的弹子锁；Raptor 2 发动机悬在试车台上，悬停可拆成 11 个组件，点火时尾焰用 WebGL 着色器在同一等距相机里喷出来；水波干涉是一台带灯光与焦散投影的教具波槽；还有 beta 的 3D 模式，拖动密码拨盘，约 90 个零件逐帧重投影重着色。输出的全部是 SVG 加 WebGL 的纯代码页面，Node 20.10 以上、零依赖，npx skills add 一行安装，Claude Code、Codex、Antigravity、OpenCode、MiniMax Code 都能跑。最讲究的是它自带「审计」：示例页面会证明拆开状态与每一帧过渡里没有任何管线穿过别的部件——把工程正确性检查做进了插画里，截图全部用 skill 自己的 capture/drive 脚本捕获，examples 目录的成品页直接可开。对做讲解内容的人来说，这是把 Motion Canvas、anything2explainer 那条「代码生成动画」路线再往精致推一格的参照物：不是画图给 agent 看，而是让 agent 像器械师一样造图解——下一步就该轮到「给魔方二阶段算法造一台会转的等距机器」了。","tags":["Agent Skill","科普可视化","SVG","WebGL","等距插图"],"effort":"一晚级","id":"a478"},{"kind":"项目灵感","title":"青简 Qingjian：候选词旁永远多一行译词的拼音输入法，Rust 写的","url":"https://github.com/qingjian-team/qingjian","source":"GitHub · qingjian-team/qingjian","date":"2026-11","summary":"把语言学习缝进日常打字的输入法：照常打拼音选候选，每条候选旁多一行当前学习语言（英/日/西/越/德）的译词；整句输入、双拼、五笔、本地整句模型全都有，全本机处理、无账号。","takeaways":["类型：桌面软件 · 成本：免费（GPL-3.0）· 可行性：官网下载安装即用","7498 stars · 2026-09-07 创建 · Rust · macOS 13+/Win10-11/Linux Fcitx/Android 预览版","学习语言五选一：英语、日语、西班牙语、越南语、德语，可随时关闭译词","隐私在线：拼音转换/词库/统计全本机，云联想默认关闭，开启也只连自己填的服务商"],"whyValuable":"把输入法这个每天碰几万次的人口入口变成沉浸式词汇学习位，产品思路和工程实现（Rust 跨四端）都值得学。","polished":"七千多星的输入法项目，Rust 写的，名字起得极雅：青简。它的核心创意一句话能讲完——好好输入，顺便多认识一个词。你照常打拼音、选候选、写整句，唯一的区别是每条候选旁边多一行小字译词：打「开发」旁边站着 development，打「编程」旁边是 programming。学习语言五选一：英语、日语、西班牙语、越南语、德语，一次只显示一种，随时可以关掉——译词永远是辅助信息，不抢你要输入的正文。别以为它只是个创意玩具：整句输入、简拼、拼写纠错、双拼、五笔全都支持，停顿后还有本地整句模型重排句子候选；「统计」页记着今天、近 7 天和累计的输入量与词汇记录。覆盖面也齐：macOS、Windows 官方安装包直装，Linux 提供 Fcitx4/5 源码安装，Android 预览版 APK 在 Releases 里。隐私处理教科书级：拼音转换、词库查询、习惯学习、输入统计全在本机完成，不要账号，云联想默认关闭，开启后也只连你自己填的服务商。GPL-3.0 开源，官网 qingjian.app 有完整文档。对天天被单词 App 打卡绑架的人，这种「把学习缝进每天几万次无意识动作」的设计才是真正不消耗意志力的方案；对开发者，它也是一个完整的 Rust 跨四端输入法实现，从引擎到系统接线全是现成教材。","tags":["输入法","Rust","语言学习","跨平台","隐私"],"effort":"一晚级","id":"a479"},{"kind":"项目灵感","title":"gpu-unlock：一行内核参数，把 GeForce 被砍半的 tensor core 速度还回来","url":"https://github.com/Zagitta/gpu-unlock","source":"GitHub · Zagitta/gpu-unlock","date":"2026-11","summary":"NVIDIA 给 GeForce 的 FP16/BF16/TF32 tensor 数学锁了半速，专业卡才全速；这个项目开机时在官方驱动加载前解除封印：最高 2× tensor 吞吐、+25–55% LLM prefill，Ampere 30 系已有 100+ 用户实测报告。","takeaways":["类型：硬件解锁工具 · 成本：免费（README 标注 GPL-2.0）· 可行性：make install + 内核参数，仅 Linux","14583 stars · 2026-10-18 创建 · 支持 RTX 20/30/40：Ampere 稳定，Ada/Turing 实验性，50 系不支持","不改驱动不刷 VBIOS，NVIDIA 发新驱动也不失效；解锁配方按 PCI ID 写在 kernel/gpu_unlock/recipes.c","实测收益：2× FP16/BF16/TF32、+25–55% prefill、+25–50% 微调、+30–55% 图像生成"],"whyValuable":"「同一种硅，按软件分级卖」的产业秘密被社区实锤破解——本地大模型玩家不换卡白拿一倍性能，也是现成的硬件科普选题素材。","polished":"十月中下旬硬件圈最炸的消息：你的 GeForce 跑 AI 只有半速，而这不是驱动 bug，是产品分级。GeForce 的 tensor core 在 FP16、BF16、TF32（FP32 累加）这三种 AI 训练和非量化推理最吃的数学上被锁了一半速率，同样的硅片换个名字卖成 RTX A 系列或专业卡就是全速。gpu-unlock（1.4 万星）做的事是：开机时、在官方驱动加载之前把这道封印解除——不改驱动、不刷 VBIOS，NVIDIA 发新驱动也不失效，固件片段只是从官方驱动包里提取的。安装两步：clone 仓库 make install，再往内核启动参数加一行 gpu_unlock.targets=all。收益有实测表：tensor 吞吐最高翻倍，LLM prefill +25–55%，微调 +25–50%，图像生成 +30–55%。支持 RTX 20/30/40 三代：30 系 Ampere 最稳（100+ 用户报告），40 系和 20 系还是实验性，50 系 Blackwell 不支持；笔记本独显休眠会静默重置解锁，得关掉运行时电源管理，结果因机型而异。两个门槛要讲清楚：仅 Linux，Windows 用户暂时无解；README 的 FAQ 里作者专门辟谣「没有网站、没有一键安装包」，认准仓库本体。对本地大模型玩家这是不换卡白拿的性能；对内容创作者，「同一种硅按软件分级卖」本身就是一条现成的深度科普选题——仓库的 benchmarks 表和 recipes.c（各卡解锁配方）就是全部素材。","tags":["GPU","NVIDIA","本地大模型","硬件解锁","Linux"],"effort":"周末级","id":"a480"},{"kind":"项目灵感","title":"esp32-iphone-agent：一块 7 美元 ESP32-S3，让 AI 亲手操作真 iPhone","url":"https://github.com/onehumanbeing/esp32-iphone-agent","source":"GitHub · onehumanbeing/esp32-iphone-agent","date":"2026-11","summary":"不越狱、不连电脑：ESP32-S3 一边当 AirPlay 接收器做「眼睛」，一边扮 USB HID 鼠标键盘做「手」，视觉模型在手机自己的 App 里看屏幕、算坐标、点按滑动，替你设闹钟、操作 App。","takeaways":["类型：硬件+Agent · 成本：约 $7（XIAO ESP32S3）· 可行性：按 README 接线即可复现","4236 stars · 2026-10-11 创建 · MIT · iOS 18+ · v0.2 起连电脑都省了，agent 直接跑在手机 App 里","眼睛：板子开自带热点收 AirPlay 镜像，H.264 直通解码；手：USB HID 注入点击滑动，BLE 传指令","README 显眼警告：只按 README 步骤装，勿跑 issue/评论区来路不明的一键安装命令"],"whyValuable":"把「AI 用手机」的门槛从越狱/云手机拉到一块开发板——是摄像头之外的另一条眼手通路，与「给 AI 当手」的拍摄线无缝衔接。","polished":"「让 AI 用手机」这件事，别人在云手机和越狱里卷，这位作者只花了一块 7 美元的 ESP32-S3。esp32-iphone-agent 的方案漂亮得像绕口令：板子同时扮演两个角色——当「眼睛」时，它开一个自己的 Wi-Fi 热点伪装成 AirPlay 接收器，iPhone 把屏幕镜像投给它，H.264 直通解码；当「手」时，它通过 USB HID 扮成鼠标键盘，接指令注入点击和滑动。而大脑根本不在电脑里：v0.2 起整个 agent 就跑在 iPhone 自己的一个 App 里，通过 BLE 给板子发命令——不越狱、不连电脑，一块板子一部手机就齐活。演示视频里那句「设一个周一和周二重复的 8 点闹钟」，agent 会自己退出 App、打开时钟、拨滚轮、勾星期、保存；仓库里还有专门的指针校准界面截图，把「agent 看到的画面」和真机画面并排展示。MIT 协议，iOS 18+，接线、校准、复现步骤全写清了，官方 YouTube 有完整演示。两个加分细节：README 用显眼的 WARNING 提醒只按 README 操作、别跑 issue/评论区里来路不明的一键安装命令——这类爆火项目的安全提示值得原样搬进视频；作者还要求任何二创保留署名。对拍过「给 AI 当手」那条线的作者来说，这是摄像头之外第二条眼手通路：真机、真 App、成本一顿饭钱，下一期实测素材齐了。","tags":["ESP32","iPhone","AI Agent","硬件","USB HID"],"effort":"周末级","id":"a481"},{"kind":"项目灵感","title":"DiPlay：不越狱不插盒子，比亚迪车机直接跑无线 CarPlay","url":"https://github.com/shihabal3amri/DiPlay","source":"GitHub · shihabal3amri/DiPlay","date":"2026-11","summary":"装在车机上的独立 APK：有线+无线 CarPlay，还能把导航箭头和路名投到 HUD；不用越狱、加密狗、Mac 和认证服务器，v0.2.22 公测，专攻比亚迪 DiLink 车机，GPL-3.0 开源 1.3 万星。","takeaways":["类型：车机应用 · 成本：免费（GPL-3.0）· 可行性：车机允许装 APK 即可试","13104 stars · 2026-09-24 创建 · Kotlin · Android 7.0+ · v0.2.22 公开预览","无线三通道：Wi-Fi Direct / 车机热点 / 同局域网；HUD 导航箭头与路名已在验证固件上实测","透明声明：捆绑从 Carlinkit 公开固件恢复的实验性配件身份，非官方 MFi，边界全写进 README"],"whyValuable":"一份诚实到把法律边界写进 README 的逆向工程：怎么在苹果封闭体系里给特定车型撕开口子，以及公测+社区反馈驱动的迭代样本。","polished":"比亚迪车主的年度项目：DiPlay 把官方一直没给的 CarPlay 装进了 DiLink 车机。装在车上的独立 APK，不用越狱、不用加密狗、不用 Mac、不用任何认证服务器——有线、无线 CarPlay 都能跑，还能把导航箭头、距离和路名投到 HUD 抬头显示上。无线支持三条通道：Wi-Fi Direct、车机自带热点、同局域网；v0.2.22 公测版带音频缓冲优化、诊断导出和「成功过的配置自动记忆」，车机热点一开就能拉起 CarPlay。支持 Android 7.0+ 的车机，项目主页有截图和下载，开发者在自己 DiLink5.1 的实车上调试。它是那种「把法律边界写进 README」的诚实项目：明确声明这不是 Apple 认证产品，APK 里捆绑的是从 Carlinkit（卖 CarPlay 盒子的厂商）公开固件里恢复的实验性配件身份，不是新申请的 MFi 身份，私钥可提取；未来 iOS 更新后能否过认证、不同车机固件上稳不稳，全都写明「未解决，欢迎社区测试」。GPL-3.0 开源，Kotlin 写的，1.3 万星。对做智能硬件内容的作者，这是比「手机投屏车机」深一层的题材：CarPlay 协议如何被逆向、MFi 认证墙怎么被绕开、一个独立开发者怎么用公测加社区反馈的方式迭代一个涉及驾驶安全的软件——每一步都有内容可拍。","tags":["车机","CarPlay","比亚迪","逆向工程","Kotlin"],"effort":"周末级","id":"a482"},{"kind":"延伸创意","title":"给终末地情报站「去 AI 味」：用 unslop 把文摘界面从 vibecoded 拉回设计感","url":"https://github.com/heydamir/unslop","source":"延伸创意 · 基于 heydamir/unslop + 终末地文摘站（自有项目）","date":"2026-11","summary":"unslop 是专治「AI 味界面」的 agent skill：先审计紫色渐变、发光、emoji 图标这些 slop 特征，再按间距→颜色→图标→文案→排版的固定顺序逐 pass 重做，还能渲染一段界面「自我改造」的 10 秒视频。","takeaways":["类型：自有站点改造 · 成本：零（skill 免费安装）· 可行性：一晚级","6141 stars · 2026-10-29 创建 · CC BY 4.0 · Claude Code/Codex 通吃，甚至能直接改一个线上链接","九个 pass 有固定顺序：间距、颜色、图标、文案、字体、布局、细节、视觉、动效","自带 story video：Playwright 截帧 + ffmpeg，渲染界面逐帧 unslop 自己，天然视频素材"],"whyValuable":"文摘站是 agent 生成的典型 vibecoded 界面——拿一个专治 AI 味的 skill 反向收拾自己 AI 造的站，改造过程本身就能成片。","polished":"自己 AI 造的站，终于有人专门治这个了。unslop（6.1k 星，CC BY 4.0）是 @heydamir 开源的 agent skill，专治「vibecoded 界面」——那些紫色渐变、到处发光、emoji 当图标、营销腔文案、忽大忽小间距的 AI 味页面，作者在 X 上连载的 Unslopping 系列就是它的原型。工作流是个标准设计评审：先 Audit，列出页面上每一处 slop 及其位置；再定 Direction，从你的产品本身提炼性格、世界观和一两个记忆点；然后按固定顺序逐 pass 重做：间距、颜色、图标、文案、字体、布局、细节、视觉、动效。它不挑技术栈，Next.js/React/Vue/Svelte/纯 HTML 都行，甚至只给一个线上链接也能直接改；改之前先出方案征求意见，页面本身不错时它会直说并只做小幅微调。还有个彩蛋：用 Playwright 截帧加 ffmpeg，渲染一段 10 秒内方形视频，画面里界面逐帧「自我去 AI 味」——天然是社交平台素材。落地到我自己的终末地文摘站和 digest 页面再合适不过：这批页面就是 agent 生成的典型 vibecoded 产物。步骤：clone 仓库把 skill 拷进 ~/.claude/skills，对 digest_index.html 跑一遍 /unslop，先看 Audit 报告再决定改多少；顺手把「AI 造的站被另一个 AI 去味」的全过程录下来，又是一条现成的视频。","tags":["去 AI 味","UI 设计","Agent Skill","文摘站","自有项目"],"effort":"一晚级","id":"a483"},{"kind":"视频选题","title":"只给 AI 一张照片，它能不能算出我在哪个街区？geo-sleuth 定位能力实测","url":"https://github.com/Oldcircle/geo-sleuth","source":"选题调研 · 基于 Oldcircle/geo-sleuth（5615 stars）","date":"2026-11","summary":"这个 skill 用 OSM 几何、高程天际线匹配和卫星图证据链给照片定位，README 招牌案例是「没有文字、没有车牌、没有地标，仅凭一座桥一座山，定位到 2 米内」——拿来做成三档难度的实测视频正合适。","takeaways":["类型：AI 实测挑战 · 成本：零 · 可行性：周末级（npx skills add 即装）","5615 stars · 2026-09-18 创建 · MIT · Python 3.10+ · Claude Code/Codex/Cursor/Gemini CLI 通吃","证据链可视化：区域扫描→天际线叠加→卫星证据图，输出相机坐标与朝向，天生分镜素材","难度阶梯：地标照→无文字街景→纯自然风光，最后一档适合直播盲测"],"whyValuable":"GeoGuessr 式看图猜位置是 B 站验证过的流量题型，把人肉解题换成 agent 证据链推理，「把推理过程摊开」就是与人类玩家最大的差异点。","polished":"GeoGuessr 式看图猜位置在 B 站验证过流量，但让 AI 来做、并且把推理链全部摊开，还没有人认真拍过——这就是这条选题的差异化。geo-sleuth（5.6k 星，MIT）是一个照片地理定位的 agent skill：npx skills add Oldcircle/geo-sleuth 一行安装，之后把照片丢给 agent 说一句「find where this photo was taken」，它会读 SKILL.md 自己跑脚本：OpenStreetMap 几何匹配、高程与天际线比对，最后交回相机坐标、朝向和一张卫星证据图。README 的招牌案例没有任何文字、车牌和地标——只有一座桥和一座山——定位到 2 米内；证据链全程可视化：区域扫描图、天际线叠加图、卫星证据图，天生就是分镜素材。视频结构建议三档难度递进：第一档有地标的照片，考「AI 会不会偷懒认地标」；第二档街景无文字，看 OSM 几何匹配的功力；第三档纯自然风光直播盲测，把 agent 的中间推理截图当「证据板」贴出来，观众跟着一起猜，评论区开竞猜。安全垫一句：内容定位成「AI 定位能力的边界实测」，结尾提醒观众照片元数据与背景细节的隐私意识。成本几乎为零，周末级可完成，正好接上「AI 实测挑战」这条内容线的下一期，install 时记得先跑它自带的 doctor.py 体检脚本。","tags":["AI 实测","地理定位","OSINT","视频选题","GeoGuessr"],"effort":"周末级","id":"a484"},{"kind":"视频选题","title":"2.9 GiB 内存跑 35B 大模型？Edge0 的 SSD 专家流式方案实测","url":"https://github.com/Edge0-AI/Edge0","source":"选题调研 · 基于 Edge0-AI/Edge0（8951 stars）","date":"2026-11","summary":"Edge0 用「SSD 专家卸载 + Recover-LoRA + 预路由器」把 35B MoE 的峰值内存压到 2.9 GiB——权重躺在 SSD 里，训练过的小路由器提前预测该加载哪些专家；有 arXiv 技术报告背书，四端推理引擎已开源。","takeaways":["类型：本地 AI 实测 · 成本：零（模型开源）· 可行性：周末级，官方 Mac mini M4 Pro 数据可对照","8951 stars · 2026-09-08 创建 · Apache-2.0 · arXiv 2609.18063 · HF/ModelScope 双渠道模型","官方数字：35B 档 14.9–17.7 tok/s@2.9 GiB；8B 档约 24 tok/s@1.0 GiB；4-bit 权重约 23GB/4.2GB","iOS/macOS/Android/Windows 四端引擎已开源，统一框架在路线图上（Q4 2026）"],"whyValuable":"内存墙是本地大模型最大门槛，这个反常识方案（不堆内存，去猜要加载什么）既有论文又有实测数据，正好接上二手卡横评的本地 AI 线。","polished":"本地大模型的头号门槛是内存墙：35B 的模型权重几十 GB，内存不够一切免谈。Edge0 的反常识答案是——别堆内存，去猜。这个 9 月初开源的流式 MoE 推理框架（8.9k 星，Apache-2.0，有 arXiv 2609.18063 技术报告）把专家权重整个放在 SSD 上，跑的时候只把当前激活的专家集搬进内存：一个训练过的 prerouter（预路由器）提前预测接下来会用到哪些专家，让它们在需要之前就从 SSD 预取到位，配合 Recover-LoRA 修正卸载带来的精度损失。官方实测：35B 档（Edge0-35B-A3B）在 Mac mini M4 Pro 上峰值内存只要 2.9 GiB，解码 14.9–17.7 tok/s；8B 档 1.0 GiB、约 24 tok/s。9 月底四端引擎已开源：iOS、macOS、Android、Windows，模型在 Hugging Face 和 ModelScope 双渠道（4-bit 权重约 23GB / 4.2GB），国内下模型走 ModelScope 无障碍。视频做实测正合适：找一台 8GB 内存的老 Mac 或旧手机装 Edge0-8B，对照官方数字跑分，再把 prerouter 的原理讲成人话——「它在猜你下一个词要用大脑的哪一部分，猜中了就不卡」。这个选题接得上之前二手卡横评的本地 AI 线，标题本身就是传播点：2.9 GiB 跑 35B。风险提示进视频：SSD 读速和预取命中率决定体验，机械硬盘党先劝退。","tags":["本地大模型","MoE","SSD 卸载","实测","推理优化"],"effort":"周末级","id":"a485"}];
var KINDS = [
  { key: '项目灵感', en: 'PROJECT IDEAS', cls: 'k-project', badge: 'kb-project' },
  { key: '延伸创意', en: 'EXTENSIONS', cls: 'k-ext', badge: 'kb-ext' },
  { key: '视频选题', en: 'VIDEO TOPICS', cls: 'k-video', badge: 'kb-video' }
];
var state = { q: '', tag: null };

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// 标签统计（按出现次数降序，同次数按首现顺序）
var tagCount = {}, tagFirst = {};
IDEAS.forEach(function (it, i) {
  (it.tags || []).forEach(function (t) {
    if (!(t in tagCount)) { tagCount[t] = 0; tagFirst[t] = i; }
    tagCount[t]++;
  });
});
var tagList = Object.keys(tagCount).sort(function (a, b) {
  return tagCount[b] - tagCount[a] || tagFirst[a] - tagFirst[b];
});

function matches(it) {
  if (state.tag && (it.tags || []).indexOf(state.tag) < 0) return false;
  if (!state.q) return true;
  var hay = [it.title, it.source, it.date, it.effort, it.summary, it.whyValuable,
    (it.takeaways || []).join('\n'), (it.tags || []).join(' '), it.polished || ''].join('\n').toLowerCase();
  return hay.indexOf(state.q) >= 0;
}

function card(it, badge) {
  var title = esc(it.title);
  var h3 = it.url
    ? '<h3><a href="' + esc(it.url) + '" target="_blank" rel="noopener">' + title + ' &nearr;</a></h3>'
    : '<h3>' + title + '</h3>';
  var tagsMini = (it.tags || []).map(function (t) { return '<span class="tmini">' + esc(t) + '</span>'; }).join('');
  return '<article class="card">' +
    '<div class="top"><span class="kbadge ' + badge + '">' + esc(it.kind) + '</span>' +
    '<span class="id">' + esc(it.id) + '</span></div>' +
    h3 +
    '<div class="meta"><span>' + esc(it.date) + '</span><span>' + esc(it.source) + '</span>' +
    (it.effort ? '<span class="effort">⏱ ' + esc(it.effort) + '</span>' : '') + '</div>' +
    '<p class="summary">' + esc(it.summary) + '</p>' +
    '<ul class="uls">' + (it.takeaways || []).map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' +
    '<div class="why"><b>WHY IT MATTERS</b>' + esc(it.whyValuable) + '</div>' +
    '<div class="tags-mini">' + tagsMini + '</div>' +
    (it.polished ? '<details><summary>▸ 展开全文</summary><div class="full">' + esc(it.polished) + '</div></details>' : '') +
    '</article>';
}

function render() {
  var main = document.getElementById('main');
  var hit = 0, html = '';
  KINDS.forEach(function (k) {
    var items = IDEAS.filter(function (it) { return it.kind === k.key && matches(it); });
    hit += items.length;
    if (!items.length) return;
    html += '<section class="' + k.cls + '">' +
      '<div class="sec-head"><h2>' + k.key + ' <span class="en">// ' + k.en + '</span></h2>' +
      '<span class="sec-count">' + items.length + ' 条</span></div>' +
      '<div class="grid">' + items.map(function (it) { return card(it, k.badge); }).join('') + '</div></section>';
  });
  if (!hit) html = '<div class="empty">[ 无匹配条目 ] 换个关键词或清除标签试试</div>';
  main.innerHTML = html;
  document.getElementById('hit').textContent = hit;
}

// 标签筛选条
var tagsBox = document.getElementById('tags');
var allBtn = '<button class="tag on" data-tag="">全部 <span class="n">' + IDEAS.length + '</span></button>';
var chips = tagList.map(function (t) {
  return '<button class="tag" data-tag="' + esc(t) + '">' + esc(t) + ' <span class="n">' + tagCount[t] + '</span></button>';
}).join('');
tagsBox.innerHTML = allBtn + chips;
tagsBox.addEventListener('click', function (e) {
  var btn = e.target.closest('.tag');
  if (!btn) return;
  state.tag = btn.getAttribute('data-tag') || null;
  Array.prototype.forEach.call(tagsBox.children, function (b) {
    b.classList.toggle('on', (b.getAttribute('data-tag') || null) === state.tag);
  });
  render();
});
document.getElementById('q').addEventListener('input', function (e) {
  state.q = e.target.value.trim().toLowerCase();
  render();
});

render();
</script>
