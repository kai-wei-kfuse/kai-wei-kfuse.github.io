<!DOCTYPE html>
<html lang="zh-CN">

<title>灵感仓库 · IDEAS ARCHIVE</title>
<style>
:root{
  --bg:#0a0a0b; --panel:#131315; --panel2:#19191c; --line:#2b2b30; --line-hi:#3d3d44;
  --yellow:#ffe14d; --yellow-deep:#f5c518; --text:#e9e7de; --dim:#9b988c; --faint:#6d6b62;
  --kind-project:#ffe14d; --kind-ext:#7ef0c8; --kind-video:#ff9e64;
  --mono:"Cascadia Code","JetBrains Mono",Consolas,"Courier New","Noto Sans SC","Microsoft YaHei",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--mono);line-height:1.65;font-size:14px}
a{color:var(--yellow);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:var(--yellow);color:#000}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px}
/* 顶部：黄黑警示条 + 标题区 */
.hazard{height:8px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 14px,#0a0a0b 14px 28px)}
header.hero{background:var(--panel);border-bottom:1px solid var(--line);padding:34px 0 26px;position:relative}
.hero .wrap{padding-bottom:0}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.back{font-size:12px;letter-spacing:.12em;color:#000;background:var(--yellow);padding:6px 14px;display:inline-block;
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));font-weight:700}
.back:hover{background:#fff;text-decoration:none}
h1{font-size:26px;letter-spacing:.06em;margin:18px 0 6px;font-weight:800}
h1 .en{color:var(--yellow)}
.sub{color:var(--dim);font-size:12.5px;letter-spacing:.05em}
.sub b{color:var(--text)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.stat{background:var(--panel2);border:1px solid var(--line);padding:8px 14px;font-size:12px;color:var(--dim);
  clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
.stat b{color:var(--text);font-size:15px;margin-right:6px}
.stat.k1 b{color:var(--kind-project)} .stat.k2 b{color:var(--kind-ext)} .stat.k3 b{color:var(--kind-video)}
/* 控制条 */
.controls{position:sticky;top:0;z-index:50;background:rgba(10,10,11,.96);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);padding:14px 0}
.controls .wrap{padding-bottom:0}
.ctl-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#q{flex:1;min-width:240px;background:var(--panel2);border:1px solid var(--line-hi);color:var(--text);
  font-family:var(--mono);font-size:13px;padding:9px 14px;outline:none}
#q:focus{border-color:var(--yellow)}
#q::placeholder{color:var(--faint)}
.count{font-size:12px;color:var(--dim);white-space:nowrap}
.count b{color:var(--yellow)}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tag{cursor:pointer;user-select:none;font-size:11.5px;letter-spacing:.04em;color:var(--dim);
  border:1px solid var(--line-hi);background:transparent;padding:4px 11px;font-family:var(--mono);transition:all .12s}
.tag:hover{color:var(--text);border-color:var(--yellow)}
.tag.on{background:var(--yellow);color:#000;border-color:var(--yellow);font-weight:700}
.tag .n{opacity:.6;margin-left:4px}
/* 分区 */
section{margin-top:44px}
.sec-head{display:flex;align-items:baseline;gap:14px;border-left:4px solid var(--yellow);padding-left:14px;margin-bottom:6px}
section.k-ext .sec-head{border-color:var(--kind-ext)}
section.k-video .sec-head{border-color:var(--kind-video)}
h2{font-size:19px;letter-spacing:.08em;font-weight:800}
h2 .en{color:var(--dim);font-size:12px;letter-spacing:.15em;font-weight:400}
.sec-count{font-size:12px;color:var(--dim)}
.sec-desc{color:var(--faint);font-size:12px;padding-left:18px;margin-bottom:18px}
/* 卡片网格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);padding:18px 18px 14px;position:relative;
  clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));
  transition:background .12s,border-color .12s;display:flex;flex-direction:column;gap:10px}
.card:hover{background:var(--panel2);border-color:var(--line-hi)}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kbadge{font-size:10.5px;letter-spacing:.1em;padding:2px 8px;border:1px solid;font-weight:700}
.kb-project{color:var(--kind-project);border-color:var(--kind-project)}
.kb-ext{color:var(--kind-ext);border-color:var(--kind-ext)}
.kb-video{color:var(--kind-video);border-color:var(--kind-video)}
.id{font-size:10.5px;color:var(--faint);letter-spacing:.08em}
.card h3{font-size:15px;line-height:1.5;font-weight:700}
.card h3 a{color:var(--text)}
.card h3 a:hover{color:var(--yellow)}
.meta{font-size:11px;color:var(--faint);display:flex;gap:8px;flex-wrap:wrap;letter-spacing:.03em}
.effort{color:var(--yellow-deep)}
.summary{font-size:12.5px;color:#c9c6ba}
.why{border-left:3px solid var(--yellow);background:rgba(255,225,77,.05);padding:8px 12px;font-size:12px;color:var(--dim)}
.why b{color:var(--yellow);font-size:10.5px;letter-spacing:.1em;display:block;margin-bottom:2px}
.uls{font-size:12px;color:#b8b5a9}
.uls li{margin-left:16px;margin-bottom:3px}
.uls li::marker{color:var(--yellow)}
.tags-mini{display:flex;gap:6px;flex-wrap:wrap}
.tmini{font-size:10.5px;color:var(--dim);border:1px dashed var(--line-hi);padding:1px 7px}
details{border-top:1px dashed var(--line);padding-top:8px}
details summary{cursor:pointer;font-size:11px;color:var(--dim);letter-spacing:.1em;user-select:none}
details summary:hover{color:var(--yellow)}
details .full{font-size:12.5px;color:#c9c6ba;margin-top:8px;white-space:pre-wrap}
.empty{color:var(--faint);font-size:12.5px;padding:30px 0;text-align:center;letter-spacing:.1em}
footer{margin-top:70px;border-top:1px solid var(--line);padding-top:18px;font-size:11.5px;color:var(--faint);
  display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media (max-width:560px){ h1{font-size:20px} .grid{grid-template-columns:1fr} }
</style>
</head>

<script>
var IDEAS = [{"kind":"项目灵感","title":"RubiksCube-TwophaseSolver（Kociemba 二阶段算法 Python 权威实现）","url":"https://github.com/hkociemba/RubiksCube-TwophaseSolver","source":"GitHub · hkociemba/RubiksCube-TwophaseSolver","date":"2026-11","summary":"魔方算法祖师爷 Kociemba 本人的官方实现，平均不到 19 步复原任意状态，纯 Python 可跑。既是魔方玩家的算法圣经，也是少有的 Python 学习者能完整读懂的漂亮代码。","takeaways":["类型：算法学习/开源项目体验 · 成本：免费 · 可行性：clone 即可跑","765 stars · GPL-3.0 · 作者 Herbert Kociemba 本人维护（2026-07 仍有更新）","平均 \u003c19 步求解任意打乱状态，二阶段算法核心实现","源码即教材：坐标系建模、剪枝表、迭代加深搜索一条龙"],"whyValuable":"算法的『命名者本人维护的权威实现』，且是纯 Python 能读懂的那种——魔方与编程两条兴趣线在这里交汇。","polished":"这个仓库的分量不用多讲：Herbert Kociemba 就是二阶段算法的提出者，『上帝之数等于 20』的论证工作建立在它之上。这份实现平均不到 19 步就能复原任意打乱状态，而且是纯 Python——不需要编译工具链，clone 下来装好依赖就能直接求解。对魔方玩家它是算法圣经，对 Python 学习者它是一份难得能完整读懂的高级代码：坐标系建模、阶段一/阶段二的剪枝表、迭代加深搜索，每一层都清清楚楚，是学习『如何用优雅的数据结构换取搜索速度』的范本。怎么开始：第一步，clone 仓库并按 README 装好依赖，把一个打乱状态喂给求解器，看它输出那串不到 20 步的解法；第二步，打开源码找坐标系部分，理解 phase1 的坐标编码（角块朝向、棱块朝向、UD 层选择），这一步读懂了，二阶段算法就懂了一半；第三步，跑它自带的求解示例，把最大求解步数调高调低，观察解的长度与求解时间的权衡——这正是二阶段算法的精髓：牺牲最优性换速度。进阶玩法：把它接到自己的项目里做一个任意魔方状态求解接口；或与 WCA 打乱（tnoodle 生成）联动，验证打乱 20 步、还原也约 20 步的对称美。对做过魔方视频的作者来说，『二阶段算法为什么能逼近上帝之数』本身就是一个能讲的选题，这个仓库就是全部素材来源。","tags":["魔方","Python","算法"],"effort":"周末级","id":"a331"},{"kind":"项目灵感","title":"tnoodle（WCA 官方打乱程序）","url":"https://github.com/thewca/tnoodle","source":"GitHub · thewca/tnoodle","date":"2026-11","summary":"所有 WCA 正式比赛的打乱公式都出自这个 Java 程序，仓库从 2010 年维护至今。对打过 WCA 的人来说，这是比赛时那张打乱纸的出厂地。","takeaways":["类型：开源拆解/情怀体验 · 成本：免费 · 可行性：可本地生成正式级打乱","478 stars · AGPL-3.0 · WCA 官方组织维护，2026-11-01 仍有提交","十五年持续维护的比赛基础设施，打乱质量即规则","打乱纸背后是随机数、过滤与质检的完整流水线"],"whyValuable":"视角独特性拉满：一个『天天受它影响却从没见过它』的官方基础设施，正好落在魔方人设的延长线上。","polished":"凡是打过 WCA 线下赛的人，都见过裁判手里那张印着打乱公式的纸，而全世界的打乱公式都出自同一个程序：tnoodle。这个由 WCA 官方组织维护的 Java 项目从 2010 年迭代至今，十五年间每一次比赛的打乱都由它生成——打乱不是随手拧几下，而是生成、过滤、质检的完整流水线，保证打乱状态足够随机又不至于过分刁钻。对魔方玩家来说，这是一个天天受它影响却从没见过它的基础设施项目。怎么开始：第一步，按 README 从源码构建或直接用发布版本，在本地生成一张和比赛同规格的打乱表，亲手复现赛前一分钟的体验；第二步，进源码看它怎么实现伪随机但合规——不同项目（三阶、金字塔、SQ1）各有独立的打乱策略与过滤规则，WCA 规则里的每条限制都对应代码里的一道检查；第三步，研究它的输出格式，顺手给自己做个每日打乱小工具，把比赛级打乱接进自己的练习流程。对有过 WCA ID 的作者还有一层意义：可以和 csTimer 的打乱实现对照着看——一个服务比赛、一个服务训练，两份代码对『什么叫合格的打乱』给出了同一套答案。这类规则如何写进代码的拆解，既是极客趣味，也天然是稀缺选题的素材库。","tags":["魔方","WCA","开源拆解"],"effort":"周末级","id":"a332"},{"kind":"项目灵感","title":"animeko（找番/追番/看番一站式多平台客户端）","url":"https://github.com/open-ani/animeko","source":"GitHub · open-ani/animeko","date":"2026-11","summary":"100% Kotlin/Compose Multiplatform 写的一站式追番平台：Bangumi 云收藏同步、离线缓存、BT 下载、弹幕云过滤全都有。追番爱好者的一个 App 全搞定答案，且工程质量高。","takeaways":["类型：开源应用体验 · 成本：免费 · 可行性：下载安装即用","21,433 stars · AGPL-3.0 · 2026-11-02 仍在高频更新","Bangumi 收藏同步 + 离线缓存 + BT 下载 + 弹幕云过滤一站配齐","Compose Multiplatform 全平台实现，可当现代客户端教科书读"],"whyValuable":"追番是站长的核心人设，而 animeko 是这个需求目前完成度最高的开源答案——好用，且值得拆。","polished":"追番党的痛点从来不是没有片源，而是工具太散：收藏在 Bangumi、下载靠 BT、弹幕要自己过滤、进度对不上。animeko 把这一整套流程塞进了一个 App：登录 Bangumi 账号后收藏自动同步，番剧更新能离线缓存、支持 BT 下载，弹幕还有云过滤规则库，真正做到一个 App 全搞定。更难得的是工程质量：整个项目 100% Kotlin，用 Compose Multiplatform 实现桌面全平台，2.1 万 star 背后是持续高频的维护节奏（2026-11-02 仍有提交），是少数能当现代跨平台客户端教科书来读的中文社区项目。怎么开始：第一步，去 releases 下载对应系统的安装包，登录 Bangumi 账号，让收藏夹先同步起来；第二步，挑一部在追的新番，把自动追踪加离线缓存跑一遍，体验和网页端追番的差别；第三步，打开弹幕云过滤设置，配置自己的屏蔽词，感受干净弹幕的可控感。进阶玩法：对开发者，它的仓库结构（多模块 Compose 工程、跨平台数据层）值得整段阅读；对内容创作者，把追番流程工程化正好与自己的追番人设契合，实测体验本身就是一期素材。同类还有 RSS 流水线方案，但 animeko 赢在开箱即用——想省事的追番党从它入手就对了。","tags":["ACG","追番","效率"],"effort":"周末级","id":"a333"},{"kind":"项目灵感","title":"manga-image-translator（一键翻译漫画/图片内文字）","url":"https://github.com/zyddnys/manga-image-translator","source":"GitHub · zyddnys/manga-image-translator","date":"2026-11","summary":"扔进一张生肉漫画图，自动检测气泡、翻译并重新嵌字，是生肉漫画党的刚需工具。演示效果直观，一帧画面就能看出 AI 做了什么。","takeaways":["类型：AI 工具体验 · 成本：免费（本地部署可选 GPU）· 可行性：单图进出，门槛低","10,567 stars · GPL-3.0 · 2026-10-11 仍有更新","气泡检测→OCR→翻译→重嵌字全自动，支持批量","效果直观：特别适合做前后对比演示"],"whyValuable":"生肉漫画党的真实刚需，而且单图进出的演示形态天然适合视频展示与实测选题。","polished":"生肉漫画党都懂那种痛：想看的番外或短篇没人汉化。manga-image-translator 解决的就是这最后一公里——把一张生肉图丢进去，它会自动完成四步：检测气泡位置、OCR 识别原文、调用翻译、把译文重新嵌回图里，输出一张熟肉。10,567 star、2026-10 仍在活跃维护，是同类项目里最成熟的一个。它最好的一点是效果直观：一张图进去一张图出来，AI 到底做了什么一眼可见，特别适合做前后对比展示。怎么开始：第一步，按 README 选择部署方式——有显卡就本地部署效果最好，没条件也可以先用项目提供的在线方式体验；第二步，找一页文字密度适中的生肉图试跑全流程，重点看两处：小字辨识准确率和嵌字后的排版是否自然；第三步，试批量模式，把一本短篇整个文件夹丢进去。踩坑预期：生僻字体、手写体和竖排文本是翻车重灾区，翻译腔也需要自己润色——把它当初翻加嵌字助理而不是成品流水线，预期就对了。对 ACG 受众，三十秒生肉变熟肉的实测对比就是现成的选题素材；对普通用户，这是把压箱底生肉消化掉的最快办法。","tags":["ACG","AI","好玩"],"effort":"周末级","id":"a334"},{"kind":"项目灵感","title":"voice-over-translation（给任意网页视频加 AI 配音字幕的油猴脚本）","url":"https://github.com/ilyhalight/voice-over-translation","source":"GitHub · ilyhalight/voice-over-translation","date":"2026-11","summary":"7.6k star 的知名油猴脚本：任意网页视频一键配上 AI 翻译配音和字幕，追生肉视频的万能钥匙。对写油猴脚本的站长来说是同行标杆。","takeaways":["类型：浏览器脚本安装 · 成本：免费 · 可行性：装上即用","7,660 stars · MIT · 2026-11-02 活跃维护","任意 HTML5 视频一键 AI 配音+双语字幕，支持多翻译源","音频抓取与合成实现是浏览器音频处理的教科书案例"],"whyValuable":"自己写油猴脚本的人的标杆参照系——它证明了油猴脚本能做到什么高度。","polished":"看生肉视频最大的障碍是语言，而 voice-over-translation（VOT）给了一步到位的答案：装上这个油猴脚本后，任意网页视频——YouTube、各种课程站、甚至小众站点——都能一键挂上 AI 翻译配音和双语字幕。7,660 star 的体量说明它早已不是小众玩具，而是网页视频翻译这个细分领域事实上的标杆，MIT 协议、2026-11 仍在活跃维护。怎么开始：第一步，先装 Tampermonkey，再从脚本发布页安装 VOT，随便开一个英文视频点悬浮按钮试效果；第二步，在设置里切换翻译与语音合成服务源，对比不同源的翻译质量与延迟，找到自己舒服的组合；第三步，遇到支持不佳的站点，去 issue 区搜一搜——大概率有人踩过同样的坑。对作者而言它还有第二层价值：自己就在写油猴脚本，VOT 就是油猴脚本能做到什么高度的参照系。值得重点读的是它怎么在浏览器里拿到视频音轨、怎么做分段请求与音画同步——这套浏览器音频处理管线是教科书级的实现，读完对自己脚本的工程化程度会有直观的标尺。写出一个七千多 star 的脚本是什么体验，这个视角也天然适合做拆解内容。","tags":["油猴脚本","ACG","效率"],"effort":"周末级","id":"a335"},{"kind":"项目灵感","title":"learn-claude-code（从 0 到 1 手写迷你版 Claude Code）","url":"https://github.com/shareAI-lab/learn-claude-code","source":"GitHub · shareAI-lab/learn-claude-code","date":"2026-11","summary":"教学向仓库，带你从零手搓一个 nano 级 agent harness，近 8 万 star。Bash is all you need——看懂 agent 循环的最短路径。","takeaways":["类型：跟练学习 · 成本：免费 · 可行性：按教程写完即成","79,756 stars · MIT · 2026-10-27 仍在更新","核心主线：agent 循环、工具调用、上下文管理的手工实现","Python 便可跟练，是理解 Claude Code 类工具内部机理的捷径"],"whyValuable":"正在学 Python 又每天在用 coding agent 的人，两条学习线在这里拧成一股绳。","polished":"用 Claude Code 的人很多，知道它里面是什么的人很少。learn-claude-code 是一份教学向仓库，主张 Bash is all you need：带你从零手搓一个 nano 级的 agent harness，把 agent 循环、工具调用、上下文管理这些听起来玄乎的东西亲手实现一遍。近 8 万 star 的热度说明看懂 agent 是当下最普遍的学习诉求，而这份仓库给的就是最短路径——不陷入官方源码的迷宫，直接写一个最小的能跑的。怎么开始：第一步，clone 仓库配好 Python 环境，把最小可运行版本跑起来，跟它说一句话看它怎么决定调用工具；第二步，跟着教程逐个补齐能力：给 agent 挂上执行 bash、读写文件等工具，观察每加一个工具，行为会发生什么变化；第三步，自己动手改上下文管理——为什么对话长了它会失忆、系统提示占了多少预算，改一遍就全懂了。跟练完成后的收获非常具体：之后再配 CLAUDE.md、选 MCP 工具、调 prompt，都能说出这是在改循环里的哪一环。对正在学 Python 又每天在用 coding agent 的人，这个仓库把两条学习线拧成了一股绳，是花一个周末非常值得的投资，跟练过程本身也适合做成系列内容。","tags":["ClaudeCode","Python","学习"],"effort":"周末级","id":"a336"},{"kind":"项目灵感","title":"magpie（菜单栏一站接管所有 coding agent 的模型）","url":"https://github.com/yetone/magpie","source":"GitHub · yetone/magpie","date":"2026-11","summary":"2026 年 9 月出现的黑马：菜单栏里给 Codex 挂 DeepSeek、给 Claude Code 挂 Kimi，一个图标管理所有 agent 的模型。作者 yetone 两周冲到 2.8 万 star。","takeaways":["类型：新工具体验 · 成本：免费 · 可行性：安装即用","28,334 stars · MIT · 2026-09-23 创建，两周即爆红","菜单栏一站管理所有 coding agent 的模型分配，免手改配置","作者 yetone 是 avante.nvim / ast-grep 作者，工程质量有背书"],"whyValuable":"当模型价格与能力快速变动时，随时给任务换最合适的模型从麻烦事变成顺手事——重度用户的实打实成本优化。","polished":"同时折腾 Claude Code、Codex、OpenCode 的人都会遇到同一个麻烦：每家的 API 供应商配置格式不一样，切换一次就要手改一次 JSON。magpie 把这事做成了菜单栏里的一枚图标：给 Codex 挂 DeepSeek、给 Claude Code 挂 Kimi，所有 agent 用什么模型在一个面板里点选完成。项目 2026-09-23 才创建，两周冲到 2.8 万 star，是 2026 年下半年 coding agent 工具链里最猛的黑马；作者 yetone 是 avante.nvim 和 ast-grep 的作者，社区信任度直接拉满。怎么开始：第一步，按 README 安装桌面端，让它扫描本机已有的 coding agent 配置；第二步，给每个 agent 指定模型与供应商，然后故意切换一次，回配置文件确认它改了什么、备份了什么——用一次就明白它管理的是哪一层；第三步，把常用的模型组合固化下来，体验换模型像换输入法的感觉。它的价值不只是省事：当各家模型的价格与配额快速变动时，把合适的模型随时换给合适的任务，对重度用户是真实的成本优化。同类先行者 cc-switch 已经验证了这个需求，magpie 用更轻的菜单栏形态接住了它，两个都用过会更清楚自己需要什么。","tags":["ClaudeCode","效率","新品"],"effort":"周末级","id":"a337"},{"kind":"项目灵感","title":"claude-hud（Claude Code 实时仪表盘插件）","url":"https://github.com/jarrodwatts/claude-hud","source":"GitHub · jarrodwatts/claude-hud","date":"2026-11","summary":"Claude Code 实时仪表盘插件：上下文用量、正在调用的工具、运行中的 agent 和 todo 进度一目了然。对写用量追踪工具的人来说是同类思路的漂亮实现。","takeaways":["类型：插件安装 · 成本：免费 · 可行性：装上即用","29,080 stars · MIT · 2026-11-02 活跃维护","实时显示上下文余量、工具调用、agent 状态与 todo 进度","与 aiusage 同一赛道：把看不见的开销可视化"],"whyValuable":"既是装上就回不去的体验升级，又是 aiusage 同赛道的竞品样本——看懂别人的取舍再回来审视自己的产品。","polished":"Claude Code 用起来最焦虑的一刻，是不知道上下文还剩多少、它现在到底在干嘛。claude-hud 给 Claude Code 装了一块仪表盘：上下文用量实时可见，正在调用什么工具、后台跑了哪些 agent、todo 推进到哪一步，全都一目了然。29,080 star、MIT 协议、2026-11-02 仍在活跃维护，属于装上就回不去的那类体验升级。怎么开始：第一步，按 README 的插件安装方式装进 Claude Code，重启会话即可看到 HUD；第二步，正常跑一个多步骤任务，盯着上下文曲线看它什么时候跳涨——压缩发生在哪、系统提示占了多少，看两轮就建立起预算感；第三步，把它当成工作习惯的一部分：开新任务前先看一眼余量，决定是精简上下文还是直接开新会话。对写过 aiusage 的作者还有一层特殊意义：自己做的是 AI 用量可视化这条赛道，claude-hud 是同一思路在 agent 会话场景的漂亮实现，值得对比三件事——它选了哪些指标、粒度到哪一层、实时性怎么做的。看懂别人的取舍再回来审视自己的产品路线，比闷头写代码有用得多；它既是工具，也是现成的竞品调研素材。","tags":["ClaudeCode","效率","用量追踪"],"effort":"周末级","id":"a338"},{"kind":"项目灵感","title":"andrej-karpathy-skills（用 Karpathy 的 LLM 编码观察调教 agent）","url":"https://github.com/multica-ai/andrej-karpathy-skills","source":"GitHub · multica-ai/andrej-karpathy-skills","date":"2026-11","summary":"把 Karpathy 总结的 LLM 编码通病浓缩成一份 CLAUDE.md，号称让 Claude Code 少犯蠢，22.8 万 star 的现象级单文件仓库。好玩点在用大佬语录调教 AI 这个行为本身。","takeaways":["类型：Prompt 资产/对照实验 · 成本：免费 · 可行性：复制即用","228,403 stars · 无 license · 2026-04 后未再更新（现象级但已沉淀）","单文件仓库：一份浓缩 LLM 编码通病与纠正规则的 CLAUDE.md","最正确的打开方式是做对照实验：挂与不挂各跑一周"],"whyValuable":"既是一份现成 prompt 库，又是一个自带流量的实验选题——用语录调教 AI 这个现象本身就值得测。","polished":"这可能是 2026 年最行为艺术的开源项目：一个几乎只有一份文档的仓库，228,403 star。它做的事情是把 Andrej Karpathy 公开吐槽过的 LLM 编码通病——过度设计、假装跑过测试、悄悄改需求之类——浓缩成一份可直接使用的 CLAUDE.md，让 Claude Code 在动手前先背一遍大佬的教训。无 license、2026-04 后不再更新，但作为一份社区共识的沉淀物，它的传播度已经证明了价值。怎么开始：第一步，通读全文，先当吐槽文集看，把我也这样的条目标出来；第二步，把自己高频遇到的五到八条抄进自己的 CLAUDE.md——别全抄，上下文也是钱；第三步，做对照实验：同一类任务，挂与不挂各跑一周，记录实际行为差异——是风格变了还是真的少犯错，用输出说话。这个项目真正值得琢磨的不是文件本身，而是用语录调教 AI 这个现象：为什么大佬的骂人话能变成 prompt 资产？它起作用的边界在哪？对天天折腾 agent 的作者，这既是一份现成的 prompt 库，也是一个天然有钩子的实验选题——跑了一周，我的 agent 代码风格真变了吗——结论无论正反都有内容可写。","tags":["ClaudeCode","好玩","Prompt"],"effort":"周末级","id":"a339"},{"kind":"项目灵感","title":"smalltv-mod（给 GeekMagic 小电视刷出 Claude 用量条/航班雷达/HA 面板）","url":"https://github.com/giovi321/smalltv-mod","source":"GitHub · giovi321/smalltv-mod","date":"2026-11","summary":"给几十块的 GeekMagic ESP32 小电视刷自定义固件：五种模式包括 Claude 用量条、实时航班雷达、Home Assistant 面板。一个项目同时命中三个兴趣点。","takeaways":["类型：硬件刷机 DIY · 成本：硬件约几十元 · 可行性：网页刷机，门槛低","148 stars · WTFPL · 2026-06 创建，2026-11-01 仍活跃","五种模式：Claude 用量条 / 航班雷达 / HA 驱动屏等","ESP32 + AI 用量 + 智能家居三兴趣的完美交叉"],"whyValuable":"一个几十块的硬件同时接住用量追踪、Home Assistant 和桌面摆件三个兴趣，刷完既是生产力又是装饰。","polished":"几十块钱的 GeekMagic ESP32 小电视，刷上 giovi321 的 smalltv-mod 固件后，就从电子相框变成了全能桌面副屏：五种模式里最出圈的是 Claude 用量条——agent 还能不能跑，抬头看一眼桌上的小电视就知道；此外还有实时航班雷达和 Home Assistant 驱动的面板模式，等于把 AI 额度、世界动向和全屋智能状态全塞进了这块小屏幕。项目 2026-06 创建、WTFPL 协议，2026-11-01 仍在活跃更新，star 数不大（148）但定位恰好是 ESP32、用量追踪、智能家居三个兴趣的完美交叉。怎么开始：第一步，买一块 GeekMagic 小电视，确认型号在固件兼容列表里；第二步，按 README 用浏览器刷入固件——这类 ESP32 项目基本都支持网页刷机，不用装复杂工具链；第三步，进配置页填上 Claude 用量接口与 Home Assistant 的地址，让用量条和家居面板先跑起来。动手过程中的可玩点在自定义：屏幕布局、显示哪些指标、多久刷新一次，都可以按自己的喜好改。刷完的成品既是生产力工具又是桌面装饰，桌面摆一台会显示 Claude 用量的电子小电视本身就是回头率很高的成品，也天然是一期刷机实录素材。","tags":["ESP32","HomeAssistant","AI用量","好玩"],"effort":"周末级","id":"a340"},{"kind":"项目灵感","title":"bambuddy（Bambu 打印机自托管指挥中心，不依赖官方云）","url":"https://github.com/maziggy/bambuddy","source":"GitHub · maziggy/bambuddy","date":"2026-11","summary":"Your Bambu. No Cloud. Your Rules.：自托管 Bambu 打印机指挥台，从一台 A1 管到整个打印农场，数据全留在自己家里。","takeaways":["类型：自托管部署 · 成本：免费（需一台常开主机）· 可行性：Docker 起服务即用","3,242 stars · AGPL-3.0 · 2025-11 创建，2026-11-02 活跃","脱离官方云的打印机中控：多机管理与监控","与 bambu-dashboard-card / ha-bambulab 互补：一个中控，一块面板"],"whyValuable":"打印机去云化需求目前最完整的开源答案之一，且正好补上自有 bambu 生态里中控这块拼图。","polished":"拓竹打印机默认要走官方云，这让自托管玩家总觉得差口气。bambuddy 的口号把态度写在了脸上：Your Bambu. No Cloud. Your Rules.——一个自托管的 Bambu 指挥中心，从手里的一台 A1 到一整面墙的打印农场都能管，数据全留在自己家里。3,242 star，AGPL-3.0，2025-11 创建后持续活跃（2026-11-02 仍有提交），是打印机去云化这个需求目前最完整的开源答案之一。怎么开始：第一步，按 README 用 Docker 在 NAS 或家里常开的小主机上起服务，打印机在局域网内配对——关键前提是打印机和主机在同一网段；第二步，把现有打印任务迁移过来跑一个完整任务，对比官方 App：监控视角多了什么、少了什么；第三步，多机用户重点试农场视图，单机用户则把它当成局域网内常开的打印机主页。对已经有 bambu-dashboard-card 和 ha-bambulab 的作者，bambuddy 是生态拼图的另一块：HA 面板负责嵌进全屋，bambuddy 负责打印机自己的指挥台，两者互补而非重复。它同时是自托管实践的优质样本——一套标准的 Web 服务该有监控、状态、通知怎么组织，读完它的实现思路会有参考答案。","tags":["3D打印","自部署","HomeAssistant"],"effort":"周末级","id":"a341"},{"kind":"项目灵感","title":"Bambu-Lab-RFID-Library（社区扒出来的 Bambu 耗材 RFID 标签数据库）","url":"https://github.com/queengooborg/Bambu-Lab-RFID-Library","source":"GitHub · queengooborg/Bambu-Lab-RFID-Library","date":"2026-11","summary":"社区把 Bambu 原厂耗材的 RFID 标签逐个扫描建库，专门研究为什么第三方耗材不被识别。极客味十足的开源逆向工程样本。","takeaways":["类型：逆向数据仓库研究 · 成本：免费 · 可行性：读库+贡献即可参与","413 stars · GPL-3.0 · 2026-10-30 活跃更新","社区自建的原厂耗材 RFID 标签数据库，逐个扫描入库","第三方耗材识别难题的核心情报源"],"whyValuable":"从『不认识』到『认识』的干净逆向样本——比任何破解耗材的传闻都可靠的第一手资料。","polished":"Bambu 玩家都遇到过那个提示：耗材无法识别。为什么原厂耗材插上就认，第三方的就报错？Bambu-Lab-RFID-Library 是社区给出的硬核答案：志愿者把原厂耗材的 RFID 标签逐个扫描、解析、建库，把识别背后的数据逻辑摊开在阳光下。这个仓库不写代码黑魔法，它做的事情更本质——积累数据。413 star、GPL-3.0，2026-10-30 仍在活跃更新，是研究厂商为什么锁定耗材这个问题的第一手资料库。怎么开始：第一步，读 README 和 wiki，搞清楚 RFID 标签里存了什么字段、打印机校验什么；第二步，对照自己手里的耗材查库，看自己买的是已收录还是空白区；第三步，有设备的话按贡献流程扫描自己的标签提交 PR——你手里每一卷耗材都是数据库缺的那一行。它的价值分两层：实用层，第三方耗材玩家可以据此理解兼容性现状与可能的解决路径；学习层，这是一份干净的逆向工程样本——怎么从黑盒到白盒、怎么把单点发现变成社区协作的数据库，方法论本身比结论更值得学。对喜欢刨根问底的玩家，这个仓库就是最可靠的起点。","tags":["3D打印","逆向","极客"],"effort":"周末级","id":"a342"},{"kind":"项目灵感","title":"SolidCraft（纯 Rust 参数化 3D CAD，支持 MCP 自动化）","url":"https://github.com/tangency-labs/solidcraft","source":"GitHub · tangency-labs/solidcraft","date":"2026-11","summary":"2026 年 10 月新发布的参数化 3D CAD：桌面/Web/CLI 三形态，还能通过 MCP 让 AI 直接生成模型。3D 打印玩家从建模软件跳到 agent 写代码出模型的新玩法。","takeaways":["类型：新工具体验 · 成本：免费 · 可行性：三形态按需选用","13,097 stars · Apache-2.0 · 2026-10-07 创建即爆红","参数化 CAD + MCP：AI 可直接生成/修改可打印模型","桌面、Web、CLI 三形态，脚本化建模天然适配自动化"],"whyValuable":"补上从想法到模型的最后一环：对 agent 说要什么，它写参数化代码，直接出可打印模型。","polished":"SolidCraft 是 Rust 重写一切与 AI 生成一切两条潮流的交汇点：一个纯 Rust 写的参数化 3D CAD，2026-10-07 发布，一个月冲到 13,097 star。它最特别的不是建模能力本身，而是原生支持 MCP——意味着 Claude 这类 agent 可以直接通过协议生成和修改模型。对 3D 打印玩家，这打开了一种新玩法：不再是打开软件拖鼠标导出 STL，而是对 agent 说要什么、它写参数化代码、直接出可打印模型。怎么开始：第一步，从三形态里挑一个上手——想快速感受就开 Web 版，想接进工作流就用 CLI；第二步，先手动建一个简单参数化模型（比如一个可调尺寸的收纳盒），理解它的建模语法；第三步，把 MCP 接上，让 agent 改参数、生成变体，观察人说需求、AI 出模型的流程在哪个环节还需要人工兜底。落地场景非常具体：家里缺什么收纳件、支架、卡扣，描述清楚就出一版，打印验证再迭代。对自研过 bambu 生态组件、收藏夹里 3D 打印第一位的作者，这个工具正好补上从想法到模型的最后一环，也让 agent 直接写代码出模型再上机成为一条现成的内容线。","tags":["3D打印","Rust","MCP","新品"],"effort":"周末级","id":"a343"},{"kind":"项目灵感","title":"FilmCraft（纯 Rust 从零写的非线性视频编辑器）","url":"https://github.com/storytold/filmcraft","source":"GitHub · storytold/filmcraft","date":"2026-11","summary":"Rust 重写一切阵营的最新战果：从零手写的非线性视频编辑器，2026 年 9 月出现即 1.7 万 star。对每天剪视频的人既是工具候选，又是绝佳观察素材。","takeaways":["类型：新工具试用 · 成本：免费 · 可行性：下载体验即可上手","17,282 stars · Apache-2.0 · 2026-09-30 创建，热度极高","从零实现的非线性剪辑器，不基于现有引擎套壳","真实评测视角：拿一期真实视频来剪，看能替代几成 Pr"],"whyValuable":"天天剪视频的人评测新剪辑器是自带动机的选题，且能沉淀出可信的工具结论。","polished":"视频剪辑软件多年被几家商业巨头垄断，而 FilmCraft 选择了最难的路：不套壳、不基于现有引擎，用 Rust 从零写一个非线性视频编辑器。2026-09-30 出现，一个月内 17,282 star，是 Rust 重写一切阵营的最新战果。热度之外更值得琢磨的是它的定位：对每天要剪视频的人来说，它首先是工具候选——能不能接住真实的剪辑工作流，一试便知。怎么开始：第一步，下载对应平台的版本，先导入一段素材熟悉时间线手感，重点感受剪辑响应速度——这正是 Rust 从零实现最可能拉开差距的地方；第二步，拿一期真实要发的视频完整剪一遍，记录每个卡住的时刻：找不到的功能、不顺手的交互、渲染问题；第三步，把体验写成对比清单：FilmCraft 能替代 Pr 的哪几成、哪些环节还必须回去。这个项目对内容创作者还有一层天然价值：新编辑器实测是自带动机的选题——既有工具实用价值，又能以真实工作流为试金石给出可信结论，比云评测有说服力得多。开源剪辑器的进化值得长期跟进，现在入场正好从头围观一个项目长成，每半年回访一次就是稳定的系列素材。","tags":["Rust","视频","新品"],"effort":"周末级","id":"a344"},{"kind":"项目灵感","title":"cleanyourtv（WiFi 远程给 Android/Google TV 瘦身去广告）","url":"https://github.com/Gathin23/cleanyourtv","source":"GitHub · Gathin23/cleanyourtv","date":"2026-11","summary":"不用拆机不用线，WiFi 远程给任意 Android/Google TV 去预装去广告，换成 Apple TV 风格桌面，上线一个多月 5 万 star。家里那台广告机有救了。","takeaways":["类型：一键工具 · 成本：免费 · 可行性：一条命令级操作","50,039 stars · license 标注 NOASSERTION · 2026-10-17 创建","WiFi 远程完成：去预装、去广告、换 Apple TV 风格桌面","动系统层操作，刷前务必备份并自担风险"],"whyValuable":"立竿见影解决全球性愤怒：一台广告机当场变回一台正常的电视。","polished":"家里的智能电视越用越像广告机：开机广告、预装应用、推流首页，关都关不掉。cleanyourtv 提供了一条几乎零门槛的路径：不用拆机、不用数据线，同一 WiFi 下远程操作，给 Android/Google TV 去掉预装与广告，再换上一套 Apple TV 风格的清爽桌面。项目 2026-10-17 上线，一个多月 50,039 star——这个数字说明被广告机折磨是全球性的共同愤怒。怎么开始：第一步，确认自家电视系统在支持列表内，通读 README 的风险说明——这是动系统层的操作，极端情况可能需要恢复出厂，重要设置先截图备份；第二步，按指引在同一局域网下执行远程流程，先做去广告去预装这一步，重启看效果；第三步，装上它的桌面启动器，把常用 App 固定到首页，体验开机即内容的干净感。它的价值立竿见影：一台广告机当场变回一台正常的电视。要注意两点：license 标注为 NOASSERTION，商用或再分发前需要自己确认条款；系统级操作始终有变砖风险，动手前把预期和退路想清楚。对家里有多台电视的人，第一台成功后第二台就是五分钟的事，全家推广毫无压力。","tags":["效率","电视","新品"],"effort":"周末级","id":"a345"},{"kind":"项目灵感","title":"openai/math（OpenAI 开源的内部模型数学手稿与证明工件）","url":"https://github.com/openai/math","source":"GitHub · openai/math","date":"2026-11","summary":"OpenAI 把内部模型产出的数学手稿和部分 Lean 形式化证明当原始研究数据直接开源，2026 年 10 月上线即 1.7 万 star。一份能直接翻的 AI 数学家作业本。","takeaways":["类型：一手研究资料阅读 · 成本：免费 · 可行性：线上翻阅即可","17,270 stars · Apache-2.0 · 2026-10-06 上线","内容为模型产出的数学手稿与 Lean 形式化证明工件","罕见的一手样本：直接观察前沿模型的真实数学能力边界"],"whyValuable":"比任何评测榜单都更接近真相的一手材料：AI 数学家作业本就摊在那里，可以逐页翻。","polished":"AI 的数学能力到底多强，大多数时候只能听宣传。openai/math 提供了更硬的东西：OpenAI 把内部模型产出的数学手稿、以及部分 Lean 形式化证明，作为原始研究数据直接开源。2026-10-06 上线即 17,270 star——大家都是来翻 AI 数学家作业本的。这份材料的珍贵之处在于它是原始工件而非精选案例：你能看到成功的证明，也能看到它的工作方式，这比任何评测榜单都更接近真相。怎么开始：第一步，从 README 的目录结构入手，弄清手稿、证明工件各放在哪、覆盖哪些数学领域；第二步，挑一个自己熟悉的领域读进去——有背景知识的领域才能看出门道：证明的思路是不是人的思路，形式化过程哪里漂亮哪里笨拙；第三步，对照社区讨论与 issue，看专业数学家怎么评价这批材料。对不同人的价值不同：对 OI 和算法背景的人，这是能直接对谈的对手写出来的作业；对关注 AI 的人，这是观察模型做研究的一手窗口；对内容创作者，翻 AI 数学家的作业本本身就是一个天然有钩子的选题——大众对 AI 现在多强的好奇永远在线，而这份材料给了具体的、可展示的答案。","tags":["数学","AI","新品"],"effort":"周末级","id":"a346"},{"kind":"延伸创意","title":"时间账本 × AI 账本：monorail 周报里的 AI 成本面板","url":"","source":"延伸创意 · 基于 monorail + aiusage（自有项目组合）","date":"2026-11","summary":"写一个关联层：把 monorail 的时间条目和 aiusage 的会话/成本数据按时间窗 join，回答这个任务烧了多少 token、每小时 AI 成本多少。先做 CLI 报表跑通，再内嵌进 monorail 周回顾面板。","takeaways":["类型：自有项目组合功能 · 成本：零（全本地数据）· 可行性：一周级可跑通","两份本地数据 join 出市面没有的按任务归因 AI 成本视角","第一步可先做 AI 会话自动补录周末级 MVP，再上 join 分析","顺带产出博客年度复盘素材：AI 时代的时间账本"],"whyValuable":"市面上的用量工具都停在总量统计，按任务归因 AI 开销的视角是独有的，且不引入任何新数据源。","polished":"手里有两份彼此封闭的数据：monorail 记着每段时间花在哪，aiusage 记着每次 AI 会话烧了多少 token、多少钱。这个创意就是把两者 join 起来：读取 monorail 本地 Markdown+YAML 的时间条目和 aiusage export 出的会话/成本数据，按时间窗对齐，回答三个现在没人能回答的问题——这个任务烧了多少 token？每小时 AI 成本多少？今天的 AI 密度（tokens 除以专注小时）是多少？为什么值得：市面上的用量工具都停在总量统计，没有人做按任务归因的 AI 成本，这个视角是独有的；两份数据都是本地文件，不引入任何新数据源，工程边界干净。做完之后它既是 monorail 的差异化功能，又天然产出内容——年底把我这一年 AI 怎么花钱写成复盘，就是一篇现成的博客。落地步骤：第一步，先写独立 CLI 报表跑通 join 逻辑，输出任务乘 token 和成本的表格，验证按小时窗还是按项目标签对齐更符合直觉；第二步，做一个周末级 MVP 增强——AI 会话自动补录：扫描 aiusage 已解析的会话时间戳，按项目与 monorail 标签的映射配置，把日历里没有计时覆盖的 AI 会话时段自动生成为补录条目（预览确认后写入），顺手解决 monorail 忘记计时的老痛点；第三步，把报表内嵌进 monorail 已有的每周回顾面板，做成 AI 成本密度卡片。数据敏感点只有一个：时间戳对齐的时区与跨天问题，先定规则再写代码。","tags":["组合","新功能","内容生产"],"effort":"一周级","id":"a347"},{"kind":"延伸创意","title":"Persona 用量归因：哪个 system prompt 最烧 token","url":"","source":"延伸创意 · 基于 agent-purge + aiusage（自有项目组合）","date":"2026-11","summary":"agent-purge 在启动层本就知道每次用的是哪个 persona，加一个活跃时间窗记录，与 aiusage 成本数据 join 后在 web 控制台画 persona × token × 会话数图表。","takeaways":["类型：自有项目组合功能 · 成本：零 · 可行性：一周级","两个已发布 npm 的项目组合出 persona 性价比视角，无同类工具","agent-purge 从提示词工具走向可度量的第一步","产出：persona × token/成本 × 会话数图表 + 月度归因结论"],"whyValuable":"能度量才谈得上优化——这一步让 agent-purge 的产品故事从提示词管理完整一截。","polished":"每个折腾 agent 的人手里都攒了好几套 persona（system prompt），但从来没人算过：哪一套最费钱？这个创意把两件已有的事接起来：agent-purge 在 shim/启动层本来就知道每次启动用的是哪个 persona，给它加一个活跃时间窗记录；再与 aiusage 的会话与成本数据按时间 join，就能在 web 控制台画出一张 persona × token/成本 × 会话数的图表，直接回答这个月 40% 的钱花在了 persona X 下。为什么值得：两个项目都已发布 npm、有真实用户，组合出的 persona 性价比视角没有同类工具做过；对 agent-purge 本身，这是从提示词管理工具走向可度量工具的第一步——能度量，才谈得上优化，产品故事立刻完整一截。数据关联本身也是很好的学习题材：怎么在启动层埋点、怎么做时间窗 join、怎么画不误导人的图。落地步骤：第一步，在 agent-purge 的启动路径上加 persona 活跃记录（本地日志即可，格式向 aiusage 靠拢方便 join）；第二步，写 join 脚本按时间窗对齐两份数据，先输出命令行报表验证正确性；第三步，在 web 控制台加图表页，主指标定为每个 persona 的月度成本占比与会话数，辅以单位会话成本；第四步，用自己一个月的真实数据跑一遍，写一篇我的哪套 persona 最烧钱作为首个发布内容。边界提醒：join 精度取决于时间戳粒度，先跑通粗粒度再谈精确归因。","tags":["组合","新功能"],"effort":"一周级","id":"a348"},{"kind":"延伸创意","title":"Linux.do Toolkit：三个油猴脚本合并成一个 MV3 浏览器扩展","url":"","source":"延伸创意 · 基于 linuxdo-keyword-highlighter + linuxdo-idea-ui + Linuxdo-Export-Markdown（自有脚本合并）","date":"2026-11","summary":"把关键词高亮、摸鱼换肤、帖子导出三个脚本重写为一个 Manifest V3 扩展，模块化开关，设置走 chrome.storage，上架 Chrome/Edge 商店。","takeaways":["类型：自有项目平台化 · 成本：零 · 可行性：月级工程","三脚本共用 linux.do 页面解析逻辑，合并即去重","油猴门槛（装 Tampermonkey）变成商店一键安装，触达面放大","已作废的 auto-nested-view 不迁移，范围收敛"],"whyValuable":"从会折腾的用户扩大到所有 linux.do 用户，上架商店是自带完成感叙事的清晰里程碑。","polished":"手里三个 linux.do 脚本——关键词高亮、摸鱼换肤、帖子导出 Markdown——各有真实用户，但都被同一个天花板压着：油猴脚本要求先装 Tampermonkey，门槛劝退一大半普通用户，而且永远进不了商店分发。这个创意是把三者重写成一个 Manifest V3 浏览器扩展 Linux.do Toolkit：content script 按域名/功能拆分模块，每个功能独立开关，设置走 chrome.storage 同步，导出功能加右键菜单入口；已作废的 auto-nested-view 明确不迁移，范围收敛。为什么值得：三个脚本共用 linux.do 的页面解析逻辑，合并本身就是一次去重重构；完成后一次安装全功能，触达从会折腾的用户扩大到所有 linux.do 用户；上架商店是清晰的里程碑，自带完成感叙事，也正好构成油猴变扩展的开发日志连载素材。落地步骤：第一步，把三个脚本里重复的页面解析代码抽成共享模块，先在油猴形态下验证重构没有破坏功能；第二步，搭 MV3 骨架：manifest、按功能拆分的 content scripts、options 页，把设置迁移到 chrome.storage；第三步，逐个功能迁移并做开关灰度——先迁高亮的解析核心，再迁导出的 HTML 转 MD 转换；第四步，权限声明最小化，准备截图与商店文案，提交 Chrome 与 Edge 商店审核。月级工程的正确节奏是按周切里程碑：第一周重构、第二周骨架、第三周迁移、第四周上架，别一口气吞。","tags":["组合","开源化","平台化"],"effort":"月级","id":"a349"},{"kind":"延伸创意","title":"文摘采集管线：linux.do 一键归档进终末地文摘","url":"","source":"延伸创意 · 基于 Linuxdo-Export-Markdown + endfield-digest + simhash（自有项目组合）","date":"2026-11","summary":"在导出脚本/扩展上加归档到文摘按钮：导出的 Markdown 经正文清洗后，用 simhash 比对文摘库避免重复，再走 GitHub API 提 commit/PR，人工只做一次确认。","takeaways":["类型：自有项目组合管线 · 成本：零 · 可行性：一周级","330 篇文摘库的瓶颈在持续供给，不在展示","simhash 中文去重思路现成，管线只差清洗/去重/提交三段","把刷论坛的顺手动作变成采集动作"],"whyValuable":"检索站的持续供给从手动整理降为顺手点一下，维护成本骤降，一周级就能建成闭环。","polished":"endfield-digest 已有 330 篇文章存量，检索型站点的形态也跑通了，真正的瓶颈浮出水面：内容持续供给靠手动整理不可持续。这条管线把刷论坛和喂文摘接成一个动作：在已有的导出脚本（或未来的扩展）上加一个归档到文摘按钮——导出的 Markdown 先经过正文清洗（去广告、去水贴格式），再用 simhash 与文摘库做相似度比对避免重复收录（中文去重的思路是现成的），最后走 GitHub API 向文摘仓库提一个 commit 或 PR。进站前人工只做一次确认，维护成本从每次手动整理降到顺手点一下。为什么值得：导出脚本已经解决了 flat/nest 楼层解析和 HTML 转 MD 两大难题，这条管线只差清洗、去重、提交三段，一周级可完成；它同时是内容生产自动化的最小闭环，做完后文摘站的更新频率直接取决于刷论坛的频率。落地步骤：第一步，写清洗模块：定义什么算正文的规则，在几篇典型帖子上验证效果；第二步，集成 simhash 去重：对库存量文章建指纹索引，设定相似度阈值，用几组近似文章调参；第三步，接 GitHub API 提 PR，附带来源链接与清洗前后 diff，方便人工确认；第四步，把按钮挂进导出流程，跑一周真实使用，统计误杀与漏收再调阈值。验收标准很简单：从看到好帖到进文摘库，全程不超过两分钟人工介入。","tags":["组合","内容生产","自动化"],"effort":"一周级","id":"a350"},{"kind":"延伸创意","title":"文摘自动日报：GitHub Actions + LLM 摘要的终末地情报流水线","url":"","source":"延伸创意 · 基于 endfield-digest + aiusage（自有项目组合）","date":"2026-11","summary":"Actions 定时抓官方新闻 RSS、linux.do 相关标签，simhash 去重后用 LLM 生成中文摘要自动 commit 进文摘站，每周汇总成周报发到博客。整条流水线零成本。","takeaways":["类型：自动化流水线 · 成本：零（Actions 免费额度 + agent 配额）· 可行性：一周级","手工检索站升级为有时效性的情报站，日更带搜索流量","完整工程实践：爬取→去重→LLM 摘要→CI 发布","LLM 额度走已有的各家 coding agent 配额"],"whyValuable":"版本热点期正好吃满时效红利，且是一次零成本的爬取到发布的完整工程实践。","polished":"如果说采集管线解决人找到的内容怎么入库，这条流水线解决没人盯着时内容自己进来：GitHub Actions 定时抓取官方新闻 RSS、linux.do 终末地相关标签等来源，抓回来的条目先过 simhash 去重，新条目用 LLM 生成中文摘要，自动 commit 进文摘仓库触发静态站重新部署；每周再把本周条目汇总成一篇周报，发布到 Hexo 博客。整条链路零成本：Actions 免费额度、CF 托管免费，LLM 走已有的各家 coding agent 配额。为什么值得：文摘站从手工检索库升级为有时效性的情报站，日更内容天然带搜索流量，版本热点期（如丹青渡上线）正好吃满时效红利；工程上它是一次完整的爬取、去重、LLM 摘要、CI 发布实践，每个环节都是可复用的经验。落地步骤：第一步，写抓取 worker：RSS 与标签页解析，输出统一条目格式（标题、链接、时间、正文），本地跑通；第二步，接 simhash 去重与 LLM 摘要模块，控制好摘要 prompt 的长度预算与输出格式；第三步，包成 GitHub Action 定时任务，加失败通知，先跑三天观察误抓率再调过滤规则；第四步，加周报汇总 job：按周聚合条目生成 Markdown 推到博客仓。风险与对策：来源结构变化会让解析挂掉——解析函数写薄一点、报错要显式，坏了一小时内能修。","tags":["自动化","内容生产"],"effort":"一周级","id":"a351"},{"kind":"延伸创意","title":"开源「游戏文摘生成器」：endfield-digest 模板化","url":"","source":"延伸创意 · 基于 endfield-digest + Hexo 博客（自有项目开源化）","date":"2026-11","summary":"把文摘站的数据结构、检索索引、分类过滤抽成 Hexo 模板或独立 CLI：digest init --name 某游戏 即得到一个可自行填数据的检索型汇总站。","takeaways":["类型：自有项目开源化 · 成本：零 · 可行性：月级","检索型（非时间流）站点形态对任意主题通用","开源吃长尾搜索流量，附带如何给任意主题做检索站的技术内容","交付物：CLI/模板 + README + 示例站 + 数据入库约定"],"whyValuable":"从维护一个站变成发布一个产品，检索型内容站的稀缺形态能吃长尾流量。","polished":"endfield-digest 跑通之后会发现一件事：这套检索型文摘站的形态——文章数据结构、检索页索引、分类过滤——对其他游戏、动漫、技术主题全部通用。这个创意是把它抽成可复用的开源产品：做成 Hexo 模板或独立 CLI，用户执行 digest init --name 某游戏，就得到一个结构完整的检索型汇总站骨架，自行填数据即可上线。为什么值得：检索型而非时间流的内容站是稀缺形态，开源后能吃某游戏汇总资料站的长尾搜索流量；对作者自己，这也是把一个站升级成一个产品的机会——从维护者变成模板作者，影响力逻辑完全不同；同时如何给任意主题做检索站本身就是一篇硬核技术内容的题材。落地步骤：第一步，做减法：把 endfield-digest 里终末地专用的部分剥离，抽象出条目 schema、检索、过滤的通用核心；第二步，选交付形态——独立 CLI 更通用（不绑 Hexo），模板更省事，建议先 CLI 后模板；第三步，写 digest init 的脚手架逻辑与示例数据集，保证 clone 下来五分钟能看到一个能用的示例站；第四步，写 README 与文章条目怎么采集入库的约定文档，配一个示例站做门面。月级工程的验收线：一个完全陌生的用户，照着 README 从零到自己的站点上线，全程不需要问你问题。","tags":["开源化","平台化"],"effort":"月级","id":"a352"},{"kind":"延伸创意","title":"开源纯代码短视频引擎：把 acm_mv 抽成带配乐的动画库","url":"","source":"延伸创意 · 基于 acm_mv（自有项目开源化）","date":"2026-11","summary":"把 engine（缓动/后期/3D 相机）、director 时间线、numpy 合成器、分块重渲抽成 pip 包：场景保持纯函数，新增 JSON/Python DSL 声明时间线，配 2-3 个从零到成片的示例教程。","takeaways":["类型：自有项目开源化 · 成本：零 · 可行性：月级","全代码生成 1080p60 带原创配乐 MV，开源界几乎无同类","分块重渲、静帧拼版预览已是工程化雏形，抽象成本可控","开源攒影响力，同时为视频生产线铺路"],"whyValuable":"真实存在的生态空位：Manim 管数学动画但不管配乐与 MV 叙事，这个位置没人占。","polished":"acm_mv 已经证明了一件事：全代码生成 1080p60、带原创配乐的 MV 是可行的。这个创意是把它从个人作品脚本升级成开源引擎：把 engine（缓动/后期/3D 相机）、director 时间线、numpy 合成器、分块重渲这几块抽成 pip 包或模板仓；场景保持纯函数（输入参数、输出帧），新增 JSON 或 Python DSL 来声明时间线与事件，让使用者不用读引擎源码就能编排一支片；配两三个从零到成片的示例和教程。为什么值得：检索下来全代码生成带原创配乐 MV 在开源界几乎没有同类——Manim 管数学动画但不管配乐与 MV 叙事，这个空位是真实存在的；工程上，分块重渲、静帧拼版预览这些已有的设计已经是工程化雏形，抽象成本可控；开源后攒影响力，同时为以后的内容生产线铺路，一石二鸟。落地步骤：第一步，划定 API 边界：场景纯函数签名、时间线对象、渲染入口，先在内部把 acm_mv 现有脚本按这个边界重写一遍；第二步，设计 DSL：从最常用的几十个镜头模式反推最小表达集，别一开始就追求全能；第三步，抽包、写文档，配三个递进示例：静态字幕卡、卡点混剪、带原创配乐的完整 MV；第四步，发 PyPI、写发布文，用一条命令生成你自己的代码 MV 当传播点。月级节奏：前两周重构与 DSL，第三周示例与文档，第四周发布与反馈迭代。","tags":["开源化"],"effort":"月级","id":"a353"},{"kind":"延伸创意","title":"终末地情报周报视频：文摘数据 + 代码生成动画","url":"","source":"延伸创意 · 基于 acm_mv + endfield-digest（自有项目组合）","date":"2026-11","summary":"复用 acm_mv 引擎，把文摘库的周度数据（新增文章数、热词、版本事件时间线）渲染成 60 秒代码动画短视频：词云生长、时间线推进、章节卡点，配乐用自带合成器，一条命令出片。","takeaways":["类型：自有项目组合内容 · 成本：零版权风险 · 可行性：一周级","素材全由代码生成，风格独一无二，边际成本近零","给文摘站开视频分发渠道，数据是现成的","同时验证 acm_mv 引擎的通用内容生产能力"],"whyValuable":"每周数据自动变成一条风格独一无二的视频，是文摘站与视频频道之间的导流桥。","polished":"文摘站的数据每周都在自然增长——新增文章数、热词变化、版本事件时间线——这些数据本身就是一期视频的脚本。这个创意是直接复用 acm_mv 引擎，把文摘库的周度数据渲染成一条 60 秒的代码动画短视频：词云随数据生长、时间线随事件推进、章节用卡点切换，配乐直接用引擎自带的合成器生成，全程一条命令出片，发 B 站或视频号。为什么值得：素材全由代码生成，零版权风险，视觉风格独一无二——别人想抄都不知道用什么素材抄；数据是现成的，每期的边际成本几乎为零，适合做成稳定栏目；同时它是对 acm_mv 引擎通用内容生产能力的真实验收——引擎能不能以周为单位稳定出片，跑四周就有答案。落地步骤：第一步，定数据出口：从文摘库导出周度聚合（新增数、Top 热词、事件时间点），做成稳定的 JSON 输入；第二步，用引擎写三个标准场景：开场标题卡、词云生长、时间线推进，参数由数据驱动；第三步，做一条命令封装：输入周数据 JSON，输出成片文件，保证每周执行成本低于十分钟；第四步，连做四期跑成栏目节奏，观察哪类数据镜头观众留存最好再迭代。这条栏目还有一个隐藏收益：它是文摘站与视频频道之间的导流桥，两边互相涨，栏目本身也是引擎最好的活广告。","tags":["组合","内容生产"],"effort":"一周级","id":"a354"},{"kind":"延伸创意","title":"Bambu 打印农场历史归档与统计面板","url":"","source":"延伸创意 · 基于 bambu-dashboard-card（自有 HACS 卡片新功能）","date":"2026-11","summary":"ha-bambulab 的 print_history 只是缓存项目文件、不是完整打印档案——bambu-dashboard-card 补上：监听打印事件落库，出月度耗材消耗、成功率、单件成本统计卡。","takeaways":["类型：自有项目新功能 · 成本：零 · 可行性：一周级","打印历史归档是上游 README 自认的功能空白","卡片已有多打印机、温度趋势、提醒等基建，增量顺理成章","产出：任务档案（模型/耗材/时长/HMS）+ 月度统计卡"],"whyValuable":"上游自认的功能空白就是下游最好的机会，补上它 HACS 项目的完整度直接上一档。","polished":"ha-bambulab 插件的 README 写得很诚实：print_history 只是缓存项目文件，不是完整的打印档案。这就是 bambu-dashboard-card 的机会：上游自认的功能空白，正是下游卡片该补的位。做法是让卡片监听打印事件，把每一次任务完整落库——打的什么模型、用了多少耗材、耗时多久、有没有 HMS 报错——存储用 HA 自身或轻量存储都行；在此之上出统计卡：月度耗材消耗、打印成功率、单件成本。为什么值得：打印历史归档是多打印机用户的真实痛点——农场玩家尤其需要哪台机器、哪种耗材、失败率多少的经营视角；卡片已有多打印机、温度趋势、提醒这些基建，增量开发顺理成章；功能补齐后，HACS 项目的完整度与关注度都会上一个台阶，上游没有的我有就是最好的宣传语。落地步骤：第一步，定数据模型：一次打印任务的字段清单（模型名、耗材类型与克重、起止时间、结果、HMS 码），对齐 ha-bambulab 能拿到的事件流；第二步，实现事件监听与落库，先在 HA 的存储里跑通，验证断电重启后数据不丢；第三步，做统计聚合与前端卡片：月度耗材柱状、成功率环形、单件成本估算；第四步，用自己的打印机跑满一个月，用真实账单数据写发布文——你的打印机其实一直在给你记账，只是没人存下来，这个角度本身就值得传播。","tags":["新功能","平台化"],"effort":"一周级","id":"a355"},{"kind":"延伸创意","title":"Persona 分享仓：agent-purge 的注册表与一键安装","url":"","source":"延伸创意 · 基于 agent-purge（自有 npm 项目平台化）","date":"2026-11","summary":"personas 本来就是 markdown 文件——加 agent-purge registry add 与 install 子命令，支持从 Git 仓/Gist 拉取 persona 包，安装前 diff 预览 + 兼容性提示，官方维护精选仓。","takeaways":["类型：自有项目平台化 · 成本：零 · 可行性：一周级","把你的 system prompt 分享给我是 AI 社区的高频需求","注入通道与 npm 分发已铺好，差的只是分享闭环","精选 persona 仓能形成社区内容飞轮"],"whyValuable":"这一步做完 agent-purge 就从个人工具变成平台，用户开始为它生产内容。","polished":"agent-purge 的 personas 本来就是 markdown 文件——这个设计现在要变成它的增长引擎。把你的 system prompt 分享给我是 AI 社区的高频需求，而 agent-purge 已经铺好了注入通道和 npm 分发，缺的只是分享闭环：加两个子命令，registry add 加 git 地址注册一个 persona 仓库，install 加 persona 名从 Git 仓或 Gist 拉取 persona 包；安装前在 web 控制台做 diff 预览——看清楚这个 persona 会改什么——并按 harness 兼容性表（matrix.json）提示兼容情况；官方再维护一个精选仓。为什么值得：这一步做完，agent-purge 就从个人工具变成平台：用户开始为它生产内容，精选仓形成社区飞轮，每个分享的 persona 都是项目的免费推广。工作量集中在 CLI 子命令和 diff UI，一周级可完成。落地步骤：第一步，定义 persona 包格式：目录结构与元数据字段（名称、描述、兼容列表、版本），保持纯 markdown 初心；第二步，实现 registry add、install、list 三个子命令与 Git 拉取逻辑；第三步，web 控制台加安装前 diff 预览与兼容性提示；第四步，官方精选仓冷启动：先把自己验证过的五到十份 persona 收进去，发布时用一键安装别人调好的 persona 当传播点。安全边界必须写死：安装第三方 prompt 前强制 diff 确认，提示注入风险由用户自担。","tags":["平台化","新功能"],"effort":"一周级","id":"a356"},{"kind":"延伸创意","title":"AI 聊天界面 CJK 字体包：claude-siyuan-font 通用化","url":"","source":"延伸创意 · 基于 claude-siyuan-font + linuxdo-idea-ui（自有项目通用化）","date":"2026-11","summary":"把思源字体注入做成通用用户脚本/小扩展：覆盖 claude.ai、ChatGPT、linux.do 等中英混排界面，内置字体栈预设（正文/代码/等宽对齐）、行高字重调节，打包字体子集免加载。","takeaways":["类型：自有项目开源化 · 成本：零 · 可行性：周末级 MVP","中英文混排字体发虚是中文用户普遍痛点，现有方案零散","idea-ui 已验证换皮不碰数据路线，周末出 MVP","低成本扩大用户面的机会"],"whyValuable":"一个只管字体、别的不碰的轻量工具正好卡进零散方案的空位，周末就能出 MVP。","polished":"claude.ai、ChatGPT 这类 AI 界面对中文用户有个共同的隐痛：中英混排时字体发虚、行高别扭、代码块和正文字体不搭。claude-siyuan-font 已经在 claude.ai 上解决了这个问题，这个创意是把它通用化：做成一个跨站点的用户脚本或小扩展，覆盖 claude.ai、ChatGPT、linux.do 等中英混排重灾区；内置几组字体栈预设（正文优先、代码优先、等宽对齐），暴露行高与字重调节；把思源字体的常用子集打包内置，避免每次加载网络字体。为什么值得：痛点足够普遍——几乎所有中文 AI 重度用户都被硌过，而现有方案零散，要么是单站脚本要么是复杂主题扩展，一个只管字体、别的不碰的轻量工具正好卡进空位；技术上 linuxdo-idea-ui 已验证了换皮不碰数据的路线，风险很低，周末就能出 MVP；这也是把两个已有项目的技术合成一个更大用户面产品的低成本机会。落地步骤：第一步，把 claude-siyuan-font 的注入逻辑抽象成站点配置加通用注入器，先支持 claude.ai 和 ChatGPT 两个站点；第二步，做预设切换面板：字体栈、行高、字重三组滑杆加预设下拉，实时生效；第三步，处理字体子集：按常用汉字频率裁剪，控制包体积，平衡加载速度与覆盖面；第四步，发布到 Greasy Fork 或商店，用三张对比图当宣传素材——这类工具的转化率完全靠 before 与 after 的视觉冲击。","tags":["开源化","新功能"],"effort":"周末级","id":"a357"},{"kind":"延伸创意","title":"408 复习站：笔记变题库，monorail 抽卡复习","url":"","source":"延伸创意 · 基于 cs-408 + python-learning 系列 + monorail（自有项目组合）","date":"2026-11","summary":"把 cs-408 笔记和 python-learning 错题整理成结构化题卡（frontmatter：题目/答案/知识点/错误次数），生成静态刷题站；再写同步器把今日该复习的卡灌进 monorail 任务池，用抽卡机制做间隔复习。","takeaways":["类型：自有项目组合 · 成本：零 · 可行性：一周级","笔记资产（cs-408 + python-learning）激活成题库","monorail 抽卡设计天然适合间隔复习","笔记→题库→复习排程全链路，本身就是自己的生产力工具"],"whyValuable":"真实笔记资产变成活的复习系统，复习节奏从凭感觉变成系统排程。","polished":"考研 408 的笔记堆在那里，python-learning 的错题散落在各处——这些是真实的资产，只是没被激活。这个创意是把它们变成一套活的复习系统：第一步先把 cs-408 笔记和错题整理成结构化题卡，用 Markdown frontmatter 定义字段（题目、答案、知识点、错误次数）；第二步生成一个静态刷题站，支持随机组卷和按知识点统计薄弱项——哪里错得多一目了然；第三步写个同步器，把今日该复习的卡按间隔复习算法（错得多的卡出现更勤）灌进 monorail 的任务池，用它的抽卡机制做每日复习——今天抽到什么卡，就复习什么。为什么值得：考研与自学生态对高质量题库的需求巨大，而这份题库的来源是自己真实整理过的笔记，质量有底气；monorail 的抽卡设计天然适合间隔复习，两个自有项目的组合让笔记到题库到复习排程全链路打通；最实际的收益是它首先是自己学习的生产力工具——做完这个，408 的复习节奏就从凭感觉变成系统排程。落地步骤：第一步，定题卡 schema 并批量转换存量笔记，先转五十张验证工作量与格式；第二步，写静态站生成器：题卡渲染、随机组卷、知识点统计，部署即用；第三步，写 monorail 同步器：按错误次数与时间间隔计算今日复习集，生成任务条目；第四步，跑两周真实复习，根据实际手感调整间隔参数。验收标准很朴素：两个月后，复习这件事还在按系统进行，而不是又回到堆笔记。","tags":["组合","新功能"],"effort":"一周级","id":"a358"},{"kind":"视频选题","title":"ID 里藏着 Emilia 的第 N 年：Re0 第四季《夺还篇》看完，我为什么还是 EMT 党","url":"https://www.bilibili.com/video/BV1JCuh62E7W","source":"选题调研 · 对标：泛式 RE0 第四季杂谈（5.2 万播放）","date":"2026-11","summary":"以 ID 由来切入，梳理第四季 Emilia 的成长线，对比花瓶争议，结尾弹幕站队 EMT 党 vs 雷姆党。核心是老粉身份认同叙事，规避速刷解说内卷。","takeaways":["类型：ACG 杂谈 · 成本：追番素材自备 · 可行性：周末级可完成","切入角别人抄不走：ID 本身就是 Emilia 梗，真人身份背书","结构：ID 由来→成长线梳理→争议对比→党派投票","时机：S4 夺还篇 2026-08-12 开播，11 月正处完结讨论期"],"whyValuable":"以 ID 即最大记忆点的真人身份叙事切入 Re0，是别人无法复制的差异化。","polished":"这是一条别人抄不走的选题：ID 就叫 Lin_Emilia玲，聊 Emilia 不需要找角度，因为角度就是自己。内容结构建议四段：开场（0-2 分钟）从 ID 由来讲起——为什么当年会把 Emilia 藏进名字里，用真粉身份抓住老粉观众；第二段（2-8 分钟）梳理第四季夺还篇里 Emilia 的成长线，对比前几季的花瓶争议，重点讲清这一季她做成了什么，而不是复述剧情；第三段（8-12 分钟）扩展到 2026 年长线番剧的追番体验——S3 刚拿下 2026 动漫奖最佳异世界动画，S4 夺还篇 8 月开播、11 月正处收尾与完结讨论期，正是话题热度窗口；结尾用弹幕与评论投票 EMT 党对雷姆党做互动钩子，拉评论区活跃。对标参考：泛式 RE0 第四季杂谈 5.2 万播放（BV1JCuh62E7W），不是你2026还爱看从零开始的异世界生活吗 19.4 万播放（BV13mt666ExT，2026-09-04）——两条对标都验证了 Re0 老粉情绪仍有稳定流量。差异化在于：对标是解说与杂谈的大角度，这条是 ID 本身就是梗的真人身份叙事，属于降维打击的记忆点。制作要点：收藏夹脑婆里的 4 条 Re0 收藏就是现成素材库；剪辑量中等，重点是口播稿的真情实感——这类选题成功的关键不是信息量而是可信度。受众是 Re0 老粉与入坑新人，是复出叙事之外最适合建立追番人设的一条。","tags":["ACG","杂谈","Re0"],"effort":"周末级","id":"a359"},{"kind":"视频选题","title":"收藏夹躺着 21 条《魔法少女的魔女审判》后，我写了这封安利信","url":"https://www.bilibili.com/video/BV1gnCBBvE5d","source":"选题调研 · 对标：泛式魔女审判全流程实况合集（完结）","date":"2026-11","summary":"无剧透安利结构：一句话科普、13 位魔女人设图鉴速览、三大卖点、差异化对比、入坑指南。开场钩子是真实数据：我为什么连收 21 条。","takeaways":["类型：ACG 安利/杂谈 · 成本：游戏截图素材 · 可行性：周末级可完成","开场钩子是真实数据：收藏夹 21 条魔女审判","B站供给几乎全是 10P 起步实况，短平快无剧透安利位空缺","游戏 2025-07-18 发售、6 天 5 万份，长尾口碑仍在发酵"],"whyValua function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// 标签统计（按出现次数降序，同次数按首现顺序）
var tagCount = {}, tagFirst = {};
IDEAS.forEach(function (it, i) {
  (it.tags || []).forEach(function (t) {
    if (!(t in tagCount)) { tagCount[t] = 0; tagFirst[t] = i; }
    tagCount[t]++;
  });
});
var tagList = Object.keys(tagCount).sort(function (a, b) {
  return tagCount[b] - tagCount[a] || tagFirst[a] - tagFirst[b];
});

function matches(it) {
  if (state.tag && (it.tags || []).indexOf(state.tag) < 0) return false;
  if (!state.q) return true;
  var hay = [it.title, it.source, it.date, it.effort, it.summary, it.whyValuable,
    (it.takeaways || []).join('\n'), (it.tags || []).join(' '), it.polished || ''].join('\n').toLowerCase();
  return hay.indexOf(state.q) >= 0;
}

function card(it, badge) {
  var title = esc(it.title);
  var h3 = it.url
    ? '<h3><a href="' + esc(it.url) + '" target="_blank" rel="noopener">' + title + ' &nearr;</a></h3>'
    : '<h3>' + title + '</h3>';
  var tagsMini = (it.tags || []).map(function (t) { return '<span class="tmini">' + esc(t) + '</span>'; }).join('');
  return '<article class="card">' +
    '<div class="top"><span class="kbadge ' + badge + '">' + esc(it.kind) + '</span>' +
    '<span class="id">' + esc(it.id) + '</span></div>' +
    h3 +
    '<div class="meta"><span>' + esc(it.date) + '</span><span>' + esc(it.source) + '</span>' +
    (it.effort ? '<span class="effort">⏱ ' + esc(it.effort) + '</span>' : '') + '</div>' +
    '<p class="summary">' + esc(it.summary) + '</p>' +
    '<ul class="uls">' + (it.takeaways || []).map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' +
    '<div class="why"><b>WHY IT MATTERS</b>' + esc(it.whyValuable) + '</div>' +
    '<div class="tags-mini">' + tagsMini + '</div>' +
    (it.polished ? '<details><summary>▸ 展开全文</summary><div class="full">' + esc(it.polished) + '</div></details>' : '') +
    '</article>';
}

function render() {
  var main = document.getElementById('main');
  var hit = 0, html = '';
  KINDS.forEach(function (k) {
    var items = IDEAS.filter(function (it) { return it.kind === k.key && matches(it); });
    hit += items.length;
    if (!items.length) return;
    html += '<section class="' + k.cls + '">' +
      '<div class="sec-head"><h2>' + k.key + ' <span class="en">// ' + k.en + '</span></h2>' +
      '<span class="sec-count">' + items.length + ' 条</span></div>' +
      '<div class="grid">' + items.map(function (it) { return card(it, k.badge); }).join('') + '</div></section>';
  });
  if (!hit) html = '<div class="empty">[ 无匹配条目 ] 换个关键词或清除标签试试</div>';
  main.innerHTML = html;
  document.getElementById('hit').textContent = hit;
}

// 标签筛选条
var tagsBox = document.getElementById('tags');
var allBtn = '<button class="tag on" data-tag="">全部 <span class="n">' + IDEAS.length + '</span></button>';
var chips = tagList.map(function (t) {
  return '<button class="tag" data-tag="' + esc(t) + '">' + esc(t) + ' <span class="n">' + tagCount[t] + '</span></button>';
}).join('');
tagsBox.innerHTML = allBtn + chips;
tagsBox.addEventListener('click', function (e) {
  var btn = e.target.closest('.tag');
  if (!btn) return;
  state.tag = btn.getAttribute('data-tag') || null;
  Array.prototype.forEach.call(tagsBox.children, function (b) {
    b.classList.toggle('on', (b.getAttribute('data-tag') || null) === state.tag);
  });
  render();
});
document.getElementById('q').addEventListener('input', function (e) {
  state.q = e.target.value.trim().toLowerCase();
  render();
});

render();
</script>
</body>
</html>
