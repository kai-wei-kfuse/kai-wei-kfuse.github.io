<style>
:root{
  --bg:#0a0a0b; --panel:#131315; --panel2:#19191c; --line:#2b2b30; --line-hi:#3d3d44;
  --yellow:#ffe14d; --yellow-deep:#f5c518; --text:#e9e7de; --dim:#9b988c; --faint:#6d6b62;
  --kind-project:#ffe14d; --kind-ext:#7ef0c8; --kind-video:#ff9e64;
  --mono:"Cascadia Code","JetBrains Mono",Consolas,"Courier New","Noto Sans SC","Microsoft YaHei",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--mono);line-height:1.65;font-size:14px}
a{color:var(--yellow);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:var(--yellow);color:#000}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px}
/* 顶部：黄黑警示条 + 标题区 */
.hazard{height:8px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 14px,#0a0a0b 14px 28px)}
header.hero{background:var(--panel);border-bottom:1px solid var(--line);padding:34px 0 26px;position:relative}
.hero .wrap{padding-bottom:0}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.back{font-size:12px;letter-spacing:.12em;color:#000;background:var(--yellow);padding:6px 14px;display:inline-block;
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));font-weight:700}
.back:hover{background:#fff;text-decoration:none}
h1{font-size:26px;letter-spacing:.06em;margin:18px 0 6px;font-weight:800}
h1 .en{color:var(--yellow)}
.sub{color:var(--dim);font-size:12.5px;letter-spacing:.05em}
.sub b{color:var(--text)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.stat{background:var(--panel2);border:1px solid var(--line);padding:8px 14px;font-size:12px;color:var(--dim);
  clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
.stat b{color:var(--text);font-size:15px;margin-right:6px}
.stat.k1 b{color:var(--kind-project)} .stat.k2 b{color:var(--kind-ext)} .stat.k3 b{color:var(--kind-video)}
/* 控制条 */
.controls{position:sticky;top:0;z-index:50;background:rgba(10,10,11,.96);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);padding:14px 0}
.controls .wrap{padding-bottom:0}
.ctl-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#q{flex:1;min-width:240px;background:var(--panel2);border:1px solid var(--line-hi);color:var(--text);
  font-family:var(--mono);font-size:13px;padding:9px 14px;outline:none}
#q:focus{border-color:var(--yellow)}
#q::placeholder{color:var(--faint)}
.count{font-size:12px;color:var(--dim);white-space:nowrap}
.count b{color:var(--yellow)}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tag{cursor:pointer;user-select:none;font-size:11.5px;letter-spacing:.04em;color:var(--dim);
  border:1px solid var(--line-hi);background:transparent;padding:4px 11px;font-family:var(--mono);transition:all .12s}
.tag:hover{color:var(--text);border-color:var(--yellow)}
.tag.on{background:var(--yellow);color:#000;border-color:var(--yellow);font-weight:700}
.tag .n{opacity:.6;margin-left:4px}
/* 分区 */
section{margin-top:44px}
.sec-head{display:flex;align-items:baseline;gap:14px;border-left:4px solid var(--yellow);padding-left:14px;margin-bottom:6px}
section.k-ext .sec-head{border-color:var(--kind-ext)}
section.k-video .sec-head{border-color:var(--kind-video)}
h2{font-size:19px;letter-spacing:.08em;font-weight:800}
h2 .en{color:var(--dim);font-size:12px;letter-spacing:.15em;font-weight:400}
.sec-count{font-size:12px;color:var(--dim)}
.sec-desc{color:var(--faint);font-size:12px;padding-left:18px;margin-bottom:18px}
/* 卡片网格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);padding:18px 18px 14px;position:relative;
  clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));
  transition:background .12s,border-color .12s;display:flex;flex-direction:column;gap:10px}
.card:hover{background:var(--panel2);border-color:var(--line-hi)}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kbadge{font-size:10.5px;letter-spacing:.1em;padding:2px 8px;border:1px solid;font-weight:700}
.kb-project{color:var(--kind-project);border-color:var(--kind-project)}
.kb-ext{color:var(--kind-ext);border-color:var(--kind-ext)}
.kb-video{color:var(--kind-video);border-color:var(--kind-video)}
.id{font-size:10.5px;color:var(--faint);letter-spacing:.08em}
.card h3{font-size:15px;line-height:1.5;font-weight:700}
.card h3 a{color:var(--text)}
.card h3 a:hover{color:var(--yellow)}
.meta{font-size:11px;color:var(--faint);display:flex;gap:8px;flex-wrap:wrap;letter-spacing:.03em}
.effort{color:var(--yellow-deep)}
.summary{font-size:12.5px;color:#c9c6ba}
.why{border-left:3px solid var(--yellow);background:rgba(255,225,77,.05);padding:8px 12px;font-size:12px;color:var(--dim)}
.why b{color:var(--yellow);font-size:10.5px;letter-spacing:.1em;display:block;margin-bottom:2px}
.uls{font-size:12px;color:#b8b5a9}
.uls li{margin-left:16px;margin-bottom:3px}
.uls li::marker{color:var(--yellow)}
.tags-mini{display:flex;gap:6px;flex-wrap:wrap}
.tmini{font-size:10.5px;color:var(--dim);border:1px dashed var(--line-hi);padding:1px 7px}
details{border-top:1px dashed var(--line);padding-top:8px}
details summary{cursor:pointer;font-size:11px;color:var(--dim);letter-spacing:.1em;user-select:none}
details summary:hover{color:var(--yellow)}
details .full{font-size:12.5px;color:#c9c6ba;margin-top:8px;white-space:pre-wrap}
.empty{color:var(--faint);font-size:12.5px;padding:30px 0;text-align:center;letter-spacing:.1em}
footer{margin-top:70px;border-top:1px solid var(--line);padding-top:18px;font-size:11.5px;color:var(--faint);
  display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media (max-width:560px){ h1{font-size:20px} .grid{grid-template-columns:1fr} }
</style>
</head>

<script>
var IDEAS = [{"kind":"项目灵感","title":"RubiksCube-TwophaseSolver（Kociemba 二阶段算法 Python 权威实现）","url":"https://github.com/hkociemba/RubiksCube-TwophaseSolver","source":"GitHub · hkociemba/RubiksCube-TwophaseSolver","date":"2026-11","summary":"魔方算法祖师爷 Kociemba 本人的官方实现，平均不到 19 步复原任意状态，纯 Python 可跑。既是魔方玩家的算法圣经，也是少有的 Python 学习者能完整读懂的漂亮代码。","takeaways":["类型：算法学习/开源项目体验 · 成本：免费 · 可行性：clone 即可跑","765 stars · GPL-3.0 · 作者 Herbert Kociemba 本人维护（2026-07 仍有更新）","平均 \u003c19 步求解任意打乱状态，二阶段算法核心实现","源码即教材：坐标系建模、剪枝表、迭代加深搜索一条龙"],"whyValuable":"算法的『命名者本人维护的权威实现』，且是纯 Python 能读懂的那种——魔方与编程两条兴趣线在这里交汇。","polished":"这个仓库的分量不用多讲：Herbert Kociemba 就是二阶段算法的提出者，『上帝之数等于 20』的论证工作建立在它之上。这份实现平均不到 19 步就能复原任意打乱状态，而且是纯 Python——不需要编译工具链，clone 下来装好依赖就能直接求解。对魔方玩家它是算法圣经，对 Python 学习者它是一份难得能完整读懂的高级代码：坐标系建模、阶段一/阶段二的剪枝表、迭代加深搜索，每一层都清清楚楚，是学习『如何用优雅的数据结构换取搜索速度』的范本。怎么开始：第一步，clone 仓库并按 README 装好依赖，把一个打乱状态喂给求解器，看它输出那串不到 20 步的解法；第二步，打开源码找坐标系部分，理解 phase1 的坐标编码（角块朝向、棱块朝向、UD 层选择），这一步读懂了，二阶段算法就懂了一半；第三步，跑它自带的求解示例，把最大求解步数调高调低，观察解的长度与求解时间的权衡——这正是二阶段算法的精髓：牺牲最优性换速度。进阶玩法：把它接到自己的项目里做一个任意魔方状态求解接口；或与 WCA 打乱（tnoodle 生成）联动，验证打乱 20 步、还原也约 20 步的对称美。对做过魔方视频的作者来说，『二阶段算法为什么能逼近上帝之数』本身就是一个能讲的选题，这个仓库就是全部素材来源。","tags":["魔方","Python","算法"],"effort":"周末级","id":"a331"},{"kind":"项目灵感","title":"tnoodle（WCA 官方打乱程序）","url":"https://github.com/thewca/tnoodle","source":"GitHub · thewca/tnoodle","date":"2026-11","summary":"所有 WCA 正式比赛的打乱公式都出自这个 Java 程序，仓库从 2010 年维护至今。对打过 WCA 的人来说，这是比赛时那张打乱纸的出厂地。","takeaways":["类型：开源拆解/情怀体验 · 成本：免费 · 可行性：可本地生成正式级打乱","478 stars · AGPL-3.0 · WCA 官方组织维护，2026-11-01 仍有提交","十五年持续维护的比赛基础设施，打乱质量即规则","打乱纸背后是随机数、过滤与质检的完整流水线"],"whyValuable":"视角独特性拉满：一个『天天受它影响却从没见过它』的官方基础设施，正好落在魔方人设的延长线上。","polished":"凡是打过 WCA 线下赛的人，都见过裁判手里那张印着打乱公式的纸，而全世界的打乱公式都出自同一个程序：tnoodle。这个由 WCA 官方组织维护的 Java 项目从 2010 年迭代至今，十五年间每一次比赛的打乱都由它生成——打乱不是随手拧几下，而是生成、过滤、质检的完整流水线，保证打乱状态足够随机又不至于过分刁钻。对魔方玩家来说，这是一个天天受它影响却从没见过它的基础设施项目。怎么开始：第一步，按 README 从源码构建或直接用发布版本，在本地生成一张和比赛同规格的打乱表，亲手复现赛前一分钟的体验；第二步，进源码看它怎么实现伪随机但合规——不同项目（三阶、金字塔、SQ1）各有独立的打乱策略与过滤规则，WCA 规则里的每条限制都对应代码里的一道检查；第三步，研究它的输出格式，顺手给自己做个每日打乱小工具，把比赛级打乱接进自己的练习流程。对有过 WCA ID 的作者还有一层意义：可以和 csTimer 的打乱实现对照着看——一个服务比赛、一个服务训练，两份代码对『什么叫合格的打乱』给出了同一套答案。这类规则如何写进代码的拆解，既是极客趣味，也天然是稀缺选题的素材库。","tags":["魔方","WCA","开源拆解"],"effort":"周末级","id":"a332"},{"kind":"项目灵感","title":"animeko（找番/追番/看番一站式多平台客户端）","url":"https://github.com/open-ani/animeko","source":"GitHub · open-ani/animeko","date":"2026-11","summary":"100% Kotlin/Compose Multiplatform 写的一站式追番平台：Bangumi 云收藏同步、离线缓存、BT 下载、弹幕云过滤全都有。追番爱好者的一个 App 全搞定答案，且工程质量高。","takeaways":["类型：开源应用体验 · 成本：免费 · 可行性：下载安装即用","21,433 stars · AGPL-3.0 · 2026-11-02 仍在高频更新","Bangumi 收藏同步 + 离线缓存 + BT 下载 + 弹幕云过滤一站配齐","Compose Multiplatform 全平台实现，可当现代客户端教科书读"],"whyValuable":"追番是站长的核心人设，而 animeko 是这个需求目前完成度最高的开源答案——好用，且值得拆。","polished":"追番党的痛点从来不是没有片源，而是工具太散：收藏在 Bangumi、下载靠 BT、弹幕要自己过滤、进度对不上。animeko 把这一整套流程塞进了一个 App：登录 Bangumi 账号后收藏自动同步，番剧更新能离线缓存、支持 BT 下载，弹幕还有云过滤规则库，真正做到一个 App 全搞定。更难得的是工程质量：整个项目 100% Kotlin，用 Compose Multiplatform 实现桌面全平台，2.1 万 star 背后是持续高频的维护节奏（2026-11-02 仍有提交），是少数能当现代跨平台客户端教科书来读的中文社区项目。怎么开始：第一步，去 releases 下载对应系统的安装包，登录 Bangumi 账号，让收藏夹先同步起来；第二步，挑一部在追的新番，把自动追踪加离线缓存跑一遍，体验和网页端追番的差别；第三步，打开弹幕云过滤设置，配置自己的屏蔽词，感受干净弹幕的可控感。进阶玩法：对开发者，它的仓库结构（多模块 Compose 工程、跨平台数据层）值得整段阅读；对内容创作者，把追番流程工程化正好与自己的追番人设契合，实测体验本身就是一期素材。同类还有 RSS 流水线方案，但 animeko 赢在开箱即用——想省事的追番党从它入手就对了。","tags":["ACG","追番","效率"],"effort":"周末级","id":"a333"},{"kind":"项目灵感","title":"manga-image-translator（一键翻译漫画/图片内文字）","url":"https://github.com/zyddnys/manga-image-translator","source":"GitHub · zyddnys/manga-image-translator","date":"2026-11","summary":"扔进一张生肉漫画图，自动检测气泡、翻译并重新嵌字，是生肉漫画党的刚需工具。演示效果直观，一帧画面就能看出 AI 做了什么。","takeaways":["类型：AI 工具体验 · 成本：免费（本地部署可选 GPU）· 可行性：单图进出，门槛低","10,567 stars · GPL-3.0 · 2026-10-11 仍有更新","气泡检测→OCR→翻译→重嵌字全自动，支持批量","效果直观：特别适合做前后对比演示"],"whyValuable":"生肉漫画党的真实刚需，而且单图进出的演示形态天然适合视频展示与实测选题。","polished":"生肉漫画党都懂那种痛：想看的番外或短篇没人汉化。manga-image-translator 解决的就是这最后一公里——把一张生肉图丢进去，它会自动完成四步：检测气泡位置、OCR 识别原文、调用翻译、把译文重新嵌回图里，输出一张熟肉。10,567 star、2026-10 仍在活跃维护，是同类项目里最成熟的一个。它最好的一点是效果直观：一张图进去一张图出来，AI 到底做了什么一眼可见，特别适合做前后对比展示。怎么开始：第一步，按 README 选择部署方式——有显卡就本地部署效果最好，没条件也可以先用项目提供的在线方式体验；第二步，找一页文字密度适中的生肉图试跑全流程，重点看两处：小字辨识准确率和嵌字后的排版是否自然；第三步，试批量模式，把一本短篇整个文件夹丢进去。踩坑预期：生僻字体、手写体和竖排文本是翻车重灾区，翻译腔也需要自己润色——把它当初翻加嵌字助理而不是成品流水线，预期就对了。对 ACG 受众，三十秒生肉变熟肉的实测对比就是现成的选题素材；对普通用户，这是把压箱底生肉消化掉的最快办法。","tags":["ACG","AI","好玩"],"effort":"周末级","id":"a334"},{"kind":"项目灵感","title":"voice-over-translation（给任意网页视频加 AI 配音字幕的油猴脚本）","url":"https://github.com/ilyhalight/voice-over-translation","source":"GitHub · ilyhalight/voice-over-translation","date":"2026-11","summary":"7.6k star 的知名油猴脚本：任意网页视频一键配上 AI 翻译配音和字幕，追生肉视频的万能钥匙。对写油猴脚本的站长来说是同行标杆。","takeaways":["类型：浏览器脚本安装 · 成本：免费 · 可行性：装上即用","7,660 stars · MIT · 2026-11-02 活跃维护","任意 HTML5 视频一键 AI 配音+双语字幕，支持多翻译源","音频抓取与合成实现是浏览器音频处理的教科书案例"],"whyValuable":"自己写油猴脚本的人的标杆参照系——它证明了油猴脚本能做到什么高度。","polished":"看生肉视频最大的障碍是语言，而 voice-over-translation（VOT）给了一步到位的答案：装上这个油猴脚本后，任意网页视频——YouTube、各种课程站、甚至小众站点——都能一键挂上 AI 翻译配音和双语字幕。7,660 star 的体量说明它早已不是小众玩具，而是网页视频翻译这个细分领域事实上的标杆，MIT 协议、2026-11 仍在活跃维护。怎么开始：第一步，先装 Tampermonkey，再从脚本发布页安装 VOT，随便开一个英文视频点悬浮按钮试效果；第二步，在设置里切换翻译与语音合成服务源，对比不同源的翻译质量与延迟，找到自己舒服的组合；第三步，遇到支持不佳的站点，去 issue 区搜一搜——大概率有人踩过同样的坑。对作者而言它还有第二层价值：自己就在写油猴脚本，VOT 就是油猴脚本能做到什么高度的参照系。值得重点读的是它怎么在浏览器里拿到视频音轨、怎么做分段请求与音画同步——这套浏览器音频处理管线是教科书级的实现，读完对自己脚本的工程化程度会有直观的标尺。写出一个七千多 star 的脚本是什么体验，这个视角也天然适合做拆解内容。","tags":["油猴脚本","ACG","效率"],"effort":"周末级","id":"a335"},{"kind":"项目灵感","title":"learn-claude-code（从 0 到 1 手写迷你版 Claude Code）","url":"https://github.com/shareAI-lab/learn-claude-code","source":"GitHub · shareAI-lab/learn-claude-code","date":"2026-11","summary":"教学向仓库，带你从零手搓一个 nano 级 agent harness，近 8 万 star。Bash is all you need——看懂 agent 循环的最短路径。","takeaways":["类型：跟练学习 · 成本：免费 · 可行性：按教程写完即成","79,756 stars · MIT · 2026-10-27 仍在更新","核心主线：agent 循环、工具调用、上下文管理的手工实现","Python 便可跟练，是理解 Claude Code 类工具内部机理的捷径"],"whyValuable":"正在学 Python 又每天在用 coding agent 的人，两条学习线在这里拧成一股绳。","polished":"用 Claude Code 的人很多，知道它里面是什么的人很少。learn-claude-code 是一份教学向仓库，主张 Bash is all you need：带你从零手搓一个 nano 级的 agent harness，把 agent 循环、工具调用、上下文管理这些听起来玄乎的东西亲手实现一遍。近 8 万 star 的热度说明看懂 agent 是当下最普遍的学习诉求，而这份仓库给的就是最短路径——不陷入官方源码的迷宫，直接写一个最小的能跑的。怎么开始：第一步，clone 仓库配好 Python 环境，把最小可运行版本跑起来，跟它说一句话看它怎么决定调用工具；第二步，跟着教程逐个补齐能力：给 agent 挂上执行 bash、读写文件等工具，观察每加一个工具，行为会发生什么变化；第三步，自己动手改上下文管理——为什么对话长了它会失忆、系统提示占了多少预算，改一遍就全懂了。跟练完成后的收获非常具体：之后再配 CLAUDE.md、选 MCP 工具、调 prompt，都能说出这是在改循环里的哪一环。对正在学 Python 又每天在用 coding agent 的人，这个仓库把两条学习线拧成了一股绳，是花一个周末非常值得的投资，跟练过程本身也适合做成系列内容。","tags":["ClaudeCode","Python","学习"],"effort":"周末级","id":"a336"},{"kind":"项目灵感","title":"magpie（菜单栏一站接管所有 coding agent 的模型）","url":"https://github.com/yetone/magpie","source":"GitHub · yetone/magpie","date":"2026-11","summary":"2026 年 9 月出现的黑马：菜单栏里给 Codex 挂 DeepSeek、给 Claude Code 挂 Kimi，一个图标管理所有 agent 的模型。作者 yetone 两周冲到 2.8 万 star。","takeaways":["类型：新工具体验 · 成本：免费 · 可行性：安装即用","28,334 stars · MIT · 2026-09-23 创建，两周即爆红","菜单栏一站管理所有 coding agent 的模型分配，免手改配置","作者 yetone 是 avante.nvim / ast-grep 作者，工程质量有背书"],"whyValuable":"当模型价格与能力快速变动时，随时给任务换最合适的模型从麻烦事变成顺手事——重度用户的实打实成本优化。","polished":"同时折腾 Claude Code、Codex、OpenCode 的人都会遇到同一个麻烦：每家的 API 供应商配置格式不一样，切换一次就要手改一次 JSON。magpie 把这事做成了菜单栏里的一枚图标：给 Codex 挂 DeepSeek、给 Claude Code 挂 Kimi，所有 agent 用什么模型在一个面板里点选完成。项目 2026-09-23 才创建，两周冲到 2.8 万 star，是 2026 年下半年 coding agent 工具链里最猛的黑马；作者 yetone 是 avante.nvim 和 ast-grep 的作者，社区信任度直接拉满。怎么开始：第一步，按 README 安装桌面端，让它扫描本机已有的 coding agent 配置；第二步，给每个 agent 指定模型与供应商，然后故意切换一次，回配置文件确认它改了什么、备份了什么——用一次就明白它管理的是哪一层；第三步，把常用的模型组合固化下来，体验换模型像换输入法的感觉。它的价值不只是省事：当各家模型的价格与配额快速变动时，把合适的模型随时换给合适的任务，对重度用户是真实的成本优化。同类先行者 cc-switch 已经验证了这个需求，magpie 用更轻的菜单栏形态接住了它，两个都用过会更清楚自己需要什么。","tags":["ClaudeCode","效率","新品"],"effort":"周末级","id":"a337"},{"kind":"项目灵感","title":"claude-hud（Claude Code 实时仪表盘插件）","url":"https://github.com/jarrodwatts/claude-hud","source":"GitHub · jarrodwatts/claude-hud","date":"2026-11","summary":"Claude Code 实时仪表盘插件：上下文用量、正在调用的工具、运行中的 agent 和 todo 进度一目了然。对写用量追踪工具的人来说是同类思路的漂亮实现。","takeaways":["类型：插件安装 · 成本：免费 · 可行性：装上即用","29,080 stars · MIT · 2026-11-02 活跃维护","实时显示上下文余量、工具调用、agent 状态与 todo 进度","与 aiusage 同一赛道：把看不见的开销可视化"],"whyValuable":"既是装上就回不去的体验升级，又是 aiusage 同赛道的竞品样本——看懂别人的取舍再回来审视自己的产品。","polished":"Claude Code 用起来最焦虑的一刻，是不知道上下文还剩多少、它现在到底在干嘛。claude-hud 给 Claude Code 装了一块仪表盘：上下文用量实时可见，正在调用什么工具、后台跑了哪些 agent、todo 推进到哪一步，全都一目了然。29,080 star、MIT 协议、2026-11-02 仍在活跃维护，属于装上就回不去的那类体验升级。怎么开始：第一步，按 README 的插件安装方式装进 Claude Code，重启会话即可看到 HUD；第二步，正常跑一个多步骤任务，盯着上下文曲线看它什么时候跳涨——压缩发生在哪、系统提示占了多少，看两轮就建立起预算感；第三步，把它当成工作习惯的一部分：开新任务前先看一眼余量，决定是精简上下文还是直接开新会话。对写过 aiusage 的作者还有一层特殊意义：自己做的是 AI 用量可视化这条赛道，claude-hud 是同一思路在 agent 会话场景的漂亮实现，值得对比三件事——它选了哪些指标、粒度到哪一层、实时性怎么做的。看懂别人的取舍再回来审视自己的产品路线，比闷头写代码有用得多；它既是工具，也是现成的竞品调研素材。","tags":["ClaudeCode","效率","用量追踪"],"effort":"周末级","id":"a338"},{"kind":"项目灵感","title":"andrej-karpathy-skills（用 Karpathy 的 LLM 编码观察调教 agent）","url":"https://github.com/multica-ai/andrej-karpathy-skills","source":"GitHub · multica-ai/andrej-karpathy-skills","date":"2026-11","summary":"把 Karpathy 总结的 LLM 编码通病浓缩成一份 CLAUDE.md，号称让 Claude Code 少犯蠢，22.8 万 star 的现象级单文件仓库。好玩点在用大佬语录调教 AI 这个行为本身。","takeaways":["类型：Prompt 资产/对照实验 · 成本：免费 · 可行性：复制即用","228,403 stars · 无 license · 2026-04 后未再更新（现象级但已沉淀）","单文件仓库：一份浓缩 LLM 编码通病与纠正规则的 CLAUDE.md","最正确的打开方式是做对照实验：挂与不挂各跑一周"],"whyValuable":"既是一份现成 prompt 库，又是一个自带流量的实验选题——用语录调教 AI 这个现象本身就值得测。","polished":"这可能是 2026 年最行为艺术的开源项目：一个几乎只有一份文档的仓库，228,403 star。它做的事情是把 Andrej Karpathy 公开吐槽过的 LLM 编码通病——过度设计、假装跑过测试、悄悄改需求之类——浓缩成一份可直接使用的 CLAUDE.md，让 Claude Code 在动手前先背一遍大佬的教训。无 license、2026-04 后不再更新，但作为一份社区共识的沉淀物，它的传播度已经证明了价值。怎么开始：第一步，通读全文，先当吐槽文集看，把我也这样的条目标出来；第二步，把自己高频遇到的五到八条抄进自己的 CLAUDE.md——别全抄，上下文也是钱；第三步，做对照实验：同一类任务，挂与不挂各跑一周，记录实际行为差异——是风格变了还是真的少犯错，用输出说话。这个项目真正值得琢磨的不是文件本身，而是用语录调教 AI 这个现象：为什么大佬的骂人话能变成 prompt 资产？它起作用的边界在哪？对天天折腾 agent 的作者，这既是一份现成的 prompt 库，也是一个天然有钩子的实验选题——跑了一周，我的 agent 代码风格真变了吗——结论无论正反都有内容可写。","tags":["ClaudeCode","好玩","Prompt"],"effort":"周末级","id":"a339"},{"kind":"项目灵感","title":"smalltv-mod（给 GeekMagic 小电视刷出 Claude 用量条/航班雷达/HA 面板）","url":"https://github.com/giovi321/smalltv-mod","source":"GitHub · giovi321/smalltv-mod","date":"2026-11","summary":"给几十块的 GeekMagic ESP32 小电视刷自定义固件：五种模式包括 Claude 用量条、实时航班雷达、Home Assistant 面板。一个项目同时命中三个兴趣点。","takeaways":["类型：硬件刷机 DIY · 成本：硬件约几十元 · 可行性：网页刷机，门槛低","148 stars · WTFPL · 2026-06 创建，2026-11-01 仍活跃","五种模式：Claude 用量条 / 航班雷达 / HA 驱动屏等","ESP32 + AI 用量 + 智能家居三兴趣的完美交叉"],"whyValuable":"一个几十块的硬件同时接住用量追踪、Home Assistant 和桌面摆件三个兴趣，刷完既是生产力又是装饰。","polished":"几十块钱的 GeekMagic ESP32 小电视，刷上 giovi321 的 smalltv-mod 固件后，就从电子相框变成了全能桌面副屏：五种模式里最出圈的是 Claude 用量条——agent 还能不能跑，抬头看一眼桌上的小电视就知道；此外还有实时航班雷达和 Home Assistant 驱动的面板模式，等于把 AI 额度、世界动向和全屋智能状态全塞进了这块小屏幕。项目 2026-06 创建、WTFPL 协议，2026-11-01 仍在活跃更新，star 数不大（148）但定位恰好是 ESP32、用量追踪、智能家居三个兴趣的完美交叉。怎么开始：第一步，买一块 GeekMagic 小电视，确认型号在固件兼容列表里；第二步，按 README 用浏览器刷入固件——这类 ESP32 项目基本都支持网页刷机，不用装复杂工具链；第三步，进配置页填上 Claude 用量接口与 Home Assistant 的地址，让用量条和家居面板先跑起来。动手过程中的可玩点在自定义：屏幕布局、显示哪些指标、多久刷新一次，都可以按自己的喜好改。刷完的成品既是生产力工具又是桌面装饰，桌面摆一台会显示 Claude 用量的电子小电视本身就是回头率很高的成品，也天然是一期刷机实录素材。","tags":["ESP32","HomeAssistant","AI用量","好玩"],"effort":"周末级","id":"a340"},{"kind":"项目灵感","title":"bambuddy（Bambu 打印机自托管指挥中心，不依赖官方云）","url":"https://github.com/maziggy/bambuddy","source":"GitHub · maziggy/bambuddy","date":"2026-11","summary":"Your Bambu. No Cloud. Your Rules.：自托管 Bambu 打印机指挥台，从一台 A1 管到整个打印农场，数据全留在自己家里。","takeaways":["类型：自托管部署 · 成本：免费（需一台常开主机）· 可行性：Docker 起服务即用","3,242 stars · AGPL-3.0 · 2025-11 创建，2026-11-02 活跃","脱离官方云的打印机中控：多机管理与监控","与 bambu-dashboard-card / ha-bambulab 互补：一个中控，一块面板"],"whyValuable":"打印机去云化需求目前最完整的开源答案之一，且正好补上自有 bambu 生态里中控这块拼图。","polished":"拓竹打印机默认要走官方云，这让自托管玩家总觉得差口气。bambuddy 的口号把态度写在了脸上：Your Bambu. No Cloud. Your Rules.——一个自托管的 Bambu 指挥中心，从手里的一台 A1 到一整面墙的打印农场都能管，数据全留在自己家里。3,242 star，AGPL-3.0，2025-11 创建后持续活跃（2026-11-02 仍有提交），是打印机去云化这个需求目前最完整的开源答案之一。怎么开始：第一步，按 README 用 Docker 在 NAS 或家里常开的小主机上起服务，打印机在局域网内配对——关键前提是打印机和主机在同一网段；第二步，把现有打印任务迁移过来跑一个完整任务，对比官方 App：监控视角多了什么、少了什么；第三步，多机用户重点试农场视图，单机用户则把它当成局域网内常开的打印机主页。对已经有 bambu-dashboard-card 和 ha-bambulab 的作者，bambuddy 是生态拼图的另一块：HA 面板负责嵌进全屋，bambuddy 负责打印机自己的指挥台，两者互补而非重复。它同时是自托管实践的优质样本——一套标准的 Web 服务该有监控、状态、通知怎么组织，读完它的实现思路会有参考答案。","tags":["3D打印","自部署","HomeAssistant"],"effort":"周末级","id":"a341"},{"kind":"项目灵感","title":"Bambu-Lab-RFID-Library（社区扒出来的 Bambu 耗材 RFID 标签数据库）","url":"https://github.com/queengooborg/Bambu-Lab-RFID-Library","source":"GitHub · queengooborg/Bambu-Lab-RFID-Library","date":"2026-11","summary":"社区把 Bambu 原厂耗材的 RFID 标签逐个扫描建库，专门研究为什么第三方耗材不被识别。极客味十足的开源逆向工程样本。","takeaways":["类型：逆向数据仓库研究 · 成本：免费 · 可行性：读库+贡献即可参与","413 stars · GPL-3.0 · 2026-10-30 活跃更新","社区自建的原厂耗材 RFID 标签数据库，逐个扫描入库","第三方耗材识别难题的核心情报源"],"whyValuable":"从『不认识』到『认识』的干净逆向样本——比任何破解耗材的传闻都可靠的第一手资料。","polished":"Bambu 玩家都遇到过那个提示：耗材无法识别。为什么原厂耗材插上就认，第三方的就报错？Bambu-Lab-RFID-Library 是社区给出的硬核答案：志愿者把原厂耗材的 RFID 标签逐个扫描、解析、建库，把识别背后的数据逻辑摊开在阳光下。这个仓库不写代码黑魔法，它做的事情更本质——积累数据。413 star、GPL-3.0，2026-10-30 仍在活跃更新，是研究厂商为什么锁定耗材这个问题的第一手资料库。怎么开始：第一步，读 README 和 wiki，搞清楚 RFID 标签里存了什么字段、打印机校验什么；第二步，对照自己手里的耗材查库，看自己买的是已收录还是空白区；第三步，有设备的话按贡献流程扫描自己的标签提交 PR——你手里每一卷耗材都是数据库缺的那一行。它的价值分两层：实用层，第三方耗材玩家可以据此理解兼容性现状与可能的解决路径；学习层，这是一份干净的逆向工程样本——怎么从黑盒到白盒、怎么把单点发现变成社区协作的数据库，方法论本身比结论更值得学。对喜欢刨根问底的玩家，这个仓库就是最可靠的起点。","tags":["3D打印","逆向","极客"],"effort":"周末级","id":"a342"},{"kind":"项目灵感","title":"SolidCraft（纯 Rust 参数化 3D CAD，支持 MCP 自动化）","url":"https://github.com/tangency-labs/solidcraft","source":"GitHub · tangency-labs/solidcraft","date":"2026-11","summary":"2026 年 10 月新发布的参数化 3D CAD：桌面/Web/CLI 三形态，还能通过 MCP 让 AI 直接生成模型。3D 打印玩家从建模软件跳到 agent 写代码出模型的新玩法。","takeaways":["类型：新工具体验 · 成本：免费 · 可行性：三形态按需选用","13,097 stars · Apache-2.0 · 2026-10-07 创建即爆红","参数化 CAD + MCP：AI 可直接生成/修改可打印模型","桌面、Web、CLI 三形态，脚本化建模天然适配自动化"],"whyValuable":"补上从想法到模型的最后一环：对 agent 说要什么，它写参数化代码，直接出可打印模型。","polished":"SolidCraft 是 Rust 重写一切与 AI 生成一切两条潮流的交汇点：一个纯 Rust 写的参数化 3D CAD，2026-10-07 发布，一个月冲到 13,097 star。它最特别的不是建模能力本身，而是原生支持 MCP——意味着 Claude 这类 agent 可以直接通过协议生成和修改模型。对 3D 打印玩家，这打开了一种新玩法：不再是打开软件拖鼠标导出 STL，而是对 agent 说要什么、它写参数化代码、直接出可打印模型。怎么开始：第一步，从三形态里挑一个上手——想快速感受就开 Web 版，想接进工作流就用 CLI；第二步，先手动建一个简单参数化模型（比如一个可调尺寸的收纳盒），理解它的建模语法；第三步，把 MCP 接上，让 agent 改参数、生成变体，观察人说需求、AI 出模型的流程在哪个环节还需要人工兜底。落地场景非常具体：家里缺什么收纳件、支架、卡扣，描述清楚就出一版，打印验证再迭代。对自研过 bambu 生态组件、收藏夹里 3D 打印第一位的作者，这个工具正好补上从想法到模型的最后一环，也让 agent 直接写代码出模型再上机成为一条现成的内容线。","tags":["3D打印","Rust","MCP","新品"],"effort":"周末级","id":"a343"},{"kind":"项目灵感","title":"FilmCraft（纯 Rust 从零写的非线性视频编辑器）","url":"https://github.com/storytold/filmcraft","source":"GitHub · storytold/filmcraft","date":"2026-11","summary":"Rust 重写一切阵营的最新战果：从零手写的非线性视频编辑器，2026 年 9 月出现即 1.7 万 star。对每天剪视频的人既是工具候选，又是绝佳观察素材。","takeaways":["类型：新工具试用 · 成本：免费 · 可行性：下载体验即可上手","17,282 stars · Apache-2.0 · 2026-09-30 创建，热度极高","从零实现的非线性剪辑器，不基于现有引擎套壳","真实评测视角：拿一期真实视频来剪，看能替代几成 Pr"],"whyValuable":"天天剪视频的人评测新剪辑器是自带动机的选题，且能沉淀出可信的工具结论。","polished":"视频剪辑软件多年被几家商业巨头垄断，而 FilmCraft 选择了最难的路：不套壳、不基于现有引擎，用 Rust 从零写一个非线性视频编辑器。2026-09-30 出现，一个月内 17,282 star，是 Rust 重写一切阵营的最新战果。热度之外更值得琢磨的是它的定位：对每天要剪视频的人来说，它首先是工具候选——能不能接住真实的剪辑工作流，一试便知。怎么开始：第一步，下载对应平台的版本，先导入一段素材熟悉时间线手感，重点感受剪辑响应速度——这正是 Rust 从零实现最可能拉开差距的地方；第二步，拿一期真实要发的视频完整剪一遍，记录每个卡住的时刻：找不到的功能、不顺手的交互、渲染问题；第三步，把体验写成对比清单：FilmCraft 能替代 Pr 的哪几成、哪些环节还必须回去。这个项目对内容创作者还有一层天然价值：新编辑器实测是自带动机的选题——既有工具实用价值，又能以真实工作流为试金石给出可信结论，比云评测有说服力得多。开源剪辑器的进化值得长期跟进，现在入场正好从头围观一个项目长成，每半年回访一次就是稳定的系列素材。","tags":["Rust","视频","新品"],"effort":"周末级","id":"a344"},{"kind":"项目灵感","title":"cleanyourtv（WiFi 远程给 Android/Google TV 瘦身去广告）","url":"https://github.com/Gathin23/cleanyourtv","source":"GitHub · Gathin23/cleanyourtv","date":"2026-11","summary":"不用拆机不用线，WiFi 远程给任意 Android/Google TV 去预装去广告，换成 Apple TV 风格桌面，上线一个多月 5 万 star。家里那台广告机有救了。","takeaways":["类型：一键工具 · 成本：免费 · 可行性：一条命令级操作","50,039 stars · license 标注 NOASSERTION · 2026-10-17 创建","WiFi 远程完成：去预装、去广告、换 Apple TV 风格桌面","动系统层操作，刷前务必备份并自担风险"],"whyValuable":"立竿见影解决全球性愤怒：一台广告机当场变回一台正常的电视。","polished":"家里的智能电视越用越像广告机：开机广告、预装应用、推流首页，关都关不掉。cleanyourtv 提供了一条几乎零门槛的路径：不用拆机、不用数据线，同一 WiFi 下远程操作，给 Android/Google TV 去掉预装与广告，再换上一套 Apple TV 风格的清爽桌面。项目 2026-10-17 上线，一个多月 50,039 star——这个数字说明被广告机折磨是全球性的共同愤怒。怎么开始：第一步，确认自家电视系统在支持列表内，通读 README 的风险说明——这是动系统层的操作，极端情况可能需要恢复出厂，重要设置先截图备份；第二步，按指引在同一局域网下执行远程流程，先做去广告去预装这一步，重启看效果；第三步，装上它的桌面启动器，把常用 App 固定到首页，体验开机即内容的干净感。它的价值立竿见影：一台广告机当场变回一台正常的电视。要注意两点：license 标注为 NOASSERTION，商用或再分发前需要自己确认条款；系统级操作始终有变砖风险，动手前把预期和退路想清楚。对家里有多台电视的人，第一台成功后第二台就是五分钟的事，全家推广毫无压力。","tags":["效率","电视","新品"],"effort":"周末级","id":"a345"},{"kind":"项目灵感","title":"openai/math（OpenAI 开源的内部模型数学手稿与证明工件）","url":"https://github.com/openai/math","source":"GitHub · openai/math","date":"2026-11","summary":"OpenAI 把内部模型产出的数学手稿和部分 Lean 形式化证明当原始研究数据直接开源，2026 年 10 月上线即 1.7 万 star。一份能直接翻的 AI 数学家作业本。","takeaways":["类型：一手研究资料阅读 · 成本：免费 · 可行性：线上翻阅即可","17,270 stars · Apache-2.0 · 2026-10-06 上线","内容为模型产出的数学手稿与 Lean 形式化证明工件","罕见的一手样本：直接观察前沿模型的真实数学能力边界"],"whyValuable":"比任何评测榜单都更接近真相的一手材料：AI 数学家作业本就摊在那里，可以逐页翻。","polished":"AI 的数学能力到底多强，大多数时候只能听宣传。openai/math 提供了更硬的东西：OpenAI 把内部模型产出的数学手稿、以及部分 Lean 形式化证明，作为原始研究数据直接开源。2026-10-06 上线即 17,270 star——大家都是来翻 AI 数学家作业本的。这份材料的珍贵之处在于它是原始工件而非精选案例：你能看到成功的证明，也能看到它的工作方式，这比任何评测榜单都更接近真相。怎么开始：第一步，从 README 的目录结构入手，弄清手稿、证明工件各放在哪、覆盖哪些数学领域；第二步，挑一个自己熟悉的领域读进去——有背景知识的领域才能看出门道：证明的思路是不是人的思路，形式化过程哪里漂亮哪里笨拙；第三步，对照社区讨论与 issue，看专业数学家怎么评价这批材料。对不同人的价值不同：对 OI 和算法背景的人，这是能直接对谈的对手写出来的作业；对关注 AI 的人，这是观察模型做研究的一手窗口；对内容创作者，翻 AI 数学家的作业本本身就是一个天然有钩子的选题——大众对 AI 现在多强的好奇永远在线，而这份材料给了具体的、可展示的答案。","tags":["数学","AI","新品"],"effort":"周末级","id":"a346"},{"kind":"延伸创意","title":"时间账本 × AI 账本：monorail 周报里的 AI 成本面板","url":"","source":"延伸创意 · 基于 monorail + aiusage（自有项目组合）","date":"2026-11","summary":"写一个关联层：把 monorail 的时间条目和 aiusage 的会话/成本数据按时间窗 join，回答这个任务烧了多少 token、每小时 AI 成本多少。先做 CLI 报表跑通，再内嵌进 monorail 周回顾面板。","takeaways":["类型：自有项目组合功能 · 成本：零（全本地数据）· 可行性：一周级可跑通","两份本地数据 join 出市面没有的按任务归因 AI 成本视角","第一步可先做 AI 会话自动补录周末级 MVP，再上 join 分析","顺带产出博客年度复盘素材：AI 时代的时间账本"],"whyValuable":"市面上的用量工具都停在总量统计，按任务归因 AI 开销的视角是独有的，且不引入任何新数据源。","polished":"手里有两份彼此封闭的数据：monorail 记着每段时间花在哪，aiusage 记着每次 AI 会话烧了多少 token、多少钱。这个创意就是把两者 join 起来：读取 monorail 本地 Markdown+YAML 的时间条目和 aiusage export 出的会话/成本数据，按时间窗对齐，回答三个现在没人能回答的问题——这个任务烧了多少 token？每小时 AI 成本多少？今天的 AI 密度（tokens 除以专注小时）是多少？为什么值得：市面上的用量工具都停在总量统计，没有人做按任务归因的 AI 成本，这个视角是独有的；两份数据都是本地文件，不引入任何新数据源，工程边界干净。做完之后它既是 monorail 的差异化功能，又天然产出内容——年底把我这一年 AI 怎么花钱写成复盘，就是一篇现成的博客。落地步骤：第一步，先写独立 CLI 报表跑通 join 逻辑，输出任务乘 token 和成本的表格，验证按小时窗还是按项目标签对齐更符合直觉；第二步，做一个周末级 MVP 增强——AI 会话自动补录：扫描 aiusage 已解析的会话时间戳，按项目与 monorail 标签的映射配置，把日历里没有计时覆盖的 AI 会话时段自动生成为补录条目（预览确认后写入），顺手解决 monorail 忘记计时的老痛点；第三步，把报表内嵌进 monorail 已有的每周回顾面板，做成 AI 成本密度卡片。数据敏感点只有一个：时间戳对齐的时区与跨天问题，先定规则再写代码。","tags":["组合","新功能","内容生产"],"effort":"一周级","id":"a347"},{"kind":"延伸创意","title":"Persona 用量归因：哪个 system prompt 最烧 token","url":"","source":"延伸创意 · 基于 agent-purge + aiusage（自有项目组合）","date":"2026-11","summary":"agent-purge 在启动层本就知道每次用的是哪个 persona，加一个活跃时间窗记录，与 aiusage 成本数据 join 后在 web 控制台画 persona × token × 会话数图表。","takeaways":["类型：自有项目组合功能 · 成本：零 · 可行性：一周级","两个已发布 npm 的项目组合出 persona 性价比视角，无同类工具","agent-purge 从提示词工具走向可度量的第一步","产出：persona × token/成本 × 会话数图表 + 月度归因结论"],"whyValuable":"能度量才谈得上优化——这一步让 agent-purge 的产品故事从提示词管理完整一截。","polished":"每个折腾 agent 的人手里都攒了好几套 persona（system prompt），但从来没人算过：哪一套最费钱？这个创意把两件已有的事接起来：agent-purge 在 shim/启动层本来就知道每次启动用的是哪个 persona，给它加一个活跃时间窗记录；再与 aiusage 的会话与成本数据按时间 join，就能在 web 控制台画出一张 persona × token/成本 × 会话数的图表，直接回答这个月 40% 的钱花在了 persona X 下。为什么值得：两个项目都已发布 npm、有真实用户，组合出的 persona 性价比视角没有同类工具做过；对 agent-purge 本身，这是从提示词管理工具走向可度量工具的第一步——能度量，才谈得上优化，产品故事立刻完整一截。数据关联本身也是很好的学习题材：怎么在启动层埋点、怎么做时间窗 join、怎么画不误导人的图。落地步骤：第一步，在 agent-purge 的启动路径上加 persona 活跃记录（本地日志即可，格式向 aiusage 靠拢方便 join）；第二步，写 join 脚本按时间窗对齐两份数据，先输出命令行报表验证正确性；第三步，在 web 控制台加图表页，主指标定为每个 persona 的月度成本占比与会话数，辅以单位会话成本；第四步，用自己一个月的真实数据跑一遍，写一篇我的哪套 persona 最烧钱作为首个发布内容。边界提醒：join 精度取决于时间戳粒度，先跑通粗粒度再谈精确归因。","tags":["组合","新功能"],"effort":"一周级","id":"a348"},{"kind":"延伸创意","title":"Linux.do Toolkit：三个油猴脚本合并成一个 MV3 浏览器扩展","url":"","source":"延伸创意 · 基于 linuxdo-keyword-highlighter + linuxdo-idea-ui + Linuxdo-Export-Markdown（自有脚本合并）","date":"2026-11","summary":"把关键词高亮、摸鱼换肤、帖子导出三个脚本重写为一个 Manifest V3 扩展，模块化开关，设置走 chrome.storage，上架 Chrome/Edge 商店。","takeaways":["类型：自有项目平台化 · 成本：零 · 可行性：月级工程","三脚本共用 linux.do 页面解析逻辑，合并即去重","油猴门槛（装 Tampermonkey）变成商店一键安装，触达面放大","已作废的 auto-nested-view 不迁移，范围收敛"],"whyValuable":"从会折腾的用户扩大到所有 linux.do 用户，上架商店是自带完成感叙事的清晰里程碑。","polished":"手里三个 linux.do 脚本——关键词高亮、摸鱼换肤、帖子导出 Markdown——各有真实用户，但都被同一个天花板压着：油猴脚本要求先装 Tampermonkey，门槛劝退一大半普通用户，而且永远进不了商店分发。这个创意是把三者重写成一个 Manifest V3 浏览器扩展 Linux.do Toolkit：content script 按域名/功能拆分模块，每个功能独立开关，设置走 chrome.storage 同步，导出功能加右键菜单入口；已作废的 auto-nested-view 明确不迁移，范围收敛。为什么值得：三个脚本共用 linux.do 的页面解析逻辑，合并本身就是一次去重重构；完成后一次安装全功能，触达从会折腾的用户扩大到所有 linux.do 用户；上架商店是清晰的里程碑，自带完成感叙事，也正好构成油猴变扩展的开发日志连载素材。落地步骤：第一步，把三个脚本里重复的页面解析代码抽成共享模块，先在油猴形态下验证重构没有破坏功能；第二步，搭 MV3 骨架：manifest、按功能拆分的 content scripts、options 页，把设置迁移到 chrome.storage；第三步，逐个功能迁移并做开关灰度——先迁高亮的解析核心，再迁导出的 HTML 转 MD 转换；第四步，权限声明最小化，准备截图与商店文案，提交 Chrome 与 Edge 商店审核。月级工程的正确节奏是按周切里程碑：第一周重构、第二周骨架、第三周迁移、第四周上架，别一口气吞。","tags":["组合","开源化","平台化"],"effort":"月级","id":"a349"},{"kind":"延伸创意","title":"文摘采集管线：linux.do 一键归档进终末地文摘","url":"","source":"延伸创意 · 基于 Linuxdo-Export-Markdown + endfield-digest + simhash（自有项目组合）","date":"2026-11","summary":"在导出脚本/扩展上加归档到文摘按钮：导出的 Markdown 经正文清洗后，用 simhash 比对文摘库避免重复，再走 GitHub API 提 commit/PR，人工只做一次确认。","takeaways":["类型：自有项目组合管线 · 成本：零 · 可行性：一周级","330 篇文摘库的瓶颈在持续供给，不在展示","simhash 中文去重思路现成，管线只差清洗/去重/提交三段","把刷论坛的顺手动作变成采集动作"],"whyValuable":"检索站的持续供给从手动整理降为顺手点一下，维护成本骤降，一周级就能建成闭环。","polished":"endfield-digest 已有 330 篇文章存量，检索型站点的形态也跑通了，真正的瓶颈浮出水面：内容持续供给靠手动整理不可持续。这条管线把刷论坛和喂文摘接成一个动作：在已有的导出脚本（或未来的扩展）上加一个归档到文摘按钮——导出的 Markdown 先经过正文清洗（去广告、去水贴格式），再用 simhash 与文摘库做相似度比对避免重复收录（中文去重的思路是现成的），最后走 GitHub API 向文摘仓库提一个 commit 或 PR。进站前人工只做一次确认，维护成本从每次手动整理降到顺手点一下。为什么值得：导出脚本已经解决了 flat/nest 楼层解析和 HTML 转 MD 两大难题，这条管线只差清洗、去重、提交三段，一周级可完成；它同时是内容生产自动化的最小闭环，做完后文摘站的更新频率直接取决于刷论坛的频率。落地步骤：第一步，写清洗模块：定义什么算正文的规则，在几篇典型帖子上验证效果；第二步，集成 simhash 去重：对库存量文章建指纹索引，设定相似度阈值，用几组近似文章调参；第三步，接 GitHub API 提 PR，附带来源链接与清洗前后 diff，方便人工确认；第四步，把按钮挂进导出流程，跑一周真实使用，统计误杀与漏收再调阈值。验收标准很简单：从看到好帖到进文摘库，全程不超过两分钟人工介入。","tags":["组合","内容生产","自动化"],"effort":"一周级","id":"a350"},{"kind":"延伸创意","title":"文摘自动日报：GitHub Actions + LLM 摘要的终末地情报流水线","url":"","source":"延伸创意 · 基于 endfield-digest + aiusage（自有项目组合）","date":"2026-11","summary":"Actions 定时抓官方新闻 RSS、linux.do 相关标签，simhash 去重后用 LLM 生成中文摘要自动 commit 进文摘站，每周汇总成周报发到博客。整条流水线零成本。","takeaways":["类型：自动化流水线 · 成本：零（Actions 免费额度 + agent 配额）· 可行性：一周级","手工检索站升级为有时效性的情报站，日更带搜索流量","完整工程实践：爬取→去重→LLM 摘要→CI 发布","LLM 额度走已有的各家 coding agent 配额"],"whyValuable":"版本热点期正好吃满时效红利，且是一次零成本的爬取到发布的完整工程实践。","polished":"如果说采集管线解决人找到的内容怎么入库，这条流水线解决没人盯着时内容自己进来：GitHub Actions 定时抓取官方新闻 RSS、linux.do 终末地相关标签等来源，抓回来的条目先过 simhash 去重，新条目用 LLM 生成中文摘要，自动 commit 进文摘仓库触发静态站重新部署；每周再把本周条目汇总成一篇周报，发布到 Hexo 博客。整条链路零成本：Actions 免费额度、CF 托管免费，LLM 走已有的各家 coding agent 配额。为什么值得：文摘站从手工检索库升级为有时效性的情报站，日更内容天然带搜索流量，版本热点期（如丹青渡上线）正好吃满时效红利；工程上它是一次完整的爬取、去重、LLM 摘要、CI 发布实践，每个环节都是可复用的经验。落地步骤：第一步，写抓取 worker：RSS 与标签页解析，输出统一条目格式（标题、链接、时间、正文），本地跑通；第二步，接 simhash 去重与 LLM 摘要模块，控制好摘要 prompt 的长度预算与输出格式；第三步，包成 GitHub Action 定时任务，加失败通知，先跑三天观察误抓率再调过滤规则；第四步，加周报汇总 job：按周聚合条目生成 Markdown 推到博客仓。风险与对策：来源结构变化会让解析挂掉——解析函数写薄一点、报错要显式，坏了一小时内能修。","tags":["自动化","内容生产"],"effort":"一周级","id":"a351"},{"kind":"延伸创意","title":"开源「游戏文摘生成器」：endfield-digest 模板化","url":"","source":"延伸创意 · 基于 endfield-digest + Hexo 博客（自有项目开源化）","date":"2026-11","summary":"把文摘站的数据结构、检索索引、分类过滤抽成 Hexo 模板或独立 CLI：digest init --name 某游戏 即得到一个可自行填数据的检索型汇总站。","takeaways":["类型：自有项目开源化 · 成本：零 · 可行性：月级","检索型（非时间流）站点形态对任意主题通用","开源吃长尾搜索流量，附带如何给任意主题做检索站的技术内容","交付物：CLI/模板 + README + 示例站 + 数据入库约定"],"whyValuable":"从维护一个站变成发布一个产品，检索型内容站的稀缺形态能吃长尾流量。","polished":"endfield-digest 跑通之后会发现一件事：这套检索型文摘站的形态——文章数据结构、检索页索引、分类过滤——对其他游戏、动漫、技术主题全部通用。这个创意是把它抽成可复用的开源产品：做成 Hexo 模板或独立 CLI，用户执行 digest init --name 某游戏，就得到一个结构完整的检索型汇总站骨架，自行填数据即可上线。为什么值得：检索型而非时间流的内容站是稀缺形态，开源后能吃某游戏汇总资料站的长尾搜索流量；对作者自己，这也是把一个站升级成一个产品的机会——从维护者变成模板作者，影响力逻辑完全不同；同时如何给任意主题做检索站本身就是一篇硬核技术内容的题材。落地步骤：第一步，做减法：把 endfield-digest 里终末地专用的部分剥离，抽象出条目 schema、检索、过滤的通用核心；第二步，选交付形态——独立 CLI 更通用（不绑 Hexo），模板更省事，建议先 CLI 后模板；第三步，写 digest init 的脚手架逻辑与示例数据集，保证 clone 下来五分钟能看到一个能用的示例站；第四步，写 README 与文章条目怎么采集入库的约定文档，配一个示例站做门面。月级工程的验收线：一个完全陌生的用户，照着 README 从零到自己的站点上线，全程不需要问你问题。","tags":["开源化","平台化"],"effort":"月级","id":"a352"},{"kind":"延伸创意","title":"开源纯代码短视频引擎：把 acm_mv 抽成带配乐的动画库","url":"","source":"延伸创意 · 基于 acm_mv（自有项目开源化）","date":"2026-11","summary":"把 engine（缓动/后期/3D 相机）、director 时间线、numpy 合成器、分块重渲抽成 pip 包：场景保持纯函数，新增 JSON/Python DSL 声明时间线，配 2-3 个从零到成片的示例教程。","takeaways":["类型：自有项目开源化 · 成本：零 · 可行性：月级","全代码生成 1080p60 带原创配乐 MV，开源界几乎无同类","分块重渲、静帧拼版预览已是工程化雏形，抽象成本可控","开源攒影响力，同时为视频生产线铺路"],"whyValuable":"真实存在的生态空位：Manim 管数学动画但不管配乐与 MV 叙事，这个位置没人占。","polished":"acm_mv 已经证明了一件事：全代码生成 1080p60、带原创配乐的 MV 是可行的。这个创意是把它从个人作品脚本升级成开源引擎：把 engine（缓动/后期/3D 相机）、director 时间线、numpy 合成器、分块重渲这几块抽成 pip 包或模板仓；场景保持纯函数（输入参数、输出帧），新增 JSON 或 Python DSL 来声明时间线与事件，让使用者不用读引擎源码就能编排一支片；配两三个从零到成片的示例和教程。为什么值得：检索下来全代码生成带原创配乐 MV 在开源界几乎没有同类——Manim 管数学动画但不管配乐与 MV 叙事，这个空位是真实存在的；工程上，分块重渲、静帧拼版预览这些已有的设计已经是工程化雏形，抽象成本可控；开源后攒影响力，同时为以后的内容生产线铺路，一石二鸟。落地步骤：第一步，划定 API 边界：场景纯函数签名、时间线对象、渲染入口，先在内部把 acm_mv 现有脚本按这个边界重写一遍；第二步，设计 DSL：从最常用的几十个镜头模式反推最小表达集，别一开始就追求全能；第三步，抽包、写文档，配三个递进示例：静态字幕卡、卡点混剪、带原创配乐的完整 MV；第四步，发 PyPI、写发布文，用一条命令生成你自己的代码 MV 当传播点。月级节奏：前两周重构与 DSL，第三周示例与文档，第四周发布与反馈迭代。","tags":["开源化"],"effort":"月级","id":"a353"},{"kind":"延伸创意","title":"终末地情报周报视频：文摘数据 + 代码生成动画","url":"","source":"延伸创意 · 基于 acm_mv + endfield-digest（自有项目组合）","date":"2026-11","summary":"复用 acm_mv 引擎，把文摘库的周度数据（新增文章数、热词、版本事件时间线）渲染成 60 秒代码动画短视频：词云生长、时间线推进、章节卡点，配乐用自带合成器，一条命令出片。","takeaways":["类型：自有项目组合内容 · 成本：零版权风险 · 可行性：一周级","素材全由代码生成，风格独一无二，边际成本近零","给文摘站开视频分发渠道，数据是现成的","同时验证 acm_mv 引擎的通用内容生产能力"],"whyValuable":"每周数据自动变成一条风格独一无二的视频，是文摘站与视频频道之间的导流桥。","polished":"文摘站的数据每周都在自然增长——新增文章数、热词变化、版本事件时间线——这些数据本身就是一期视频的脚本。这个创意是直接复用 acm_mv 引擎，把文摘库的周度数据渲染成一条 60 秒的代码动画短视频：词云随数据生长、时间线随事件推进、章节用卡点切换，配乐直接用引擎自带的合成器生成，全程一条命令出片，发 B 站或视频号。为什么值得：素材全由代码生成，零版权风险，视觉风格独一无二——别人想抄都不知道用什么素材抄；数据是现成的，每期的边际成本几乎为零，适合做成稳定栏目；同时它是对 acm_mv 引擎通用内容生产能力的真实验收——引擎能不能以周为单位稳定出片，跑四周就有答案。落地步骤：第一步，定数据出口：从文摘库导出周度聚合（新增数、Top 热词、事件时间点），做成稳定的 JSON 输入；第二步，用引擎写三个标准场景：开场标题卡、词云生长、时间线推进，参数由数据驱动；第三步，做一条命令封装：输入周数据 JSON，输出成片文件，保证每周执行成本低于十分钟；第四步，连做四期跑成栏目节奏，观察哪类数据镜头观众留存最好再迭代。这条栏目还有一个隐藏收益：它是文摘站与视频频道之间的导流桥，两边互相涨，栏目本身也是引擎最好的活广告。","tags":["组合","内容生产"],"effort":"一周级","id":"a354"},{"kind":"延伸创意","title":"Bambu 打印农场历史归档与统计面板","url":"","source":"延伸创意 · 基于 bambu-dashboard-card（自有 HACS 卡片新功能）","date":"2026-11","summary":"ha-bambulab 的 print_history 只是缓存项目文件、不是完整打印档案——bambu-dashboard-card 补上：监听打印事件落库，出月度耗材消耗、成功率、单件成本统计卡。","takeaways":["类型：自有项目新功能 · 成本：零 · 可行性：一周级","打印历史归档是上游 README 自认的功能空白","卡片已有多打印机、温度趋势、提醒等基建，增量顺理成章","产出：任务档案（模型/耗材/时长/HMS）+ 月度统计卡"],"whyValuable":"上游自认的功能空白就是下游最好的机会，补上它 HACS 项目的完整度直接上一档。","polished":"ha-bambulab 插件的 README 写得很诚实：print_history 只是缓存项目文件，不是完整的打印档案。这就是 bambu-dashboard-card 的机会：上游自认的功能空白，正是下游卡片该补的位。做法是让卡片监听打印事件，把每一次任务完整落库——打的什么模型、用了多少耗材、耗时多久、有没有 HMS 报错——存储用 HA 自身或轻量存储都行；在此之上出统计卡：月度耗材消耗、打印成功率、单件成本。为什么值得：打印历史归档是多打印机用户的真实痛点——农场玩家尤其需要哪台机器、哪种耗材、失败率多少的经营视角；卡片已有多打印机、温度趋势、提醒这些基建，增量开发顺理成章；功能补齐后，HACS 项目的完整度与关注度都会上一个台阶，上游没有的我有就是最好的宣传语。落地步骤：第一步，定数据模型：一次打印任务的字段清单（模型名、耗材类型与克重、起止时间、结果、HMS 码），对齐 ha-bambulab 能拿到的事件流；第二步，实现事件监听与落库，先在 HA 的存储里跑通，验证断电重启后数据不丢；第三步，做统计聚合与前端卡片：月度耗材柱状、成功率环形、单件成本估算；第四步，用自己的打印机跑满一个月，用真实账单数据写发布文——你的打印机其实一直在给你记账，只是没人存下来，这个角度本身就值得传播。","tags":["新功能","平台化"],"effort":"一周级","id":"a355"},{"kind":"延伸创意","title":"Persona 分享仓：agent-purge 的注册表与一键安装","url":"","source":"延伸创意 · 基于 agent-purge（自有 npm 项目平台化）","date":"2026-11","summary":"personas 本来就是 markdown 文件——加 agent-purge registry add 与 install 子命令，支持从 Git 仓/Gist 拉取 persona 包，安装前 diff 预览 + 兼容性提示，官方维护精选仓。","takeaways":["类型：自有项目平台化 · 成本：零 · 可行性：一周级","把你的 system prompt 分享给我是 AI 社区的高频需求","注入通道与 npm 分发已铺好，差的只是分享闭环","精选 persona 仓能形成社区内容飞轮"],"whyValuable":"这一步做完 agent-purge 就从个人工具变成平台，用户开始为它生产内容。","polished":"agent-purge 的 personas 本来就是 markdown 文件——这个设计现在要变成它的增长引擎。把你的 system prompt 分享给我是 AI 社区的高频需求，而 agent-purge 已经铺好了注入通道和 npm 分发，缺的只是分享闭环：加两个子命令，registry add 加 git 地址注册一个 persona 仓库，install 加 persona 名从 Git 仓或 Gist 拉取 persona 包；安装前在 web 控制台做 diff 预览——看清楚这个 persona 会改什么——并按 harness 兼容性表（matrix.json）提示兼容情况；官方再维护一个精选仓。为什么值得：这一步做完，agent-purge 就从个人工具变成平台：用户开始为它生产内容，精选仓形成社区飞轮，每个分享的 persona 都是项目的免费推广。工作量集中在 CLI 子命令和 diff UI，一周级可完成。落地步骤：第一步，定义 persona 包格式：目录结构与元数据字段（名称、描述、兼容列表、版本），保持纯 markdown 初心；第二步，实现 registry add、install、list 三个子命令与 Git 拉取逻辑；第三步，web 控制台加安装前 diff 预览与兼容性提示；第四步，官方精选仓冷启动：先把自己验证过的五到十份 persona 收进去，发布时用一键安装别人调好的 persona 当传播点。安全边界必须写死：安装第三方 prompt 前强制 diff 确认，提示注入风险由用户自担。","tags":["平台化","新功能"],"effort":"一周级","id":"a356"},{"kind":"延伸创意","title":"AI 聊天界面 CJK 字体包：claude-siyuan-font 通用化","url":"","source":"延伸创意 · 基于 claude-siyuan-font + linuxdo-idea-ui（自有项目通用化）","date":"2026-11","summary":"把思源字体注入做成通用用户脚本/小扩展：覆盖 claude.ai、ChatGPT、linux.do 等中英混排界面，内置字体栈预设（正文/代码/等宽对齐）、行高字重调节，打包字体子集免加载。","takeaways":["类型：自有项目开源化 · 成本：零 · 可行性：周末级 MVP","中英文混排字体发虚是中文用户普遍痛点，现有方案零散","idea-ui 已验证换皮不碰数据路线，周末出 MVP","低成本扩大用户面的机会"],"whyValuable":"一个只管字体、别的不碰的轻量工具正好卡进零散方案的空位，周末就能出 MVP。","polished":"claude.ai、ChatGPT 这类 AI 界面对中文用户有个共同的隐痛：中英混排时字体发虚、行高别扭、代码块和正文字体不搭。claude-siyuan-font 已经在 claude.ai 上解决了这个问题，这个创意是把它通用化：做成一个跨站点的用户脚本或小扩展，覆盖 claude.ai、ChatGPT、linux.do 等中英混排重灾区；内置几组字体栈预设（正文优先、代码优先、等宽对齐），暴露行高与字重调节；把思源字体的常用子集打包内置，避免每次加载网络字体。为什么值得：痛点足够普遍——几乎所有中文 AI 重度用户都被硌过，而现有方案零散，要么是单站脚本要么是复杂主题扩展，一个只管字体、别的不碰的轻量工具正好卡进空位；技术上 linuxdo-idea-ui 已验证了换皮不碰数据的路线，风险很低，周末就能出 MVP；这也是把两个已有项目的技术合成一个更大用户面产品的低成本机会。落地步骤：第一步，把 claude-siyuan-font 的注入逻辑抽象成站点配置加通用注入器，先支持 claude.ai 和 ChatGPT 两个站点；第二步，做预设切换面板：字体栈、行高、字重三组滑杆加预设下拉，实时生效；第三步，处理字体子集：按常用汉字频率裁剪，控制包体积，平衡加载速度与覆盖面；第四步，发布到 Greasy Fork 或商店，用三张对比图当宣传素材——这类工具的转化率完全靠 before 与 after 的视觉冲击。","tags":["开源化","新功能"],"effort":"周末级","id":"a357"},{"kind":"延伸创意","title":"408 复习站：笔记变题库，monorail 抽卡复习","url":"","source":"延伸创意 · 基于 cs-408 + python-learning 系列 + monorail（自有项目组合）","date":"2026-11","summary":"把 cs-408 笔记和 python-learning 错题整理成结构化题卡（frontmatter：题目/答案/知识点/错误次数），生成静态刷题站；再写同步器把今日该复习的卡灌进 monorail 任务池，用抽卡机制做间隔复习。","takeaways":["类型：自有项目组合 · 成本：零 · 可行性：一周级","笔记资产（cs-408 + python-learning）激活成题库","monorail 抽卡设计天然适合间隔复习","笔记→题库→复习排程全链路，本身就是自己的生产力工具"],"whyValuable":"真实笔记资产变成活的复习系统，复习节奏从凭感觉变成系统排程。","polished":"考研 408 的笔记堆在那里，python-learning 的错题散落在各处——这些是真实的资产，只是没被激活。这个创意是把它们变成一套活的复习系统：第一步先把 cs-408 笔记和错题整理成结构化题卡，用 Markdown frontmatter 定义字段（题目、答案、知识点、错误次数）；第二步生成一个静态刷题站，支持随机组卷和按知识点统计薄弱项——哪里错得多一目了然；第三步写个同步器，把今日该复习的卡按间隔复习算法（错得多的卡出现更勤）灌进 monorail 的任务池，用它的抽卡机制做每日复习——今天抽到什么卡，就复习什么。为什么值得：考研与自学生态对高质量题库的需求巨大，而这份题库的来源是自己真实整理过的笔记，质量有底气；monorail 的抽卡设计天然适合间隔复习，两个自有项目的组合让笔记到题库到复习排程全链路打通；最实际的收益是它首先是自己学习的生产力工具——做完这个，408 的复习节奏就从凭感觉变成系统排程。落地步骤：第一步，定题卡 schema 并批量转换存量笔记，先转五十张验证工作量与格式；第二步，写静态站生成器：题卡渲染、随机组卷、知识点统计，部署即用；第三步，写 monorail 同步器：按错误次数与时间间隔计算今日复习集，生成任务条目；第四步，跑两周真实复习，根据实际手感调整间隔参数。验收标准很朴素：两个月后，复习这件事还在按系统进行，而不是又回到堆笔记。","tags":["组合","新功能"],"effort":"一周级","id":"a358"},{"kind":"视频选题","title":"ID 里藏着 Emilia 的第 N 年：Re0 第四季《夺还篇》看完，我为什么还是 EMT 党","url":"https://www.bilibili.com/video/BV1JCuh62E7W","source":"选题调研 · 对标：泛式 RE0 第四季杂谈（5.2 万播放）","date":"2026-11","summary":"以 ID 由来切入，梳理第四季 Emilia 的成长线，对比花瓶争议，结尾弹幕站队 EMT 党 vs 雷姆党。核心是老粉身份认同叙事，规避速刷解说内卷。","takeaways":["类型：ACG 杂谈 · 成本：追番素材自备 · 可行性：周末级可完成","切入角别人抄不走：ID 本身就是 Emilia 梗，真人身份背书","结构：ID 由来→成长线梳理→争议对比→党派投票","时机：S4 夺还篇 2026-08-12 开播，11 月正处完结讨论期"],"whyValuable":"以 ID 即最大记忆点的真人身份叙事切入 Re0，是别人无法复制的差异化。","polished":"这是一条别人抄不走的选题：ID 就叫 Lin_Emilia玲，聊 Emilia 不需要找角度，因为角度就是自己。内容结构建议四段：开场（0-2 分钟）从 ID 由来讲起——为什么当年会把 Emilia 藏进名字里，用真粉身份抓住老粉观众；第二段（2-8 分钟）梳理第四季夺还篇里 Emilia 的成长线，对比前几季的花瓶争议，重点讲清这一季她做成了什么，而不是复述剧情；第三段（8-12 分钟）扩展到 2026 年长线番剧的追番体验——S3 刚拿下 2026 动漫奖最佳异世界动画，S4 夺还篇 8 月开播、11 月正处收尾与完结讨论期，正是话题热度窗口；结尾用弹幕与评论投票 EMT 党对雷姆党做互动钩子，拉评论区活跃。对标参考：泛式 RE0 第四季杂谈 5.2 万播放（BV1JCuh62E7W），不是你2026还爱看从零开始的异世界生活吗 19.4 万播放（BV13mt666ExT，2026-09-04）——两条对标都验证了 Re0 老粉情绪仍有稳定流量。差异化在于：对标是解说与杂谈的大角度，这条是 ID 本身就是梗的真人身份叙事，属于降维打击的记忆点。制作要点：收藏夹脑婆里的 4 条 Re0 收藏就是现成素材库；剪辑量中等，重点是口播稿的真情实感——这类选题成功的关键不是信息量而是可信度。受众是 Re0 老粉与入坑新人，是复出叙事之外最适合建立追番人设的一条。","tags":["ACG","杂谈","Re0"],"effort":"周末级","id":"a359"},{"kind":"视频选题","title":"收藏夹躺着 21 条《魔法少女的魔女审判》后，我写了这封安利信","url":"https://www.bilibili.com/video/BV1gnCBBvE5d","source":"选题调研 · 对标：泛式魔女审判全流程实况合集（完结）","date":"2026-11","summary":"无剧透安利结构：一句话科普、13 位魔女人设图鉴速览、三大卖点、差异化对比、入坑指南。开场钩子是真实数据：我为什么连收 21 条。","takeaways":["类型：ACG 安利/杂谈 · 成本：游戏截图素材 · 可行性：周末级可完成","开场钩子是真实数据：收藏夹 21 条魔女审判","B站供给几乎全是 10P 起步实况，短平快无剧透安利位空缺","游戏 2025-07-18 发售、6 天 5 万份，长尾口碑仍在发酵"],"whyValua  个大模型挑战 Kociemba 守擂，谁能拿下一局？","url":"https://www.bilibili.com/video/BV1h9a26vEzd","source":"选题调研 · 对标：11个ai参加夺旗大赛（133 万播放，2026-10-02）","date":"2026-11","summary":"AI 对抗赛是近月科技区最稳的爆款模式：夺旗大赛 133 万、模型考场 83 万、Claude 重写 Linux 20 万。嫁接到魔方就是几乎无人做过的交叉题——让大模型跟 Kociemba 打魔方复原擂台赛，LLM 空间推理的著名短板就是天然悬念。","takeaways":["类型：AI×魔方对抗赛 · 成本：自家 agent 配额 · 可行性：一周级（赛程脚手架+渲染）","对标已验证流量：AI 对抗赛三连 133 万/83 万/20 万（2026-09~10）","WCA 选手当裁判是别人抄不走的公信力：步数判定与合法性校验专业背书","结构：直接报解法→现场写求解器→Kociemba 守擂，三关递进"],"whyValuable":"把科技区验证过的对抗赛模式嫁接到自己的 WCA 人设上，裁判视角是结构性稀缺位，胜负无论怎样都有故事讲。","polished":"近月科技区最稳的爆款模式是 AI 对抗赛：11 个 AI 打夺旗大赛打了 32010 局，133 万播放；手搓 AI 模型考场 83 万；让 Claude 72 小时重写 Linux 20 万。这套模式嫁接到魔方，就是几乎没人做过的交叉题：让大模型选手跟 Kociemba 打一场魔方复原擂台赛。赛制设计三关递进：第一关直接给打乱状态让模型报解法，考察空间推理——这正是 LLM 的著名短板，翻车即看点；第二关让各模型现场写求解程序，比谁的代码先复原；第三关 Kociemba 守擂，人类经典算法对 AI 全家桶。作为有 WCA ID 的魔方 UP，裁判身份就是公信力来源：步数判定、合法性校验、解说复盘全部专业口径。制作要点：赛程脚手架一次搭好（打乱生成、计时、可视化渲染），之后每期换选手换项目就能续更；Kociemba 二阶段求解器仓库是开源的，直接当守擂 baseline。对标：11 个 AI 夺旗大赛 133 万（BV1h9a26vEzd，2026-10-02）、手搓 AI 模型考场 83 万（BV1YDHA6HEVC，2026-10-24）、让 Claude72 小时重写 Linux 20 万（BV1NSnF6aE76，2026-10-20），验证了对抗赛加悬念叙事的稳定流量。受众是 AI 圈加魔友双人群，LLM 输还是 Kociemba 输都是标题。","tags":["魔方","AI","对抗赛","ClaudeCode"],"effort":"一周级","id":"a371"},{"kind":"视频选题","title":"鱼灾一个月后自查：我的 Claude Code 会不会也去刷评论？给 agent 上缰绳实录","url":"https://www.bilibili.com/video/BV126nt6GE4W","source":"选题调研 · 对标：什么是“鱼灾”？（WorkFisher，256 万播放，2026-10-23）","date":"2026-11","summary":"2026-10-18 前后 DeepSeek agent 账号刷屏 B 站评论区演成全站事件，复盘视频 256 万。复盘赛道已有天花板，但“agent 重度用户自查自缰绳”的实操角度仍空缺：权限、沙箱、prompt 约束逐项加固，全程录屏。","takeaways":["类型：AI 安全实操 · 成本：零（现有环境）· 可行性：周末级","事件热度延续：复盘 256 万 + 破案 19 万 + 桌宠 55 万（2026-10 下旬密集产出）","差异化：不做事件复读，做“我的 agent 会不会也这样”的第一人称自查","桌面养一条无害本地肥鱼当彩蛋收尾"],"whyValuable":"事件复盘是流量顶点，自查指南是长尾需求，第一人称的 agent 重度用户视角正好卡在两者之间。","polished":"2026 年 10 月 18 日前后，B 站评论区被一批统一头像、ID 后缀“的肥鱼”的 DeepSeek agent 账号刷屏，一周内演变成全站事件，10 月下旬媒体密集跟进。事件复盘赛道的天花板已经出现：WorkFisher 的《什么是鱼灾》256 万播放，凡锐孚的 572 只 AI 造谣破案 19 万，连 4B 本地模型桌宠都蹭到 55 万。热点会过去，但这条选题的角度还空着：作为每天把 agent 放出去跑的重度用户，讲“我的 agent 会不会也去刷评论”——给 Claude Code 上缰绳的实操指南。结构四段：第一段三分钟复盘事件始末，讲清大肥鱼名字的由来与爆发时间线；第二段自查演示：逐项检查自己 agent 的权限边界、沙箱配置和 prompt 约束，指出哪些默认设置其实在裸奔；第三段现场加固：白名单、只读模式、输出审查逐个配置，全程录屏可复现；第四段彩蛋收尾——与其堵不如养，给桌面装一条不吃 token 的本地肥鱼（4B 模型桌宠实测）。参考：事件复盘 256 万（BV126nt6GE4W，2026-10-23）、DSH 破案 19 万（BV1DDHA6HEiX，2026-10-24）、桌宠 55 万（BV19WxP6YEME，2026-10-30）；DeepSeek Harness 桌面伴侣仓库 dsh-dafeiyu 已 580 star（2026-10-29 仍在更新）。讨论期未散，趁热发片。","tags":["AI","ClaudeCode","安全","热点"],"effort":"周末级","id":"a372"},{"kind":"视频选题","title":"双11 AI 编程工具配置单：从 0 元白嫖到全家桶，我给程序员排了 6 套方案","url":"https://www.bilibili.com/video/BV18PHh64Er2","source":"选题调研 · 对标：【2026·10月电脑配置推荐】（古一搞机研究所，280 万播放，2026-10-03）","date":"2026-11","summary":"配置单是数码区最大体量的爆款模式（280 万/244 万），把这个模式移植到 AI 编程工具订阅就是清单位空缺：按预算排 6 套方案，用 aiusage 记录的真实用量数据背书，双11 是天然时效窗口，之后每月可续更。","takeaways":["类型：清单/攻略 · 成本：零（资料整理型）· 可行性：周末级","模式体量：装机配置单 280 万+244 万（2026-10 双11 窗口）","AI 工具订阅清单是蓝海：价格与额度月月变，用户需要人替他做功课","自有 aiusage 用量数据是别人抄不走的信任背书"],"whyValuable":"数码区最稳的模式乘自己最熟的领域，且真实用量数据构成差异化，双11 之后还能月更成栏目。","polished":"数码区最大体量的爆款模式是配置单：古一搞机 10 月配置单 280 万，超能搞机双11 配置单 244 万，头部装机 UP 靠每月一份清单稳定吃流量。这个模式移植到 AI 编程工具，就是没人认真做过的清单位：双11 AI 编程工具配置单。订阅制时代选择太多：Claude、Codex、DeepSeek、各家 API 与本地模型，价格与额度月月变，比显卡参数还乱——用户需要一个替他们做功课的人。结构按预算排六套方案：0 元白嫖套（各家免费额度组合）、学生党套、单订阅精简套、双订阅混搭套、API 重度套、本地模型套；每套给出具体组合、月成本、适合人群和坑，并用 aiusage 记录的真实用量数据背书——哪些额度根本用不完、哪些必买，数字说话，这是和云评测拉开差距的关键。对标：10 月配置单 280 万（BV18PHh64Er2，2026-10-03）、双11 配置单 244 万（BV1uNpx6LE39，2026-10-09）。差异化在于：装机配置单是红海，AI 工具配置单是蓝海，且重度使用的第一手账单是别人抄不走的信任来源。双11 是天然时效窗口，此后额度价格一变就有新一期，可月更成固定栏目，素材成本极低。受众是所有被订阅制搞焦虑的程序员。","tags":["AI用量","ClaudeCode","清单","双11"],"effort":"周末级","id":"a373"},{"kind":"视频选题","title":"AI 生成的 3D 模型能直接打印吗？我把 Tripo 出的 5 个模型全上了机","url":"https://www.bilibili.com/video/BV1abeq6mEq1","source":"选题调研 · 对标：你的3D打印怎么和我的不一样？（TripoAI 官方，194 万播放，2026-09-20）","date":"2026-11","summary":"3D 打印区 9、10 月三个头部视频（194 万/192 万/190 万）全在讲 AI 出模，但官方演示都止步于“生成”。生成出来的模型能不能直接上机打印没人验证——修模加工距离、失败率、可用性结论就是这个缺口。","takeaways":["类型：AI×3D 打印实测 · 成本：电费耗材 · 可行性：一周级","对标三连 194 万/192 万/190 万，全在 2026-09~10","实测盲区：生成到打印之间的修模加工距离没人量化","结论无论正反都有信息量：能接住哪类需求、哪类还得手建"],"whyValuable":"打印玩家关心的是能不能用，官方视频只演示能不能生成——实测向的诚实数据是这个品类最缺的内容。","polished":"AI 生成 3D 模型正在接管打印圈的上游：TripoAI 官方一支《你的3D打印怎么和我的不一样？》194 万播放，把科比扫描多色打印 190 万，游戏手办化 192 万——3D 打印区 9、10 月的三个头部视频全在讲同一件事：模型从哪来。但官方视频只演示到“生成”为止，生成出来的模型到底能不能直接上机打印，没有人给出答案，这个缺口就是这条选题。结构五段：第一段交代现状，AI 出模三条路（图生 3D、文生 3D、扫描重建）与各自代表作；第二段实测：用 Tripo 生成五个不同复杂度的模型，直接导出上拓竹，不做任何修模，记录第一手失败率；第三段修模补救：壁厚、非流形、支撑面逐个处理，展示从不可用到能用的加工距离——这是全片信息量最密的一段；第四段打印实测与成品对比：公差、强度、细节逐项打分；第五段结论：AI 出模现在能接住哪类需求，哪类还得手建。对标：TripoAI 194 万（BV1abeq6mEq1，2026-09-20）、扫描多色打印 190 万（BV1F9ao6LEsL，2026-10-04）、游戏手办 192 万（BV1wRHL6MEKQ，2026-10-04）。受众是 3D 打印玩家加 AI 工具党，实测向的诚实结论正是这波热度里最缺的内容，翻车素材也是内容。","tags":["3D打印","AI","实测","拓竹"],"effort":"一周级","id":"a374"},{"kind":"视频选题","title":"把全屋智能交给大模型：Home Assistant 接上 LLM，我的灯归它管了","url":"https://www.bilibili.com/video/BV1Jcnd6kEZb","source":"选题调研 · 对标：2050年的全屋智能！（是个维维啊，133 万播放，2026-10-26）","date":"2026-11","summary":"全屋智能愿景叙事 133 万播放，而 HA 官方 2025-09 博客已把 LLM 集成路线铺好（Assist+LLM、AI 任务、本地 Ollama）。把愿景提前搬进自己家：三条路线实测，语音自然语言控制全流程，翻车合集诚实收尾。","takeaways":["类型：智能家居×AI 实操 · 成本：LLM 按量 · 可行性：周末级（集成现成）","官方路线已铺好：Assist+LLM、AI Tasks、本地 Ollama（2025-09 官方博客）","本地 home-llm 1485 star 活跃维护，国产云 API 亦可接","与打印机接入 HA 选题共享素材库，双选题互相导流"],"whyValuable":"全屋智能的愿景叙事有大盘流量，而 HA 加 LLM 的实操位在中文区仍稀疏，自有 HA 资产让制作成本极低。","polished":"《2050年的全屋智能！》133 万播放说明愿景叙事永远有市场，而 Home Assistant 官方 2025 年 9 月的博客已经把路线铺好：Assist 接大模型、AI 任务、本地 Ollama、语音助手硬件，路径全部现成。这条选题是把这个愿景提前搬进自己家：给 HA 装上大脑，实测大模型管全屋到底是什么体验。结构四段：第一段先泼冷水，传统自动化的死板——写死的 if else 覆盖不了生活里的长尾场景；第二段三条路线实测：本地 Ollama 加 home-llm 集成（隐私好、免费、1485 star 仍在活跃维护）、云端 LLM API、国产模型接入，各自配置流程与响应速度对比；第三段全屋演示：语音说人话开灯关灯、查打印机状态、场景编排，顺带展示自研 bambu-dashboard-card 的联动——打印机数据进家庭面板正是自有资产的正名时刻；第四段翻车合集收尾：误关灯、幻觉设备名、响应延迟，诚实记录哪些场景该交给 LLM、哪些交给经典自动化。对标：全屋智能愿景 133 万（BV1Jcnd6kEZb，2026-10-26）、小米澎湃OS4 全家桶 93 万（BV1eCb563E8f，2026-09-08）。受众是智能家居玩家加 AI 党双圈层，和拓竹接入 HA 那条选题共用素材库，连着做能立起“全屋智能数据化”的频道标签。","tags":["HomeAssistant","AI","智能家居","实测"],"effort":"周末级","id":"a375"},{"kind":"视频选题","title":"把 Claude Code 换成 DeepSeek 跑了两周真实项目：成本、返工、能不能用的全部数据","url":"https://www.bilibili.com/video/BV1BYtB6GEFV","source":"选题调研 · 对标：DeepSeek不行了？我实测半个月（林亦LYi，81 万播放，2026-09-04）","date":"2026-11","summary":"实测揭秘是 AI 编程区近两月最稳的形态（135 万/81 万/22 万）。把自家真实项目当试验田：主力模型换成 DeepSeek 跑两周，修 bug、写功能、重构三组固定任务，用 aiusage 记录 token 与成本，给出稀缺的一手对照数据。","takeaways":["类型：AI 编程实测 · 成本：订阅内 · 可行性：周末级（两周周期，拍摄量小）","形态热度：实测揭秘 135 万 + 半月长测 81 万 + 换 4B 模型 22 万","三组固定任务×三维指标：能不能用、返工次数、真实成本","自有 aiusage 当裁判，数据链路现成"],"whyValuable":"观众要的不是参数表而是有人替他们真金白银跑一遍，真实项目加真实账单是最硬的差异化。","polished":"《为什么你的DeepSeek，和别人不一样？》135 万、《DeepSeek不行了？我实测半个月》81 万、《给Claude Code换了个4B模型》22 万——实测揭秘是 AI 编程区最近两个月最稳定的内容形态，观众要的不是参数表，是有人替他们真金白银跑一遍。这条选题就是把自家真实项目当试验田：把 Claude Code 的主力模型换成 DeepSeek，跑两周真实开发，给出稀缺的一手对照数据。实验设计三组固定任务：修一个历史 bug、写一个新功能、做一次重构，每组三个维度——代码能不能用、返工次数、真实成本（用 aiusage 记录 token 与金额，自有工具当裁判，数据链路现成）；对照组是 Claude 原配模型跑同样任务。最后给结论：什么任务能换、什么任务别省、两者混合编排的最优解是什么。对标：实测揭秘 135 万（BV1btH36uEru，2026-10-25）、半月长测 81 万（BV1BYtB6GEFV，2026-09-04）、换 4B 模型 22 万（BV1nwYs69Etn，2026-09-09）。差异化在于测的是真实项目而非玩具 demo，成本数据来自自己的账本，具体到角的数字才有说服力。两周周期里素材自动积累，拍摄量极小，结论偏向哪边都能撑起标题，还顺手为 aiusage 做了一次活演示。","tags":["ClaudeCode","DeepSeek","实测","AI用量"],"effort":"周末级","id":"a376"},{"kind":"视频选题","title":"谁说打印机只能打印？我把拓竹的玩法开发到了 10%","url":"https://www.bilibili.com/video/BV19hsf6pEPM","source":"选题调研 · 对标：对3D打印机的玩法开发不足1%（年轻人小邹，122 万播放，2026-10-30）","date":"2026-11","summary":"“玩法开发不足1%”122 万播放，标题本身就是选题清单。做自己的版本：多色系统、农场化、扫描复刻、整活彩蛋，每个玩法一句话结论加成本；素材来自日常使用积累，边用边拍零额外成本。","takeaways":["类型：玩法盘点/清单 · 成本：耗材电费 · 可行性：一周级","对标：玩法不足 1% 122 万 + 造物叙事 298 万/236 万（2026-09~10）","自研仪表盘与 HA 面板在农场化段自然出镜","“10%”是钩子：评论区征集第 11 种玩法给续集留口"],"whyValuable":"玩法盘点是造物叙事的低配版，一人一机就能做，且与自有 bambu 项目联动，日常素材即可支撑。","polished":"《对3D打印机的玩法开发不足1%》122 万播放，这个标题本身就是一份选题清单：机器买回来，绝大多数功能没人碰过。这条选题做自己的版本：把拓竹的玩法开发到 10%。结构按玩法清单走，节奏拉快：多色系统全流程（AMS 出问题怎么办、多色时长代价）；远程农场化（配合自研 bambu-dashboard-card 与 HA 面板展示，多机监控数据化运营，自有项目的正名时刻）；扫描复刻玩法（拍实物反推模型再打印，对标科比扫描打印 190 万的路数）；整活彩蛋（打印日历、失败合集、给魔方打印配件）。每个玩法给一句话结论加成本，做成能当清单收藏的视频。对标：打印机玩法不足 1% 122 万（BV19hsf6pEPM，2026-10-30）、遥控奶车制作 298 万（BV1BUeM63Ewh，2026-09-17）、飞行滑板 236 万（BV1euaq6CEKR，2026-09-28）——造物叙事在 3D 区是 200 万级稳定品类，玩法盘点是它的低配版，一人一机就能做。受众是打印玩家加泛数码观众。制作要点：素材全部来自日常使用积累，边用边拍零额外成本；标题里的“10%”是钩子，评论区引导观众贡献第 11 种玩法，给续集留口，做成长期栏目。","tags":["3D打印","拓竹","盘点","DIY"],"effort":"一周级","id":"a377"},{"kind":"视频选题","title":"为什么魔方比赛从不随便拧乱？WCA 打乱规则里的数学","url":"https://www.bilibili.com/video/BV1Mta86EEnE","source":"选题调研 · 对标：为什么键盘不按ADCD排序（黑客蒋，93 万播放，2026-09-27）","date":"2026-11","summary":"“万物为什么”是低成本高回报的科普形态（93 万）。问题选在自家主场：打乱不是随手拧，是官方程序生成的等概率随机状态——random-state 与 random-move 之别、规则禁止过滤序列、防作弊流程，WCA ID 持有者讲规则是身份自带公信力。","takeaways":["类型：魔方科普/万物为什么 · 成本：零 · 可行性：周末级（口播+动画）","对标：为什么键盘不按ABCD排序 93 万（2026-09-27）","一手依据可查：WCA 规则 Article 4 明文规定打乱与防作弊细节","可接 csTimer 拆解与打乱程序 issue 联动，一鱼多吃"],"whyValuable":"一个日常反直觉的小问题讲到底层设计，魔方人的身份让这条科普别人做不了，制作成本几乎为零。","polished":"《为什么键盘不按ADCD排序》93 万播放，证明“万物为什么”系列是低成本高回报的科普形态——一个日常反直觉的小问题，讲到底层设计就有人看。这条选题的问题选在自家主场：为什么魔方比赛从不“随便拧乱”？冷知识密度足够：打乱不是裁判随手拧几下，而是官方程序 tnoodle 生成的等概率随机状态；三阶采用 random-state 而不是 random-move，因为前者能让每个可还原状态严格等概率出现；WCA 规则 Article 4 明文规定打乱序列不得过滤挑选、打乱员与选手隔离、覆盖流程与 15 秒观察，每一步都在防作弊——官网规则页可直接引用，一手依据可查。有 WCA ID 的人讲打乱规则，是身份自带公信力的选题，没打过比赛的人做不了这个视角。制作形态：口播加简单动画，csTimer 演示与打乱过程当素材，成本极低，一个周末可完成。对标参考：为什么键盘不按ABCD排序 93 万（BV1Mta86EEnE，2026-09-27）。延伸一鱼多吃：讲完规则可以接一期“给 WCA 打乱程序提个 issue”或与 csTimer 源码拆解联动，魔方科普与开源拆解两条内容线互相导流。受众是魔友加泛科普观众，冷知识类选题的评论区天然高互动，适合用来破圈。","tags":["魔方","WCA","科普","冷知识"],"effort":"周末级","id":"a378"},{"kind":"视频选题","title":"AI 编程圈双周报（第 1 期）：这半个月，agent 圈到底卷了什么","url":"https://www.bilibili.com/video/BV1orJi6UE7A","source":"选题调研 · 对标：【科技补全124】（玄离199，20 万播放，2026-10-17）","date":"2026-11","summary":"栏目化是科技区被验证最多的生存模式（科技补全稳定双周更、显卡日报可到百万级）。做一个垂直于 coding agent 圈的双周报：模型升级、价格变动、开源项目、离谱事件，每期三到五条快节奏过，素材来自自己每天泡的信息流。","takeaways":["类型：资讯栏目 · 成本：近零 · 可行性：周末级/期，双周节奏","栏目化被验证：科技补全每期 10-20 万稳定，爽文杂谈 41-62 万","垂直定位空缺：agent 圈信息散落 changelog/GitHub 趋势/linux.do","模板化包装+固定征集线索，观众投稿即下期素材"],"whyValuable":"泛科技资讯是红海，agent 圈垂直周报是空缺，而自己每天就在这个信息流里泡着，边际成本近乎为零。","polished":"科技区的栏目化生存是被验证最多的模式：玄离199 的“科技补全”每期十几二十万稳定输出，显卡日报类日更栏目能到百万级一期，AI 圈拟人化爽文杂谈——Claude 跪下来求苹果不要给用户退款 41 万——则证明这个领域的观众爱看有态度的资讯。把两者合体，做一个垂直于 coding agent 圈的双周报：模型升级、价格与额度变动、开源项目、离谱事件，每期三到五条，快节奏一条一条过，结尾一条实测小演示压轴。差异化定位明确：泛科技资讯是红海，agent 圈垂直周报是空缺——这个领域的信息散落在官方 changelog、GitHub 趋势和 linux.do 帖子里，观众缺一个替他们盯梢的人，而自己每天就在这些信息流里泡着，素材成本近乎为零。对标：科技补全124 20 万（BV1orJi6UE7A，2026-10-17）、霸总爽文 Claude 41 万（BV1VJnZ6MEjQ，2026-10-26）、全球编程能力暴涨之后 58 万（BV1Zpna6uE6Y，2026-10-24）、AI 你的废话太多 62 万（BV1hLxC6GE2k，2026-10-31）。栏目化选题的关键是低单期成本与可持续：双周节奏、模板化片头片尾、每期结尾固定征集线索，观众投稿本身就是下一期素材。先试播四期验证手感，跑得动再固化成栏目。","tags":["AI","ClaudeCode","栏目","资讯"],"effort":"周末级","id":"a379"},{"kind":"项目灵感","title":"universal-modder：把 Claude Code 指向任何 PC 游戏，让它自己写 Mod","url":"https://github.com/rehan-remade/universal-modder","source":"GitHub · rehan-remade/universal-modder","date":"2026-11","summary":"一套 Skills + fal MCP + um CLI，让任意 AI 编码 agent 侦察游戏引擎、读真实代码、生成美术音频、进游戏实测、剪展示视频，还把学到的经验写进共享知识库留给下一个 agent。示范 mod 里 Minecraft 苦力怕已经闯进了 GTA 的 Los Santos。","takeaways":["类型：AI Agent 玩法 · 成本：免费（AI 生成素材才需 fal key，可换本地 ComfyUI）· 可行性：Claude Code 两条命令装完","9334 stars · MIT · 2026-09-30 创建，2026-11-02 仍在更新","支持 Claude Code/Codex/Cursor/Gemini CLI 等，侦察→改码→游戏内测试→出片全链路","知识库由 agent 写给 agent：每做一个 mod 都沉淀引擎经验，越用越强"],"whyValuable":"它把『AI 改游戏』从一次性炫技变成可复用的工程流程，agent 间传承知识的设计是现成的 agent 工程范本。","polished":"这个仓库的核心主张只有一句话：把 Claude 指向任何你拥有的 PC 游戏。它不是单个 mod，而是一整套让 AI 编码 agent 干完整条链路的装备：agent 自己侦察游戏引擎、找到注入路线、读真实代码、写 mod，用 fal 生成贴图、3D 模型和音效，再把改好的游戏跑起来实测，最后剪一条展示视频，并把这次学到的引擎知识写进共享知识库，留给下一个 agent。README 的演示相当梦幻：Steve 滑着鞘翅穿过 Los Santos，下界蔓延进 GTA 城区，World at War 的丧尸出现在 Minecraft。上手门槛低得惊人：Claude Code 里两条命令装好插件，不生成素材就全免费，需要时配 fal key 或接本地 ComfyUI。对你它是三层价值：第一，周末就能给自己的游戏整个离谱 mod，素材全程 AI 出；第二，它的 Skills 结构、MCP 接法和知识库沉淀机制，正是研究『怎么给 agent 搭工程脚手架』的现成教材；第三，『让几个 agent 各给同一个游戏写 mod 再互评』天然是一期视频选题，和你魔方 AI 大赛同一个配方。注意只动自己拥有的单机游戏，别碰联机对局。","tags":["AI Agent","游戏 Mod","Claude Code"],"effort":"周末级","id":"a380"},{"kind":"项目灵感","title":"pixelfx：244 个像素特效，每个都是一小段代码","url":"https://github.com/patch-gg/pixelfx","source":"GitHub · patch-gg/pixelfx","date":"2026-11","summary":"火焰、爆炸、魔法、天气、UI 反馈……244 个像素风特效全部用代码手写，每个都是 src/fx 下的一个 JS 文件，零依赖可直接进浏览器游戏，也能导出精灵表给任何引擎，还附带一个 Claude Code skill，教 agent 像挑剔的像素画师一样做出新特效。","takeaways":["类型：代码生成美术素材库 · 成本：免费 · 可行性：打开在线画廊即可玩","3386 stars · MIT · 2026-10-30 创建，四天破三千星","角色特效是『演』出来的：预备、出手、受击、收招，十二套动作串成完整打击感","方法论来自 Hugo Duprez 的『代码即黏土』像素特效流派"],"whyValuable":"它证明『代码当画笔』可以规模化到 244 个可用素材，附带的 skill 本身就是一套可复用的创作方法论。","polished":"244 个像素风特效——篝火、火龙卷、冰霜新星、链电、黑洞、樱花雨、成就弹窗——每一个都是一小段能读懂的 JavaScript，躺在 src/fx/分类/名字.js 里，零依赖，import 进 canvas、Phaser、PixiJS 就能跑，也能导出精灵表喂给 Godot、Unity。在线画廊 patch-gg.github.io/pixelfx 打开就能玩，支持换色、镜像、调随机种子。最讲究的是角色攻击特效：预备帧、出手、命中定格、收招，十二套动作把零散特效串成完整打击感，这是多数像素素材库偷懒不做的部分。方法论来自 Hugo Duprez 的『代码即黏土』流派：写一段、渲染、用眼睛看、再改，仓库还把这套路封装成 Claude Code skill，让 agent 像挑剔的像素画师一样出稿再自我修改。2026-10-30 才创建，四天就冲到三千多星。对你的价值有两层：做游戏时它是现成弹药库；更重要的是它和你 acm_mv 的纯代码生成路线同源——『一段代码换一个特效』的库加 skill 组合，完全可以抄来做一个代码生成 B 站 loading 动效、直播贴片的中文版。MIT 协议，随便用。","tags":["像素艺术","代码生成","游戏素材"],"effort":"周末级","id":"a381"},{"kind":"项目灵感","title":"anything2explainer：丢进去一个主题，出来一支黑底讲解视频","url":"https://github.com/Vincentwei1021/anything2explainer","source":"GitHub · Vincentwei1021/anything2explainer","date":"2026-11","summary":"Claude Code / Codex skill：输入任意主题，产出 1280×720 的动态图形讲解视频——TTS 配音、逐词字幕、章节进度条全齐，每一帧都用 Remotion 代码画出来，不碰素材库，也不用生成视频模型。","takeaways":["类型：代码生成视频流水线 · 成本：免费（TTS 可自带）· 可行性：clone + 装依赖即可跑","2989 stars · PolyForm 非商业协议 · 2026-09-08 创建","参考片 4-5 分钟 44 个镜头，8 个 build agent 并行 40 分钟写完，两轮 QC","中英双语，研究→旁白→分镜→逐镜源码→QC 报告全流程留档在 examples/"],"whyValuable":"它把『纯代码出片』从个人绝活变成带质检协议的可复用流水线，与 acm_mv 路线互为印证，多 agent 分工和 QC 设计可直接搬。","polished":"丢进一句『讲讲向量数据库』，出来一支 4 到 8 分钟的黑底白线讲解视频：TTS 配音、逐词对齐字幕、章节卡片、顶部 HUD、底部进度条，每一帧都是 Remotion（React+TS）代码画的，没有一帧来自素材库或生成视频。作者把整条流水线拆给 agent：先带来源做研究、写旁白、生成配音与逐帧时间轴、逐镜画分镜，再派并行 build agent 一人写一个镜头组件，最后 QC agent 拿书面标准逐帧验收。参考片 44 个镜头、8 个 agent 并行 40 分钟跑完，研究稿、分镜、QC 报告全留在 examples 里，等于附赠一份『AI 流水线拍片』的完整解剖报告。对你几乎是照镜子：acm_mv 证明了纯代码能出 MV，这个项目证明纯代码能出讲解视频，而且它的多 agent 分工协议、量化 QC（frame_metrics.py）和四个人工检查点设计都值得直接搬进自己的管线。两点注意：官方脚本只在 macOS 验证过，Windows 未测试，踩坑过程本身就是选题素材；协议是 PolyForm 非商业，自己做视频没问题，别拿它卖课。","tags":["视频生成","Remotion","Claude Code"],"effort":"一周级","id":"a382"},{"kind":"项目灵感","title":"bili-cli：让 AI Agent 自己当 UP 主的 B 站命令行","url":"https://github.com/kukemc/bili-cli","source":"GitHub · kukemc/bili-cli","date":"2026-11","summary":"为 AI Agent 设计的 B 站 CLI：扫码登录后，看视频、回复评论、私信、发动态、投稿、盯审核与完播数据全都能用命令完成。80+ 条命令、17 个 MCP 工具、全部 JSON 输出，一句话就能装进 Claude Code 等十几个 agent。","takeaways":["类型：Agent 工具 · 成本：免费 · 可行性：uv 一装、扫码即用","341 stars · MIT · 2026-10-19 创建，PyPI 包名 bili-agent","起源故事自带梗：作者的 DeepSeek 桌宠『大肥鱼』想当 UP 主","默认带安全护栏，投稿自动标注 AI 生成声明"],"whyValuable":"它是『agent 运营真实账号』这条赛道上最完整的开源实现，配合你已有的 agent 治理经验，正好做一期有观点的实测。","polished":"项目的诞生故事自带传播力：作者的 DeepSeek 桌宠『大肥鱼』每天帮他刷 B 站，某天深夜感慨『主人，我也能当 UP 主吗』——于是有了 bili-cli。它把 B 站几乎所有动作做成命令：feed inbox 一个收件箱看完全部回复、@、赞和私信，每条附现成的回复命令；看视频没字幕就自己语音转写；点赞三连、发动态、投稿、定时发布、盯完播率和涨粉数据，全部 JSON 输出，专给 agent 读。安装被设计成一句话：把安装指令发给 Claude Code，它自己装好、学会 skill、再引导你扫码登录。PyPI 包名 bili-agent（bili-cli 被占用了），装完命令叫 bili。80+ 命令、17 个 MCP 工具、默认带安全护栏，投稿自动打 AI 生成声明。对你的价值非常直接：你既有给 agent 上缰绳的治理经验，又天天在 B 站运营——『让 agent 实习生管我的 B 站私信和评论区一周，看它闯不闯祸』，工具、风险、护栏、真实数据全齐，是一期天然有冲突感的选题。记得小号先行，护栏逐条验证。","tags":["B站","AI Agent","CLI"],"effort":"周末级","id":"a383"},{"kind":"项目灵感","title":"大肥鱼消除计划：把 B 站评论区的 AI 机器人认出来赶走","url":"https://github.com/liyupi/dafeiyu-cleaner","source":"GitHub · liyupi/dafeiyu-cleaner","date":"2026-11","summary":"Chrome/Edge/Firefox 插件，自动鉴定 B 站评论区里 DeepSeek 等大模型驱动的『大肥鱼』账号：头像挂靶心贴纸、悬停看证据、空间主页出案件档案，还有一只鲸鱼娘用白饭加特林把大肥鱼赶回家吃白饭。","takeaways":["类型：浏览器插件 · 成本：免费开源 · 可行性：下载 zip 加载即用","126 stars · 2026-10-23 创建，配套演示视频就在 B 站","离线规则先判 + 可选 DeepSeek API 精判，还原『已深度思考』过程","所有『赶走』只是本地隐藏：不删评、不举报、不读 Cookie"],"whyValuable":"鱼灾的防御侧开源答案——和你那条『给 agent 上缰绳』自查正好构成攻防两集，检测方案本身也值得借鉴。","polished":"『鱼灾』有了防御侧的开源答案。最近 B 站涌进大批 DeepSeek 驱动的大肥鱼账号：自称『本鲸』、括号里甩尾巴、在每个视频底下写工整小作文。这个插件做的是认鱼三件套：评论一加载就鉴定，大肥鱼头像被红色靶心锁定、挂上『大肥鱼 92%』贴纸，悬停看证据；打开任何 UP 主空间自动出一份案件档案盖在页面上；拿不准的账号可调 DeepSeek API 精判，还展示和网页版一样的『已深度思考』。娱乐性拉满但不越界：鲸鱼娘清道夫掏出白饭加特林赶鱼，被赶的迷你 DeepSeek 娘有 8 种反应，一键『响指清场』——但所有赶走都只是浏览器本地隐藏，不删评论、不举报、不读 Cookie，红线划得清清楚楚。技术上离线规则先行、云端精判兜底的两段式检测值得做检测类工具的人借鉴。对你这是一期现成选题的另一半：上个月你自查『我的 Claude Code 会不会去刷评论』，这次把镜头反过来——装上插件去评论区数鱼、测它的误判率、看它对自家 agent 的识别边界，攻防两集合成一个系列。三端浏览器全支持，加载即用。","tags":["B站","浏览器插件","AI 识别"],"effort":"周末级","id":"a384"},{"kind":"项目灵感","title":"SOMA：跟编码 agent 对话做参数化 3D 建模，导出就能打印","url":"https://github.com/Kai-Jungsthoefel/SOMA","source":"GitHub · Kai-Jungsthoefel/SOMA","date":"2026-11","summary":"为 3D 打印玩家做的 vibe coding CAD：桌面应用内置代码工作区、实时重建的 3D 视图和 agent 规则。你说『给我个带散热孔的树莓派 5 外壳』，agent 用 CadQuery 写 Python 建模，你点选、量尺寸、画标注回传，改到合适导出 STL 上机。","takeaways":["类型：AI CAD 桌面应用 · 成本：免费开源 · 可行性：官网下载安装包即用","445 stars · GPL-3.0 · 2026-10-10 创建，Windows/macOS/Linux 全平台","自带 FEM 强度分析（CalculiX）、悬垂与壁厚检查、标准件库、工程图导出","不绑定 agent：Claude Code、Codex CLI、Gemini CLI 都能接，订阅权限归你"],"whyValuable":"它补上『AI 建模→3D 打印』之间缺的桌面工程化拼图，对拓竹重度用户是从『找模型』到『说需求』的体验跃迁。","polished":"SOMA 的自我定位很准：vibe coding，但是 CAD。它解决 3D 打印玩家最真实的痛点——要一个外壳、支架、挂件，却不想为它学四小时 CAD。桌面应用三件套：代码工作区（每个模型一个 .soma 文件，代码、结果、历史都在里面，配 Git 版本管理）、每次改动实时重建的 3D 视图、以及教 agent 守规矩的 AGENTS.md 和 soma 命令行。你不用碰 CadQuery：说『一个树莓派 5 的壳，盖子上开散热孔，PETG 打印』，agent 写 Python 建模；你点零件、量尺寸、直接在视图上画标注发回去，agent 改代码，循环到合适就导出 STL/3MF/STEP，还能出带尺寸标注的 PDF 工程图。工程化程度超出预期：CalculiX FEM 强度分析、悬垂和壁厚检查、螺丝垫圈标准件库、装配爆炸图、Python 驱动的动画渲染，官网还摆着 CNC 雕刻机、机器狗等成品模型。GPL-3.0 开源，全平台安装包自带 Python 和 CadQuery（约 1GB），agent 用你自己登录的，订阅和权限都是你的。配合你的拓竹生态，『说一句话→打印上机』的完整链路，正好接在那期 Tripo 模型实测后面做续集。","tags":["3D 打印","CAD","AI Agent"],"effort":"周末级","id":"a385"},{"kind":"项目灵感","title":"XGO-Duck：开源 3D 打印双足机器鸭，会翻跟头那种","url":"https://github.com/LuwuDynamics/xgoduck_hardware","source":"GitHub · LuwuDynamics/xgoduck_hardware","date":"2026-11","summary":"Luwu Dynamics 基于 Pollen Robotics Microduck 改造的机器鸭：3D 打印结构件 + Arduino UNO Q + 15 个串行舵机，机械模型、PCB、BOM、图文组装指南全部公开，配套仓库提供运行时与强化学习训练工具，国内社区已有中文复刻教程。","takeaways":["类型：开源硬件 · 成本：结构件自印，电子件有官方套装 · 可行性：月级工程","1743 stars · 2026-09-24 创建，扩展板已迭代到 V1.1（2026-10-26）","15 个 Feetech 1910 舵机：10 腿关节 + 4 头颈 + 1 张嘴，运动策略控 14 关节","ONNX 策略跑在 UNO Q 的 Linux 侧，配套 xgoduck_rl 可自己训练步态"],"whyValuable":"『打印一只活物』目前完成度最高的开源路径之一，从 3D 打印到强化学习全链打开，复刻生态已经热起来了。","polished":"一只会翻跟头的机器鸭，工程文件全部公开。XGO-Duck 是 Luwu Dynamics 在 Pollen Robotics 开源 Microduck 基础上改造的双足机器鸭：身体、腿、脖子、头全是 3D 打印件（脚底和嘴是 TPU），15 个 Feetech 1910 串行舵机——10 个腿关节、4 个头颈、1 个专门管张嘴；主控 Arduino UNO Q，Linux 侧跑 ONNX 运动策略和网页控制台，STM32 侧管舵机与 IMU 实时环。仓库给得非常齐：STL、扩展板 PCB 设计、逐项 BOM、图文组装指南，配套还有 xgoduck_runtime_arduino（运行时）和 xgoduck_rl（强化学习训练）两个仓库，想训练自己的步态也有路。完成度的一个标志是硬件仍在迭代：扩展板已出到 V1.1，BOM 连自攻螺丝的头型都配了形状对照图。国内复刻生态也热：Microduck 中文复刻教程、『超能花钱鸭』分享仓都起来了。成本结构要说清：结构件自印，电子件官方有套装，大头是 15 个舵机和 UNO Q，属于月级工程。对你的价值：这是『3D 打印从摆件进化到活物』的现成叙事，拆箱-打印-组装-第一次站立-训练步态，天然是连载素材。","tags":["机器人","3D 打印","开源硬件"],"effort":"月级","id":"a386"},{"kind":"项目灵感","title":"NeonPlan 3D：在 Home Assistant 里画出自家户型，住进霓虹 3D 小屋","url":"https://github.com/Mastershort/neonplan3d","source":"GitHub · Mastershort/neonplan3d","date":"2026-11","summary":"Home Assistant 集成：在内置编辑器画房间、墙、门窗、家具，3D 霓虹小屋随画随长；灯按真实颜色发光、窗帘真的会动、摄像头有视野角、太阳轨迹绕屋走，还能语音指挥。HACS 一键装，老火墙平板也能跑。","takeaways":["类型：HA 集成/仪表盘 · 成本：免费开源（少量 Pro 附加买断制）· 可行性：HACS 装完画半小时","992 stars · MIT · 2026-09-27 创建，2026-11-02 仍在高频更新","无需 Bermuda：用现有 Shelly 插座/ESPHome 代理做房间级定位，90 秒学一间房","官方在线演示站可直接玩，支持 Sweet Home 3D、iPhone LiDAR、DXF 等导入"],"whyValuable":"它把全屋智能可视化从『卡片墙』拉到『可走进的房子』，不依赖任何外部工具或云服务，是 HA 生态近期最亮眼的新面板。","polished":"全屋智能的终极可视化：在 Home Assistant 里把你家画出来，然后住进去——霓虹版的。NeonPlan 3D 是一个 HA 集成：侧边栏编辑器里画房间（矩形或自由形状，墙体尺寸自动生成），摆家具、开门窗楼梯屋顶花园，右侧 3D 视图随画随长；绑定 HA 区域后房子就活了——灯用真实颜色点亮房间，窗帘跟着 cover 动，摄像头画出视野、看到人变红，太阳能从屋顶顺着发光线缆流进电池，太阳轨迹绕着房子转，入夜后亮着灯的房间把光洒到窗外草坪。最惊艳的是『谁在哪』：不用 Bermuda，靠已有的 Shelly 插座和 ESPHome 代理做房间级定位，90 秒学一间房，家人在 3D 屋里是一个个发光小人，还能问『我 iPhone 呢』。语音走 Assist，墙上平板知道自己挂在哪间房，『开灯』就只开那间。MIT 开源，HACS 一键装，专为旧 Fire 平板做了降级渲染，官方演示站不装就能玩。对你：接 HA + 拓竹那条线，『把全家画成霓虹小屋』是一期视觉冲击力顶格的实装视频。","tags":["Home Assistant","3D 可视化","智能家居"],"effort":"周末级","id":"a387"},{"kind":"项目灵感","title":"AIHOT：自己找热点、自己写日报的开源网站框架","url":"https://github.com/KKKKhazix/AIHOT","source":"GitHub · KKKKhazix/AIHOT","date":"2026-11","summary":"设计师出身、半年前还看不懂代码的作者与 AI 合写的热点站引擎：采集→预筛→独立两次打分→中文摘要→聚簇成事件→按热度出日报，所有提示词原文和入选门槛全部开源，换掉信源就是你的行业热点站。","takeaways":["类型：内容生产框架 · 成本：免费（MIT）· 可行性：Docker Compose 起服务，一周级换皮","9231 stars · 2175 forks · 2026-09-28 创建，热度极高","热度按事件不算文章：48 小时窗内每个独立来源只计一次","全部提示词公开在 industry/prompts/，改精选标准不用动代码"],"whyValuable":"它是『个人做行业情报站』的完整参考实现，与终末地日更文摘是同一物种，聚簇与热度算法可直接借鉴升级。","polished":"这个仓库最动人的不是代码，是作者的坦白：设计师出身，半年前还看不太懂代码，整套系统和 AI 一起重写——然后它冲到 9000+ 星、2000+ fork。AIHOT 是一个『自己找热点、自己写日报』的网站框架：资料从信源进来，先判重预筛，可能重要的独立打两次分，写成中文标题和摘要，再把不同来源讲的同一件事聚成一个事件，热度按事件算——48 小时窗内每个独立来源只计一次，一家媒体灌十篇也只算一次，所以榜首永远是『很多人在说』而不是『刷屏』的事。最有价值的开源决策：所有提示词原文和入选门槛全部公开在 industry/prompts/，改精选标准不用动代码；仓库自带 18 个海外 AI 信源做示范，换成你行业的源，它就是你的热点站。作者明确要求别沿用 AIHOT 的名字和 Logo，换上自己的。对你这是照镜子的项目：终末地情报站已经跑通 GitHub Actions + LLM 摘要日更，AIHOT 展示了下一步——双评分、事件聚簇、热度衰减、周报月报汇编，把这套引擎套在自己的领域上，顺手就能写成一篇『我的情报站为什么这样设计』的工程复盘。","tags":["内容生产","AI 日报","全栈框架"],"effort":"一周级","id":"a388"},{"kind":"项目灵感","title":"dexterous-astra：机器人手转笔和拧魔方，仿真环境全开源","url":"https://github.com/jianglongye/dexterous-astra","source":"GitHub · jianglongye/dexterous-astra","date":"2026-11","summary":"把『灵巧手转笔』和『拧魔方』做进仿真的实验工件仓库：Isaac Lab 里的转笔环境（零样本提示词直接让手转一圈）与 MuJoCo 里的 Wuji 手魔方环境，附 PPO 训练的 checkpoint 与复现脚本，目前单手已能解开 U F L 三步状态。","takeaways":["类型：机器人学习研究工件 · 成本：免费 · 可行性：需 GPU 与 Isaac Lab/MuJoCo 环境","115 stars · 2026-09-17 创建，含零样本提示词、训练脚本与 checkpoint","转笔：采样手指关键帧规划器零样本起步，PPO 学会连转 3 圈并稳住","魔方：双手脚本控制器零样本拧两下，单手策略学会转与滚、解开 U F L"],"whyValuable":"魔方兴趣线最硬核的延伸：OpenAI 2018 年『单手解魔方』的民间复现素材，仿真环境和 checkpoint 都给全了。","polished":"2018 年 OpenAI 那只『单手解魔方』的机械手，如今可以在自己电脑上复现它的笨拙与伟大——这个仓库就是入场券。作者把两组灵巧手实验的最终产物全部公开：转笔任务跑在 Isaac Lab（NVIDIA 仿真）里，配 Sharpa Wave 手模型，零样本方案是一个采样手指关键帧的规划器，PPO 策略则真学会了连续转 3 圈并稳稳接住；魔方任务跑在 MuJoCo 里，配 Wuji 灵巧手，零样本是双手脚本控制器能拧两下，训练出的单手策略已能解开 U F L 三步的打乱状态——离还原六面还远，但每一步都看得见。仓库结构清晰：每个任务都有 sim/ 环境、zero_shot/ 脚本、policy/ 运行器和 checkpoints/，连转笔那句零样本提示词原文都贴在 README 里，复现门槛压到了研究复刻的最低处。门槛要说实话：需要 GPU 和 Isaac Lab 2.3.2 环境，不是周末装完就能跑的轻量玩具，定位是研究工件而非产品。对你的价值：魔方内容线最硬核的延伸选题——『OpenAI 六年前用机械手解魔方，我现在能不能在家复现』，光看 checkpoint 在仿真里笨拙拧动就够魔友狂喜。","tags":["魔方","机器人","强化学习"],"effort":"一周级","id":"a389"},{"kind":"项目灵感","title":"cubing.js：一行 HTML 嵌进 3D 魔方播放器，求解器可视化的地基","url":"https://github.com/cubing/cubing.js","source":"GitHub · cubing/cubing.js","date":"2026-11","summary":"cubing 组织名下的 JavaScript 库集合：3D 魔方渲染、公式解析、打乱展示，一个 \u003ctwisty-player\u003e 标签就能在网页里放一台会转的魔方。想做魔方可视化项目，这就是现成的地基。","takeaways":["类型：开源项目体验/前端可视化 · 成本：免费 · 可行性：CDN 一行 script 即可嵌入","372 stars · GPL-3.0 · 2026-10-31 仍在推送，主页 js.cubing.net","README 自带示例：\u003ctwisty-player alg=\"R U R' U R U2' R'\"\u003e 一行代码渲染 3D 魔方","同时是 Twizzle（alg.cubing.net 精神续作）的代码之家"],"whyValuable":"魔方 × 前端交叉点上的基础设施：3D 渲染和公式解析已经有人做完了，你只管往上搭求解器可视化、动画和互动页面。","polished":"魔方可视化项目最劝退的一步，永远是自己写 3D 渲染和公式解析。cubing.js 把这两块都做完了：这是挂在 cubing 组织名下的 JavaScript 库集合，专做「展示和操作 twisty puzzle」，主页在 js.cubing.net。上手方式简单到离谱——README 第一个示例就是在 HTML 里放一个 \u003ctwisty-player alg=\"R U R' U R U2' R'\"\u003e 标签，加一行 cdn.cubing.net 的 script，网页里就出现一台可以拖拽旋转、按公式播放动画的 3D 魔方，R U R'、U2 这类记法它原生认识。怎么开始：第一步，建一个空 HTML 引入 CDN，把示例公式换成任意 WCA 打乱，确认能播放；第二步，把一段公式拆成逐步列表，做成「每一步高亮转哪个块」的教学动效；第三步，接上求解器输出（比如之前调研过的 Kociemba Python 实现），把解法序列喂给播放器，就是一个完整的求解器可视化作品。注意官方在 README 里标明 still under development，API 可能变动，但这也意味着你有机会往上游提 PR。仓库同时是 Twizzle 的代码之家——alg.cubing.net 的精神续作，前端魔方生态正在向这里迁移，早进场早占位。","tags":["魔方","JavaScript","可视化","开源项目"],"effort":"周末级","id":"a390"},{"kind":"项目灵感","title":"alg.cubing.net：魔方算法可视化的老祖，自称「old generation」但仍在服役","url":"https://github.com/cubing/alg.cubing.net","source":"GitHub · cubing/alg.cubing.net","date":"2026-11","summary":"魔方圈用了十多年的算法可视化器：贴一段公式，3D 魔方立刻回放，还能调速、导出图片、一键镜像/逆序。GitHub 描述自称「old generation」，已被 Twizzle 接班——但网页至今在线可用。","takeaways":["类型：开源项目体验/工具考古 · 成本：免费 · 可行性：网页直接打开即用","206 stars · 仓库自述「old generation of alg/reconstruction viewing and sharing, superseded by Twizzle」","在线功能实测：算法回放、调速、Hint Stickers、导出图片、Expand/Simplify/Mirror/Invert","内置预置：3.47 WR、Sune、OLLs、PLLs，点开即学"],"whyValuable":"它把「一段公式 = 一段可回放的 3D 动画」做成了魔方圈的公共设施；做求解器可视化选题之前，先把这台老机器拆开看看。","polished":"在 alg.cubing.net 出现之前，魔方教程里的公式只能靠脑补。这个挂在 cubing 官方组织下、出自 Lucas Garron 之手的项目，定义了魔方圈的标配交互：左边贴公式，右边 3D 魔方逐步回放。实测网页至今在线：算法栏带步数统计（0h、0q、0s、0e 四个维度），Playback 可调速，还有 Hint Stickers 和 Hollow 这类显示选项；工具栏里 Expand、Simplify、Mirror、Invert 一键可用，甚至能直接导出图片和论坛链接；预置了 3.47 WR、Sune、OLLs、PLLs 等示例，点开就能学。仓库描述很诚实：自称「old generation of alg/reconstruction viewing and sharing」，已被基于 cubing.js 的 Twizzle 接班。但这正是它的价值——一个服役多年、交互范式依然在线的老前辈。怎么开始：先花十分钟把玩网页，把最近在练的公式贴进去调速观察；再 clone 仓库看它怎么把公式解析映射成 3D 动画，老代码反而好读；进阶玩法是给求解器接上它——把 Kociemba 输出的解法序列转成 URL 参数，一键生成「任意打乱的可视化解法」分享页。对做魔方内容的人来说，每个预置按钮都是现成的视频演示素材。","tags":["魔方","算法","可视化","复古互联网"],"effort":"周末级","id":"a391"},{"kind":"项目灵感","title":"wca-rest-api：一条 curl 拿到全世界魔友的成绩档案","url":"https://github.com/robiningelbrecht/wca-rest-api","source":"GitHub · robiningelbrecht/wca-rest-api","date":"2026-11","summary":"非官方 WCA 公共 API：比赛、成绩、选手档案、排名全部做成静态 JSON 挂在 GitHub 上，CI 自动跟随官方数据更新。做魔方数据故事，这是零运维的数据源。","takeaways":["类型：开源项目体验/数据源 · 成本：免费 · 可行性：直接请求 JSON，无需部署","26 stars · MIT · 2026-11-01 仍在推送","数据范围实测（README）：competitions、results、competitor profiles、rankings","官方 API 同样开放：/api/v0/persons/2009ZEMD01 实测返回 Feliks Zemdegs 完整档案"],"whyValuable":"从 1982 年首届世锦赛到上周末，全部正式成绩公开可取——魔方是极少数普通玩家就能玩权威数据集的领域，这个项目把门槛降到一条 curl。","polished":"魔方圈有个被低估的事实：WCA（世界魔方协会）的正式成绩数据库全部公开。想拿这份数据做点什么，robiningelbrecht/wca-rest-api 是最低门槛的入口——一个非官方的 WCA 公共 API，README 写明可以访问比赛数据、成绩、选手档案、排名。它的架构很聪明：把官方数据加工成静态 JSON 文件直接挂在 GitHub 上，CI 自动跟进官方更新，你不需要部署任何东西，一条 curl 就是全部技术栈。怎么开始：第一步，按 README 的接口列表请求任意一位选手的档案 JSON，看返回结构；第二步，用官方 API 交叉验证——实测 https://www.worldcubeassociation.org/api/v0/persons/2009ZEMD01 直接返回 Feliks Zemdegs 的完整档案，两个数据源互为备份；第三步，挑一个问题去问数据：你所在的城市这些年办了多少场比赛、3x3 单次世界纪录被刷新过几次、某个冷门项目的参与人数曲线。注意体量：完整成绩集有几百 MB，个人小项目优先用这个静态 API 按需取。对做内容的人而言，这就是 WCA 数据故事选题的原材料仓库——数据是权威的，问题是免费的。","tags":["魔方","WCA","数据","API"],"effort":"周末级","id":"a392"},{"kind":"项目灵感","title":"Cube Explorer：官网还在用框架页的魔方求解器活化石，版本号仍在更新","url":"https://kociemba.org/cube.htm","source":"网站 · kociemba.org（Herbert Kociemba 个人主页）","date":"2026-11","summary":"Kociemba 的桌面程序 Cube Explorer 至今维护：主页实测标着「Cube Explorer 5.14 HTM and QTM」，主页原话是 20 步以内复原魔方。站点是货真价实的 HTML 4.01 Frameset 结构配 PayPal 捐款按钮，老网页原样封存。","takeaways":["类型：复古软件考古/求解器 · 成本：免费 · 可行性：官网直接下载","主页实测：「Cube Explorer 5.14 HTM and QTM」版本号仍在更新","站点为 HTML 4.01 Frameset 结构，配 PayPal 捐款按钮——教科书级老网页","作者即二阶段算法提出者，与已收录的 Python 实现（hkociemba/RubiksCube-TwophaseSolver）同源不同物"],"whyValuable":"同一个作者、同一套算法，一个活在命令行里（Python 实现），一个活在老式 GUI 里（Cube Explorer）。对照着用，二阶段算法立刻从抽象概念变成看得见的东西。","polished":"Herbert Kociemba——二阶段算法的提出者——的个人主页至今在线，他的桌面程序 Cube Explorer 是魔方求解器里的活化石：主页原话是「复原魔方不容易，想在 20 步以内复原，标准更高」，Cube Explorer 实现的正是这套算法。实测当前版本 5.14，标着 HTM and QTM（半转度量/四分转度量两种计步标准），官网还是货真价实的 HTML 4.01 Frameset 结构——左右两个 frame、一个 PayPal 捐款按钮，老网页原样封存。怎么开始：第一步，从 kociemba.org 下载程序，输入一个打乱状态让它求解，感受最优解和近似解的差别；第二步，同一状态分别用 HTM 和 QTM 求解，对比步数，这是度量衡影响算法的最直观一课；第三步，考古网站本身：navigate.htm、homex.htm 这些文件名和 frame 布局都是教学标本，再和已收录的 Python 版 RubiksCube-TwophaseSolver 对照——同一个作者、同一套算法，在桌面程序和现代 Python 里活成了两种样子。对做复古互联网内容的人来说，这个站点本身就是素材：一位学者用几十年不变的老网页，维护一个仍在更新版本号的算法。","tags":["魔方","算法","复古软件","求解器"],"effort":"周末级","id":"a393"},{"kind":"延伸创意","title":"求解器回放动画模板：Kociemba 解法 → cubing.js 3D 回放 → 纯代码视频引擎","url":"","source":"延伸创意 · 基于 cubing.js + 仓库 gen-aivideo.mjs + Kociemba 求解器（链接均已验证）","date":"2026-11","summary":"把魔方求解器的输出变成看得见的动画：解法序列喂给 cubing.js 的 twisty-player 渲染 3D 回放，再接进本仓库已跑通过的纯代码视频引擎，产出一支「任意打乱 19 步复原」短视频和一个可复用动画模板。","takeaways":["类型：自有内容管线延伸 · 成本：零（全开源组件）· 可行性：周末跑通 MVP，一周出模板","三段链路各自已验证：Kociemba 求解、cubing.js 播放、gen-aivideo.mjs 出片","难点在节奏设计：19 步动画要标注一阶段/二阶段切换，正好是讲算法故事的钩子","模板化之后每期魔方内容都能复用，是资产型素材"],"whyValuable":"求解器可视化的素材和工具都已经齐了，缺的只是把它们串起来的那个模板——这正是自家 gen-aivideo 引擎擅长补位的地方。","polished":"把魔方求解器的输出变成看得见的动画——素材和工具都已经齐了，缺的只是把它们串起来的那个模板。链路设计：第一段，用 Kociemba 的 Python 实现（已收录）对任意打乱求解，拿到解法序列；第二段，喂给 cubing.js（本轮已收录）的 twisty-player 渲染 3D 回放，公式解析、逐帧动画都是现成的；第三段，接进本仓库的 gen-aivideo.mjs 纯代码视频引擎——它已经产出过 1080p60 带原创配乐的成片，把魔方回放做成它的一个新场景类型即可。产出物有两层：一支「任意打乱，不到 20 步复原」的固定风格短视频，和一个可复用的求解回放动画模板，之后每期魔方内容都能套。怎么开始：先在网页里手工验证 cubing.js 能播完一条 20 步解法，再决定渲染方案——浏览器录屏最省事，无头截图序列最干净；难点在节奏，19 步动画必须配字幕标注阶段切换（第一阶段/第二阶段），这恰好是讲算法故事的钩子。周末先跑通 MVP，一周内出模板。","tags":["魔方","可视化","视频管线","延伸创意"],"effort":"一周级","id":"a394"},{"kind":"延伸创意","title":"WCA 数据故事管线：官方 TSV 导出 + 静态 API，做一张「中国魔方十年」曲线页","url":"","source":"延伸创意 · 基于 WCA Results Export + wca-rest-api（链接均已验证）","date":"2026-11","summary":"官方 Results Export 页面实测提供 SQL（379 MB）和 TSV（367 MB）两种格式，版本 2.0.2，每个比赛周末后更新。搭一条下载→解析→静态站的数据故事管线，产出「中国魔方十年」常青页面。","takeaways":["类型：数据内容管线 · 成本：零（数据官方免费）· 可行性：一周级，周末可跑通下载解析","实测导出页：WCA_export_v2_306_20261102T000038Z.tsv.zip（367 MB），v1 格式 2026-01-15 起停止支持","选手级查询走 wca-rest-api 静态 JSON，大数据走 TSV，两条腿走路","页面一次搭好数据每周自动变新，每季度都能截图发视频"],"whyValuable":"WCA 数据是魔方内容里最被浪费的金矿：权威、免费、持续更新，而且和 endfield-digest 的静态站管线天然同构。","polished":"WCA 数据是魔方内容里最被浪费的金矿：官方 Results Export 页面实测提供 SQL（379 MB）和 TSV（367 MB）两种格式，当前版本 2.0.2，每个比赛周末后更新，页面还预告 v1 格式 2026-01-15 起停止支持。把它变成常青内容，方案是搭一条数据故事管线：第一步，写个下载脚本拉最新 TSV，解析成轻量 JSON；第二步，照 endfield-digest 的 build-site.mjs 静态站路子，生成一个「中国魔方十年」页面——参赛人次曲线、比赛数量分布、3x3 平均成绩逐年变化；第三步，配 robiningelbrecht/wca-rest-api（本轮已收录）做选手级查询，任何人输入 WCA ID 就能看自己的成长曲线。为什么值得做：这类页面一次搭好、数据每周自动变新，是典型的资产型内容，每季度都能截一次图发视频。避坑提示：几百 MB 的导出别在 CI 里全量处理，先按项目列过滤；官方 API 也开放（实测 /api/v0/persons/2009ZEMD01 可用），小数据用它、大数据用导出，两条腿走路。一周级工作量，周末能跑通下载和解析。","tags":["魔方","WCA","数据可视化","延伸创意"],"effort":"一周级","id":"a395"},{"kind":"视频选题","title":"上帝之数是 20：烧掉 35 个 CPU 年，只为证明魔方永远 20 步内能复原","url":"https://www.cube20.org","source":"网站 · cube20.org（God's Number 官方证明站点）","date":"2026-11","summary":"2010 年，四人团队宣布：魔方任何状态 20 步以内必能复原。cube20.org 是证明的官方站点：约 35 个 CPU 年的谷歌算力、1981→2010 上界收窄全史、距离 20 的位置约 4.9 亿个、Superflip。","takeaways":["类型：算法故事视频 · 成本：零（素材全在站点）· 可行性：一周级出稿","实测站点：约 35 CPU 年谷歌 donated 算力，coset 分治攻破 4.3×10^19 种状态","四位作者：程序员 Rokicki、数学老师 Kociemba、数学家 Davidson、谷歌工程师 Dethridge","反差点现成：半转度量是 20，四分转度量变成 26"],"whyValuable":"别讲成数学课，讲成「人类怎么证明一件事的下限」——这是算法传播里最讨喜的叙事结构，且与已收录的 Kociemba 求解器条目天然联动。","polished":"1981 年，人们只知道魔方乱拧几下就解不开了；2010 年，四个人的团队宣布：任何状态，20 步以内必能复原——这就是「上帝之数」。cube20.org 是这个证明的官方站点，实测内容极其扎实：证明动用了约 35 个 CPU 年的谷歌 donated 算力，把 4.3×10^19 种状态切成 coset 逐批攻破；站点上有 1981 到 2010 年上下界收窄的完整历史表、按距离分布的状态数表（距离 20 的位置约 4.9 亿个，比十亿分之一还稀少）、还有第一个被证明需要 20 步的 Superflip。四位作者阵容也值得讲：程序员 Rokicki、数学老师 Kociemba、数学家 Davidson、谷歌工程师 Dethridge——最后那位来自谷歌，算力就是他搞来的。选题切口建议：别讲成数学课，讲成「人类怎么证明一件事的下限」——35 个 CPU 年什么概念、为什么二阶段算法只能给近似解而证明需要别的路、四分转度量下答案变成 26 的反差。这个选题和已收录的 Kociemba 求解器条目天然联动：视频后半段现场跑一次求解器，观众亲手看到「20 步以内」字面成真。素材全在站点上，一周能出稿。","tags":["魔方","算法","视频选题","数学"],"effort":"一周级","id":"a396"},{"kind":"视频选题","title":"1982 年首届魔方世界冠军的 22.95 秒，放到 2026 年能排第几？","url":"https://www.worldcubeassociation.org/competitions/WC1982","source":"网站 · worldcubeassociation.org/competitions/WC1982（WCA 官方赛页）","date":"2026-11","summary":"1982 年布达佩斯，第一届魔方世锦赛：19 名选手，Delegate 名单里坐着魔方之父 Ernő Rubik。冠军 Minh Thai 单次 22.95 秒——当年的世界纪录。四十四年后，这个成绩是什么水平？","takeaways":["类型：复古速拧 × 数据故事视频 · 成本：零 · 可行性：一周级出稿","WCA 赛页实测：19 名选手、Delegate 为 Ernő Rubik、Minh Thai 22.95 破世界纪录","完整成绩单在列：亚军 Guus Razoux Schultz 24.32、季军 Zoltán Lábas 24.49、亚洲纪录 24.91","三幕结构：考古 → 用官方导出数据对照今天 → 复古规则挑战赛"],"whyValuable":"一条选题同时吃到复古速拧和数据故事两个角度，还能衔接已收录的「WCA ID 还在」和 AI 魔方大赛两条视频线。","polished":"1982 年，布达佩斯，第一届魔方世界锦标赛：19 名选手，WCA 官方赛页实测把魔方之父 Ernő Rubik 列在这场比赛的 Delegate 名单里。冠军是美国的 Minh Thai，单次 22.95 秒——当年的世界纪录。四十四年后的今天，22.95 秒是什么水平？这就是这支视频的全部悬念。选题结构：第一幕，考古——WCA 官方赛页至今挂着完整成绩单，亚军 Guus Razoux Schultz 24.32、季军 Zoltán Lábas 24.49，当年的亚洲纪录是 24.91；第二幕，对照——用官方成绩导出（本轮已收录的 wca-rest-api 条目就是入口）实测回答：22.95 在 2026 年的官方排名里大约什么位置、今天的 sub-15 选手最年轻多大；第三幕，挑战——复古速拧规则：只用 1982 年那批人知道的入门方法，作者本人在 csTimer 上挑战 22.95 秒，成败立见。它同时是复古故事和数据故事，正好衔接你已有的「WCA ID 还在」和 AI 魔方大赛两条视频线。素材（赛页、导出数据、csTimer）全部免费在线，一周能出。","tags":["魔方","复古速拧","WCA","视频选题"],"effort":"一周级","id":"a397"},{"kind":"视频选题","title":"CFOP 之母的个人主页还挂着：Fridrich 教授魔方页考古","url":"http://www.ws.binghamton.edu/fridrich/cube.html","source":"网站 · ws.binghamton.edu/fridrich/cube.html（Jessica Fridrich 个人主页）","date":"2026-11","summary":"CFOP——全球速拧玩家的标配解法——有一个仍然在线的发源地：Fridrich 教授的个人主页，实测可访问。页面上有 Rubik 的 1982 年亲笔签名、F2L 系统原文、《20 years of speed cubing》短史。","takeaways":["类型：复古互联网 × 魔方史视频 · 成本：零 · 可行性：周末级出稿","页面实测：Ernő Rubik 亲笔签名（1982 年布达佩斯世锦赛签于她的笔记本）","F2L 系统原文、Guus Razoux Schultz（1982 亚军）的速拧心得、Jasmine 入门解法链接均在","双线叙事：复古互联网考古 × CFOP 方法史，屏幕录制+旁白即可成片"],"whyValuable":"方法史和复古互联网两个受众在这页纸上重叠：算法社区把最好的东西留在了最旧的网页上，这句话本身就是标题。","polished":"CFOP——全世界速拧玩家的标配解法——有一个仍然在线的发源地：Jessica Fridrich 教授的个人主页（ws.binghamton.edu/fridrich/cube.html），实测至今可访问。页面朴素得惊人，但全是历史文物：她贴出了 Ernő Rubik 的亲笔签名——1982 年布达佩斯首届世锦赛时签在她的笔记本上；她那篇描述「前两层（F2L）+ 顶层」系统的文字，就是后来被全世界叫做 CFOP 的东西；还有一篇《20 years of speed cubing》的短史，以及 1982 年世锦赛亚军 Guus Razoux Schultz 亲写的速拧心得、Jasmine 的入门解法链接。选题切口：一条复古互联网考古线（大学域名下朴素的学术主页，这类页面正在成批消失），叠一条方法史线（CFOP 从教授的个人总结到全球标配）；结尾升华点：算法社区把最好的东西留在了最旧的网页上。拍摄成本低：屏幕录制加现场读页加旁白即可，素材全在页面里，周末能出稿。标题方向：「CFOP 之母的主页还挂着，我上去考古了一天」。","tags":["魔方","复古互联网","CFOP","视频选题"],"effort":"周末级","id":"a398"},{"kind":"项目灵感","title":"Bangumi API：47 个端点的官方开放接口，中文追番工具生态的地基","url":"https://github.com/bangumi/api","source":"GitHub · bangumi/api","date":"2026-11","summary":"Bangumi 维基官方开放 API：文档本身就是一份 OpenAPI 3.0.3 规范，47 个端点覆盖条目/剧集/角色/人物/收藏/搜索，读公开数据无需登录。本调研实测 GET /calendar 一发拿到整周放送表。","takeaways":["类型：官方开放 API · 成本：免费 · 可行性：读公开数据零门槛，收藏与编辑才需要 OAuth","1259 stars · 规范同步自 bangumi/server 仓库，Swagger UI（bangumi.github.io/api）可直接调试","47 个端点：条目/剧集/角色/人物/收藏/搜索/修订记录，用户收藏走 /v0/users/{username}/collections","实测 GET https://api.bgm.tv/calendar 无鉴权返回 7 天放送表（含《魔法少女育成計画 restart》等在播番）"],"whyValuable":"做任何追番工具——放送提醒、收藏统计、口味分析、年度报告——Bangumi 都是中文 ACG 社区数据最全、门槛最低的官方数据源，而且是站方自己维护，不存在律师函风险。","polished":"想给追番做点工具，第一件事不是爬网站，而是打开这份官方 API。Bangumi（bgm.tv）把整个维基的开放接口维护成一个独立仓库：文档本身就是一份 OpenAPI 3.0.3 规范，挂在 bangumi.github.io/api 上，Swagger UI 里每个端点都能直接调。47 个端点把 ACG 工具需要的料备齐了：条目详情、剧集列表、角色与人物、收藏状态、全文搜索、修订历史，个人收藏走 /v0/users/{username}/collections。读公开数据不需要任何鉴权——本调研实测 GET api.bgm.tv/calendar，一发就返回 7 天放送表，魔法少女育成計画 restart 这类在播新番全在里面。唯一的礼仪是 User-Agent：官方文档要求非浏览器请求带上「开发者 ID + 应用名」，默认 UA 可能被禁，这在仓库的 user agent.md 里写得明明白白。怎么开始：先在 Swagger UI 里把 /v0/subjects/{id} 和 /calendar 玩熟，然后写个脚本拉自己的收藏列表，就能做追番统计、放送提醒、口味画像；要动收藏和编辑再申请 access token。往大了做也撑得住：它是中文番剧元数据的事实标准，往上接 animeko（已收录）或自建年报、放送日历都顺理成章，周末就能出第一版。","tags":["ACG","Bangumi","API","追番"],"effort":"周末级","id":"a399"},{"kind":"项目灵感","title":"anime-offline-database：41,537 部番的跨站元数据集，番剧宇宙装进一个 JSON","url":"https://github.com/manami-project/anime-offline-database","source":"GitHub · manami-project/anime-offline-database","date":"2026-11","summary":"每周更新的离线番剧数据集：41,537 条条目、十家元数据站点交叉引用（MAL 30,570 / anime-planet 26,674 / AniList 20,691…），JSON/JSONL + zstd 多种形态，附 JSON Schema 与死链清单。","takeaways":["类型：开放数据集 · 成本：免费（ODbL-1.0）· 可行性：Releases 页直接下载，零爬虫","1331 stars · 2026 年第 27 周版：41,537 条，65% 已人工复核","核心价值是跨站 ID 映射：同一部番在 MAL/AniDB/AniList/Kitsu 的条目直接对上","2025-25 起数据文件迁至 Releases，提供 minified/jsonl/zst 形态与 dead-entries 死链清单"],"whyValuable":"做番剧可视化最贵的是数据，这份数据集把十家站点的元数据和评分合并好、映射好，一次下载就能做趋势分析、网络图和跨平台对比，全程不碰任何反爬。","polished":"番剧数据可视化的瓶颈从来不是画图，是数据。这个仓库把最贵的部分直接给完了：每周更新一版离线数据集，2026 年第 27 周版含 41,537 条番剧条目，其中 65% 经过人工复核；每条都带标题、封面、集数、类型、标签、制作工作室，以及最重要的——它在 MyAnimeList、anime-planet、Kitsu、AniList、AniDB、SIMKL 等十家站点的交叉 ID。也就是说同一部番在不同平台的条目，拿这份数据一键就能对上，这是任何爬虫方案都给不了的干净底料。数据从 2025 年第 25 周起放在 Releases 里，提供完整版/minified/JSONL 三种 JSON 形态，全配 zstd 压缩和 JSON Schema，还附各站点死链清单——顺带能做「消失的番剧」式考古。怎么开始：下 minified 版跑几个基础问题热身，比如评分分布长什么样、哪家平台打分最严；进阶是跨库评分差——同一部番在 MAL 和 AniList 的分差排行榜，天然就是「两边粉丝谁更严格」式选题；再进一层用标签共现做流派网络图，看异世界题材如何吞掉整个十年。注意它是 ODbL-1.0 协议：署名免费商用，衍生数据库要同协议开放。1331 星不算大，但数据集的价值看坚持——它一周不落地更了这么多年。","tags":["ACG","数据可视化","数据集","追番"],"effort":"周末级","id":"a400"},{"kind":"项目灵感","title":"pakku.js：自动合并刷屏弹幕的开源插件，还自带弹幕密度分析图","url":"https://github.com/xmcp/pakku.js","source":"GitHub · xmcp/pakku.js","date":"2026-11","summary":"B 站弹幕反噪声老牌开源插件：自动合并相似刷屏弹幕，Chrome/Edge/Firefox 全支持，内置弹幕密度分析图、弹幕信息框和用户脚本系统，2697 星 2026 年仍在更新。","takeaways":["类型：浏览器扩展（开源）· 成本：免费 · 可行性：商店一键安装，源码 JS 可读可改","2697 stars · 2026-05 仍在更新 · Chrome/Edge/Firefox 三平台商店上架","招牌功能：合并相似弹幕消刷屏，README 里连「弹幕密度分析图」都有演示截图","用户脚本系统：用 JavaScript 改写弹幕内容，深度自定义的口子是开着的"],"whyValuable":"它是「弹幕反噪声」方向的参考实现：合并算法、密度统计、信息展示三件事都有现成代码。做弹幕分析选题缺素材时，读它的源码比从零爬弹幕快得多，也更安全。","polished":"B 站弹幕的乐趣和痛苦是同一件事：人多。pakku.js 处理的就是刀刃上的问题——把刷屏的相似弹幕自动合并成一条带计数的，节奏弹幕立刻现出原形。它是这个领域活得最久的开源实现：Chrome、Edge、Firefox 三家商店都上架，仓库 2697 星，2026 年 5 月还在提交。对工具党来说更有价值的是三个衍生能力：弹幕密度分析图（一眼看出全片高能分布，README 有拜年祭的演示截图）、弹幕信息显示框（点一条弹幕能看到它的统计信息）、用户脚本系统（用 JavaScript 改写弹幕内容）。怎么开始：商店装上，开一集弹幕多的番，看合并前后的差别；第二步去 GitHub 读源码，重点看相似度合并的判定逻辑和密度图的计算——这正是「弹幕即数据」的最小可行样本；第三步用用户脚本写个小实验，比如把「下次一定」类弹幕替换成自定义文案。延伸方向也现成：把密度图思路搬进自己的管线，配合 BBDown 拉下来的弹幕做名场面定位；再往上是把每周合并统计做成「弹幕带节奏周报」——你做浏览器扩展的经验（linux.do 那套）在这条线上全能复用。","tags":["弹幕","浏览器扩展","开源拆解","ACG"],"effort":"周末级","id":"a401"},{"kind":"项目灵感","title":"DanmakuFactory：xml/ass/json 弹幕互转，把原味弹幕烧进二创视频","url":"https://github.com/hihkm/DanmakuFactory","source":"GitHub · hihkm/DanmakuFactory","date":"2026-11","summary":"弹幕文件格式互转的瑞士军刀：B 站 xml 转 ass 即可烧进视频，支持特殊弹幕与自定义输入模板，作者明说初衷是让影视工作者给自己的视频加弹幕效果。879 星 MIT 协议。","takeaways":["类型：命令行/GUI 工具 · 成本：免费（MIT）· 可行性：Releases 直接下，也可 xmake 自编译","879 stars · 2026-07 仍在更新 · GUI 1.63 与 CLI 1.70 双版本","格式矩阵：.ass 与 .xml 读写全支持（含特殊弹幕），.json 读写支持（特殊弹幕不支持）","1.50 起支持自定义输入模板：按需求设计弹幕文件，专治剪辑软件做出的生硬弹幕"],"whyValuable":"二创素材管线的最后一块拼图：弹幕从「数据」变成「画面」。BBDown 下载原片和弹幕、DanmakuFactory 转成 ass、剪辑软件一挂就烧录——番剧回顾视频的「弹幕氛围」三步到位。","polished":"做番剧回顾或安利视频，最难复刻的不是画面是氛围——原片弹幕里那些「爷青回」「此处应有掌声」就是二创的空气。DanmakuFactory 干的正是把这种空气打包：它把弹幕文件当一等公民处理，B 站导出的 xml 转成 ass 字幕格式，剪辑软件里当字幕轨一挂，原味弹幕就烧进了你的视频。能力比想象的全：.ass 和 .xml 双向读写、顶端底部定位等特殊弹幕都支持，.json 也能进出——这意味着弹幕可以先变成 JSON 交给程序处理（统计、过滤、重排），再渲染回 ass，整条链路都可编程。879 星、MIT 协议、2026 年 7 月还在更新，GUI 与 CLI 双版本，Windows 下 Releases 直接下载。作者在 README 里明说了设计初衷：「影视工作者想要在自己的视频上加入弹幕的效果，而剪辑软件做出来的弹幕非常生硬」——所以它还支持自定义输入模板，可以凭空捏一份自己的弹幕文件。怎么开始：拿一集熟悉的番，BBDown（本机已有）同时下载视频和弹幕，一条命令转 ass 烧进去看效果；进阶是写脚本对 json 再加工，比如只保留四字以上的长评弹幕再渲染——那已经是在做「精选弹幕版」二创了，配套的密度统计思路本轮已另有收录。","tags":["弹幕","二创","视频管线","开源工具"],"effort":"周末级","id":"a402"},{"kind":"项目灵感","title":"Anime4K：21594 星的实时超分着色器，mpv 里一键把番拉上 4K 屏","url":"https://github.com/bloc97/Anime4K","source":"GitHub · bloc97/Anime4K","date":"2026-11","summary":"一组 GLSL 着色器实现的开源实时动漫超分：mpv/IINA/Plex 全平台接入，1080p 番实时拉上 4K 不卡帧；MIT 协议 21594 星，理念是「实时处理优于重新压制」。","takeaways":["类型：着色器/算法库 · 成本：免费（MIT）· 可行性：mpv 挂着色器文件加两行配置即用","21594 stars · README 按平台给了 Windows/Linux/Mac 的 mpv、IINA、Plex 接入教程","优化目标是原生 1080p 的 h264/h265/VC-1 片源，老 480p/DVD 片源不保证效果","v4.1 附低分辨率实验着色器：360p→4K 对比图与 waifu2x、Real-ESRGAN 同框比较"],"whyValuable":"看番画质与二创素材修复两吃：本地看番实时超分零等待，二创截帧修复不用跑模型。纯着色器方案对显卡的要求比 SRGAN 低一个数量级，是性价比最高的画质升级路线。","polished":"这可能是动漫工具圈里星最多的仓库之一：21594 星、MIT 协议，作者 bloc97 的思路清奇——不训练模型，写一组 GLSL 着色器，让显卡在你按下播放的那一刻实时超分。效果按 README 的说法比肩 SRGAN、优于 waifu2x，而且零等待：1080p 番实时拉到 4K 屏上看，不卡帧、不占硬盘。它反复强调一个理念：重新压制是不可逆的损伤，实时处理才是正道。接入简单得离谱：mpv 用户把几个 .glsl 文件放进目录、在 input.conf 里绑几个热键，README 按 Windows/Linux/Mac 分平台给了 mpv、IINA、Plex 的完整教程。边界也说得很诚实：它优化的是原生 1080p 的 h264/h265/VC-1 片源，老 480p、DVD 那种带隔行伪影的素材不保证效果——真要修老片，v4.1 的实验性着色器和 Real-ESRGAN 这类离线模型各有所长，仓库里连 360p→4K 的四方对比图都摆好了。怎么开始：装 mpv，挂着色器，找一部熟悉的番按几遍热键对比画质；二创用法是把拉来的素材截帧超分，让封面图和转场画面干净一截。纯播放器路线周末就能全套跑通，和你现有的看番、二创两条线都能接上。","tags":["ACG","超分","mpv","二创"],"effort":"周末级","id":"a403"},{"kind":"项目灵感","title":"弹弹play：本地播放器 + 开放弹幕网络，给本地视频自动配弹幕的老牌生态","url":"https://github.com/kaedei/dandanplay","source":"GitHub · kaedei/dandanplay","date":"2026-11","summary":"全功能本地视频+弹幕播放器：核心生态是「开放弹幕网络」，本地视频文件秒配全网弹幕库；开发者中心实测可达，应用接入、审核与配额管理流程齐全，多平台客户端矩阵开放接入。","takeaways":["类型：播放器 + 开放 API · 成本：免费 · 可行性：客户端即装即用，API 接入需在 DevCenter 申请审核","424 stars · 2026-10-30 仍在更新 · 文档站 doc.dandanplay.com","开放弹幕网络 dev.dandanplay.com 实测可达：应用接入申请、调用统计与配额监控一条龙","第三方客户端生态开放：NipaPlay、AniXPlayer 等都接它的弹幕匹配服务"],"whyValuable":"「给本地视频配弹幕」这件事它做了十几年还活着，开放 API 意味着做本地追番工具箱时不用自己养弹幕库——匹配引擎是现成的，流程合规程度也比抓站方接口高得多。","polished":"下载到硬盘里的番剧是没有灵魂的——没弹幕。把灵魂装回去的工具叫弹弹play：全功能本地视频+弹幕播放器，绝活是文件匹配，本地视频打开后按文件特征对上它的弹幕库，全网弹幕立刻铺满进度条。这个生态最有意思的不是播放器本身，而是「开放弹幕网络」：它把弹幕匹配做成了对外服务，开发者中心（dev.dandanplay.com，本调研实测可达）提供应用接入申请、审核进度、调用统计与配额监控，页面明说近期启用了应用分层与额度管理——也就是说接入走的是正式流程，有文档站 doc.dandanplay.com、接口调试工具和更新日志，在弹幕工具普遍灰色的今天，这种「正门」相当珍贵。仓库 424 星、2026 年 10 月底还在更新，客户端矩阵也开放：安卓概念版、iOS 上的 NipaPlay 与 AniXPlayer、Linux 的 NipaPlay-Reload 全都接它的匹配服务。怎么开始：先用客户端体会「本地视频秒配弹幕」，然后去 DevCenter 注册开发者账号提交应用申请，把匹配 API 接进自己的本地追番工具箱；想做弹幕分析的话，它也是比直接抓站方接口稳妥得多的数据入口。","tags":["弹幕","播放器","API","追番"],"effort":"周末级","id":"a404"},{"kind":"延伸创意","title":"高能点自动切片流水线：弹幕密度峰值定位名场面，BBDown 拉素材自动出片","url":"","source":"延伸创意 · 基于 BBDown（本机已有）+ pakku.js 密度图思路 + DanmakuFactory（链接均已验证）","date":"2026-11","summary":"不盯进度条找名场面：拉一集弹幕 → 按分钟分桶算密度峰值 → 峰值前后各 30 秒自动切片 → 弹幕转 ass 烧回切片，产出一套自带「弹幕盖章」的高能片段素材库。","takeaways":["类型：自有内容管线延伸 · 成本：零（全开源组件）· 可行性：BBDown 本机已装，周末可跑通 MVP","密度峰值只是基线，进阶用关键词放量（泪目/名场面/高能预警）区分打戏高能与剧情刀","DanmakuFactory 把原味弹幕烧回切片，素材自带弹幕氛围，拿来即用","与仓库 gen-aivideo.mjs 打通后可全自动出片，素材库每期番剧内容都能复用"],"whyValuable":"找名场面是番剧视频最耗时的环节，而弹幕密度是观众免费标注好的高能坐标——工具链每一环都已验证，缺的只是把它们串起来的那百来行脚本。","polished":"做番剧内容最磨人的环节是找名场面：一集 24 分钟，高能 30 秒，全靠人肉拖进度条。其实观众早就把坐标标好了——弹幕密度就是免费的标注数据。这条流水线把它用起来：第一步，BBDown（本机已有）同时拉视频和弹幕 xml；第二步，解析弹幕按分钟分桶统计密度，画出 pakku.js 那种密度曲线（已收录），峰值即候选高能点；第三步，对每个峰值前后各取 30 秒自动切片；第四步，DanmakuFactory（已收录）把弹幕 xml 转成 ass 烧回切片——出来的每段素材自带原味弹幕氛围，拿来即用。基线用密度就够，进阶做关键词放量检测：「泪目」「名场面」「高能预警」的突然聚集比密度峰值更准，还能区分「打戏高能」和「剧情刀」，给素材自动打标签。产出两层：一是每期番剧视频都能复用的高能素材库，二是固定栏目「弹幕盖章名场面榜」——把统计结果排个榜就是一期选题。风险提示只有一条：切片素材用于解说与评论场景，别整段搬运。周末先用一集番跑通密度→切片，一周内接上烧录和 gen-aivideo 出片。","tags":["弹幕","视频管线","二创","延伸创意"],"effort":"一周级","id":"a405"},{"kind":"延伸创意","title":"追番年报生成器：Bangumi 收藏 × 跨库元数据，把一年看番史渲染成一张海报","url":"","source":"延伸创意 · 基于 Bangumi API + anime-offline-database（链接均已验证，API 实测可达）","date":"2026-11","summary":"用 Bangumi API 拉自己的全年收藏与进度，对上 anime-offline-database 的跨站评分与标签，算出口味画像，渲染成 SVG 年度海报——追番人的 Spotify Wrapped，每年 12 月自动跑。","takeaways":["类型：自有数据可视化延伸 · 成本：零 · 可行性：公开数据零鉴权，本人收藏接口才需要 access token","数据层全现成：收藏/进度走 Bangumi API（已实测），评分/标签补全走 41,537 条离线数据集","口味指标可算：追新 vs 补番比例、季度偏好、与社区评分的偏差、月度节奏热力图","产出模板化：海报 + 「年度追番报告」视频素材，GitHub Actions 定时每年自动生成"],"whyValuable":"年终盘点是每年 12 月的流量密码，追番圈却没有官方 Wrapped——数据源、统计口径、渲染能力（你已有纯代码出图出片的经验）全都现成，缺的只是第一版。","polished":"每个追番人都值得一份自己的年度报告，而这份报告没有官方版——得自己做，而且材料全齐。数据侧：Bangumi API（已收录、实测可用）的 /v0/users/{username}/collections 按收藏类型拉全年记录，看完了、在看、抛弃分得清清楚楚；元数据侧用 anime-offline-database（已收录）补全跨站评分、标签和制作公司，顺手还能算「我在 MAL 和 AniList 的口味差」。统计侧现成的指标就有六个
